<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Gửi Bé Ngày 20/10 ❤️</title>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Great+Vibes&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    body {
      background: radial-gradient(circle at 50% 32%, #fffdfd 0%, #ffe8ef 52%, #ffc8d6 100%);
      color: #4a303a;
      font-family: 'Quicksand', -apple-system, BlinkMacSystemFont, sans-serif;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      position: relative;
      touch-action: manipulation;
    }

    /* Canvas hạt phấn hoa & cánh hoa bay nhẹ ngoài không gian */
    #ambientCanvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    /* Nút xem lại hiệu ứng hoa trồi lên */
    #top-controls {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 35;
    }
    .replay-btn {
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(8px);
      color: #c9184a;
      border: 2px solid #ffb3c6;
      padding: 8px 16px;
      border-radius: 25px;
      font-family: inherit;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(201, 24, 74, 0.14);
      transition: transform 0.2s, background 0.2s;
    }
    .replay-btn:hover { background: #fff; transform: translateY(-2px); }
    .replay-btn:active { transform: scale(0.95); }

    /* =========================================================================
       SÂN KHẤU ĐA THỰC THỂ (MỖI CÀNH HOA, LÁ, GIẤY GÓI LÀ 1 THỰC THỂ RIÊNG)
       ========================================================================= */
    #bouquet-world {
      position: relative;
      width: 560px;
      height: 650px;
      z-index: 10;
      transform-origin: bottom center;
      pointer-events: none;
    }

    /* Hào quang sáng dịu phía sau các thực thể */
    .stage-glow {
      position: absolute;
      left: 50%;
      top: 42%;
      width: 440px;
      height: 440px;
      transform: translate(-50%, -50%);
      background: radial-gradient(circle, rgba(255, 255, 255, 0.92) 0%, rgba(255, 182, 193, 0.4) 48%, rgba(255, 182, 193, 0) 72%);
      border-radius: 50%;
      z-index: 0;
    }

    /* Class chung cho mỗi Thực Thể Độc Lập (Hoa, Lá, Giấy gói, Nơ, Thư) */
    .entity {
      position: absolute;
      left: 50%;
      bottom: 85px; /* Điểm hội tụ gốc bó hoa */
      transform-origin: bottom center;
      will-change: transform;
      pointer-events: auto;
    }

    /* Đầu bông hoa hồng bung nở riêng biệt khi cành đã trồi lên */
    .rose-head-group {
      transform-box: fill-box;
      transform-origin: center;
      transform: scale(0.18) rotate(-25deg);
      transition: transform 0.85s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.3s;
      cursor: pointer;
    }
    .entity.bloomed .rose-head-group {
      transform: scale(1) rotate(0deg);
    }
    .entity.bloomed .rose-head-group:hover {
      filter: brightness(1.07) drop-shadow(0 0 12px rgba(255, 77, 109, 0.55));
    }

    /* Thực thể Bức Thư Kẹp Trong Thân Bó Hoa */
    #tucked-letter-entity {
      position: absolute;
      left: 50%;
      bottom: 205px;
      width: 140px;
      height: 96px;
      transform-origin: bottom center;
      cursor: pointer;
      z-index: 82;
      pointer-events: auto;
      will-change: transform;
    }
    .tucked-envelope-card {
      width: 100%;
      height: 100%;
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.3s;
      filter: drop-shadow(0 8px 16px rgba(128, 15, 47, 0.32));
    }
    #tucked-letter-entity.ready .tucked-envelope-card {
      animation: letterBreath 2.4s ease-in-out infinite;
    }
    #tucked-letter-entity:hover .tucked-envelope-card {
      transform: scale(1.09) translateY(-5px) rotate(-3deg);
      filter: drop-shadow(0 12px 22px rgba(255, 77, 109, 0.75));
    }
    @keyframes letterBreath {
      0%, 100% { transform: scale(1) translateY(0); }
      50% { transform: scale(1.04) translateY(-4px); }
    }

    /* Dòng nhắc mở thư bên dưới */
    #bottom-hint {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%) translateY(40px);
      opacity: 0;
      z-index: 30;
      background: rgba(255, 255, 255, 0.92);
      border: 2px solid #ffb3c6;
      color: #c9184a;
      padding: 8px 22px;
      border-radius: 30px;
      font-weight: 700;
      font-size: 14px;
      box-shadow: 0 8px 24px rgba(201, 24, 74, 0.18);
      cursor: pointer;
      transition: opacity 0.6s ease, transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
      white-space: nowrap;
    }
    #bottom-hint.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
    #bottom-hint:hover {
      background: #fff;
      transform: translateX(-50%) translateY(-2px);
    }

    /* =========================================================================
       HIỆU ỨNG LẬT MỞ LÁ THƯ 3D (3D BOOK / PAPER FLIP UNFOLD)
       ========================================================================= */
    #letter-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(42, 10, 24, 0.62);
      backdrop-filter: blur(7px);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 16px;
      perspective: 1800px;
    }

    .book-flip-container {
      position: relative;
      width: 100%;
      max-width: 560px;
      max-height: 88vh;
      transform-style: preserve-3d;
      display: flex;
      flex-direction: column;
    }

    /* Tờ giấy thư thực hiện hiệu ứng lật mở 3D từ gập đôi ra phẳng */
    .letter-sheet {
      position: relative;
      width: 100%;
      background: linear-gradient(180deg, #fffefb 0%, #fff4f7 100%);
      border: 3px solid #ff8fa3;
      border-radius: 22px;
      padding: 26px 26px 20px;
      box-shadow: 0 28px 65px rgba(0, 0, 0, 0.42), inset 0 0 0 6px rgba(255, 194, 209, 0.35);
      transform-origin: left center;
      transform: rotateY(-95deg) rotateX(12deg) scale(0.8);
      opacity: 0;
      transition: transform 0.9s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.45s ease;
      display: flex;
      flex-direction: column;
      max-height: 86vh;
    }

    /* Trang bìa phong bì lật mở sang bên trái như mở thiệp / mở thư */
    .letter-cover-leaf {
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, #ffe5ec 0%, #ffb3c6 100%);
      border-radius: 20px;
      border: 3px solid #ff8fa3;
      transform-origin: left center;
      transform: rotateY(0deg);
      transition: transform 0.95s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.55s ease 0.35s;
      z-index: 15;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      backface-visibility: hidden;
    }
    .seal-badge {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #ff4d6d, #a4133c 70%, #590d22);
      border: 3px solid #ffe5ec;
      box-shadow: 0 8px 20px rgba(164, 19, 60, 0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      color: #fff;
      margin-bottom: 10px;
    }

    #letter-modal.open .letter-sheet {
      transform: rotateY(0deg) rotateX(0deg) scale(1);
      opacity: 1;
    }
    #letter-modal.open .letter-cover-leaf {
      transform: rotateY(-165deg);
      opacity: 0;
    }

    .letter-title {
      font-family: 'Great Vibes', cursive;
      font-size: clamp(32px, 6vw, 42px);
      color: #c9184a;
      text-align: center;
      margin-bottom: 10px;
      line-height: 1.15;
      flex-shrink: 0;
    }

    .letter-lines-box {
      overflow-y: auto;
      padding: 14px 18px;
      background:
        linear-gradient(transparent, transparent 31px, rgba(255, 179, 198, 0.4) 32px);
      background-size: 100% 32px;
      background-color: rgba(255, 255, 255, 0.82);
      border-radius: 14px;
      border: 1.5px solid #ffd6e0;
      line-height: 32px;
      font-size: 16.5px;
      font-weight: 600;
      color: #3d242e;
      text-align: left;
      max-height: 60vh;
      box-shadow: inset 0 2px 10px rgba(255, 143, 163, 0.12);
    }
    .letter-lines-box::-webkit-scrollbar { width: 6px; }
    .letter-lines-box::-webkit-scrollbar-thumb { background: #ff8fa3; border-radius: 10px; }

    .letter-p {
      margin-bottom: 14px;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.6s ease, transform 0.6s ease;
    }
    .letter-p.show {
      opacity: 1;
      transform: translateY(0);
    }
    .letter-p:last-child {
      margin-bottom: 0;
      color: #c9184a;
      font-weight: 700;
      font-size: 18px;
    }

    .letter-actions {
      display: flex;
      justify-content: center;
      margin-top: 14px;
      flex-shrink: 0;
    }
    .btn-fold-back {
      background: linear-gradient(135deg, #ff4d6d 0%, #ff758f 100%);
      color: #fff;
      border: none;
      padding: 10px 26px;
      border-radius: 25px;
      font-family: inherit;
      font-weight: 700;
      font-size: 14.5px;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(255, 77, 109, 0.35);
      transition: transform 0.15s;
    }
    .btn-fold-back:hover { transform: translateY(-2px); }
  </style>
</head>
<body>

  <!-- Canvas hạt phấn sáng & cánh hoa rơi -->
  <canvas id="ambientCanvas"></canvas>

  <!-- Nút xem lại hiệu ứng các cành hoa trồi từ dưới lên -->
  <div id="top-controls">
    <button id="btn-replay" class="replay-btn">🌹 Cho hoa trồi lên lại</button>
  </div>

  <!-- Sân khấu chứa 52 Thực Thể Độc Lập trồi từ dưới lên -->
  <div id="bouquet-world">
    <div class="stage-glow"></div>
    <!-- Các thực thể Giấy gói, Lá, Hoa Hồng, Hoa Baby, Nơ và Bức Thư được khởi tạo độc lập tại đây -->
  </div>

  <div id="bottom-hint">💌 Chạm vào bức thư kẹp trên thân bó hoa để mở thư nhé!</div>

  <!-- Modal Hiệu ứng Lật Mở Lá Thư 3D -->
  <div id="letter-modal">
    <div class="book-flip-container">
      <div class="letter-sheet">
        <!-- Bìa thư lật mở 3D sang trái -->
        <div class="letter-cover-leaf">
          <div class="seal-badge">❤️</div>
          <div style="font-family:'Great Vibes',cursive; font-size:34px; color:#a4133c;">Gửi Bé 20/10</div>
        </div>

        <div class="letter-title">Gửi cô gái của anh ❤️</div>
        <div id="letter-lines" class="letter-lines-box"></div>

        <div class="letter-actions">
          <button id="btn-close-letter" class="btn-fold-back">🌹 Gấp thư lại &amp; Ngắm hoa</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // =========================================================================
    // 1. NỘI DUNG LÁ THƯ NGUYÊN VĂN CỦA BẠN
    // =========================================================================
    const LETTER_PARAGRAPHS = [
      "Vậy là hành trình nhỏ của chúng mình đến đây là hết rồi nè bé ❤️",
      "Anh hong biết ngoài kia có bao nhiêu lời chúc dành cho bé hôm nay, nhưng anh vẫn muốn tự mình nói với bé một vài điều.",
      "Chúc bé 20/10 thật vui vẻ nhaaa. Anh mong bé sẽ luôn có thật nhiều điều khiến bé mỉm cười, có đủ dũng khí để làm những điều bé muốn, và có thể yêu thương bản thân mình nhiều hơn một chút mỗi ngày.",
      "Anh mong những ngày bé vui, anh có thể vui cùng bé. Những ngày bé mệt, bé có thể kể anh nghe hoặc cứ ở cạnh anh một chút cũng được. Bé hong cần lúc nào cũng phải vui vẻ, hong cần lúc nào cũng phải giỏi giang hay trở thành một người thật hoàn hảo đâu. Bé cứ là bé thoiii.",
      "Anh biết đôi khi hai đứa mình vẫn còn vụng về, vẫn có những lúc chưa hiểu được nhau. Nhưng anh mong tụi mình sẽ ngày càng hiểu nhau hơn, biết cách thương nhau tốt hơn, và cùng nhau trải qua thật nhiều ngày bình thường nữa.",
      "Cảm ơn bé vì đã xuất hiện trong cuộc sống của anh, vì đã cho anh được thương bé, được lắng nghe những câu chuyện của bé và được trở thành một phần trong thế giới của bé.",
      "Mong rằng khi nhìn lại hôm nay, bé sẽ nhớ rằng đã có một người rất vui vì được gặp bé, rất trân trọng bé, và thật lòng mong bé hạnh phúc.",
      "Chúc bé 20/10 vui vẻ nhaaa, cô gái của anh.",
      "Anh thương bé nhiều lắmmm. ❤️"
    ];

    // =========================================================================
    // 2. BẢNG MÀU HOA HỒNG CHÂN THỰC & HÀM TẠO SVG TỪNG ĐÓA HỒNG ĐỘC LẬP
    // =========================================================================
    const ROSE_THEMES = {
      velvet: { c1: "#590d22", c2: "#a4133c", c3: "#df2957", c4: "#ff758f", rim: "#ffccd5" },
      ruby:   { c1: "#800f2f", c2: "#c9184a", c3: "#ff4d6d", c4: "#ffb3c6", rim: "#ffe5ec" },
      coral:  { c1: "#b5179e", c2: "#e5383b", c3: "#ff758f", c4: "#ffc2d1", rim: "#fff0f3" },
      blush:  { c1: "#c9184a", c2: "#ff4d6d", c3: "#ff8fa3", c4: "#ffe5ec", rim: "#ffffff" },
      cream:  { c1: "#e07a5f", c2: "#ff8fa3", c3: "#ffcad4", c4: "#fff5f7", rim: "#ffffff" }
    };

    // Tạo một thực thể Cành Hoa Hồng độc lập (có cuống hoa, lá, đài hoa và các tầng cánh hồng 3D)
    function createRoseEntitySVG(uid, themeKey, stemLen, curveX, headScale, isBud) {
      const t = ROSE_THEMES[themeKey] || ROSE_THEMES.ruby;
      const w = 150;
      const h = stemLen + 110;
      const cx = w / 2;
      const topY = 62;
      const botY = h - 10;

      const gradId = `rg_${uid}`;
      const innerGradId = `ig_${uid}`;

      let bloomMarkup = "";
      if (isBud) {
        // Nụ hoa hồng chúm chím kèm đài lá
        bloomMarkup = `
          <g class="rose-head-group" transform="translate(${cx + curveX}, ${topY}) scale(${headScale})">
            <path d="M0,22 C-16,16 -20,-8 -9,-26 C-2,-16 2,-16 9,-26 C20,-8 16,16 0,22 Z" fill="url(#${gradId})"/>
            <path d="M0,19 C-10,14 -11,-8 0,-29 C11,-8 10,14 0,19 Z" fill="${t.rim}" opacity="0.45"/>
            <path d="M0,23 C-14,19 -18,8 -15,-4 C-10,8 -4,16 0,20 C4,16 10,8 15,-4 C18,8 14,19 0,23 Z" fill="#2d6a4f"/>
          </g>
        `;
      } else {
        // Đóa hoa hồng nở rộ nhiều tầng cánh реалистичный
        bloomMarkup = `
          <g class="rose-head-group" transform="translate(${cx + curveX}, ${topY}) scale(${headScale})">
            <!-- Đài lá xanh phía dưới bông hồng -->
            <path d="M-28,24 L-40,36 L-18,30 Z M28,24 L40,36 L18,30 Z M0,32 L0,44 L8,32 Z" fill="#2d6a4f"/>
            <!-- Tầng cánh ngoài cùng (5 cánh lớn uốn lượn) -->
            <g fill="url(#${gradId})">
              <path d="M0,-48 C25,-52 46,-33 47,-9 C48,16 33,39 10,46 C-12,52 -37,40 -46,18 C-53,-4 -40,-35 -18,-45 C-8,-50 -3,-47 0,-48 Z"/>
              <path d="M0,-47 C24,-50 44,-32 45,-8 C46,15 32,37 9,44 C-12,50 -35,38 -44,17 C-50,-4 -38,-33 -17,-43 Z" transform="rotate(42)"/>
              <path d="M0,-45 C22,-48 42,-30 43,-7 C44,14 30,35 8,42 C-11,48 -33,36 -41,15 C-47,-4 -36,-31 -15,-41 Z" transform="rotate(84)"/>
            </g>
            <!-- Ánh sáng viền cánh ngoài -->
            <path d="M-28,-35 Q0,-51 28,-35 Q48,-9 32,25 Q0,47 -32,25 Q-48,-9 -28,-35 Z" fill="${t.rim}" opacity="0.22" transform="rotate(20)"/>
            <!-- Tầng cánh giữa xếp lớp tạo chiều sâu -->
            <path d="M-25,-24 C-6,-41 23,-37 33,-16 C43,4 33,29 10,35 C-12,41 -33,27 -36,4 C-39,-12 -30,-19 -25,-24 Z" fill="${t.c1}" opacity="0.32"/>
            <path d="M0,-36 C20,-38 35,-23 35,-3 C35,17 21,32 2,35 C-17,37 -33,25 -35,5 C-37,-15 -20,-34 0,-36 Z" fill="url(#${gradId})"/>
            <path d="M0,-33 C18,-35 31,-20 32,-3 C33,14 19,29 2,31 C-15,33 -30,20 -31,3 C-32,-14 -16,-31 0,-33 Z" transform="rotate(52)" fill="${t.rim}" opacity="0.25"/>
            <!-- Tầng cánh khum quanh tâm -->
            <path d="M0,-24 C14,-25 24,-14 24,0 C24,13 13,24 0,24 C-13,24 -24,13 -24,0 C-24,-13 -13,-23 0,-24 Z" fill="url(#${innerGradId})"/>
            <!-- Xoáy tâm hoa hồng nhiều lớp -->
            <path d="M-14,-5 C-7,-16 9,-16 14,-5 C19,6 9,17 -2,16 C-12,15 -16,3 -10,-6 C-5,-11 6,-10 9,-3 C11,3 5,9 -1,8 C-6,7 -7,1 -3,-2"
                  fill="none" stroke="${t.rim}" stroke-width="2.4" stroke-linecap="round" opacity="0.82"/>
          </g>
        `;
      }

      return `
        <svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="overflow:visible;">
          <defs>
            <radialGradient id="${gradId}" cx="50%" cy="42%" r="56%">
              <stop offset="0%" stop-color="${t.c1}"/>
              <stop offset="42%" stop-color="${t.c2}"/>
              <stop offset="78%" stop-color="${t.c3}"/>
              <stop offset="100%" stop-color="${t.c4}"/>
            </radialGradient>
            <radialGradient id="${innerGradId}" cx="48%" cy="42%" r="52%">
              <stop offset="0%" stop-color="${t.c1}"/>
              <stop offset="60%" stop-color="${t.c2}"/>
              <stop offset="100%" stop-color="${t.c3}"/>
            </radialGradient>
          </defs>
          <!-- Cuống hoa hồng riêng biệt của từng bông -->
          <path d="M${cx},${botY} Q${cx + curveX * 0.45},${(botY + topY) / 2} ${cx + curveX},${topY + 12}"
                fill="none" stroke="#2d6a4f" stroke-width="4.2" stroke-linecap="round"/>
          <!-- Lá hồng mọc trên thân cành -->
          <ellipse cx="${cx + curveX * 0.55 - 14}" cy="${topY + (botY - topY) * 0.42}" rx="13" ry="7"
                   transform="rotate(-28 ${cx + curveX * 0.55 - 14} ${topY + (botY - topY) * 0.42})" fill="#40916c"/>
          <ellipse cx="${cx + curveX * 0.65 + 14}" cy="${topY + (botY - topY) * 0.34}" rx="13" ry="7"
                   transform="rotate(28 ${cx + curveX * 0.65 + 14} ${topY + (botY - topY) * 0.34})" fill="#52b788"/>
          ${bloomMarkup}
        </svg>
      `;
    }

    // Tạo thực thể Cành Lá Khuynh Diệp độc lập
    function createFoliageEntitySVG(stemLen, curveX) {
      const w = 130;
      const h = stemLen + 70;
      const cx = w / 2;
      const topY = 30;
      const botY = h - 8;
      let leaves = "";
      for (let i = 1; i <= 5; i++) {
        const t = i / 5;
        const lx = cx + curveX * t;
        const ly = botY - (botY - topY) * t;
        const side = i % 2 === 0 ? 1 : -1;
        leaves += `
          <ellipse cx="${lx + side * 14}" cy="${ly}" rx="12" ry="19"
                   transform="rotate(${side * 42} ${lx + side * 14} ${ly})"
                   fill="${i % 2 === 0 ? '#52b788' : '#2d6a4f'}" opacity="0.95"/>
        `;
      }
      return `
        <svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="overflow:visible;">
          <path d="M${cx},${botY} Q${cx + curveX * 0.5},${(botY + topY) / 2} ${cx + curveX},${topY}"

    // Đăng ký từng thực thể vào hệ thống Vật Lý Trồi Từ Dưới Lên & Đung Đưa Độc Lập
    function registerEntityPhysics(el, targetAngle, delayMs, hasBloom, swayFactor) {
      const ent = {
        el,
        targetAngle,
        currentAngle: 0, // Lúc mới trồi lên thì thẳng đứng, lên tới nơi mới xòe ra góc targetAngle
        vAngle: 0,
        yOffset: 680,    // Bắt đầu ở dưới đáy màn hình (trồi từ dưới lên)
        vY: 0,
        started: false,
        bloomed: false,
        hasBloom,
        swayFactor,
        phase: Math.random() * Math.PI * 2,
        freq: 0.0014 + Math.random() * 0.0009
      };

      // Đặt vị trí ban đầu ẩn dưới đáy
      el.style.transform = `translate3d(0px, ${ent.yOffset}px, 0) rotate(0deg)`;

      setTimeout(() => {
        ent.started = true;
      }, delayMs);

      entities.push(ent);
      return ent;
    }

    }));

    const burstItems = [];
    function spawnPetalBurst(x, y, count = 12) {
      const icons = ["❤️", "🌹", "✨", "💖", "🌸"];
      for (let i = 0; i < count; i++) {
        const ang = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.35;
        const spd = 1.4 + Math.random() * 3.0;
        burstItems.push({
          x, y,
          vx: Math.cos(ang) * spd,
          vy: Math.sin(ang) * spd - 1.2,
          alpha: 1,
          size: 14 + Math.random() * 8,
          sym: icons[Math.floor(Math.random() * icons.length)]
        });
      }
    }

    function physicsTick(timestamp) {
      // 1. Cập nhật vật lý độc lập của từng thực thể trong bó hoa
      const centerX = window.innerWidth / 2;
      const baseY = window.innerHeight - 95;

      entities.forEach((ent) => {
        if (!ent.started) return;

        // Lực lò xo kéo thực thể trồi từ dưới đáy (yOffset: 680) lên vị trí (yOffset: 0)
        const dy = 0 - ent.yOffset;
        ent.vY = ent.vY * 0.80 + dy * 0.075;
        ent.yOffset += ent.vY;

        // Khi cành hoa đã trồi lên gần tới đỉnh -> Kích hoạt bung nở các lớp cánh hoa hồng
        if (ent.hasBloom && !ent.bloomed && ent.yOffset < 75) {
          ent.bloomed = true;
          ent.el.classList.add("bloomed");
        }

        // Góc đung đưa tự nhiên riêng biệt của mỗi cành hoa
        const windSway = Math.sin(timestamp * ent.freq + ent.phase) * 2.2 * ent.swayFactor;

        // Tương tác vật lý khi lướt chuột/ngón tay qua gần từng cành hoa
        let interactPush = 0;
        if (ent.yOffset < 30 && pointerX > 0) {
          const rad = (ent.currentAngle * Math.PI) / 180;
          const approxTipX = centerX + Math.sin(rad) * 240;
          const approxTipY = baseY - Math.cos(rad) * 240;
          const dist = Math.hypot(pointerX - approxTipX, pointerY - approxTipY);
          if (dist < 110) {
            const dir = pointerX < approxTipX ? 1 : -1;
            interactPush = dir * ((110 - dist) / 110) * 8.5 * ent.swayFactor;
          }
        }

        // Chỉ xòe góc cắm hoa khi cành đang trồi lên
        const riseProgress = Math.max(0, Math.min(1, 1 - ent.yOffset / 500));
        const desiredAngle = ent.targetAngle * riseProgress + windSway + interactPush;

        const dAng = desiredAngle - ent.currentAngle;
        ent.vAngle = ent.vAngle * 0.84 + dAng * 0.09;
        ent.currentAngle += ent.vAngle;

        ent.el.style.transform = `translate3d(0px, ${ent.yOffset.toFixed(2)}px, 0) rotate(${ent.currentAngle.toFixed(2)}deg)`;
      });

      // 2. Vẽ cánh hoa bay trong không gian
      ambCtx.clearRect(0, 0, ambCanvas.width, ambCanvas.height);

      floatingPetals.forEach((p) => {
        p.x += p.vx + Math.sin(timestamp * 0.0015 + p.rot) * 0.3;
        p.y += p.vy;
        p.rot += p.vRot;

        if (p.y > ambCanvas.height + 20) {
          p.y = -15;
          p.x = Math.random() * ambCanvas.width;
        }
        if (p.x > ambCanvas.width + 20) p.x = -15;
        if (p.x < -20) p.x = ambCanvas.width + 15;

        ambCtx.save();
        ambCtx.translate(p.x, p.y);
        ambCtx.rotate(p.rot);
        ambCtx.fillStyle = p.color;
        ambCtx.beginPath();
        ambCtx.moveTo(0, -p.size);
        ambCtx.bezierCurveTo(p.size, -p.size, p.size, p.size, 0, p.size);
        ambCtx.bezierCurveTo(-p.size, p.size, -p.size, -p.size, 0, -p.size);
        ambCtx.fill();
        ambCtx.restore();
      });

      for (let i = burstItems.length - 1; i >= 0; i--) {
        const b = burstItems[i];
        b.x += b.vx;
        b.y += b.vy;
        b.vy += 0.05;
        b.alpha -= 0.018;
        if (b.alpha <= 0) {
          burstItems.splice(i, 1);
          continue;
        }
        ambCtx.save();
        ambCtx.globalAlpha = b.alpha;
        ambCtx.font = `${b.size}px sans-serif`;
        ambCtx.textAlign = "center";
        ambCtx.fillText(b.sym, b.x, b.y);
        ambCtx.restore();
      }

      requestAnimationFrame(physicsTick);
    }

    buildIndependentBouquetEntities();
    requestAnimationFrame(physicsTick);
  </script>
</body>
</html>
