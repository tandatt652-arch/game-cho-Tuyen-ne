<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">

    <title>Mario English - Tuyển Sinh Lớp 10 (Bé Tuyến)</title>
    <style>
        body {
            margin: 0; padding: 0;
            background-color: #2c3e50;

            width: 100%; max-width: 800px;

            display: flex; flex-direction: column; position: relative;
        }
        #ui-panel {
            background: #ecf0f1; padding: 15px;
            color: #2c3e50; border-bottom: 4px solid #bdc3c7;
        }
        .header-info {
            display: flex; justify-content: space-between; align-items: center; font-weight: bold; margin-bottom: 10px;
            color: #e74c3c; font-size: 16px; flex-wrap: wrap; gap: 5px;
        }
        .level-controls { display: flex; align-items: center; gap: 5px; color: #2c3e50; }
        #level-input { width: 40px; text-align: center; border: 1px solid #95a5a6; border-radius: 5px; padding: 3px; font-weight: bold;}
        #btn-jump-level { background: #27ae60; color: white; border: none; border-radius: 5px; cursor: pointer; padding: 4px 10px; font-weight: bold; }
        #btn-jump-level:active { background: #2ecc71; }
        #health-display { background: #ff7675; color: white; padding: 4px 10px; border-radius: 15px; }

        #instruction { font-style: italic; margin-bottom: 5px; font-size: 14px; color: #2980b9;}
        #context { 
            background: #fff; padding: 10px; border: 1px solid #ccc; 
            border-radius: 5px; font-size: 14px; max-height: 80px; overflow-y: auto;
            margin-bottom: 10px; display: none; line-height: 1.4;
        }
        #question { font-weight: bold; font-size: 16px; margin-bottom: 10px; }
        #options-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 5px; font-size: 14px;
        }
        
        #game-container {
            position: relative; width: 100%; background: #87CEEB;
        }
        canvas { display: block; width: 100%; height: auto; }
        
        #notification {
            position: absolute; top: 15%; left: 50%; transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8); padding: 10px 20px; border-radius: 8px;
            font-size: 16px; font-weight: bold; text-align: center;
            opacity: 0; pointer-events: none; z-index: 100; transition: opacity 0.3s ease;
        }

        #end-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(44, 62, 80, 0.95); z-index: 200;
            display: none; flex-direction: column; align-items: center; justify-content: center;
            text-align: center; padding: 20px; box-sizing: border-box;
        }
        #end-msg { font-size: 24px; font-weight: bold; margin-bottom: 20px; line-height: 1.4; }
        #btn-restart {
            background: #f1c40f; border: none; border-bottom: 4px solid #f39c12; color: #2c3e50;

        }
        #btn-restart:active { border-bottom: 0; transform: translateY(4px); }

        #controls {
            display: flex; justify-content: space-around; flex-wrap: wrap;
            background: #34495e; padding: 10px 0; gap: 10px;
        }
        .btn {
            background: #3498db; border: none; border-bottom: 4px solid #2980b9;
            color: white; font-size: 18px; padding: 15px 20px; border-radius: 10px;
            user-select: none; cursor: pointer; flex: 1; margin: 0 5px; font-weight: bold;
        }

        .btn-help { background: #f39c12; border-bottom: 4px solid #e67e22; }
        .btn-help:disabled { background: #95a5a6; border-bottom: 4px solid #7f8c8d; opacity: 0.7; cursor: not-allowed; }

</head>

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    let health = 10;
    let hasCheated = false;
    let mistakesThisLevel = 0;

    let currentLevel = 1;
    const MAX_LEVEL = 100;
    let currentQData = null;
    let hasKey = false;
    let helpUsed = false;
    let blocks = [];
    
    const player = { x: 50, y: 200, width: 40, height: 40, vx: 0, vy: 0, speed: 5, jumpPower: -13, grounded: false };
    const gravity = 0.8;
    const floorY = 260; 
    const door = { x: 720, y: 160, width: 60, height: 100 };
    const keys = { left: false, right: false, jump: false };

    const playerImg = new Image(); playerImg.src = 'nhanvat.png';
    const doorImg = new Image(); doorImg.src = 'cua.png';
    const blockImg = new Image(); blockImg.src = 'gach.png';

    let notifyTimeout = null;
    function showNotification(msg, type) {
        const noti = document.getElementById('notification');
        noti.innerText = msg;
        if (type === 'error') {
            noti.style.border = "3px solid #e74c3c";
            noti.style.color = "#ff7675";
        } else {
            noti.style.border = "3px solid #2ecc71";
            noti.style.color = "#55efc4";
        }
        noti.style.opacity = 1;
        if (notifyTimeout) clearTimeout(notifyTimeout);
        notifyTimeout = setTimeout(() => { noti.style.opacity = 0; }, 2000); 
    }

    function updateHealthUI() {
        document.getElementById('health-display').innerText = `❤️ ${health}`;
    }

    function fullResetGame() {
        health = 10;
        currentLevel = 1;
        hasCheated = false;
        updateHealthUI();
        loadLevel();
    }

    function loadLevel() {
        mistakesThisLevel = 0;
        hasKey = false;
        helpUsed = false;
        
        document.getElementById('btnHelp').disabled = false;
        document.getElementById('level-display').innerText = currentLevel;
        document.getElementById('status-display').innerText = "Tìm chìa khóa! 🔑";
        document.getElementById('status-display').style.color = "#e74c3c";

        player.x = 50; player.y = floorY - player.height;
        player.vx = 0; player.vy = 0;

        currentQData = questionBank[currentLevel - 1];

        document.getElementById('instruction').innerText = currentQData.instruction;
        document.getElementById('question').innerText = currentQData.content;
        
        const contextDiv = document.getElementById('context');
        if(currentQData.context) {
            contextDiv.style.display = "block";
            contextDiv.innerText = currentQData.context;
            contextDiv.scrollTop = 0; 
        } else {
            contextDiv.style.display = "none";
        }

        ['A','B','C','D'].forEach(id => {
            document.getElementById('opt-'+id).style.textDecoration = "none";
            document.getElementById('opt-'+id).style.color = "#2c3e50";
            document.getElementById('opt-'+id).innerText = `${id}. ${currentQData.options[id]}`;
        });

        blocks = [
            { id: 'A', x: 120, y: 100, w: 50, h: 50, active: true },
            { id: 'B', x: 280, y: 100, w: 50, h: 50, active: true },
            { id: 'C', x: 440, y: 100, w: 50, h: 50, active: true },
            { id: 'D', x: 600, y: 100, w: 50, h: 50, active: true }
        ];
    }

    function useHelp5050() {
        if (helpUsed || hasKey) return;
        helpUsed = true;
        document.getElementById('btnHelp').disabled = true;

        let wrongBlocks = blocks.filter(b => b.id !== currentQData.correct_answer && b.active);
        wrongBlocks.sort(() => Math.random() - 0.5);
        if(wrongBlocks.length >= 2) {
            wrongBlocks[0].active = false;
            wrongBlocks[1].active = false;
            
            document.getElementById('opt-' + wrongBlocks[0].id).style.textDecoration = "line-through";
            document.getElementById('opt-' + wrongBlocks[0].id).style.color = "#bdc3c7";
            document.getElementById('opt-' + wrongBlocks[1].id).style.textDecoration = "line-through";
            document.getElementById('opt-' + wrongBlocks[1].id).style.color = "#bdc3c7";
        }
    }

    function checkHitBlock(block) {
        if (!block.active) return;
        
        if (block.id === currentQData.correct_answer) {
            hasKey = true;
            block.active = false; 
            document.getElementById('status-display').innerText = "Vào Cửa Đi ^.^ 🚪";
            document.getElementById('status-display').style.color = "#2ecc71";
            showNotification("Đúng rồi nè! Có chìa khóa rồi!", "success");
        } else {
            health--;
            mistakesThisLevel++;
            updateHealthUI();
            
            showNotification("Ựaaaaa", "error");
            block.active = false; 
            document.getElementById('opt-' + block.id).style.textDecoration = "line-through";
            document.getElementById('opt-' + block.id).style.color = "#bdc3c7";

            if (health <= 0) {
                showNotification("Bé Tuyến lười biếng rồi, dạy lại bé Tuyến rồi làm lại thôi!", "error");
                setTimeout(fullResetGame, 1500);
            }
        }
    }

    function update() {
        if (keys.left) player.vx = -player.speed;
        else if (keys.right) player.vx = player.speed;
        else player.vx = 0;

        if (keys.jump && player.grounded) {
            player.vy = player.jumpPower;
            player.grounded = false;
        }

        player.x += player.vx;
        player.y += player.vy;
        player.vy += gravity;

        if (player.x < 0) player.x = 0;
        if (player.x + player.width > canvas.width) player.x = canvas.width - player.width;

        if (player.y + player.height >= floorY) {
            player.y = floorY - player.height;
            player.vy = 0;
            player.grounded = true;
        }

        blocks.forEach(block => {
            if (block.active) {
                if (player.vy < 0 && 
                    player.y <= block.y + block.h && player.y + player.height > block.y + block.h &&
                    player.x + player.width > block.x && player.x < block.x + block.w) {
                    player.y = block.y + block.h; 
                    player.vy = 0; 
                    checkHitBlock(block);
                }
                if (player.vy > 0 && 
                    player.y + player.height >= block.y && player.y < block.y &&
                    player.x + player.width > block.x && player.x < block.x + block.w) {
                    player.y = block.y - player.height;
                    player.vy = 0;
                    player.grounded = true;
                }
            }
        });

        if (hasKey && player.x + player.width > door.x && player.y + player.height > door.y && player.x < door.x + door.width) {
            if (currentLevel === MAX_LEVEL) {
                const endScreen = document.getElementById('end-screen');
                const endMsg = document.getElementById('end-msg');
                const btnRestart = document.getElementById('btn-restart');
                endScreen.style.display = "flex";
                
                if (hasCheated) {
                    endMsg.innerText = "GIAN LẬN RỒI BÉ NÀY HƯ QUÁ!\nPHẢI DẠY LẠI THÔI.";
                    endMsg.style.color = "#e74c3c";
                    btnRestart.innerText = "Làm lại không gian lận";
                } else {
                    endMsg.innerText = "Bé Tuyến giỏi quá nè 🎉";
                    endMsg.style.color = "#2ecc71";
                    btnRestart.innerText = "Chơi lại từ đầu";
                }

                btnRestart.onclick = () => {
                    endScreen.style.display = "none";
                    fullResetGame();
                }
            } 
            else {
                if (mistakesThisLevel > 0) {
                    showNotification("cố gắng làm tốt hơn nha bé oii", "error");
                } else {
                    showNotification("Hmmm, bé này cũng dỏi đó chớ, làm câu nữa đi", "success");
                }
                currentLevel++;
                loadLevel(); 
            }
        }
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        ctx.fillStyle = '#8B4513';
        ctx.fillRect(0, floorY, canvas.width, canvas.height - floorY);
        ctx.fillStyle = '#2ecc71'; 
        ctx.fillRect(0, floorY, canvas.width, 15);

        blocks.forEach(block => {
            if (block.active) {
                if (blockImg.complete && blockImg.naturalHeight !== 0) {
                    ctx.drawImage(blockImg, block.x, block.y, block.w, block.h);
                } else {
                    ctx.fillStyle = '#e67e22'; 
                    ctx.fillRect(block.x, block.y, block.w, block.h);
                    ctx.strokeStyle = '#d35400';
                    ctx.lineWidth = 3;
                    ctx.strokeRect(block.x, block.y, block.w, block.h);
                }
                ctx.fillStyle = 'white';
                ctx.font = 'bold 28px Arial';
                ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.lineWidth = 2; ctx.strokeStyle = 'black';
                ctx.strokeText(block.id, block.x + block.w / 2, block.y + block.h / 2);
                ctx.fillText(block.id, block.x + block.w / 2, block.y + block.h / 2);
            }
        });

        if (doorImg.complete && doorImg.naturalHeight !== 0) {
            ctx.drawImage(doorImg, door.x, door.y, door.width, door.height);
        } else {
            ctx.fillStyle = hasKey ? '#3498db' : '#7f8c8d';
            ctx.fillRect(door.x, door.y, door.width, door.height);
            ctx.fillStyle = '#f1c40f';
            ctx.beginPath();
            ctx.arc(door.x + 10, door.y + door.height / 2, 5, 0, Math.PI * 2);
            ctx.fill();
        }

        // VẼ NHÂN VẬT
        if (playerImg.complete && playerImg.naturalHeight !== 0) {
            ctx.drawImage(playerImg, player.x, player.y, player.width, player.height);
        } else {
            ctx.fillStyle = '#e74c3c';
            ctx.fillRect(player.x, player.y, player.width, player.height);
            ctx.fillStyle = 'white'; ctx.fillRect(player.x + 25, player.y + 10, 8, 8);
            ctx.fillStyle = 'black'; ctx.fillRect(player.x + 28, player.y + 12, 4, 4);
        }

        // TÊN NHÂN VẬT LƠ LỬNG TRÊN ĐẦU
        ctx.fillStyle = '#ffffff'; 
        ctx.font = 'bold 16px Arial';
        ctx.textAlign = 'center';
        ctx.strokeStyle = '#000000'; // Viền đen để dễ nhìn
        ctx.lineWidth = 3;
        ctx.strokeText("Bé Tuyến", player.x + player.width / 2, player.y - 10);
        ctx.fillText("Bé Tuyến", player.x + player.width / 2, player.y - 10);
    }

    function gameLoop() {
        update();
        draw();
        requestAnimationFrame(gameLoop);
    }

    document.getElementById('btn-jump-level').addEventListener('click', () => {
        let inputVal = parseInt(document.getElementById('level-input').value);
        if (inputVal >= 1 && inputVal <= MAX_LEVEL) {
            hasCheated = true; 
            currentLevel = inputVal;
            showNotification("Đã dùng tính năng Dịch Chuyển!", "error");
            loadLevel();
        } else {
            showNotification(`Vui lòng nhập từ 1 đến ${MAX_LEVEL}`, 'error');
        }
    });

    function bindButton(btnId, keyName) {
        const btn = document.getElementById(btnId);
        btn.addEventListener('touchstart', (e) => { e.preventDefault(); keys[keyName] = true; }, {passive: false});
        btn.addEventListener('touchend', (e) => { e.preventDefault(); keys[keyName] = false; }, {passive: false});
        btn.addEventListener('mousedown', () => keys[keyName] = true);
        btn.addEventListener('mouseup', () => keys[keyName] = false);
        btn.addEventListener('mouseleave', () => keys[keyName] = false);
    }

    bindButton('btnLeft', 'left');
    bindButton('btnRight', 'right');
    bindButton('btnJump', 'jump');
    
    document.getElementById('btnHelp').addEventListener('click', useHelp5050);
    document.getElementById('btnHelp').addEventListener('touchstart', (e) => { e.preventDefault(); useHelp5050(); }, {passive: false});

    loadLevel();
    gameLoop();
</script>
</body>
