<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>P2P Voice Call - 1000% Booster & Floating Popup</title>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    body {
      background: radial-gradient(circle at center, #1b2038 0%, #0b0d17 100%);
      color: #f1f2f6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100dvh;
      width: 100vw;
      overflow-x: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 14px;
    }

    /* HỆ THỐNG TOAST POPUP GÓC TRÊN PHẢI */
    #toast-container {
      position: fixed;
      top: 78px;
      right: 16px;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-width: 320px;
      width: calc(100% - 32px);
      pointer-events: none;
    }
    .toast-popup {
      background: rgba(25, 30, 48, 0.95);
      backdrop-filter: blur(12px);
      border-left: 4px solid #ff758c;
      border-top: 1px solid rgba(255,255,255,0.12);
      border-right: 1px solid rgba(255,255,255,0.12);
      border-bottom: 1px solid rgba(255,255,255,0.12);
      color: #fff;
      padding: 12px 16px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 13px;
      font-weight: 600;
      pointer-events: auto;
      animation: slideInRight 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }
    .toast-popup.success { border-left-color: #2ed573; }
    .toast-popup.warn { border-left-color: #ffa502; }
    .toast-popup.info { border-left-color: #4facfe; }
    @keyframes slideInRight {
      from { transform: translateX(110%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }
    @keyframes fadeOutRight {
      to { transform: translateX(110%); opacity: 0; }
    }

    /* THANH KẾT NỐI TRÊN CÙNG */
    #top-bar {
      width: 100%;
      max-width: 860px;
      background: rgba(25, 30, 48, 0.88);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 16px;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      z-index: 15;
      box-shadow: 0 8px 25px rgba(0,0,0,0.4);
    }
    .bar-section {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .id-chip {
      background: rgba(79, 172, 254, 0.18);
      border: 1px solid #4facfe;
      color: #70c4ff;
      padding: 5px 10px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 13px;
      user-select: text;
      -webkit-user-select: text;
    }
    input#remote-id-input {
      background: rgba(11, 13, 23, 0.9);
      border: 1px solid #3a415e;
      color: #fff;
      padding: 7px 12px;
      border-radius: 8px;
      font-size: 13px;
      outline: none;
      width: 175px;
    }
    input#remote-id-input:focus { border-color: #ff758c; }
    .btn-sm {
      background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%);
      color: #fff;
      border: none;
      padding: 7px 13px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 12.5px;
      cursor: pointer;
      transition: transform 0.15s, opacity 0.2s;
    }
    .btn-sm:active { transform: scale(0.95); }
    .btn-copy {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .btn-pip {
      background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
      color: #0b0d17;
    }

    /* KHU VỰC HIỂN THỊ TRUNG TÂM */
    #voice-stage {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      width: 100%;
      max-width: 820px;
      text-align: center;
      margin: 10px 0;
    }
    .top-badges {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .bg-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(46, 213, 115, 0.14);
      border: 1px solid rgba(46, 213, 115, 0.4);
      color: #2ed573;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
    }
    .turbo-btn {
      background: rgba(255, 165, 2, 0.15);
      border: 1px solid #ffa502;
      color: #ffa502;
      padding: 5px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.2s;
    }
    .turbo-btn.active {
      background: linear-gradient(135deg, #ff4757 0%, #ffa502 100%);
      color: #fff;
      border-color: #fff;
      box-shadow: 0 0 18px rgba(255, 71, 87, 0.6);
    }

    .avatars-row {
      display: flex;
      align-items: stretch;
      justify-content: center;
      gap: 24px;
      flex-wrap: wrap;
      width: 100%;
    }
    .user-card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px;
      padding: 20px 22px;
      width: 285px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.35);
    }
    .avatar-circle {
      width: 82px;
      height: 82px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      position: relative;
      transition: box-shadow 0.06s ease, transform 0.06s ease;
    }
    .avatar-me { background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); }
    .avatar-peer { background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%); }
    .user-name { font-weight: 700; font-size: 16px; }
    .mic-badge {
      font-size: 12px;
      color: #a4b0be;
      background: rgba(0, 0, 0, 0.35);
      padding: 4px 10px;
      border-radius: 12px;
    }

    /* THANH TRƯỢT KHUẾCH ĐẠI 1000% */
    .boost-box {
      width: 100%;
      background: rgba(0, 0, 0, 0.32);
      border: 1px solid rgba(255, 255, 255, 0.09);
      border-radius: 14px;
      padding: 10px 12px;
      margin-top: 4px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .boost-header {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: #ced6e0;
      font-weight: 600;
    }
    .boost-val { color: #2ed573; font-weight: 800; }
    .boost-val.high { color: #ffa502; }
    .boost-val.extreme { color: #ff4757; text-shadow: 0 0 8px rgba(255,71,87,0.6); }

    input[type="range"].boost-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 6px;
      background: linear-gradient(90deg, #2ed573 0%, #ffa502 50%, #ff4757 100%);
      border-radius: 4px;
      outline: none;
    }
    input[type="range"].boost-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #fff;
      cursor: pointer;
      border: 3px solid #ff4757;
      box-shadow: 0 2px 6px rgba(0,0,0,0.5);
    }
    .boost-presets {
      display: flex;
      justify-content: space-between;
      gap: 4px;
      margin-top: 2px;
    }
    .preset-btn {
      flex: 1;
      background: rgba(255, 255, 255, 0.08);
      border: none;
      color: #a4b0be;
      font-size: 11px;
      padding: 4px 0;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 700;
    }
    .preset-btn:hover { background: rgba(255, 255, 255, 0.2); color: #fff; }

    #call-timer {
      font-size: 26px;
      font-weight: 800;
      color: #2ed573;
      letter-spacing: 2px;
      display: none;
    }
    #status-text { font-size: 14px; font-weight: 600; color: #ffa502; }

    /* THANH NÚT ĐIỀU KHIỂN DƯỚI CÙNG */
    #bottom-controls {
      background: rgba(25, 30, 48, 0.9);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 10px 20px;
      border-radius: 40px;
      display: flex;
      align-items: center;
      gap: 14px;
      z-index: 15;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .ctrl-btn {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      border: none;
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }
    .ctrl-btn:hover { background: rgba(255, 255, 255, 0.22); }
    .ctrl-btn.off {
      background: rgba(255, 71, 87, 0.25);
      color: #ff4757;
      border: 1px solid #ff4757;
    }
    .ctrl-btn.hangup {
      background: #ff4757;
      color: #fff;
      width: 60px;
      border-radius: 25px;
      display: none;
    }

    /* HỘP THOẠI POPUP GỬI TIN NHẮN NHANH */
    #quick-msg-modal, #incoming-modal {
      position: fixed;
      inset: 0;
      background: rgba(11, 13, 23, 0.82);
      backdrop-filter: blur(10px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 30;
      padding: 20px;
    }
    .modal-card {
      background: #191e30;
      border: 2px solid #ff758c;
      border-radius: 24px;
      padding: 24px;
      width: 100%;
      max-width: 360px;
      text-align: center;
      box-shadow: 0 15px 45px rgba(0,0,0,0.6);
    }
    .incoming-actions {
      display: flex;
      justify-content: center;
      gap: 14px;
      margin-top: 20px;
    }
    .btn-accept {
      background: #2ed573; color: #fff; border: none;
      padding: 11px 22px; border-radius: 30px; font-weight: 800; cursor: pointer;
    }
    .btn-reject {
      background: #ff4757; color: #fff; border: none;
      padding: 11px 22px; border-radius: 30px; font-weight: 800; cursor: pointer;
    }

    .floating-heart {
      position: fixed;
      bottom: 85px;
      font-size: 28px;
      pointer-events: none;
      z-index: 25;
      animation: floatUp 2.4s ease-out forwards;
    }
    @keyframes floatUp {
      0% { transform: translateY(0) scale(0.7); opacity: 1; }
      100% { transform: translateY(-320px) scale(1.4); opacity: 0; }
    }
  </style>
</head>
<body>

  <!-- Container chứa các Popup thông báo góc màn hình -->
  <div id="toast-container"></div>

  <!-- Luồng âm thanh ẩn & Canvas phục vụ cửa sổ Popup Nổi (PiP) -->
  <audio id="remote-raw-puller" autoplay playsinline muted></audio>
  <audio id="remote-boosted-player" autoplay playsinline></audio>
  <canvas id="pip-canvas" width="360" height="200" style="display:none;"></canvas>
  <video id="pip-video" autoplay muted playsinline style="position:fixed; width:1px; height:1px; opacity:0; pointer-events:none;"></video>

  <!-- THANH KẾT NỐI TRÊN CÙNG -->
  <div id="top-bar">
    <div class="bar-section">
      <span style="font-size: 13px; color: #a4b0be;">ID:</span>
      <span id="my-id" class="id-chip">Đang tạo...</span>
      <button id="btn-copy-link" class="btn-sm btn-copy">🔗 Copy Link</button>
      <button id="btn-pip" class="btn-sm btn-pip" title="Tách cửa sổ Popup nổi trên màn hình">🪟 Mở Popup Nổi</button>
    </div>

    <div class="bar-section" id="dial-box">
      <input type="text" id="remote-id-input" placeholder="Nhập ID người nhận..." />
      <button id="btn-call" class="btn-sm">📞 Gọi Thoại</button>
    </div>
  </div>

  <!-- SÂN KHẤU ĐÀM THOẠI TRUNG TÂM -->
  <div id="voice-stage">
    <div class="top-badges">
      <div class="bg-badge">🛡️ Chạy Nền: Bật</div>
      <button id="btn-vocal-turbo" class="turbo-btn">🚀 Bật Siêu Kích Âm Giọng Nói (+8dB)</button>
    </div>

    <div id="call-timer">00:00</div>
    <div id="status-text">Đang khởi tạo bộ khuếch đại 1000%...</div>

    <div class="avatars-row">
      <!-- Thẻ của bạn (Khuếch đại Mic lên tới 1000%) -->
      <div class="user-card">
        <div id="local-avatar" class="avatar-circle avatar-me">🎧</div>
        <div class="user-name">Bạn</div>
        <div id="local-mic-label" class="mic-badge">🎤 Đang bật Mic</div>

        <div class="boost-box">
          <div class="boost-header">
            <span>🎙️ Kích âm Mic:</span>
            <span id="mic-boost-label" class="boost-val">100%</span>
          </div>
          <input type="range" id="mic-boost-slider" class="boost-slider" min="0" max="1000" value="100" step="10" />
          <div class="boost-presets">
            <button class="preset-btn" onclick="setMicBoost(100)">100%</button>
            <button class="preset-btn" onclick="setMicBoost(300)">300%</button>
            <button class="preset-btn" onclick="setMicBoost(600)">600%</button>
            <button class="preset-btn" onclick="setMicBoost(1000)">1000%</button>
          </div>
        </div>
      </div>

      <!-- Thẻ của đối phương (Khuếch đại Loa lên tới 1000%) -->
      <div class="user-card">
        <div id="remote-avatar" class="avatar-circle avatar-peer">💖</div>
        <div class="user-name" id="remote-name">Người thương</div>
        <div id="remote-mic-label" class="mic-badge">⏳ Chưa kết nối</div>

        <div class="boost-box">
          <div class="boost-header">
            <span>🔊 Kích âm Loa:</span>
            <span id="spk-boost-label" class="boost-val">100%</span>
          </div>
          <input type="range" id="spk-boost-slider" class="boost-slider" min="0" max="1000" value="100" step="10" />
          <div class="boost-presets">
            <button class="preset-btn" onclick="setSpkBoost(100)">100%</button>
            <button class="preset-btn" onclick="setSpkBoost(300)">300%</button>
            <button class="preset-btn" onclick="setSpkBoost(600)">600%</button>
            <button class="preset-btn" onclick="setSpkBoost(1000)">1000%</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- POPUP HỘP THOẠI ĐỔ CHUÔNG CUỘC GỌI ĐẾN -->
  <div id="incoming-modal">
    <div class="modal-card">
      <div class="avatar-circle avatar-peer" style="margin: 0 auto 14px; width: 76px; height: 76px; font-size: 32px;">📲</div>
      <h3 style="font-size: 19px; margin-bottom: 6px;">Cuộc gọi thoại đến...</h3>
      <p id="caller-id-text" style="font-size: 13px; color: #a4b0be;">Từ: ...</p>
      <div class="incoming-actions">
        <button id="btn-accept" class="btn-accept">📞 Nghe máy</button>
        <button id="btn-reject" class="btn-reject">✖ Từ chối</button>
      </div>
    </div>
  </div>

  <!-- POPUP GỬI LỜI NHẮN NHANH NỔI LÊN MÀN HÌNH ĐỐI PHƯƠNG -->
  <div id="quick-msg-modal">
    <div class="modal-card">
      <h3 style="font-size: 18px; margin-bottom: 12px; color: #ff758c;">💬 Gửi Popup Nhắn Nhanh</h3>
      <input type="text" id="quick-msg-input" placeholder="Nhập lời nhắn hiển thị lên màn hình..." style="width:100%; padding:10px; border-radius:10px; border:1px solid #4facfe; background:#0b0d17; color:#fff; margin-bottom:14px;" />
      <div class="incoming-actions" style="margin-top:4px;">
        <button id="btn-send-msg" class="btn-accept">Gửi Ngay 🚀</button>
        <button id="btn-close-msg" class="btn-reject" style="background:#57606f;">Đóng</button>
      </div>
    </div>
  </div>

  <!-- THANH NÚT ĐIỀU KHIỂN DƯỚI CÙNG -->
  <div id="bottom-controls">
    <button id="btn-mic" class="ctrl-btn" title="Bật / Tắt Micro">🎤</button>
    <button id="btn-speaker" class="ctrl-btn" title="Bật / Tắt Loa">🔊</button>
    <button id="btn-msg-popup" class="ctrl-btn" title="Gửi Popup lời nhắn">💬</button>
    <button id="btn-heart" class="ctrl-btn" title="Thả tim">💗</button>
    <button id="btn-hangup" class="ctrl-btn hangup" title="Kết thúc cuộc gọi">📴</button>
  </div>

  <script>
    // =========================================================================
    // 1. CẤU HÌNH TURN SERVER CHÍNH CHỦ CỦA BẠN
    // =========================================================================
    const iceServers = [
      { urls: "stun:stun.relay.metered.ca:80" },
      {
        urls: "turn:global.relay.metered.ca:80",
        username: "8a9147e70a62e057ae66290f",
        credential: "GhlDl9OroRDzeCzf",
      },
      {
        urls: "turn:global.relay.metered.ca:80?transport=tcp",
        username: "8a9147e70a62e057ae66290f",
        credential: "GhlDl9OroRDzeCzf",
      },
      {
        urls: "turn:global.relay.metered.ca:443",
        username: "8a9147e70a62e057ae66290f",
        credential: "GhlDl9OroRDzeCzf",
      },
      {
        urls: "turns:global.relay.metered.ca:443?transport=tcp",
        username: "8a9147e70a62e057ae66290f",
        credential: "GhlDl9OroRDzeCzf",
      },
    ];

    const peer = new Peer({
      config: { iceServers, iceCandidatePoolSize: 10 },
      pingInterval: 5000
    });

    // Biến xử lý âm thanh & Khuếch đại 1000%
    let audioCtx = null;
    let rawMicStream = null;
    let processedMicStream = null;
    let micGainNode = null;
    let micVocalFilter = null;
    let remoteGainNode = null;
    let remoteVocalFilter = null;
    let isVocalTurbo = false;

    let currentCall = null;
    let dataConn = null;
    let incomingCallObj = null;
    let isMicOn = true;
    let isSpeakerOn = true;
    let currentMicBoost = 1.0; // Lên tới 10.0 (1000%)
    let currentSpkBoost = 1.0; // Lên tới 10.0 (1000%)

    let localVolumeLevel = 0;
    let remoteVolumeLevel = 0;
    let callTimerInterval = null;
    let heartbeatInterval = null;
    let callSeconds = 0;
    let ringtoneInterval = null;

    const remoteRawPuller = document.getElementById("remote-raw-puller");
    const remoteBoostedPlayer = document.getElementById("remote-boosted-player");
    const statusText = document.getElementById("status-text");
    const localAvatar = document.getElementById("local-avatar");
    const remoteAvatar = document.getElementById("remote-avatar");

    // =========================================================================
    // 2. HỆ THỐNG POPUP THÔNG BÁO (TOAST POPUP + OS NOTIFICATION + PIP POPUP)
    // =========================================================================
    function showPopupToast(message, type = "info", icon = "🔔") {
      const container = document.getElementById("toast-container");
      const toast = document.createElement("div");
      toast.className = `toast-popup ${type}`;
      toast.innerHTML = `<span style="font-size:18px;">${icon}</span><span>${message}</span>`;
      container.appendChild(toast);

      // Phát tiếng ting nhẹ khi có popup
      playPopSound();

      // Nếu người dùng đang ẩn trình duyệt, đẩy luôn Notification của hệ điều hành
      if (document.visibilityState !== "visible" && "Notification" in window && Notification.permission === "granted") {
        new Notification("P2P Voice Call", { body: `${icon} ${message}` });
      }

      setTimeout(() => {
        toast.style.animation = "fadeOutRight 0.3s forwards";
        setTimeout(() => toast.remove(), 300);
      }, 3800);
    }

    function playPopSound() {
      try {
        const ctx = ensureAudioContext();
        const osc = ctx.createOscillator();
        const g = ctx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(740, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(980, ctx.currentTime + 0.09);
        g.gain.setValueAtTime(0.06, ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.1);
        osc.connect(g);
        g.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.1);
      } catch (e) {}
    }

    // Cửa sổ Popup Nổi Đè Lên Màn Hình (Picture-in-Picture)
    const pipCanvas = document.getElementById("pip-canvas");
    const pipCtx = pipCanvas.getContext("2d");
    const pipVideo = document.getElementById("pip-video");

    function renderPipCanvas() {
      pipCtx.fillStyle = "#121626";
      pipCtx.fillRect(0, 0, 360, 200);

      // Tiêu đề & Thời gian gọi
      pipCtx.fillStyle = "#2ed573";
      pipCtx.font = "bold 15px sans-serif";
      pipCtx.textAlign = "center";
      const timeStr = document.getElementById("call-timer").innerText || "00:00";
      pipCtx.fillText(currentCall ? `🟢 Đang gọi: ${timeStr}` : "⏳ Đang chờ kết nối...", 180, 28);

      // Vòng sóng âm của Bạn
      const r1 = 30 + Math.min(20, localVolumeLevel * 0.35);
      pipCtx.fillStyle = "rgba(79, 172, 254, 0.25)";
      pipCtx.beginPath(); pipCtx.arc(105, 105, r1, 0, Math.PI * 2); pipCtx.fill();
      pipCtx.fillStyle = "#4facfe";
      pipCtx.beginPath(); pipCtx.arc(105, 105, 28, 0, Math.PI * 2); pipCtx.fill();
      pipCtx.fillStyle = "#fff"; pipCtx.font = "22px sans-serif";
      pipCtx.fillText(isMicOn ? "🎤" : "🔇", 105, 113);
      pipCtx.font = "bold 12px sans-serif";
      pipCtx.fillText(`Bạn (${Math.round(currentMicBoost * 100)}%)`, 105, 160);

      // Vòng sóng âm của Người thương
      const r2 = 30 + Math.min(20, remoteVolumeLevel * 0.35);
      pipCtx.fillStyle = "rgba(255, 117, 140, 0.25)";
      pipCtx.beginPath(); pipCtx.arc(255, 105, r2, 0, Math.PI * 2); pipCtx.fill();
      pipCtx.fillStyle = "#ff758c";
      pipCtx.beginPath(); pipCtx.arc(255, 105, 28, 0, Math.PI * 2); pipCtx.fill();
      pipCtx.fillStyle = "#fff"; pipCtx.font = "22px sans-serif";
      pipCtx.fillText("💖", 255, 113);
      pipCtx.font = "bold 12px sans-serif";
      pipCtx.fillText(`Loa (${Math.round(currentSpkBoost * 100)}%)`, 255, 160);

      requestAnimationFrame(renderPipCanvas);
    }
    renderPipCanvas();

    document.getElementById("btn-pip").addEventListener("click", async () => {
      try {
        if ("Notification" in window && Notification.permission === "default") {
          Notification.requestPermission();
        }
        if (document.pictureInPictureElement) {
          await document.exitPictureInPicture();
          showPopupToast("Đã đóng cửa sổ Popup nổi", "info", "🪟");
          return;
        }
        if (!pipVideo.srcObject) {
          pipVideo.srcObject = pipCanvas.captureStream(15);
        }
        await pipVideo.play();
        await pipVideo.requestPictureInPicture();
        showPopupToast("Đã bật Popup nổi đè lên màn hình!", "success", "🪟");
      } catch (err) {
        showPopupToast("Trình duyệt này không hỗ trợ tách Popup Video PiP", "warn", "⚠️");
      }
    });

    // =========================================================================
    // 3. GIỮ CHẠY NỀN & ĐÁNH THỨC AUDIO CONTEXT
    // =========================================================================
    function activateBackgroundPersistence() {
      if (navigator.locks && navigator.locks.request) {
        navigator.locks.request("p2p_voice_call_lock", () => new Promise(() => {}));
      }
      if ("mediaSession" in navigator) {
        navigator.mediaSession.metadata = new MediaMetadata({
          title: "Cuộc gọi thoại P2P (1000% Booster)",
          artist: "Đang chạy nền - Chỉ ngắt khi đóng Tab"
        });
        navigator.mediaSession.playbackState = "playing";
      }
      if ("wakeLock" in navigator) {
        navigator.wakeLock.request("screen").catch(() => {});
      }
    }

    document.addEventListener("visibilitychange", () => {
      if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
      if (remoteBoostedPlayer.paused && remoteBoostedPlayer.srcObject) {
        remoteBoostedPlayer.play().catch(() => {});
      }
    });

    function ensureAudioContext() {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContextClass();
        audioCtx.onstatechange = () => {
          if (audioCtx.state === "suspended" || audioCtx.state === "interrupted") {
            audioCtx.resume();
          }
        };
      }
      if (audioCtx.state === "suspended" || audioCtx.state === "interrupted") {
        audioCtx.resume();
      }
      return audioCtx;
    }

    // =========================================================================
    // 4. MẠCH SIÊU KHUẾCH ĐẠI 1000% (10X) + LỌC GIỌNG NÓI VOCAL TURBO
    // =========================================================================
    async function initLocalAudioWithBooster() {
      try {
        const rawStream = await navigator.mediaDevices.getUserMedia({
          audio: {
            echoCancellation: true,
            noiseSuppression: true,
            autoGainControl: true
          },
          video: false
        });
        rawMicStream = rawStream;

        const ctx = ensureAudioContext();
        const source = ctx.createMediaStreamSource(rawStream);

        // Tầng 1: Cắt tạp âm trầm dưới 85Hz (tiếng quạt, tiếng gió ù)
        const highPass = ctx.createBiquadFilter();
        highPass.type = "highpass";
        highPass.frequency.setValueAtTime(85, ctx.currentTime);

        // Tầng 2: Bộ kích dải tần giọng nói con người (2500Hz) khi bật Vocal Turbo
        micVocalFilter = ctx.createBiquadFilter();
        micVocalFilter.type = "peaking";
        micVocalFilter.frequency.setValueAtTime(2500, ctx.currentTime);
        micVocalFilter.Q.setValueAtTime(1.0, ctx.currentTime);
        micVocalFilter.gain.setValueAtTime(isVocalTurbo ? 8 : 0, ctx.currentTime);

        // Tầng 3: Khuếch đại biên độ (0x -> 10x / 1000%)
        micGainNode = ctx.createGain();
        micGainNode.gain.value = currentMicBoost;

        // Tầng 4: Bộ nén chống vỡ tiếng khi kích lên 1000%
        const compressor = ctx.createDynamicsCompressor();
        compressor.threshold.setValueAtTime(-16, ctx.currentTime);
        compressor.knee.setValueAtTime(12, ctx.currentTime);
        compressor.ratio.setValueAtTime(18, ctx.currentTime);
        compressor.attack.setValueAtTime(0.002, ctx.currentTime);
        compressor.release.setValueAtTime(0.2, ctx.currentTime);

        const destination = ctx.createMediaStreamDestination();

        source.connect(highPass);
        highPass.connect(micVocalFilter);
        micVocalFilter.connect(micGainNode);
        micGainNode.connect(compressor);
        compressor.connect(destination);

        processedMicStream = destination.stream;

        statusText.innerText = "Sẵn sàng gọi thoại (Khuếch đại tối đa 1000%)";
        statusText.style.color = "#2ed573";

        activateBackgroundPersistence();
        setupVoiceVisualizer(processedMicStream, localAvatar, "79, 172, 254", true);
        return processedMicStream;
      } catch (err) {
        statusText.innerText = "Vui lòng cấp quyền Micro trên trình duyệt!";
        statusText.style.color = "#ff4757";
        showPopupToast("Chưa cấp quyền Micro!", "warn", "⚠️");
        return null;
      }
    }

    initLocalAudioWithBooster();

    function routeRemoteAudioWithBooster(remoteStream) {
      const ctx = ensureAudioContext();

      remoteRawPuller.srcObject = remoteStream;
      remoteRawPuller.muted = true;
      remoteRawPuller.play().catch(() => {});

      const source = ctx.createMediaStreamSource(remoteStream);

      const highPass = ctx.createBiquadFilter();
      highPass.type = "highpass";
      highPass.frequency.setValueAtTime(85, ctx.currentTime);

      remoteVocalFilter = ctx.createBiquadFilter();
      remoteVocalFilter.type = "peaking";
      remoteVocalFilter.frequency.setValueAtTime(2500, ctx.currentTime);
      remoteVocalFilter.Q.setValueAtTime(1.0, ctx.currentTime);
      remoteVocalFilter.gain.setValueAtTime(isVocalTurbo ? 8 : 0, ctx.currentTime);

      remoteGainNode = ctx.createGain();
      remoteGainNode.gain.value = isSpeakerOn ? currentSpkBoost : 0;

      const limiter = ctx.createDynamicsCompressor();
      limiter.threshold.setValueAtTime(-10, ctx.currentTime);
      limiter.knee.setValueAtTime(10, ctx.currentTime);
      limiter.ratio.setValueAtTime(20, ctx.currentTime);
      limiter.attack.setValueAtTime(0.001, ctx.currentTime);
      limiter.release.setValueAtTime(0.15, ctx.currentTime);

      const boostedDestination = ctx.createMediaStreamDestination();

      source.connect(highPass);
      highPass.connect(remoteVocalFilter);
      remoteVocalFilter.connect(remoteGainNode);
      remoteGainNode.connect(limiter);
      limiter.connect(boostedDestination);

      remoteBoostedPlayer.srcObject = boostedDestination.stream;
      remoteBoostedPlayer.muted = false;
      remoteBoostedPlayer.play().catch(() => {
        limiter.connect(ctx.destination);
      });

      setupVoiceVisualizer(boostedDestination.stream, remoteAvatar, "255, 117, 140", false);
    }

    // Nút bật/tắt Siêu Kích Âm Giọng Nói (Vocal Turbo +8dB)
    document.getElementById("btn-vocal-turbo").addEventListener("click", (e) => {
      ensureAudioContext();
      isVocalTurbo = !isVocalTurbo;
      e.currentTarget.classList.toggle("active", isVocalTurbo);
      e.currentTarget.innerText = isVocalTurbo
        ? "🔥 Đang Bật: Siêu Kích Âm Giọng Nói (+8dB)"
        : "🚀 Bật Siêu Kích Âm Giọng Nói (+8dB)";

      if (micVocalFilter) micVocalFilter.gain.setTargetAtTime(isVocalTurbo ? 8 : 0, audioCtx.currentTime, 0.03);
      if (remoteVocalFilter) remoteVocalFilter.gain.setTargetAtTime(isVocalTurbo ? 8 : 0, audioCtx.currentTime, 0.03);

      showPopupToast(
        isVocalTurbo ? "Đã bật lọc & kích giọng nói siêu rõ (+8dB)!" : "Đã tắt chế độ Vocal Turbo",
        isVocalTurbo ? "success" : "info",
        "🚀"
      );
    });

    // Thanh trượt Khuếch đại Mic (0% -> 1000%)
    const micSlider = document.getElementById("mic-boost-slider");
    const micLabel = document.getElementById("mic-boost-label");

    window.setMicBoost = function(percent) {
      micSlider.value = percent;
      updateMicBoostValue(percent);
      showPopupToast(`Khuếch đại Micro: ${percent}%`, "info", "🎙️");
    };

    function updateMicBoostValue(percent) {
      ensureAudioContext();
      currentMicBoost = percent / 100;
      if (micGainNode) {
        micGainNode.gain.setTargetAtTime(isMicOn ? currentMicBoost : 0, audioCtx.currentTime, 0.02);
      }
      micLabel.innerText = percent + "%";
      micLabel.className = "boost-val" + (percent >= 600 ? " extreme" : percent > 200 ? " high" : "");
    }
    micSlider.addEventListener("input", (e) => updateMicBoostValue(Number(e.target.value)));

    // Thanh trượt Khuếch đại Loa (0% -> 1000%)
    const spkSlider = document.getElementById("spk-boost-slider");
    const spkLabel = document.getElementById("spk-boost-label");

    window.setSpkBoost = function(percent) {
      spkSlider.value = percent;
      updateSpkBoostValue(percent);
      showPopupToast(`Khuếch đại Loa nghe: ${percent}%`, "info", "🔊");
    };

    function updateSpkBoostValue(percent) {
      ensureAudioContext();
      currentSpkBoost = percent / 100;
      if (remoteGainNode) {
        remoteGainNode.gain.setTargetAtTime(isSpeakerOn ? currentSpkBoost : 0, audioCtx.currentTime, 0.02);
      }
      spkLabel.innerText = percent + "%";
      spkLabel.className = "boost-val" + (percent >= 600 ? " extreme" : percent > 200 ? " high" : "");
    }
    spkSlider.addEventListener("input", (e) => updateSpkBoostValue(Number(e.target.value)));

    // =========================================================================
    // 5. HIỆU ỨNG SÓNG ÂM
    // =========================================================================
    function setupVoiceVisualizer(stream, avatarEl, rgbColor, isLocal) {
      try {
        const ctx = ensureAudioContext();
        const source = ctx.createMediaStreamSource(stream);
        const analyser = ctx.createAnalyser();
        analyser.fftSize = 256;
        source.connect(analyser);
        const dataArray = new Uint8Array(analyser.frequencyBinCount);

        function updateMeter() {
          if (!stream.active) {
            avatarEl.style.boxShadow = "none";
            avatarEl.style.transform = "scale(1)";
            return;
          }
          analyser.getByteFrequencyData(dataArray);
          let sum = 0;
          for (let i = 0; i < dataArray.length; i++) sum += dataArray[i];
          const avg = sum / dataArray.length;

          if (isLocal) localVolumeLevel = avg;
          else remoteVolumeLevel = avg;

          if (document.visibilityState === "visible") {
            if (avg > 8) {
              const radius = Math.min(48, avg * 0.7);
              avatarEl.style.boxShadow = `0 0 ${radius}px ${radius * 0.45}px rgba(${rgbColor}, 0.85)`;
              avatarEl.style.transform = `scale(${1 + Math.min(0.12, avg * 0.0015)})`;
            } else {
              avatarEl.style.boxShadow = `0 0 0 0 rgba(${rgbColor}, 0)`;
              avatarEl.style.transform = "scale(1)";
            }
          }
          requestAnimationFrame(updateMeter);
        }
        updateMeter();
      } catch (e) {}
    }

    // =========================================================================
    // 6. CHUÔNG BÁO CUỘC GỌI ĐẾN
    // =========================================================================
    function startRingtone() {
      stopRingtone();
      const ctx = ensureAudioContext();
      ringtoneInterval = setInterval(() => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(587.33, ctx.currentTime);
        osc.frequency.setValueAtTime(880, ctx.currentTime + 0.18);
        gain.gain.setValueAtTime(0.18, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.5);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.5);
      }, 1200);
    }

    function stopRingtone() {
      if (ringtoneInterval) {
        clearInterval(ringtoneInterval);
        ringtoneInterval = null;
      }
    }

    // =========================================================================
    // 7. XỬ LÝ SỰ KIỆN PEERJS & POPUP TƯƠNG TÁC
    // =========================================================================
    peer.on("open", (id) => {
      document.getElementById("my-id").innerText = id;
      const params = new URLSearchParams(window.location.search);
      const targetFromUrl = params.get("id");
      if (targetFromUrl && targetFromUrl !== id) {
        document.getElementById("remote-id-input").value = targetFromUrl;
        showPopupToast("Đã tự điền ID từ Link mời! Bấm Gọi Thoại ngay nhé.", "success", "🔗");
      }
    });

    peer.on("disconnected", () => peer.reconnect());

    peer.on("error", (err) => {
      stopRingtone();
      statusText.style.color = "#ff4757";
      if (err.type === "peer-unavailable") {
        statusText.innerText = "Không tìm thấy ID người nhận!";
        showPopupToast("Không tìm thấy ID người nhận (hoặc họ chưa mở web)!", "warn", "❌");
      } else {
        statusText.innerText = "Lỗi kết nối: " + err.type;
      }
    });

    peer.on("connection", (conn) => {
      dataConn = conn;
      setupDataChannel();
    });

    peer.on("call", (call) => {
      incomingCallObj = call;
      document.getElementById("caller-id-text").innerText = "Từ ID: " + call.peer;
      document.getElementById("incoming-modal").style.display = "flex";
      startRingtone();
      showPopupToast("Có cuộc gọi thoại đến!", "success", "📲");
    });

    document.getElementById("btn-accept").addEventListener("click", async () => {
      stopRingtone();
      ensureAudioContext();
      activateBackgroundPersistence();
      document.getElementById("incoming-modal").style.display = "none";
      if (!processedMicStream) await initLocalAudioWithBooster();
      if (incomingCallObj) {
        incomingCallObj.answer(processedMicStream);
        handleActiveCall(incomingCallObj);
      }
    });

    document.getElementById("btn-reject").addEventListener("click", () => {
      stopRingtone();
      document.getElementById("incoming-modal").style.display = "none";
      if (incomingCallObj) {
        incomingCallObj.close();
        incomingCallObj = null;
      }
      if (dataConn && dataConn.open) dataConn.send({ type: "REJECTED" });
    });

    document.getElementById("btn-call").addEventListener("click", async () => {
      const targetId = document.getElementById("remote-id-input").value.trim();
      if (!targetId || targetId === peer.id) {
        showPopupToast("Vui lòng nhập ID hợp lệ của người nhận!", "warn", "⚠️");
        return;
      }

      ensureAudioContext();
      activateBackgroundPersistence();
      if (!processedMicStream) await initLocalAudioWithBooster();
      statusText.innerText = "Đang đổ chuông...";
      statusText.style.color = "#ffa502";
      showPopupToast("Đang gọi cho người thương...", "info", "📞");

      dataConn = peer.connect(targetId);
      setupDataChannel();

      const call = peer.call(targetId, processedMicStream);
      handleActiveCall(call);
    });

    function handleActiveCall(call) {
      if (currentCall) currentCall.close();
      currentCall = call;

      call.on("stream", (remoteStream) => {
        routeRemoteAudioWithBooster(remoteStream);

        statusText.innerText = "Đang đàm thoại (Đã khóa chạy nền)";
        statusText.style.color = "#2ed573";
        document.getElementById("remote-mic-label").innerText = "🎤 Đang kết nối";
        document.getElementById("dial-box").style.display = "none";
        document.getElementById("btn-hangup").style.display = "flex";
        startCallTimer();
        startHeartbeat();
        showPopupToast("Kết nối cuộc gọi thành công!", "success", "🎉");
      });

      call.on("close", () => endCallCleanup("Cuộc gọi đã kết thúc"));
      call.on("error", () => endCallCleanup("Mất kết nối cuộc gọi"));
    }

    function setupDataChannel() {
      if (!dataConn) return;
      dataConn.on("open", () => {
        dataConn.send({ type: "MIC_STATE", isMicOn });
      });
      dataConn.on("data", (data) => {
        if (data.type === "HEART") {
          spawnFloatingHeart();
          showPopupToast("Người thương vừa thả tim cho bạn!", "info", "💗");
        }
        else if (data.type === "QUICK_MSG") {
          showPopupToast(`Người thương: "${data.text}"`, "success", "💌");
        }
        else if (data.type === "HANGUP") {
          showPopupToast("Đối phương đã kết thúc cuộc gọi", "warn", "📴");
          endCallCleanup("Đối phương đã kết thúc cuộc gọi");
        }
        else if (data.type === "REJECTED") {
          showPopupToast("Đối phương đang bận hoặc từ chối cuộc gọi", "warn", "✖");
          endCallCleanup("Đối phương từ chối cuộc gọi");
        }
        else if (data.type === "MIC_STATE") {
          document.getElementById("remote-mic-label").innerText = data.isMicOn ? "🎤 Đang bật Mic" : "🔇 Đã tắt Mic";
          showPopupToast(data.isMicOn ? "Đối phương đã bật lại Mic" : "Đối phương vừa tắt Mic", "info", data.isMicOn ? "🎤" : "🔇");
        }
        else if (data.type === "PING") {
          if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
        }
      });
    }

    function startHeartbeat() {
      stopHeartbeat();
      heartbeatInterval = setInterval(() => {
        if (dataConn && dataConn.open) dataConn.send({ type: "PING", t: Date.now() });
        if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
      }, 4000);
    }

    function stopHeartbeat() {
      if (heartbeatInterval) {
        clearInterval(heartbeatInterval);
        heartbeatInterval = null;
      }
    }

    window.addEventListener("pagehide", () => {
      if (dataConn && dataConn.open) dataConn.send({ type: "HANGUP" });
      if (currentCall) currentCall.close();
      peer.destroy();
    });

    function endCallCleanup(reasonText) {
      stopRingtone();
      stopHeartbeat();
      if (currentCall) { currentCall.close(); currentCall = null; }
      if (dataConn) { dataConn.close(); dataConn = null; }

      remoteRawPuller.srcObject = null;
      remoteBoostedPlayer.srcObject = null;
      remoteAvatar.style.boxShadow = "none";
      document.getElementById("remote-mic-label").innerText = "⏳ Chưa kết nối";

      statusText.innerText = reasonText || "Sẵn sàng gọi thoại";
      statusText.style.color = "#ffa502";
      document.getElementById("dial-box").style.display = "flex";
      document.getElementById("btn-hangup").style.display = "none";
      stopCallTimer();
    }

    // =========================================================================
    // 8. CÁC NÚT ĐIỀU KHIỂN DƯỚI CÙNG & POPUP NHẮN NHANH
    // =========================================================================
    document.getElementById("btn-mic").addEventListener("click", (e) => {
      ensureAudioContext();
      isMicOn = !isMicOn;
      if (rawMicStream) rawMicStream.getAudioTracks().forEach(t => (t.enabled = isMicOn));
      if (micGainNode) micGainNode.gain.setTargetAtTime(isMicOn ? currentMicBoost : 0, audioCtx.currentTime, 0.02);

      e.currentTarget.classList.toggle("off", !isMicOn);
      e.currentTarget.innerText = isMicOn ? "🎤" : "🔇";
      document.getElementById("local-mic-label").innerText = isMicOn ? "🎤 Đang bật Mic" : "🔇 Đã tắt Mic";
      showPopupToast(isMicOn ? "Đã bật Micro" : "Đã tắt Micro", "info", isMicOn ? "🎤" : "🔇");
      if (dataConn && dataConn.open) dataConn.send({ type: "MIC_STATE", isMicOn });
    });

    document.getElementById("btn-speaker").addEventListener("click", (e) => {
      ensureAudioContext();
      isSpeakerOn = !isSpeakerOn;
      if (remoteGainNode) remoteGainNode.gain.setTargetAtTime(isSpeakerOn ? currentSpkBoost : 0, audioCtx.currentTime, 0.02);
      remoteBoostedPlayer.muted = !isSpeakerOn;
      e.currentTarget.classList.toggle("off", !isSpeakerOn);
      e.currentTarget.innerText = isSpeakerOn ? "🔊" : "🔈";
      showPopupToast(isSpeakerOn ? "Đã bật Loa" : "Đã tắt tiếng Loa", "info", isSpeakerOn ? "🔊" : "🔈");
    });

    // Mở Popup Gửi lời nhắn nhanh
    const quickMsgModal = document.getElementById("quick-msg-modal");
    const quickMsgInput = document.getElementById("quick-msg-input");

    document.getElementById("btn-msg-popup").addEventListener("click", () => {
      quickMsgModal.style.display = "flex";
      quickMsgInput.focus();
    });
    document.getElementById("btn-close-msg").addEventListener("click", () => {
      quickMsgModal.style.display = "none";
    });
    document.getElementById("btn-send-msg").addEventListener("click", () => {
      const text = quickMsgInput.value.trim();
      if (!text) return;
      if (dataConn && dataConn.open) {
        dataConn.send({ type: "QUICK_MSG", text });
        showPopupToast(`Đã gửi Popup: "${text}"`, "success", "📨");
      } else {
        showPopupToast("Chưa kết nối với người nhận!", "warn", "⚠️");
      }
      quickMsgInput.value = "";
      quickMsgModal.style.display = "none";
    });

    function spawnFloatingHeart() {
      const heart = document.createElement("div");
      heart.className = "floating-heart";
      heart.innerText = ["💖", "💗", "💓", "💘", "🌸"][Math.floor(Math.random() * 5)];
      heart.style.left = (25 + Math.random() * 50) + "%";
      document.body.appendChild(heart);
      setTimeout(() => heart.remove(), 2400);
    }

    document.getElementById("btn-heart").addEventListener("click", () => {
      spawnFloatingHeart();
      if (dataConn && dataConn.open) dataConn.send({ type: "HEART" });
    });

    document.getElementById("btn-hangup").addEventListener("click", () => {
      if (dataConn && dataConn.open) dataConn.send({ type: "HANGUP" });
      endCallCleanup("Bạn đã kết thúc cuộc gọi");
    });

    document.getElementById("btn-copy-link").addEventListener("click", () => {
      if (!peer.id) return;
      const inviteUrl = `${window.location.origin}${window.location.pathname}?id=${peer.id}`;
      navigator.clipboard.writeText(inviteUrl);
      showPopupToast("Đã sao chép Link mời vào bộ nhớ tạm!", "success", "🔗");
    });

    function startCallTimer() {
      stopCallTimer();
      callSeconds = 0;
      const timerEl = document.getElementById("call-timer");
      timerEl.style.display = "block";
      callTimerInterval = setInterval(() => {
        callSeconds++;
        const mins = String(Math.floor(callSeconds / 60)).padStart(2, "0");
        const secs = String(callSeconds % 60).padStart(2, "0");
        timerEl.innerText = `${mins}:${secs}`;
      }, 1000);
    }

    function stopCallTimer() {
      if (callTimerInterval) clearInterval(callTimerInterval);
      document.getElementById("call-timer").style.display = "none";
    }
  </script>
</body>
</html>
