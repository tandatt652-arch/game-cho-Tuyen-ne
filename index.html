<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>CyberBrawl - Online P2P Fighter</title>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #0f111a;
      color: #e0e6ed;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 10px;
      overflow-x: hidden;
      touch-action: manipulation;
    }
    #lobby {
      background: #1a1d2e;
      border: 1px solid #2d334d;
      border-radius: 8px;
      padding: 10px 16px;
      margin-bottom: 10px;
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
      font-size: 13px;
      max-width: 800px;
      width: 100%;
    }
    .badge {
      background: #2a2f4c;
      padding: 4px 8px;
      border-radius: 4px;
      user-select: all;
      font-weight: bold;
      color: #00d2d3;
    }
    input {
      background: #111422;
      border: 1px solid #3b4268;
      color: #fff;
      padding: 6px 10px;
      border-radius: 4px;
      outline: none;
      font-size: 13px;
    }
    button.btn {
      background: #ff4757;
      color: #fff;
      border: none;
      padding: 6px 14px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 600;
      transition: opacity 0.2s;
    }
    button.btn-sec {
      background: #3742fa;
    }
    button.btn:hover { opacity: 0.85; }
    #status {
      font-weight: bold;
      color: #ffa502;
    }
    #hud {
      width: 100%;
      max-width: 800px;
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
      font-weight: bold;
      font-size: 13px;
    }
    .player-hud {
      width: 48%;
    }
    .hp-container {
      width: 100%;
      height: 22px;
      background: #222;
      border: 2px solid #57606f;
      border-radius: 4px;
      overflow: hidden;
      position: relative;
    }
    .hp-bar {
      height: 100%;
      width: 100%;
      background: #2ed573;
      transition: width 0.08s ease-out;
    }
    .hp-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 11px;
      color: #fff;
      text-shadow: 1px 1px 2px #000;
    }
    .cd-container {
      width: 100%;
      height: 5px;
      background: #222;
      border-radius: 2px;
      margin-top: 3px;
      overflow: hidden;
    }
    .cd-bar {
      height: 100%;
      width: 100%;
      background: #ffa502;
    }
    canvas {
      border: 2px solid #2d334d;
      border-radius: 6px;
      background: #161824;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      max-width: 100%;
      height: auto;
    }
    #guide {
      margin-top: 8px;
      font-size: 12px;
      color: #8395a7;
      text-align: center;
      line-height: 1.5;
    }

    /* BÀN PHÍM ẢO CHO ĐIỆN THOẠI */
    #touch-panel {
      display: flex;
      justify-content: space-between;
      width: 100%;
      max-width: 800px;
      margin-top: 14px;
      padding: 0 8px;
      gap: 16px;
    }
    .touch-group {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .t-btn {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      background: #2d334d;
      color: #fff;
      border: 2px solid #57606f;
      font-weight: bold;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      touch-action: none;
      box-shadow: 0 4px 10px rgba(0,0,0,0.4);
    }
    .t-btn:active, .t-btn.active {
      background: #57606f;
      transform: scale(0.94);
    }
    .t-btn-jump { background: #3742fa; border-color: #70a1ff; }
    .t-btn-atk { background: #ff4757; border-color: #ff6b81; font-size: 12px; }
    .t-btn-shoot { background: #ffa502; border-color: #eccc68; font-size: 12px; color: #1e1e24; }
  </style>
</head>
<body>

  <!-- Menu kết nối & Bật/Tắt phím ảo -->
  <div id="lobby">
    <div>ID của bạn: <span id="my-id" class="badge">Đang tạo ID...</span></div>
    <div>
      <input type="text" id="target-id" placeholder="Nhập ID đối thủ..." />
      <button id="btn-connect" class="btn">Kết nối</button>
    </div>
    <button id="btn-toggle-touch" class="btn btn-sec">🎮 Ẩn/Hiện Phím Ảo</button>
    <div id="status">Chế độ offline (Luyện tập)</div>
  </div>

  <!-- Thanh máu & Hồi chiêu đạn -->
  <div id="hud">
    <div class="player-hud">
      <div style="color: #54a0ff; margin-bottom: 2px;">P1 (Xanh)</div>
      <div class="hp-container">
        <div id="p1-hp" class="hp-bar"></div>
        <div id="p1-hp-text" class="hp-text">200 / 200</div>
      </div>
      <div class="cd-container"><div id="p1-cd" class="cd-bar"></div></div>
    </div>
    <div class="player-hud">
      <div style="color: #ff6b6b; text-align: right; margin-bottom: 2px;">P2 (Đỏ)</div>
      <div class="hp-container">
        <div id="p2-hp" class="hp-bar"></div>
        <div id="p2-hp-text" class="hp-text">200 / 200</div>
      </div>
      <div class="cd-container"><div id="p2-cd" class="cd-bar" style="float: right;"></div></div>
    </div>
  </div>

  <canvas id="gameCanvas" width="800" height="420"></canvas>

  <!-- Cụm phím ảo cảm ứng -->
  <div id="touch-panel">
    <div class="touch-group">
      <div class="t-btn" data-key="left">◀</div>
      <div class="t-btn" data-key="right">▶</div>
    </div>
    <div class="touch-group">
      <div class="t-btn t-btn-jump" data-key="jump">▲</div>
      <div class="t-btn t-btn-atk" data-key="attack">ĐẤM</div>
      <div class="t-btn t-btn-shoot" data-key="shoot">BẮN</div>
    </div>
  </div>

  <div id="guide">
    <strong>Bàn phím P1 (Host/Offline):</strong> A/D (Đi), W (Nhảy), F (Đấm), G (Bắn đạn)<br/>
    <strong>Bàn phím P2 (Khách/Offline):</strong> Phím mũi tên (Đi/Nhảy), K (Đấm), L (Bắn đạn)
  </div>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const GROUND_Y = 360;
    const GRAVITY = 0.8;
    const MAX_HP = 200;
    const SHOOT_COOLDOWN = 90; // 90 frame = 1.5 giây

    // --- CLASS ĐẠN NĂNG LƯỢNG ---
    class Projectile {
      constructor(x, y, vx, color, owner) {
        this.x = x;
        this.y = y;
        this.vx = vx;
        this.r = 8;
        this.color = color;
        this.owner = owner; // 1 hoặc 2
        this.active = true;
      }
      update() {
        this.x += this.vx;
        if (this.x < 0 || this.x > canvas.width) this.active = false;
      }
      draw() {
        ctx.save();
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = "#fff";
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.restore();
      }
    }

    let projectiles = [];

    // --- CẤU HÌNH NHÂN VẬT ---
    class Fighter {
      constructor(x, color, facingRight, id) {
        this.id = id;
        this.x = x;
        this.y = GROUND_Y - 80;
        this.w = 40;
        this.h = 80;
        this.vx = 0;
        this.vy = 0;
        this.hp = MAX_HP;
        this.color = color;
        this.facingRight = facingRight;
        this.isGrounded = false;
        this.isAttacking = false;
        this.attackFrame = 0;
        this.hitstun = 0;
        this.shootCd = 0;
      }

      update(inputs) {
        if (this.shootCd > 0) this.shootCd--;

        if (this.hitstun > 0) {
          this.hitstun--;
        } else {
          this.vx = 0;
          if (inputs.left) { this.vx = -5; this.facingRight = false; }
          if (inputs.right) { this.vx = 5; this.facingRight = true; }
          if (inputs.jump && this.isGrounded) this.vy = -15;

          // Đòn đấm cận chiến
          if (inputs.attack && !this.isAttacking) {
            this.isAttacking = true;
            this.attackFrame = 0;
          }

          // Bắn đạn tầm xa
          if (inputs.shoot && this.shootCd === 0) {
            const spawnX = this.facingRight ? this.x + this.w + 10 : this.x - 10;
            const spawnY = this.y + 35;
            const speed = this.facingRight ? 11 : -11;
            projectiles.push(new Projectile(spawnX, spawnY, speed, this.color, this.id));
            this.shootCd = SHOOT_COOLDOWN;
          }
        }

        this.x += this.vx;
        this.y += this.vy;

        if (this.y + this.h < GROUND_Y) {
          this.vy += GRAVITY;
          this.isGrounded = false;
        } else {
          this.y = GROUND_Y - this.h;
          this.vy = 0;
          this.isGrounded = true;
        }

        this.x = Math.max(0, Math.min(canvas.width - this.w, this.x));

        if (this.isAttacking) {
          this.attackFrame++;
          if (this.attackFrame > 14) {
            this.isAttacking = false;
            this.attackFrame = 0;
          }
        }
      }

      draw() {
        ctx.fillStyle = this.hitstun > 0 ? "#ffffff" : this.color;
        ctx.fillRect(this.x, this.y, this.w, this.h);

        // Mắt chỉ hướng nhìn
        ctx.fillStyle = "#fff";
        const eyeX = this.facingRight ? this.x + 24 : this.x + 6;
        ctx.fillRect(eyeX, this.y + 16, 10, 10);

        // Hitbox đòn đấm
        if (this.isAttacking && this.attackFrame >= 4 && this.attackFrame <= 9) {
          ctx.fillStyle = "rgba(255, 234, 167, 0.8)";
          const hx = this.facingRight ? this.x + this.w : this.x - 45;
          ctx.fillRect(hx, this.y + 25, 45, 25);
        }
      }

      getHitbox() {
        if (!this.isAttacking || this.attackFrame < 4 || this.attackFrame > 9) return null;
        return {
          x: this.facingRight ? this.x + this.w : this.x - 45,
          y: this.y + 25,
          w: 45,
          h: 25
        };
      }
    }

    const p1 = new Fighter(120, "#54a0ff", true, 1);
    const p2 = new Fighter(640, "#ff6b6b", false, 2);

    // --- ĐIỀU KHIỂN: BÀN PHÍM + CẢM ỨNG ---
    const rawKeys = {};
    const touchInputs = { left: false, right: false, jump: false, attack: false, shoot: false };

    window.addEventListener("keydown", (e) => { rawKeys[e.key.toLowerCase()] = true; });
    window.addEventListener("keyup", (e) => { rawKeys[e.key.toLowerCase()] = false; });

    // Xử lý sự kiện chạm cho các nút ảo
    document.querySelectorAll(".t-btn").forEach((btn) => {
      const key = btn.getAttribute("data-key");
      const activate = (e) => {
        e.preventDefault();
        touchInputs[key] = true;
        btn.classList.add("active");
      };
      const deactivate = (e) => {
        e.preventDefault();
        touchInputs[key] = false;
        btn.classList.remove("active");
      };

      btn.addEventListener("touchstart", activate, { passive: false });
      btn.addEventListener("touchend", deactivate, { passive: false });
      btn.addEventListener("touchcancel", deactivate, { passive: false });
      btn.addEventListener("mousedown", activate);
      btn.addEventListener("mouseup", deactivate);
      btn.addEventListener("mouseleave", deactivate);
    });

    // Bật/tắt thanh phím ảo
    const touchPanel = document.getElementById("touch-panel");
    let touchVisible = true;
    document.getElementById("btn-toggle-touch").addEventListener("click", () => {
      touchVisible = !touchVisible;
      touchPanel.style.display = touchVisible ? "flex" : "none";
    });

    function getLocalInputs() {
      return {
        p1: {
          left: !!rawKeys["a"] || touchInputs.left,
          right: !!rawKeys["d"] || touchInputs.right,
          jump: !!rawKeys["w"] || touchInputs.jump,
          attack: !!rawKeys["f"] || touchInputs.attack,
          shoot: !!rawKeys["g"] || touchInputs.shoot
        },
        p2: {
          left: !!rawKeys["arrowleft"],
          right: !!rawKeys["arrowright"],
          jump: !!rawKeys["arrowup"],
          attack: !!rawKeys["k"],
          shoot: !!rawKeys["l"]
        }
      };
    }

    // --- MẠNG P2P BẰNG PEERJS (BẢN SỬA LỖI KẾT NỐI) ---
    let role = "OFFLINE";
    let conn = null;
    let clientInputs = { left: false, right: false, jump: false, attack: false, shoot: false };

    // Bổ sung STUN Server công khai của Google để xuyên tường lửa/NAT
    const peer = new Peer({
      config: {
        iceServers: [
          { urls: "stun:stun.l.google.com:19302" },
          { urls: "stun:stun1.l.google.com:19302" },
          { urls: "stun:stun2.l.google.com:19302" },
          { urls: "stun:stun3.l.google.com:19302" }
        ]
      }
    });

    // Bắt lỗi hệ thống PeerJS và hiển thị trực tiếp lên màn hình
    peer.on("error", (err) => {
      console.error("Lỗi PeerJS:", err);
      const statusEl = document.getElementById("status");
      statusEl.style.color = "#ff4757";

      if (err.type === "peer-unavailable") {
        statusEl.innerText = "Lỗi: Không tìm thấy ID đối thủ (sai ID hoặc đối thủ đã tắt)!";
      } else if (err.type === "network") {
        statusEl.innerText = "Lỗi mạng: Không kết nối được tới máy chủ ghép đôi!";
      } else {
        statusEl.innerText = `Lỗi: ${err.type}`;
      }
    });

    peer.on("open", (id) => {
      document.getElementById("my-id").innerText = id;
    });

    // P1 (Host) nhận kết nối
    peer.on("connection", (c) => {
      conn = c;
      role = "HOST";

      conn.on("open", () => {
        document.getElementById("status").innerText = "Đã kết nối: Bạn là P1 (Host)";
        document.getElementById("status").style.color = "#2ed573";
      });

      setupNetEvents();
    });

    // P2 bấm kết nối tới P1
    document.getElementById("btn-connect").addEventListener("click", () => {
      const target = document.getElementById("target-id").value.trim();
      if (!target) {
        alert("Vui lòng nhập ID của đối thủ!");
        return;
      }
      if (target === peer.id) {
        alert("Bạn không thể tự kết nối với chính ID của mình!");
        return;
      }

      if (conn) conn.close();

      // Sử dụng chế độ reliable: false (chuẩn UDP - truyền nhanh, không bị treo bắt tay)
      conn = peer.connect(target, { reliable: false });
      role = "CLIENT";

      const statusEl = document.getElementById("status");
      statusEl.innerText = "Đang bắt tay kết nối P2P...";
      statusEl.style.color = "#ffa502";

      conn.on("open", () => {
        statusEl.innerText = "Đã kết nối: Bạn là P2 (Khách)";
        statusEl.style.color = "#2ed573";
        setupNetEvents();
      });

      conn.on("error", (err) => {
        console.error("Lỗi DataConnection:", err);
        statusEl.innerText = "Kết nối thất bại (Lỗi ICE/Mạng)!";
        statusEl.style.color = "#ff4757";
      });
    });

    function setupNetEvents() {
      conn.on("data", (data) => {
        if (role === "HOST") {
          clientInputs = data;
        } else if (role === "CLIENT") {
          p1.x = data.p1.x; p1.y = data.p1.y; p1.hp = data.p1.hp;
          p1.facingRight = data.p1.f; p1.isAttacking = data.p1.a; p1.attackFrame = data.p1.af; 
          p1.hitstun = data.p1.hs; p1.shootCd = data.p1.cd;

          p2.x = data.p2.x; p2.y = data.p2.y; p2.hp = data.p2.hp;
          p2.facingRight = data.p2.f; p2.isAttacking = data.p2.a; p2.attackFrame = data.p2.af; 
          p2.hitstun = data.p2.hs; p2.shootCd = data.p2.cd;

          projectiles = data.projs.map(p => new Projectile(p.x, p.y, p.vx, p.c, p.o));
        }
      });

      conn.on("close", () => {
        document.getElementById("status").innerText = "Đối thủ đã ngắt kết nối!";
        document.getElementById("status").style.color = "#ff4757";
      });
    }

    function checkCollision(r1, r2) {
      return r1.x < r2.x + r2.w && r1.x + r1.w > r2.x && r1.y < r2.y + r2.h && r1.y + r1.h > r2.y;
    }

    let p1HasHit = false;
    let p2HasHit = false;

    // --- GAME LOOP ---
    function loop() {
      const inputs = getLocalInputs();

      if (role === "OFFLINE") {
        p1.update(inputs.p1);
        p2.update(inputs.p2);
      } else if (role === "HOST") {
        p1.update(inputs.p1);
        p2.update(clientInputs);

        // Host phát tán State sang Client
        if (conn && conn.open) {
          conn.send({
            p1: { x: p1.x, y: p1.y, hp: p1.hp, f: p1.facingRight, a: p1.isAttacking, af: p1.attackFrame, hs: p1.hitstun, cd: p1.shootCd },
            p2: { x: p2.x, y: p2.y, hp: p2.hp, f: p2.facingRight, a: p2.isAttacking, af: p2.attackFrame, hs: p2.hitstun, cd: p2.shootCd },
            projs: projectiles.map(p => ({ x: p.x, y: p.y, vx: p.vx, c: p.color, o: p.owner }))
          });
        }
      } else if (role === "CLIENT") {
        if (conn && conn.open) {
          conn.send({
            left: inputs.p1.left || inputs.p2.left,
            right: inputs.p1.right || inputs.p2.right,
            jump: inputs.p1.jump || inputs.p2.jump,
            attack: inputs.p1.attack || inputs.p2.attack,
            shoot: inputs.p1.shoot || inputs.p2.shoot
          });
        }
      }

      // Xử lý đạn và va chạm (Host hoặc Offline giữ quyền quyết định)
      if (role !== "CLIENT") {
        // Cập nhật vị trí các viên đạn
        projectiles.forEach((proj) => {
          proj.update();

          // Va chạm đạn với P2 (nếu P1 bắn)
          if (proj.active && proj.owner === 1) {
            if (checkCollision({ x: proj.x - proj.r, y: proj.y - proj.r, w: proj.r * 2, h: proj.r * 2 }, p2)) {
              p2.hp = Math.max(0, p2.hp - 15);
              p2.hitstun = 10;
              p2.vx = proj.vx > 0 ? 6 : -6;
              proj.active = false;
            }
          }

          // Va chạm đạn với P1 (nếu P2 bắn)
          if (proj.active && proj.owner === 2) {
            if (checkCollision({ x: proj.x - proj.r, y: proj.y - proj.r, w: proj.r * 2, h: proj.r * 2 }, p1)) {
              p1.hp = Math.max(0, p1.hp - 15);
              p1.hitstun = 10;
              p1.vx = proj.vx > 0 ? 6 : -6;
              proj.active = false;
            }
          }
        });
        projectiles = projectiles.filter(p => p.active);

        // Va chạm đòn đấm
        const h1 = p1.getHitbox();
        if (h1 && !p1HasHit) {
          if (checkCollision(h1, p2)) {
            p2.hp = Math.max(0, p2.hp - 10);
            p2.hitstun = 12;
            p2.vx = p1.facingRight ? 9 : -9;
            p1HasHit = true;
          }
        }
        if (!p1.isAttacking) p1HasHit = false;

        const h2 = p2.getHitbox();
        if (h2 && !p2HasHit) {
          if (checkCollision(h2, p1)) {
            p1.hp = Math.max(0, p1.hp - 10);
            p1.hitstun = 12;
            p1.vx = p2.facingRight ? 9 : -9;
            p2HasHit = true;
          }
        }
        if (!p2.isAttacking) p2HasHit = false;
      }

      // CẬP NHẬT HUD
      document.getElementById("p1-hp").style.width = (p1.hp / MAX_HP * 100) + "%";
      document.getElementById("p2-hp").style.width = (p2.hp / MAX_HP * 100) + "%";
      document.getElementById("p1-hp-text").innerText = `${p1.hp} / ${MAX_HP}`;
      document.getElementById("p2-hp-text").innerText = `${p2.hp} / ${MAX_HP}`;

      // Thanh hồi chiêu đạn (đầy = sẵn sàng)
      const p1CdRatio = Math.max(0, 1 - (p1.shootCd / SHOOT_COOLDOWN));
      const p2CdRatio = Math.max(0, 1 - (p2.shootCd / SHOOT_COOLDOWN));
      document.getElementById("p1-cd").style.width = (p1CdRatio * 100) + "%";
      document.getElementById("p2-cd").style.width = (p2CdRatio * 100) + "%";

      // VẼ MÀN HÌNH
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Sàn đấu
      ctx.fillStyle = "#1e2235";
      ctx.fillRect(0, GROUND_Y, canvas.width, canvas.height - GROUND_Y);
      ctx.fillStyle = "#ff4757";
      ctx.fillRect(0, GROUND_Y, canvas.width, 3);

      p1.draw();
      p2.draw();
      projectiles.forEach(p => p.draw());

      requestAnimationFrame(loop);
    }

    loop();
  </script>
</body>
</html>
