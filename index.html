<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Mừng Ngày 20/10 - Gửi Tặng Tuyến 💖</title>
  <!-- Font chữ nét mảnh & điệu đà (Great Vibes & Alex Brush) -->
  <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Great+Vibes&family=Dancing+Script:wght@600&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #2b2d42;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    body {
      background: radial-gradient(circle at 50% 35%, #fff9fb 0%, #ffe5ec 55%, #ffd6e0 100%);
      color: #4a4a68;
      font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      min-height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      touch-action: manipulation;
    }

    /* Canvas hiệu ứng Cánh Hoa Rơi & Đom Đóm Lấp Lánh */
    #bgCanvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 2;
    }

    /* Thanh điều khiển Nhạc Nền nhỏ gọn ở góc trên */
    #top-bar {
      position: fixed;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 25;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      border: 2px solid #ffc2d1;
      border-radius: 30px;
      padding: 7px 18px;
      display: flex;
      align-items: center;
      gap: 14px;
      box-shadow: 0 8px 25px rgba(255, 77, 109, 0.15);
    }
    .top-title {
      font-weight: 800;
      font-size: 13.5px;
      color: #c9184a;
      white-space: nowrap;
    }
    .music-ctrl {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #fff0f5;
      border: 1.5px solid #ffc2d1;
      padding: 3px 10px;
      border-radius: 20px;
    }
    .music-btn {
      background: none;
      border: none;
      font-size: 15px;
      cursor: pointer;
      line-height: 1;
    }
    #bgm-volume {
      width: 70px;
      accent-color: #ff4d6d;
      cursor: pointer;
      height: 5px;
    }

    /* =========================================================================
       KHU VỰC SÂN KHẤU BÓ HOA NGHỆ THUẬT
       ========================================================================= */
    #bouquet-stage {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding-top: 30px;
      transition: opacity 0.6s ease, transform 0.6s ease;
    }

    /* Hào quang lung linh phía sau bó hoa */
    .bouquet-aura {
      position: absolute;
      width: 380px;
      height: 380px;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.95) 0%, rgba(255, 183, 197, 0.45) 50%, rgba(255, 183, 197, 0) 75%);
      border-radius: 50%;
      z-index: -1;
      animation: auraPulse 4s ease-in-out infinite;
    }
    @keyframes auraPulse {
      0%, 100% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.08); opacity: 1; }
    }

    /* Khung SVG Bó Hoa */
    .bouquet-wrapper {
      width: min(92vw, 440px);
      height: min(65vh, 470px);
      display: flex;
      align-items: center;
      justify-content: center;
      animation: bouquetFloat 4.5s ease-in-out infinite;
      filter: drop-shadow(0 18px 28px rgba(180, 40, 80, 0.22));
    }
    @keyframes bouquetFloat {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-10px) rotate(0.8deg); }
    }

    /* Hiệu ứng từng bông hoa đung đưa & tương tác khi chạm */
    .flower-head {
      cursor: pointer;
      transform-box: fill-box;
      transform-origin: center;
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.3s;
      animation: gentleSway 5s ease-in-out infinite;
    }
    .flower-head:nth-child(even) {
      animation-duration: 6s;
      animation-direction: reverse;
    }
    .flower-head:hover {
      transform: scale(1.12) rotate(4deg);
      filter: brightness(1.08) drop-shadow(0 0 12px rgba(255, 117, 140, 0.65));
    }
    .flower-head:active {
      transform: scale(0.95);
    }
    @keyframes gentleSway {
      0%, 100% { transform: rotate(-2deg); }
      50% { transform: rotate(2.5deg); }
    }

    /* Hiệu ứng hoa baby lấp lánh */
    .babys-breath circle {
      animation: twinkleStar 2.6s ease-in-out infinite alternate;
    }
    .babys-breath circle:nth-child(3n) { animation-delay: 0.7s; }
    .babys-breath circle:nth-child(2n) { animation-delay: 1.4s; }
    @keyframes twinkleStar {
      0% { opacity: 0.65; r: 3.2px; }
      100% { opacity: 1; r: 4.6px; filter: drop-shadow(0 0 4px #fff); }
    }

    .hint-touch {
      font-size: 13px;
      color: #a4133c;
      background: rgba(255, 255, 255, 0.75);
      padding: 5px 16px;
      border-radius: 20px;
      border: 1px solid #ffccd5;
      margin-top: -6px;
      margin-bottom: 12px;
      font-weight: 600;
      box-shadow: 0 4px 12px rgba(255, 117, 140, 0.12);
    }

    /* Nút Phong Bì Mở Thư Tình */
    .envelope-btn {
      position: relative;
      background: linear-gradient(135deg, #ff4d6d 0%, #ff758c 100%);
      color: #fff;
      border: 3px solid #fff;
      padding: 12px 28px;
      border-radius: 30px;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(255, 77, 109, 0.4);
      display: flex;
      align-items: center;
      gap: 10px;
      transition: transform 0.2s, box-shadow 0.2s;
      animation: pulseBtn 2s infinite;
    }
    .envelope-btn:hover {
      transform: translateY(-3px) scale(1.03);
      box-shadow: 0 14px 30px rgba(255, 77, 109, 0.55);
    }
    @keyframes pulseBtn {
      0%, 100% { box-shadow: 0 8px 25px rgba(255, 77, 109, 0.4), 0 0 0 0 rgba(255, 77, 109, 0.4); }
      50% { box-shadow: 0 8px 25px rgba(255, 77, 109, 0.5), 0 0 0 10px rgba(255, 77, 109, 0); }
    }

    /* =========================================================================
       MODAL BỨC THƯ TÌNH LÃNG MẠN
       ========================================================================= */
    #letter-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(35, 15, 30, 0.6);
      backdrop-filter: blur(6px);
      z-index: 30;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .letter-paper {
      background: linear-gradient(180deg, #fffdf9 0%, #fff0f5 100%);
      border: 3px solid #ff8fa3;
      border-radius: 24px;
      padding: 26px 24px 22px;
      max-width: 520px;
      width: 100%;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3), inset 0 0 0 6px rgba(255, 194, 209, 0.35);
      text-align: center;
      position: relative;
      animation: letterUnfold 0.45s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes letterUnfold {
      from { transform: translateY(40px) scale(0.85); opacity: 0; }
      to { transform: translateY(0) scale(1); opacity: 1; }
    }
    .letter-header {
      font-family: 'Great Vibes', cursive;
      font-size: 38px;
      color: #c9184a;
      margin-bottom: 6px;
      line-height: 1.2;
    }
    .letter-body {
      font-family: 'Dancing Script', 'Segoe UI', cursive;
      font-size: 21px;
      color: #4a4a68;
      line-height: 1.6;
      min-height: 115px;
      padding: 12px 14px;
      background: rgba(255, 255, 255, 0.7);
      border-radius: 16px;
      border: 1.5px dashed #ffb3c6;
      margin-bottom: 14px;
      text-align: left;
    }

    /* Cụm 2 nhân vật Chibi Đạt & Tuyến đứng trong thư */
    .couple-box {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 36px;
      height: 82px;
      margin: 14px 0 8px;
      position: relative;
    }
    .couple-heart {
      font-size: 26px;
      animation: heartBeat 1s infinite alternate;
    }
    @keyframes heartBeat {
      from { transform: scale(0.9); }
      to { transform: scale(1.25); }
    }

    /* =========================================================================
       MODEL NHÂN VẬT CHIBI (ĐẠT & TUYẾN)
       ========================================================================= */
    @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
    .player {
      position: relative;
      width: 56px;
      height: 66px;
      transform-origin: center bottom;
      pointer-events: none;
    }
    .player.female { --c-primary: #ff758c; --c-secondary: #ffb3c6; --c-accent: #ffe066; }
    .player.male { --c-primary: #4facfe; --c-secondary: #70d6ff; --c-accent: #ffe066; }
    .player-name-tag {
      position: absolute; top: -22px; left: 50%; transform: translateX(-50%);
      white-space: nowrap; font-size: 11px; font-weight: 800; color: var(--ink);
      background: rgba(255, 255, 255, 0.9); padding: 1px 7px; border-radius: 10px;
      border: 1.5px solid var(--ink); z-index: 10;
    }
    .player-shadow {
      position: absolute; bottom: -5px; left: 10px; width: 36px; height: 12px;
      background: rgba(0, 0, 0, 0.14); border-radius: 50%; z-index: 0;
    }
    .chibi { position: relative; width: 100%; height: 100%; animation: bounce 1.5s infinite ease-in-out; }
    .cb-head { position: absolute; width: 46px; height: 46px; border: 4px solid var(--ink); border-radius: 45%; left: 5px; top: 0; z-index: 2; background: #ffe6d5; }
    .cb-hair { position: absolute; width: 54px; height: 25px; background: var(--ink); border-radius: 25px 25px 0 0; top: -4px; left: -8px; z-index: 3; }
    .cb-backhair { position: absolute; width: 56px; height: 50px; background: var(--ink); border-radius: 30px; top: 10px; left: 0; z-index: 1; }
    .cb-eye { position: absolute; top: 20px; width: 6px; height: 10px; background: var(--ink); border-radius: 50%; z-index: 3; }
    .cb-eye::after { content: ""; position: absolute; top: 2px; left: 1px; width: 2.5px; height: 2.5px; background: #fff; border-radius: 50%; }
    .cb-eye.e1 { left: 8px; } .cb-eye.e2 { right: 8px; }
    .cb-blush { position: absolute; top: 26px; width: 8px; height: 5px; background: #ff7ca8; border-radius: 50%; opacity: 0.6; z-index: 3; }
    .cb-blush.b1 { left: 2px; } .cb-blush.b2 { right: 2px; }
    .cb-mouth { position: absolute; left: 14px; top: 30px; width: 10px; height: 5px; border-radius: 0 0 10px 10px; background: var(--ink); z-index: 3; }
    .cb-body { position: absolute; width: 34px; height: 26px; background: var(--c-primary); border: 4px solid var(--ink); border-radius: 10px; bottom: 0; left: 11px; z-index: 2; overflow: hidden; }
    .avatar-acc { position: absolute; pointer-events: none; z-index: 6; }

    .acc-bow { left: 23px; top: -2px; width: 42px; height: 26px; transform: rotate(6deg); }
    .acc-bow::before, .acc-bow::after { content: ""; position: absolute; top: 3px; width: 18px; height: 14px; background: var(--c-secondary); border: 3px solid var(--ink); box-shadow: inset 0 3px #ffffffa0; box-sizing: border-box; }
    .acc-bow::before { left: 1px; border-radius: 80% 25% 65% 30%; transform: rotate(-12deg); }
    .acc-bow::after { right: 1px; border-radius: 25% 80% 30% 65%; transform: rotate(12deg); }
    .acc-bow i { position: absolute; left: 16px; top: 6px; width: 10px; height: 10px; background: var(--c-accent); border: 3px solid var(--ink); border-radius: 5px; z-index: 3; box-sizing: border-box; }
    .acc-bow span, .acc-bow b { position: absolute; display: block; width: 7px; height: 11px; background: var(--c-primary); border: 3px solid var(--ink); border-top: none; border-radius: 0 0 7px 7px; top: 12px; z-index: 2; box-sizing: border-box; }
    .acc-bow span { left: 10px; transform: rotate(10deg); }
    .acc-bow b { right: 10px; transform: rotate(-10deg); }

    .player.male .cb-backhair { width: 50px; height: 22px; top: 8px; left: 3px; border-radius: 12px; }
    .player.male .cb-hair { width: 52px; height: 19px; top: -5px; left: -7px; border-radius: 20px 20px 6px 6px; }
    .player.male .cb-hair::before { content: ""; position: absolute; left: 4px; bottom: -6px; width: 16px; height: 10px; background: var(--ink); border-radius: 0 0 12px 4px; transform: rotate(-8deg); }
    .player.male .cb-hair::after { content: ""; position: absolute; right: 4px; bottom: -5px; width: 18px; height: 9px; background: var(--ink); border-radius: 0 0 4px 12px; transform: rotate(8deg); }
    .cb-ahoge { position: absolute; top: -13px; left: 18px; width: 14px; height: 11px; border-top: 4px solid var(--ink); border-left: 4px solid var(--ink); border-radius: 100% 0 0 0; transform: rotate(15deg); z-index: 4; }
    .cb-collar { position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 16px; height: 8px; background: #fff; border: 2.5px solid var(--ink); border-top: none; border-radius: 0 0 6px 6px; z-index: 3; }
    .cb-tie { position: absolute; top: 6px; left: 50%; transform: translateX(-50%); width: 7px; height: 11px; background: #ff4d6d; border: 2px solid var(--ink); border-radius: 2px 2px 5px 5px; z-index: 4; }
    .acc-cap { left: -4px; top: -8px; width: 38px; height: 20px; transform: rotate(-10deg); }
    .acc-cap::before { content: ""; position: absolute; top: 2px; left: 2px; width: 32px; height: 15px; background: var(--c-secondary); border: 3px solid var(--ink); border-radius: 20px 20px 6px 6px; box-shadow: inset 0 3px #ffffffa0; box-sizing: border-box; }
    .acc-cap::after { content: ""; position: absolute; bottom: 1px; left: -4px; width: 22px; height: 7px; background: var(--c-primary); border: 3px solid var(--ink); border-radius: 8px 0 8px 8px; box-sizing: border-box; }
    .acc-cap i { position: absolute; right: 9px; top: 5px; width: 8px; height: 8px; background: var(--c-accent); border: 2.5px solid var(--ink); border-radius: 50%; z-index: 3; box-sizing: border-box; }

    button.btn {
      background: linear-gradient(135deg, #ff4d6d 0%, #ff758c 100%);
      color: #fff;
      border: none;
      padding: 10px 20px;
      border-radius: 25px;
      cursor: pointer;
      font-weight: 800;
      font-size: 14.5px;
      box-shadow: 0 6px 16px rgba(255, 77, 109, 0.35);
      transition: transform 0.15s, opacity 0.2s;
    }
    button.btn:hover { opacity: 0.94; transform: translateY(-2px); }
    button.btn-sec { background: #adb5bd; box-shadow: none; }

    /* =========================================================================
       MÀN HÌNH ĐÊM PHÁO HOA RỰC RỠ & KIỂU CHỮ MỎNG ĐIỆU ĐÀ
       ========================================================================= */
    #fireworks-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at center, #1b0a2e 0%, #070210 100%);
      z-index: 50;
      overflow: hidden;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    #fwCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    .finale-content {
      position: relative;
      z-index: 55;
      text-align: center;
      padding: 20px;
      pointer-events: auto;
      animation: letterUnfold 0.8s ease;
    }
    @keyframes delicateFloat {
      0%, 100% {
        transform: translateY(0) scale(1);
        filter: drop-shadow(0 0 12px rgba(255, 143, 163, 0.9)) drop-shadow(0 0 28px rgba(255, 229, 236, 0.5));
      }
      50% {
        transform: translateY(-8px) scale(1.03);
        filter: drop-shadow(0 0 18px rgba(255, 224, 102, 0.95)) drop-shadow(0 0 38px rgba(255, 117, 140, 0.85));
      }
    }
    @keyframes shimmerFlow {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    .romantic-title {
      font-family: 'Great Vibes', 'Alex Brush', cursive;
      font-weight: 400;
      font-size: clamp(42px, 7vw, 74px);
      letter-spacing: 1.5px;
      background: linear-gradient(270deg, #ffdde1, #fff6cc, #ffffff, #ffc2d1, #e0c3fc);
      background-size: 300% 300%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: shimmerFlow 5s ease infinite, delicateFloat 3.4s ease-in-out infinite;
      line-height: 1.4;
      margin-bottom: 12px;
      padding: 4px 16px;
    }
    .romantic-sub {
      color: #ffe5ec;
      font-size: 16px;
      font-weight: 400;
      letter-spacing: 1.5px;
      opacity: 0.92;
      text-shadow: 0 2px 10px rgba(255, 77, 109, 0.8);
      margin-bottom: 28px;
    }
  </style>
</head>
<body>

  <!-- Canvas nền: Cánh hoa hồng rơi, Đom đóm & Trái tim bay khi chạm -->
  <canvas id="bgCanvas"></canvas>

  <!-- Thanh điều chỉnh Nhạc Nền -->
  <div id="top-bar">
    <span class="top-title">🌸 Dành Tặng Tuyến 20/10 💖</span>
    <div class="music-ctrl" title="Chỉnh âm lượng nhạc">
      <button id="btn-bgm-toggle" class="music-btn">🎵</button>
      <input type="range" id="bgm-volume" min="0" max="100" value="50" />
    </div>
  </div>

  <!-- =========================================================================
       MÀN HÌNH 1: BÓ HOA NGHỆ THUẬT ĐA LỚP & PHONG BÌ THƯ
       ========================================================================= -->
  <div id="bouquet-stage">
    <div class="bouquet-aura"></div>

    <!-- BÓ HOA VẼ CHI TIẾT BẰNG SVG ĐA LỚP & GRADIENT MỀM MẠI -->
    <div class="bouquet-wrapper">
      <svg viewBox="0 0 500 560" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <!-- Bóng đổ mềm mại cho từng lớp hoa và giấy gói -->
          <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#800f2f" flood-opacity="0.18"/>
          </filter>
          <filter id="glow-white" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur stdDeviation="2.5" result="blur"/>
            <feMerge>
              <feMergeNode in="blur"/>
              <feMergeNode in="SourceGraphic"/>
            </feMerge>
          </filter>

          <!-- Gradient Giấy Gói Hoa Cao Cấp -->
          <linearGradient id="wrap-back" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#f8edeb"/>
            <stop offset="100%" stop-color="#fcd5ce"/>
          </linearGradient>
          <linearGradient id="wrap-pink-left" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#ffcad4"/>
            <stop offset="50%" stop-color="#ff9ebb"/>
            <stop offset="100%" stop-color="#f48fb1"/>
          </linearGradient>
          <linearGradient id="wrap-pink-right" x1="1" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#ffe5ec"/>
            <stop offset="55%" stop-color="#ffb3c6"/>
            <stop offset="100%" stop-color="#fb6f92"/>
          </linearGradient>
          <linearGradient id="wrap-cream-front" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#ffffff"/>
            <stop offset="100%" stop-color="#ffe5ec"/>
          </linearGradient>

          <!-- Gradient Ruy-băng Lụa Đỏ Hồng -->
          <linearGradient id="ribbon-grad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#ff758f"/>
            <stop offset="50%" stop-color="#ff4d6d"/>
            <stop offset="100%" stop-color="#c9184a"/>
          </linearGradient>

          <!-- Gradient Cánh Hoa Hồng Đỏ Thắm / Hồng Đào / Kem Sữa / Tím Pastel -->
          <radialGradient id="rose-ruby" cx="50%" cy="45%" r="55%">
            <stop offset="0%" stop-color="#800f2f"/>
            <stop offset="40%" stop-color="#c9184a"/>
            <stop offset="78%" stop-color="#ff4d6d"/>
            <stop offset="100%" stop-color="#ff8fa3"/>
          </radialGradient>
          <radialGradient id="rose-blush" cx="50%" cy="45%" r="55%">
            <stop offset="0%" stop-color="#ff4d6d"/>
            <stop offset="45%" stop-color="#ff758f"/>
            <stop offset="80%" stop-color="#ffb3c6"/>
            <stop offset="100%" stop-color="#fff0f3"/>
          </radialGradient>
          <radialGradient id="rose-cream" cx="50%" cy="45%" r="55%">
            <stop offset="0%" stop-color="#ffb703"/>
            <stop offset="30%" stop-color="#ffcad4"/>
            <stop offset="70%" stop-color="#fff0f3"/>
            <stop offset="100%" stop-color="#ffffff"/>
          </radialGradient>
          <radialGradient id="rose-lilac" cx="50%" cy="45%" r="55%">
            <stop offset="0%" stop-color="#7209b7"/>
            <stop offset="42%" stop-color="#b5179e"/>
            <stop offset="78%" stop-color="#f72585"/>
            <stop offset="100%" stop-color="#ffccd5"/>
          </radialGradient>
          <linearGradient id="leaf-euca" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#74c69d"/>
            <stop offset="100%" stop-color="#2d6a4f"/>
          </linearGradient>
          <linearGradient id="leaf-mint" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#95d5b2"/>
            <stop offset="100%" stop-color="#40916c"/>
          </linearGradient>

          <!-- MẪU BÔNG HOA HỒNG ĐA TẦNG CÁNH (REUSABLE SYMBOL) -->
          <g id="luxury-rose">
            <!-- Tầng cánh ngoài cùng uốn lượn -->

  <script>
    // =========================================================================
    // 1. NỘI DUNG BỨC THƯ (BẠN CÓ THỂ SỬA LỜI CHÚC TẠI ĐÂY)
    // =========================================================================
    const LOVE_LETTER_CONTENT =
      "Tặng em bó hoa tươi thắm nhất! Chúc công chúa của anh luôn rạng rỡ và xinh đẹp như những đóa hoa này.\n\n" +
      "Cảm ơn em đã đến bên anh. Chúc cục dàng của anh một ngày 20/10 thật hạnh phúc và ngập tràn tiếng cười. Yêu em rất nhìu! ❤️";

    // =========================================================================
    // 2. HỆ THỐNG ÂM THANH & NHẠC NỀN LÃNG MẠN (WEB AUDIO API)
    // =========================================================================
    let audioCtx = null;
    let bgmMasterGain = null;
    let bgmPlaying = false;
    let bgmMuted = false;
    let bgmVolume = 0.5;
    let bgmStep = 0;

    const FLOWER_CHIMES = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        bgmMasterGain = audioCtx.createGain();
        bgmMasterGain.gain.setValueAtTime(bgmMuted ? 0 : bgmVolume * 0.25, audioCtx.currentTime);
        bgmMasterGain.connect(audioCtx.destination);
      }
      if (audioCtx.state === "suspended") audioCtx.resume();
      if (!bgmPlaying) startRomanticMusicBox();
    }

    const N = {
      _: 0,
      C3: 130.81,F3: 174.61, G3: 196.00, A3: 220.00,
      C4: 261.63, D4: 293.66, E4: 329.63, F4: 349.23, G4: 392.00, A4: 440.00, B4: 493.88,
      C5: 523.25, D5: 587.33, E5: 659.25, F5: 698.46, G5: 783.99, A5: 880.00, B5: 987.77, C6: 1046.50
    };

    const LEAD_MELODY = [
      N.E5, N._,  N.G5, N.E5, N.C5, N.D5, N.E5, N._,  N.G5, N.A5, N.G5, N.E5, N.D5, N._,  N.C5, N._,
      N.C5, N.E5, N.A5, N._,  N.G5, N.E5, N.C5, N.D5, N.E5, N._,  N.D5, N._,  N.C5, N._,  N._,  N._,
      N.F5, N._,  N.A5, N.F5, N.C5, N.F5, N.A5, N._,  N.G5, N.A5, N.B5, N.G5, N.E5, N._,  N.D5, N._,
      N.E5, N.G5, N.C6, N.B5, N.A5, N.G5, N.E5, N.C5, N.D5, N.E5, N.C5, N._,  N._,  N._,  N._,  N._
    ];

    const ARP_NOTES = [
      N.C4, N.E4, N.G4, N.B4, N.C4, N.E4, N.G4, N.B4, N.C4, N.E4, N.G4, N.B4, N.C4, N.E4, N.G4, N.B4,
      N.A3, N.C4, N.E4, N.G4, N.A3, N.C4, N.E4, N.G4, N.A3, N.C4, N.E4, N.G4, N.A3, N.C4, N.E4, N.G4,
      N.F3, N.A3, N.C4, N.E4, N.F3, N.A3, N.C4, N.E4, N.G3, N.B4, N.D4, N.F4, N.G3, N.B4, N.D4, N.F4,
      N.C4, N.E4, N.G4, N.C5, N.F3, N.A3, N.C4, N.D4, N.G3, N.B4, N.D4, N.G4, N.C4, N.G3, N.E4, N.C4
    ];

    function playMusicBoxNote(freq, dur, waveType, gainVal) {
      if (!audioCtx || !bgmMasterGain || freq <= 0) return;
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = waveType;
      osc.frequency.setValueAtTime(freq, now);

      gain.gain.setValueAtTime(0.001, now);
      gain.gain.linearRampToValueAtTime(gainVal, now + 0.015);
      gain.gain.exponentialRampToValueAtTime(0.001, now + dur);

      osc.connect(gain);
      gain.connect(bgmMasterGain);
      osc.start(now);
      osc.stop(now + dur + 0.02);
    }

    function startRomanticMusicBox() {
      if (bgmPlaying) return;
      bgmPlaying = true;
      setInterval(() => {
        if (!audioCtx || bgmMuted || bgmVolume <= 0.01 || audioCtx.state !== "running") return;
        const lead = LEAD_MELODY[bgmStep];
        const arp = ARP_NOTES[bgmStep];
        if (lead > 0) playMusicBoxNote(lead, 0.32, "sine", 0.26);
        if (arp > 0) playMusicBoxNote(arp, 0.2, "triangle", 0.14);
        bgmStep = (bgmStep + 1) % LEAD_MELODY.length;
      }, 150);
    }

    function updateBgmGain() {
      if (!audioCtx || !bgmMasterGain) return;
      const target = bgmMuted ? 0 : bgmVolume * 0.25;
      bgmMasterGain.gain.setTargetAtTime(target, audioCtx.currentTime, 0.03);
    }

    document.getElementById("bgm-volume").addEventListener("input", (e) => {
      initAudio();
      bgmVolume = parseInt(e.target.value, 10) / 100;
      if (bgmVolume > 0 && bgmMuted) bgmMuted = false;
      document.getElementById("btn-bgm-toggle").innerText = (bgmMuted || bgmVolume === 0) ? "🔇" : "🎵";
      updateBgmGain();
    });

    document.getElementById("btn-bgm-toggle").addEventListener("click", () => {
      initAudio();
      bgmMuted = !bgmMuted;
      document.getElementById("btn-bgm-toggle").innerText = (bgmMuted || bgmVolume === 0) ? "🔇" : "🎵";
      updateBgmGain();
    });

    function playChime(freq, duration = 0.35, vol = 0.18) {
      try {
        initAudio();
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const over = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "sine";
        over.type = "triangle";
        osc.frequency.setValueAtTime(freq, now);
        over.frequency.setValueAtTime(freq * 2, now);

        gain.gain.setValueAtTime(0.001, now);
        gain.gain.linearRampToValueAtTime(vol, now + 0.015);
        gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

        osc.connect(gain);
        over.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        over.start(now);
        osc.stop(now + duration);
        over.stop(now + duration);
      } catch (e) {}
    }

    window.addEventListener("pointerdown", () => initAudio(), { once: true });

    // =========================================================================
    // 3. TƯƠNG TÁC CHẠM VÀO HOA & HIỆU ỨNG CÁNH HOA RƠI / ĐOM ĐÓM
    // =========================================================================
    const bgCanvas = document.getElementById("bgCanvas");
    const bgCtx = bgCanvas.getContext("2d");

    function resizeCanvases() {
      bgCanvas.width = window.innerWidth;
      bgCanvas.height = window.innerHeight;
      fwCanvas.width = window.innerWidth;
      fwCanvas.height = window.innerHeight;
    }

    const fallingPetals = Array.from({ length: 32 }, () => ({
      x: Math.random() * window.innerWidth,
      y: Math.random() * window.innerHeight,
      vx: -0.4 + Math.random() * 1.1,
      vy: 0.7 + Math.random() * 1.1,
      size: 6 + Math.random() * 6,
      rot: Math.random() * Math.PI * 2,
      vRot: (Math.random() - 0.5) * 0.025,
      color: ["#ff8fa3", "#ffb3c6", "#ffcad4", "#ff4d6d"][Math.floor(Math.random() * 4)]
    }));

    const fireflies = Array.from({ length: 24 }, () => ({
      x: Math.random() * window.innerWidth,
      y: Math.random() * window.innerHeight,
      vx: (Math.random() - 0.5) * 0.5,
      vy: (Math.random() - 0.5) * 0.5,
      r: 2 + Math.random() * 2.5,
      phase: Math.random() * Math.PI * 2
    }));

    const burstHearts = [];

    function spawnHeartBurst(clientX, clientY, count = 12) {
      const symbols = ["💖", "💗", "🌸", "✨", "💝"];
      for (let i = 0; i < count; i++) {
        const ang = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.4;
        const spd = 1.5 + Math.random() * 3.5;
        burstHearts.push({
          x: clientX,
          y: clientY,
          vx: Math.cos(ang) * spd,
          vy: Math.sin(ang) * spd - 1.2,
          alpha: 1,
          size: 15 + Math.random() * 10,
          sym: symbols[Math.floor(Math.random() * symbols.length)]
        });
      }
    }

    // Gắn sự kiện chạm vào từng bông hoa trong bó hoa
    document.querySelectorAll(".flower-head").forEach((fl) => {
      fl.addEventListener("pointerdown", (e) => {
        e.stopPropagation();
        const noteIdx = parseInt(fl.getAttribute("data-note") || "0", 10);
        playChime(FLOWER_CHIMES[noteIdx % FLOWER_CHIMES.length], 0.4, 0.22);
        spawnHeartBurst(e.clientX, e.clientY, 14);
      });
    });

    // =========================================================================
    // 4. XỬ LÝ MỞ THƯ TÌNH & CHUYỂN SANG MÀN KẾT PHÁO HOA
    // =========================================================================
    const letterModal = document.getElementById("letter-modal");
    const letterTextEl = document.getElementById("letter-text");
    const fireworksOverlay = document.getElementById("fireworks-overlay");
    let typingTimer = null;
    let fireworksActive = false;

    function startTypewriterLetter() {
      if (typingTimer) clearInterval(typingTimer);
      letterTextEl.innerHTML = "";
      let idx = 0;
      typingTimer = setInterval(() => {
        if (idx < LOVE_LETTER_CONTENT.length) {
          const ch = LOVE_LETTER_CONTENT[idx];
          letterTextEl.innerHTML += ch === "\n" ? "<br/>" : ch;
          idx++;
        } else {
          clearInterval(typingTimer);
        }
      }, 32);
    }

    document.getElementById("btn-open-letter").addEventListener("click", (e) => {
      playChime(783.99, 0.4);
      spawnHeartBurst(e.clientX, e.clientY, 18);
      letterModal.style.display = "flex";
      startTypewriterLetter();
    });

    document.getElementById("btn-back-bouquet").addEventListener("click", () => {
      if (typingTimer) clearInterval(typingTimer);
      letterModal.style.display = "none";
    });

    document.getElementById("btn-to-fireworks").addEventListener("click", () => {
      if (typingTimer) clearInterval(typingTimer);
      letterModal.style.display = "none";
      fireworksActive = true;
      fireworksOverlay.style.display = "flex";
      playChime(1046.50, 0.5);
    });

    document.getElementById("btn-replay-all").addEventListener("click", () => {
      fireworksActive = false;
      fireworksOverlay.style.display = "none";
    });

    // =========================================================================
    // 5. HỆ THỐNG PHÁO HOA RỰC RỠ (CÓ CẢ PHÁO HOA HÌNH TRÁI TIM)
    // =========================================================================
    const fwCanvas = document.getElementById("fwCanvas");
    const fwCtx = fwCanvas.getContext("2d");
    const rockets = [];
    const sparks = [];
    const FW_COLORS = ["#ff4d6d", "#ffd166", "#4facfe", "#ff758c", "#7bed9f", "#f3c4fb", "#ffffff", "#ff9f1c"];

    resizeCanvases();
    window.addEventListener("resize", resizeCanvases);

    function explodeHeartFirework(rx, ry, color) {
      const steps = 46;
      for (let i = 0; i < steps; i++) {
        const t = (Math.PI * 2 * i) / steps;
        // Phương trình tham số hình Trái Tim
        const hx = 16 * Math.pow(Math.sin(t), 3);
        const hy = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
        sparks.push({
          x: rx,
          y: ry,
          vx: hx * 0.22,
          vy: hy * 0.22,
          color,
          alpha: 1,
          size: 2.6
        });
      }
    }

    function updateAndDrawFireworks() {
      if (!fireworksActive) return;

      fwCtx.fillStyle = "rgba(12, 4, 24, 0.2)";
      fwCtx.fillRect(0, 0, fwCanvas.width, fwCanvas.height);

      if (Math.random() < 0.08) {
        rockets.push({
          x: 80 + Math.random() * (fwCanvas.width - 160),
          y: fwCanvas.height,
          vx: (Math.random() - 0.5) * 2,
          vy: -(6.8 + Math.random() * 3.5),
          targetY: 70 + Math.random() * (fwCanvas.height * 0.42),
          color: FW_COLORS[Math.floor(Math.random() * FW_COLORS.length)],
          isHeart: Math.random() < 0.4
        });
      }

      for (let i = rockets.length - 1; i >= 0; i--) {
        const r = rockets[i];
        r.x += r.vx;
        r.y += r.vy;

        fwCtx.fillStyle = r.color;
        fwCtx.beginPath();
        fwCtx.arc(r.x, r.y, 3, 0, Math.PI * 2);
        fwCtx.fill();

        if (r.y <= r.targetY) {
          if (r.isHeart) {
            explodeHeartFirework(r.x, r.y, r.color);
          } else {
            const count = 44 + Math.floor(Math.random() * 24);
            for (let s = 0; s < count; s++) {
              const angle = (Math.PI * 2 * s) / count + (Math.random() - 0.5) * 0.1;
              const speed = 1.5 + Math.random() * 4.5;
              sparks.push({
                x: r.x,
                y: r.y,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,
                color: FW_COLORS[Math.floor(Math.random() * FW_COLORS.length)],
                alpha: 1,
                size: 2 + Math.random() * 2.2
              });
            }
          }
          playChime(240 + Math.random() * 280, 0.15, 0.04);
          rockets.splice(i, 1);
        }
      }

      for (let i = sparks.length - 1; i >= 0; i--) {
        const sp = sparks[i];
        sp.x += sp.vx;
        sp.y += sp.vy;
        sp.vy += 0.048;
        sp.vx *= 0.985;
        sp.alpha -= 0.014;

        if (sp.alpha <= 0) {
          sparks.splice(i, 1);
          continue;
        }

        fwCtx.save();
        fwCtx.globalAlpha = sp.alpha;
        fwCtx.fillStyle = sp.color;
        fwCtx.shadowColor = sp.color;
        fwCtx.shadowBlur = 8;
        fwCtx.beginPath();
        fwCtx.arc(sp.x, sp.y, sp.size, 0, Math.PI * 2);
        fwCtx.fill();
        fwCtx.restore();
      }
    }

    // =========================================================================
    // 6. VÒNG LẶP ĐỒ HỌA CHÍNH
    // =========================================================================
    function animateLoop(timestamp) {
      bgCtx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);

      // Vẽ đom đóm phát sáng dịu dàng
      fireflies.forEach(f => {
        f.x += f.vx;
        f.y += f.vy;
        if (f.x < 0) f.x = bgCanvas.width;
        if (f.x > bgCanvas.width) f.x = 0;
        if (f.y < 0) f.y = bgCanvas.height;
        if (f.y > bgCanvas.height) f.y = 0;

        const alpha = 0.35 + Math.abs(Math.sin(timestamp * 0.002 + f.phase)) * 0.65;
        bgCtx.save();
        bgCtx.globalAlpha = alpha;
        bgCtx.fillStyle = "#ffe066";
        bgCtx.shadowColor = "#ffd166";
        bgCtx.shadowBlur = 10;
        bgCtx.beginPath();
        bgCtx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
        bgCtx.fill();
        bgCtx.restore();
      });

      // Vẽ cánh hoa hồng rơi
      fallingPetals.forEach(p => {
        p.x += p.vx + Math.sin(timestamp * 0.0015 + p.rot) * 0.35;
        p.y += p.vy;
        p.rot += p.vRot;

        if (p.y > bgCanvas.height + 20) {
          p.y = -15;
          p.x = Math.random() * bgCanvas.width;
        }
        if (p.x > bgCanvas.width + 20) p.x = -15;
        if (p.x < -20) p.x = bgCanvas.width + 15;

        bgCtx.save();
        bgCtx.translate(p.x, p.y);
        bgCtx.rotate(p.rot);
        bgCtx.fillStyle = p.color;
        bgCtx.beginPath();
        bgCtx.moveTo(0, -p.size);
        bgCtx.bezierCurveTo(p.size, -p.size, p.size, p.size, 0, p.size);
        bgCtx.bezierCurveTo(-p.size, p.size, -p.size, -p.size, 0, -p.size);
        bgCtx.fill();
        bgCtx.restore();
      });

      // Vẽ các hạt trái tim bung ra khi chạm vào hoa
      for (let i = burstHearts.length - 1; i >= 0; i--) {
        const bh = burstHearts[i];
        bh.x += bh.vx;
        bh.y += bh.vy;
        bh.vy += 0.05;
        bh.alpha -= 0.018;
        if (bh.alpha <= 0) {
          burstHearts.splice(i, 1);
          continue;
        }
        bgCtx.save();
        bgCtx.globalAlpha = bh.alpha;
        bgCtx.font = `${bh.size}px sans-serif`;
        bgCtx.textAlign = "center";
        bgCtx.fillText(bh.sym, bh.x, bh.y);
        bgCtx.restore();
      }

      updateAndDrawFireworks();
      requestAnimationFrame(animateLoop);
    }

    requestAnimationFrame(animateLoop);
  </script>
</body>
</html>
