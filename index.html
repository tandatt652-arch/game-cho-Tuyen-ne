<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>P2P Voice Call</title>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    body {
      background: radial-gradient(circle at center, #1b2038 0%, #0b0d17 100%);
      color: #f1f2f6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100dvh;
      width: 100vw;
      overflow: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 16px;
    }

    /* THANH KẾT NỐI TRÊN CÙNG */
    #top-bar {
      width: 100%;
      max-width: 780px;
      background: rgba(25, 30, 48, 0.85);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 16px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      z-index: 15;
      box-shadow: 0 8px 25px rgba(0,0,0,0.4);
    }
    .bar-section {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .id-chip {
      background: rgba(79, 172, 254, 0.18);
      border: 1px solid #4facfe;
      color: #70c4ff;
      padding: 5px 10px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 13px;
      user-select: text;
      -webkit-user-select: text;
    }
    input#remote-id-input {
      background: rgba(11, 13, 23, 0.9);
      border: 1px solid #3a415e;
      color: #fff;
      padding: 7px 12px;
      border-radius: 8px;
      font-size: 13px;
      outline: none;
      width: 185px;
    }
    input#remote-id-input:focus { border-color: #ff758c; }
    .btn-sm {
      background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%);
      color: #fff;
      border: none;
      padding: 7px 14px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      transition: transform 0.15s, opacity 0.2s;
    }
    .btn-sm:active { transform: scale(0.95); }
    .btn-copy {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.2);
      font-weight: 600;
    }

    /* KHU VỰC HIỂN THỊ TRUNG TÂM (2 AVATAR ĐÀM THOẠI) */
    #voice-stage {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      width: 100%;
      max-width: 680px;
      text-align: center;
    }
    .avatars-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 36px;
      flex-wrap: wrap;
    }
    .user-card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 26px 32px;
      width: 210px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.3);
      transition: transform 0.2s;
    }
    .avatar-circle {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 42px;
      position: relative;
      transition: box-shadow 0.08s ease, transform 0.08s ease;
    }
    .avatar-me {
      background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
      box-shadow: 0 0 0 0 rgba(79, 172, 254, 0.5);
    }
    .avatar-peer {
      background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%);
      box-shadow: 0 0 0 0 rgba(255, 117, 140, 0.5);
    }
    .user-name {
      font-weight: 700;
      font-size: 16px;
    }
    .mic-badge {
      font-size: 12px;
      color: #a4b0be;
      background: rgba(0, 0, 0, 0.35);
      padding: 4px 10px;
      border-radius: 12px;
    }

    #call-timer {
      font-size: 28px;
      font-weight: 800;
      color: #2ed573;
      letter-spacing: 2px;
      display: none;
    }
    #status-text {
      font-size: 15px;
      font-weight: 600;
      color: #ffa502;
    }
    #sub-hint {
      font-size: 13px;
      color: #8395a7;
      max-width: 400px;
      line-height: 1.5;
    }

    /* THANH NÚT ĐIỀU KHIỂN DƯỚI CÙNG */
    #bottom-controls {
      background: rgba(25, 30, 48, 0.88);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 10px 22px;
      border-radius: 40px;
      display: flex;
      align-items: center;
      gap: 16px;
      z-index: 15;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      margin-bottom: 6px;
    }
    .ctrl-btn {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      border: none;
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
      font-size: 21px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }
    .ctrl-btn:hover { background: rgba(255, 255, 255, 0.22); }
    .ctrl-btn.off {
      background: rgba(255, 71, 87, 0.25);
      color: #ff4757;
      border: 1px solid #ff4757;
    }
    .ctrl-btn.hangup {
      background: #ff4757;
      color: #fff;
      width: 62px;
      border-radius: 26px;
      display: none;
    }

    /* HỘP THOẠI ĐỔ CHUÔNG CUỘC GỌI ĐẾN */
    #incoming-modal {
      position: absolute;
      inset: 0;
      background: rgba(11, 13, 23, 0.82);
      backdrop-filter: blur(10px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 30;
      padding: 20px;
    }
    .incoming-card {
      background: #191e30;
      border: 2px solid #ff758c;
      border-radius: 24px;
      padding: 28px 24px;
      width: 100%;
      max-width: 350px;
      text-align: center;
      box-shadow: 0 15px 45px rgba(0,0,0,0.6);
    }
    .incoming-actions {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin-top: 22px;
    }
    .btn-accept {
      background: #2ed573;
      color: #fff;
      border: none;
      padding: 12px 24px;
      border-radius: 30px;
      font-weight: 800;
      font-size: 15px;
      cursor: pointer;
    }
    .btn-reject {
      background: #ff4757;
      color: #fff;
      border: none;
      padding: 12px 24px;
      border-radius: 30px;
      font-weight: 800;
      font-size: 15px;
      cursor: pointer;
    }

    /* Hiệu ứng thả tim bay */
    .floating-heart {
      position: absolute;
      bottom: 85px;
      font-size: 28px;
      pointer-events: none;
      z-index: 25;
      animation: floatUp 2.4s ease-out forwards;
    }
    @keyframes floatUp {
      0% { transform: translateY(0) scale(0.7); opacity: 1; }
      100% { transform: translateY(-320px) scale(1.4); opacity: 0; }
    }
  </style>
</head>
<body>

  <!-- Phần tử phát âm thanh ẩn -->
  <audio id="remote-audio" autoplay playsinline></audio>

  <!-- THANH KẾT NỐI TRÊN CÙNG -->
  <div id="top-bar">
    <div class="bar-section">
      <span style="font-size: 13px; color: #a4b0be;">ID của bạn:</span>
      <span id="my-id" class="id-chip">Đang tạo...</span>
      <button id="btn-copy-link" class="btn-sm btn-copy">🔗 Copy Link Mời</button>
    </div>

    <div class="bar-section" id="dial-box">
      <input type="text" id="remote-id-input" placeholder="Nhập ID người nhận..." />
      <button id="btn-call" class="btn-sm">📞 Gọi Thoại</button>
    </div>
  </div>

  <!-- SÂN KHẤU ĐÀM THOẠI TRUNG TÂM -->
  <div id="voice-stage">
    <div id="call-timer">00:00</div>
    <div id="status-text">Đang khởi tạo Micro...</div>

    <div class="avatars-row">
      <!-- Thẻ của bạn -->
      <div class="user-card">
        <div id="local-avatar" class="avatar-circle avatar-me">🎧</div>
        <div class="user-name">Bạn</div>
        <div id="local-mic-label" class="mic-badge">🎤 Đang bật Mic</div>
      </div>

      <!-- Thẻ của đối phương -->
      <div class="user-card">
        <div id="remote-avatar" class="avatar-circle avatar-peer">💖</div>
        <div class="user-name" id="remote-name">Người thương</div>
        <div id="remote-mic-label" class="mic-badge">⏳ Chưa kết nối</div>
      </div>
    </div>

    <p id="sub-hint">
      Nhấn <strong>"🔗 Copy Link Mời"</strong> gửi cho người kia hoặc nhập mã ID rồi bấm <strong>Gọi Thoại</strong>.
    </p>
  </div>

  <!-- HỘP THOẠI ĐỔ CHUÔNG KHI CÓ CUỘC GỌI ĐẾN -->
  <div id="incoming-modal">
    <div class="incoming-card">
      <div class="avatar-circle avatar-peer" style="margin: 0 auto 16px; width: 80px; height: 80px; font-size: 34px;">📲</div>
      <h3 style="font-size: 20px; margin-bottom: 6px;">Cuộc gọi thoại đến...</h3>
      <p id="caller-id-text" style="font-size: 13px; color: #a4b0be;">Từ: ...</p>
      <div class="incoming-actions">
        <button id="btn-accept" class="btn-accept">📞 Nghe máy</button>
        <button id="btn-reject" class="btn-reject">✖ Từ chối</button>
      </div>
    </div>
  </div>

  <!-- THANH NÚT ĐIỀU KHIỂN DƯỚI CÙNG -->
  <div id="bottom-controls">
    <button id="btn-mic" class="ctrl-btn" title="Bật / Tắt Micro">🎤</button>
    <button id="btn-speaker" class="ctrl-btn" title="Bật / Tắt Loa">🔊</button>
    <button id="btn-heart" class="ctrl-btn" title="Thả tim">💗</button>
    <button id="btn-hangup" class="ctrl-btn hangup" title="Kết thúc cuộc gọi">📴</button>
  </div>

  <script>
    // =========================================================================
    // 1. CẤU HÌNH TURN SERVER CHÍNH CHỦ CỦA BẠN
    // =========================================================================
    const iceServers = [
      { urls: "stun:stun.relay.metered.ca:80" },
      {
        urls: "turn:global.relay.metered.ca:80",
        username: "8a9147e70a62e057ae66290f",
        credential: "GhlDl9OroRDzeCzf",
      },
      {
        urls: "turn:global.relay.metered.ca:80?transport=tcp",
        username: "8a9147e70a62e057ae66290f",
        credential: "GhlDl9OroRDzeCzf",
      },
      {
        urls: "turn:global.relay.metered.ca:443",
        username: "8a9147e70a62e057ae66290f",
        credential: "GhlDl9OroRDzeCzf",
      },
      {
        urls: "turns:global.relay.metered.ca:443?transport=tcp",
        username: "8a9147e70a62e057ae66290f",
        credential: "GhlDl9OroRDzeCzf",
      },
    ];

    const peer = new Peer({
      config: { iceServers, iceCandidatePoolSize: 10 }
    });

    let localStream = null;
    let currentCall = null;
    let dataConn = null;
    let incomingCallObj = null;
    let isMicOn = true;
    let isSpeakerOn = true;
    let callTimerInterval = null;
    let callSeconds = 0;
    let ringtoneInterval = null;

    const remoteAudio = document.getElementById("remote-audio");
    const statusText = document.getElementById("status-text");
    const localAvatar = document.getElementById("local-avatar");
    const remoteAvatar = document.getElementById("remote-avatar");

    // =========================================================================
    // 2. KHỞI TẠO MICRO (CHỈ THU ÂM THANH - KHÔNG DÙNG CAMERA)
    // =========================================================================
    async function initLocalAudio() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          audio: {
            echoCancellation: true,
            noiseSuppression: true,
            autoGainControl: true
          },
          video: false
        });
        localStream = stream;
        statusText.innerText = "Sẵn sàng gọi thoại";
        statusText.style.color = "#2ed573";
        setupVoiceVisualizer(stream, localAvatar, "79, 172, 254");
        return stream;
      } catch (err) {
        console.error("Không mở được Micro:", err);
        statusText.innerText = "Vui lòng cấp quyền Micro trên trình duyệt!";
        statusText.style.color = "#ff4757";
        return null;
      }
    }

    initLocalAudio();

    // =========================================================================
    // 3. HIỆU ỨNG VÒNG SÁNG NHẤP NHÁY THEO GIỌNG NÓI
    // =========================================================================
    function setupVoiceVisualizer(stream, avatarEl, rgbColor) {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const audioCtx = new AudioCtx();
        const source = audioCtx.createMediaStreamSource(stream);
        const analyser = audioCtx.createAnalyser();
        analyser.fftSize = 256;
        source.connect(analyser);
        const dataArray = new Uint8Array(analyser.frequencyBinCount);

        function updateMeter() {
          if (!stream.active) {
            avatarEl.style.boxShadow = "none";
            avatarEl.style.transform = "scale(1)";
            return;
          }
          analyser.getByteFrequencyData(dataArray);
          let sum = 0;
          for (let i = 0; i < dataArray.length; i++) sum += dataArray[i];
          const avg = sum / dataArray.length;

          if (avg > 12) {
            const radius = Math.min(35, avg * 0.6);
            avatarEl.style.boxShadow = `0 0 ${radius}px ${radius * 0.4}px rgba(${rgbColor}, 0.75)`;
            avatarEl.style.transform = `scale(${1 + Math.min(0.08, avg * 0.0012)})`;
          } else {
            avatarEl.style.boxShadow = `0 0 0 0 rgba(${rgbColor}, 0)`;
            avatarEl.style.transform = "scale(1)";
          }
          requestAnimationFrame(updateMeter);
        }
        updateMeter();
      } catch (e) {
        console.warn("Không tạo được hiệu ứng sóng âm:", e);
      }
    }

    // =========================================================================
    // 4. CHUÔNG BÁO CUỘC GỌI ĐẾN (WEB AUDIO API)
    // =========================================================================
    function startRingtone() {
      stopRingtone();
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtx) return;
      const ctx = new AudioCtx();

      ringtoneInterval = setInterval(() => {
        if (ctx.state === "suspended") ctx.resume();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(587.33, ctx.currentTime);
        osc.frequency.setValueAtTime(880, ctx.currentTime + 0.18);
        gain.gain.setValueAtTime(0.15, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.5);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.5);
      }, 1200);
    }

    function stopRingtone() {
      if (ringtoneInterval) {
        clearInterval(ringtoneInterval);
        ringtoneInterval = null;
      }
    }

    // =========================================================================
    // 5. XỬ LÝ SỰ KIỆN PEERJS (TẠO ID, GỌI ĐI, NHẬN CUỘC GỌI)
    // =========================================================================
    peer.on("open", (id) => {
      document.getElementById("my-id").innerText = id;
      const params = new URLSearchParams(window.location.search);
      const targetFromUrl = params.get("id");
      if (targetFromUrl && targetFromUrl !== id) {
        document.getElementById("remote-id-input").value = targetFromUrl;
        statusText.innerText = "Đã điền sẵn ID người nhận! Bấm Gọi Thoại ngay nhé.";
      }
    });

    peer.on("error", (err) => {
      stopRingtone();
      statusText.style.color = "#ff4757";
      if (err.type === "peer-unavailable") statusText.innerText = "Không tìm thấy ID người nhận (hoặc họ chưa mở web)!";
      else statusText.innerText = "Lỗi kết nối: " + err.type;
    });

    peer.on("connection", (conn) => {
      dataConn = conn;
      setupDataChannel();
    });

    peer.on("call", (call) => {
      incomingCallObj = call;
      document.getElementById("caller-id-text").innerText = "Từ ID: " + call.peer;
      document.getElementById("incoming-modal").style.display = "flex";
      startRingtone();
    });

    document.getElementById("btn-accept").addEventListener("click", async () => {
      stopRingtone();
      document.getElementById("incoming-modal").style.display = "none";
      if (!localStream) await initLocalAudio();
      if (incomingCallObj) {
        incomingCallObj.answer(localStream);
        handleActiveCall(incomingCallObj);
      }
    });

    document.getElementById("btn-reject").addEventListener("click", () => {
      stopRingtone();
      document.getElementById("incoming-modal").style.display = "none";
      if (incomingCallObj) {
        incomingCallObj.close();
        incomingCallObj = null;
      }
      if (dataConn && dataConn.open) dataConn.send({ type: "REJECTED" });
    });

    document.getElementById("btn-call").addEventListener("click", async () => {
      const targetId = document.getElementById("remote-id-input").value.trim();
      if (!targetId) {
        alert("Vui lòng nhập ID của người nhận!");
        return;
      }
      if (targetId === peer.id) {
        alert("Bạn không thể tự gọi cho chính mình!");
        return;
      }

      if (!localStream) await initLocalAudio();
      statusText.innerText = "Đang đổ chuông...";
      statusText.style.color = "#ffa502";

      dataConn = peer.connect(targetId);
      setupDataChannel();

      const call = peer.call(targetId, localStream);
      handleActiveCall(call);
    });

    function handleActiveCall(call) {
      if (currentCall) currentCall.close();
      currentCall = call;

      call.on("stream", (remoteStream) => {
        remoteAudio.srcObject = remoteStream;
        setupVoiceVisualizer(remoteStream, remoteAvatar, "255, 117, 140");

        statusText.innerText = "Đang trong cuộc gọi thoại";
        statusText.style.color = "#2ed573";
        document.getElementById("remote-mic-label").innerText = "🎤 Đang kết nối";
        document.getElementById("dial-box").style.display = "none";
        document.getElementById("btn-hangup").style.display = "flex";
        startCallTimer();
      });

      call.on("close", () => endCallCleanup("Cuộc gọi đã kết thúc"));
      call.on("error", () => endCallCleanup("Mất kết nối cuộc gọi"));
    }

    function setupDataChannel() {
      if (!dataConn) return;
      dataConn.on("open", () => {
        dataConn.send({ type: "MIC_STATE", isMicOn });
      });
      dataConn.on("data", (data) => {
        if (data.type === "HEART") spawnFloatingHeart();
        else if (data.type === "HANGUP") endCallCleanup("Đối phương đã kết thúc cuộc gọi");
        else if (data.type === "REJECTED") endCallCleanup("Đối phương đang bận / Từ chối cuộc gọi");
        else if (data.type === "MIC_STATE") {
          document.getElementById("remote-mic-label").innerText = data.isMicOn ? "🎤 Đang bật Mic" : "🔇 Đã tắt Mic";
        }
      });
    }

    function endCallCleanup(reasonText) {
      stopRingtone();
      if (currentCall) { currentCall.close(); currentCall = null; }
      if (dataConn) { dataConn.close(); dataConn = null; }

      remoteAudio.srcObject = null;
      remoteAvatar.style.boxShadow = "none";
      document.getElementById("remote-mic-label").innerText = "⏳ Chưa kết nối";

      statusText.innerText = reasonText || "Sẵn sàng gọi thoại";
      statusText.style.color = "#ffa502";
      document.getElementById("dial-box").style.display = "flex";
      document.getElementById("btn-hangup").style.display = "none";
      stopCallTimer();
    }

    // =========================================================================
    // 6. CÁC NÚT ĐIỀU KHIỂN TRONG CUỘC GỌI
    // =========================================================================
    // Bật / Tắt Micro
    document.getElementById("btn-mic").addEventListener("click", (e) => {
      if (!localStream) return;
      const audioTracks = localStream.getAudioTracks();
      if (audioTracks.length > 0) {
        isMicOn = !isMicOn;
        audioTracks[0].enabled = isMicOn;
        e.currentTarget.classList.toggle("off", !isMicOn);
        e.currentTarget.innerText = isMicOn ? "🎤" : "🔇";
        document.getElementById("local-mic-label").innerText = isMicOn ? "🎤 Đang bật Mic" : "🔇 Đã tắt Mic";
        if (dataConn && dataConn.open) dataConn.send({ type: "MIC_STATE", isMicOn });
      }
    });

    // Bật / Tắt Loa
    document.getElementById("btn-speaker").addEventListener("click", (e) => {
      isSpeakerOn = !isSpeakerOn;
      remoteAudio.muted = !isSpeakerOn;
      e.currentTarget.classList.toggle("off", !isSpeakerOn);
      e.currentTarget.innerText = isSpeakerOn ? "🔊" : "🔈";
    });

    // Thả tim bay
    function spawnFloatingHeart() {
      const heart = document.createElement("div");
      heart.className = "floating-heart";
      heart.innerText = ["💖", "💗", "💓", "💘", "🌸"][Math.floor(Math.random() * 5)];
      heart.style.left = (25 + Math.random() * 50) + "%";
      document.body.appendChild(heart);
      setTimeout(() => heart.remove(), 2400);
    }

    document.getElementById("btn-heart").addEventListener("click", () => {
      spawnFloatingHeart();
      if (dataConn && dataConn.open) dataConn.send({ type: "HEART" });
    });

    // Kết thúc cuộc gọi
    document.getElementById("btn-hangup").addEventListener("click", () => {
      if (dataConn && dataConn.open) dataConn.send({ type: "HANGUP" });
      endCallCleanup("Bạn đã kết thúc cuộc gọi");
    });

    // Sao chép Link mời nhanh
    document.getElementById("btn-copy-link").addEventListener("click", (e) => {
      if (!peer.id) return;
      const inviteUrl = `${window.location.origin}${window.location.pathname}?id=${peer.id}`;
      navigator.clipboard.writeText(inviteUrl);
      const btn = e.currentTarget;
      const oldText = btn.innerText;
      btn.innerText = "✓ Đã chép Link!";
      setTimeout(() => { btn.innerText = oldText; }, 2000);
    });

    // Bộ đếm thời gian cuộc gọi
    function startCallTimer() {
      stopCallTimer();
      callSeconds = 0;
      const timerEl = document.getElementById("call-timer");
      timerEl.style.display = "block";
      callTimerInterval = setInterval(() => {
        callSeconds++;
        const mins = String(Math.floor(callSeconds / 60)).padStart(2, "0");
        const secs = String(callSeconds % 60).padStart(2, "0");
        timerEl.innerText = `${mins}:${secs}`;
      }, 1000);
    }

    function stopCallTimer() {
      if (callTimerInterval) clearInterval(callTimerInterval);
      document.getElementById("call-timer").style.display = "none";
    }
  </script>
</body>
</html>
