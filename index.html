<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bấm dô ii❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght=700&display=swap" rel="stylesheet">
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; user-select: none; -webkit-user-select: none;
            background-color: #000003; font-family: Arial, sans-serif;
        }
        #canvas-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }
        
        #instruction {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.9); z-index: 10; text-align: center; pointer-events: none;
            font-size: 14px; background: rgba(30, 40, 60, 0.6); padding: 10px 20px; border-radius: 20px;
            box-shadow: 0 0 10px rgba(135, 206, 235, 0.5);
            width: 85%; max-width: 600px;
        }

        /* JOYSTICK */
        #joystick-zone {
            position: absolute; bottom: 40px; left: 40px; width: 120px; height: 120px;
            background: rgba(255, 255, 255, 0.2); border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 50%; z-index: 10; display: none; touch-action: none;
        }
        #joystick-knob {
            position: absolute; top: 35px; left: 35px; width: 50px; height: 50px;
            background: rgba(255, 255, 255, 0.9); box-shadow: 0 0 15px rgba(0,0,0,0.2); border-radius: 50%;
        }

        /* Các nút tương tác cũ */
        #door-prompt {
            position: absolute; bottom: 25%; left: 50%; transform: translateX(-50%);
            color: #fff; background: linear-gradient(45deg, #4caf50, #2196f3);
            padding: 14px 28px; border-radius: 30px; font-size: 18px; font-weight: bold;
            display: none; cursor: pointer; z-index: 10;
            box-shadow: 0 0 20px rgba(33, 150, 243, 0.6);
            animation: pulse 1.5s infinite alternate;
        }

        #curtain-btn {
            position: absolute; bottom: 25px; right: 25px;
            color: #fff; background: linear-gradient(45deg, #9c27b0, #3f51b5);
            padding: 12px 24px; border-radius: 25px; font-size: 16px; font-weight: bold;
            cursor: pointer; z-index: 10;
            box-shadow: 0 0 15px rgba(156, 39, 176, 0.6);
            transition: transform 0.2s;
        }
        #curtain-btn:active { transform: scale(0.95); }

        /* HỆ THỐNG UI TƯƠNG TÁC MỚI (BÒ & CỎ) */
        #action-prompt {
            position: absolute; bottom: 30%; left: 50%; transform: translateX(-50%);
            color: #fff; background: linear-gradient(45deg, #ff9800, #e91e63);
            padding: 14px 28px; border-radius: 30px; font-size: 18px; font-weight: bold;
            display: none; cursor: pointer; z-index: 20;
            box-shadow: 0 0 20px rgba(233, 30, 99, 0.6);
        }

        #dialogue-box {
            position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%);
            width: 90%; max-width: 500px; background: rgba(20, 20, 35, 0.92);
            border: 3px solid #ff6b8b; border-radius: 20px; padding: 20px;
            box-shadow: 0 0 25px rgba(255, 107, 139, 0.5);
            display: none; flex-direction: column; z-index: 30; color: #fff;
        }
        #dialogue-text {
            font-size: 16px; line-height: 1.5; margin-bottom: 20px; text-align: center; font-weight: 500;
        }
        .dialogue-options {
            display: flex; flex-direction: column; gap: 10px; width: 100%;
        }
        .option-btn {
            background: rgba(255, 255, 255, 0.15); border: 1px solid rgba(255, 255, 255, 0.3);
            color: #fff; padding: 12px; border-radius: 12px; font-size: 15px; font-weight: bold;
            cursor: pointer; transition: all 0.2s; text-align: center;
        }
        .option-btn:hover { background: #ff6b8b; border-color: #ff6b8b; }

        @keyframes pulse {
            0% { transform: translateX(-50%) scale(1); }
            100% { transform: translateX(-50%) scale(1.08); }
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="door-prompt">Mở cửa ra đi nèe🚪</div>
    <div id="curtain-btn">Chạm Mở/Đóng Rèm</div>
    
    <div id="action-prompt">Tương tác</div>
    <div id="dialogue-box">
        <div id="dialogue-text">Lời thoại của bò hiển thị ở đây...</div>
        <div class="dialogue-options" id="options-container"></div>
    </div>

    <div id="joystick-zone"><div id="joystick-knob"></div></div>
    <div id="canvas-container"></div>

    <script>
        // --- CẤU HÌNH LIÊN KẾT THEO DÕI GOOGLE FORM CHÍNH XÁC CỦA BẠN ---
        const GOOGLE_FORM_URL = "https://docs.google.com/forms/d/e/1FAIpQLSe4Jvx2uI27uJQTt9Xn6QdFj59c53kFNIRbxyFeirMOOEFE4g/formResponse";
        
        const FORM_ENTRY_IDS = {
            playerId: "entry.1666228409",      // test1 -> Lưu mã người chơi
            cowScale: "entry.992038501",       // test2 -> Lưu kích thước bò
            questionText: "entry.1275903316",   // test3 -> Lời thoại/Ngữ cảnh
            playerChoice: "entry.444679017"    // test4 -> Lựa chọn của người dùng
        };

        // Tạo ID ngẫu nhiên cho mỗi lượt tải trang để phân biệt giữa các người chơi khác nhau
        const randomPlayerId = "User-" + Math.random().toString(36).substring(2, 9).toUpperCase();

        // Hàm xử lý gửi dữ liệu chạy ngầm không gây lag game
        function sendTrackingData(cowScale, questionText, playerChoice) {
            const formData = new FormData();
            formData.append(FORM_ENTRY_IDS.playerId, randomPlayerId);
            formData.append(FORM_ENTRY_IDS.cowScale, cowScale);
            formData.append(FORM_ENTRY_IDS.questionText, questionText);
            formData.append(FORM_ENTRY_IDS.playerChoice, playerChoice);

            fetch(GOOGLE_FORM_URL, {
                method: "POST",
                mode: "no-cors",
                body: formData
            }).then(() => {
                console.log("Đã lưu lựa chọn:", {cowScale, questionText, playerChoice});
            }).catch(err => console.error("Lỗi đồng bộ hệ thống:", err));
        }

        // --- KHỞI TẠO HỆ THỐNG MÔI TRƯỜNG NGÀY ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x7ec0ee);
        scene.fog = new THREE.FogExp2(0x7ec0ee, 0.005);

        const playerGroup = new THREE.Group();
        playerGroup.position.set(-3, 1.8, 3); 
        scene.add(playerGroup);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 2000);
        playerGroup.add(camera);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xfffaed, 0.9);
        sunLight.position.set(120, 150, 100);
        scene.add(sunLight);

        const roomLight = new THREE.PointLight(0xffeedd, 1.0, 15);
        roomLight.position.set(0, 3.2, 1);
        scene.add(roomLight);

        function createMat(color, roughness = 0.7) {
            return new THREE.MeshStandardMaterial({ color: color, roughness: roughness, side: THREE.FrontSide });
        }

        // --- ĐỔI SÀN THẾ GIỚI THÀNH NỀN CỎ RỘNG VÔ TẬN ---
        const grassMat = new THREE.MeshStandardMaterial({ color: 0x557a46, roughness: 0.9, metalness: 0.1 }); 
        const floor = new THREE.Mesh(new THREE.PlaneGeometry(10000, 10000), grassMat);
        floor.rotation.x = -Math.PI / 2; 
        floor.receiveShadow = true;
        floor.position.y = 0; 
        scene.add(floor); 

        // --- CĂN PHÒNG ---
        const roomGroup = new THREE.Group();
        scene.add(roomGroup);

        const wallMat = new THREE.MeshStandardMaterial({ color: 0xf29cbc, roughness: 1.0, metalness: 0.0, side: THREE.DoubleSide }); 
        const roomFloorMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.25, metalness: 0.15 }); 

        const roomFloor = new THREE.Mesh(new THREE.PlaneGeometry(12, 12), roomFloorMat);
        roomFloor.rotation.x = -Math.PI / 2; 
        roomFloor.position.y = 0.005; // Đã sửa khoảng cách để triệt tiêu lỗi chồng lấp đổi màu nền
        roomFloor.receiveShadow = true; 
        roomGroup.add(roomFloor);

        function createWallMesh(geo, mat) {
            const mesh = new THREE.Mesh(geo, mat);
            mesh.castShadow = true; mesh.receiveShadow = true;
            return mesh;
        }

        const ceiling = createWallMesh(new THREE.PlaneGeometry(12, 12), wallMat);
        ceiling.rotation.x = Math.PI / 2; ceiling.position.y = 5; roomGroup.add(ceiling);

        const leftWall = createWallMesh(new THREE.PlaneGeometry(12, 5), wallMat);
        leftWall.position.set(-6, 2.5, 0); leftWall.rotation.y = Math.PI / 2; roomGroup.add(leftWall);

        const rightWall = createWallMesh(new THREE.PlaneGeometry(12, 5), wallMat);
        rightWall.position.set(6, 2.5, 0); rightWall.rotation.y = -Math.PI / 2; roomGroup.add(rightWall);

        const frontWallLeft = createWallMesh(new THREE.PlaneGeometry(4.5, 5), wallMat); frontWallLeft.position.set(-3.75, 2.5, -6); roomGroup.add(frontWallLeft);

        const frontWallRight = createWallMesh(new THREE.PlaneGeometry(4.5, 5), wallMat); frontWallRight.position.set(3.75, 2.5, -6); roomGroup.add(frontWallRight);

        const frontWallTop = createWallMesh(new THREE.PlaneGeometry(3, 1.4), wallMat); frontWallTop.position.set(0, 4.3, -6); roomGroup.add(frontWallTop);

        const backWallBottom = createWallMesh(new THREE.PlaneGeometry(12, 1.25), wallMat); backWallBottom.position.set(0, 0.625, 6); backWallBottom.rotation.y = Math.PI; roomGroup.add(backWallBottom);

        const backWallTop = createWallMesh(new THREE.PlaneGeometry(12, 1.35), wallMat); backWallTop.position.set(0, 4.325, 6); backWallTop.rotation.y = Math.PI; roomGroup.add(backWallTop);

        const backWallLeft = createWallMesh(new THREE.PlaneGeometry(2.5, 2.4), wallMat); backWallLeft.position.set(-4.75, 2.45, 6); backWallLeft.rotation.y = Math.PI; roomGroup.add(backWallLeft);

        const backWallRight = createWallMesh(new THREE.PlaneGeometry(2.5, 2.4), wallMat); backWallRight.position.set(4.75, 2.45, 6); backWallRight.rotation.y = Math.PI; roomGroup.add(backWallRight);

        // --- KHUNG NHÔM CỬA SỔ ---
        const aluMat = new THREE.MeshStandardMaterial({ color: 0xdddddd, metalness: 0.8, roughness: 0.2 });
        const frames = [
            { w: 7.0, h: 0.1, d: 0.15, x: 0, y: 3.6, z: 5.95 }, { w: 7.0, h: 0.1, d: 0.15, x: 0, y: 1.3, z: 5.95 }, 
            { w: 0.1, h: 2.4, d: 0.15, x: -3.45, y: 2.45, z: 5.95 }, { w: 0.1, h: 2.4, d: 0.15, x: 3.45, y: 2.45, z: 5.95 }, 
            { w: 7.0, h: 0.08, d: 0.15, x: 0, y: 2.45, z: 5.95 }, { w: 0.08, h: 2.4, d: 0.15, x: 0, y: 2.45, z: 5.95 }  
        ];
        frames.forEach(f => {
            const bar = new THREE.Mesh(new THREE.BoxGeometry(f.w, f.h, f.d), aluMat);
            bar.position.set(f.x, f.y, f.z); bar.castShadow = true; roomGroup.add(bar);
        });

        const glassMat = new THREE.MeshStandardMaterial({ color: 0xffffff, transparent: true, opacity: 0.08, roughness: 0.0, metalness: 1.0, depthWrite: false });
        const windowGlass = new THREE.Mesh(new THREE.PlaneGeometry(7.0, 2.4), glassMat);
        windowGlass.position.set(0, 2.45, 5.92); windowGlass.rotation.y = Math.PI; roomGroup.add(windowGlass);

        // --- RÈM VẢI (CURTAINS) ---
        const curtainMat = new THREE.MeshStandardMaterial({ color: 0xff0000, roughness: 0.9, side: THREE.DoubleSide });
        const curtainGeo = new THREE.PlaneGeometry(3.6, 2.6, 10, 1);
        
        const curtainLeft = new THREE.Mesh(curtainGeo, curtainMat); curtainLeft.position.set(-1.75, 2.45, 5.85); curtainLeft.castShadow = true;
        const curtainRight = new THREE.Mesh(curtainGeo, curtainMat); curtainRight.position.set(1.75, 2.45, 5.85); curtainRight.castShadow = true;
        roomGroup.add(curtainLeft, curtainRight);

        // --- CÁNH CỬA PHÒNG ---
        const doorWidth = 3.0, doorHeight = 3.6;
        const doorCanvas = document.createElement('canvas'); doorCanvas.width = 256; doorCanvas.height = 512;
        const dCtx = doorCanvas.getContext('2d');
        dCtx.fillStyle = '#2b190e'; dCtx.fillRect(0,0,256,512);
        dCtx.strokeStyle = '#1a0f08'; dCtx.lineWidth = 14;
        dCtx.strokeRect(20, 20, 216, 472); dCtx.strokeRect(20, 20, 216, 220);
        dCtx.fillStyle = '#ffcc00'; dCtx.beginPath(); dCtx.arc(40, 256, 12, 0, Math.PI*2); dCtx.fill();

        const doorTex = new THREE.CanvasTexture(doorCanvas);
        const doorMesh = new THREE.Mesh(new THREE.BoxGeometry(doorWidth, doorHeight, 0.15), new THREE.MeshStandardMaterial({ map: doorTex }));
        doorMesh.position.set(doorWidth/2, doorHeight/2, 0);

        const doorPivot = new THREE.Group(); doorPivot.position.set(-doorWidth/2, 0, -6);
        doorPivot.add(doorMesh); scene.add(doorPivot);

        // --- TRANG TRÍ TRONG PHÒNG ---
        const bedGroup = new THREE.Group(); bedGroup.position.set(-4.2, 0, 3.0);
        const bedBase = new THREE.Mesh(new THREE.BoxGeometry(2.8, 0.5, 4), createMat(0xf2b8d1)); bedBase.castShadow = true; bedBase.receiveShadow = true;
        const bedMattress = new THREE.Mesh(new THREE.BoxGeometry(2.6, 0.4, 3.8), createMat(0xf29cbc, 0.8)); bedMattress.position.y = 0.4; bedMattress.castShadow = true;
        const pillow = new THREE.Mesh(new THREE.BoxGeometry(2.0, 0.2, 0.8), createMat(0xbd3a6d)); pillow.position.set(0, 0.65, 1.3); pillow.castShadow = true;
        const blanket = new THREE.Mesh(new THREE.BoxGeometry(2.62, 0.42, 2.5), createMat(0xbd3a6d, 0.7)); blanket.position.set(0, 0.42, -0.6); blanket.castShadow = true;
        bedGroup.add(bedBase, bedMattress, pillow, blanket); roomGroup.add(bedGroup);

        // --- ĐỂ TRANG TRÍ TƯỜNG CỦA CĂN PHÒNG ---
        function taoTextureTrangTri(loai) {
            const canvas = document.createElement('canvas'); canvas.width = 128; canvas.height = 128;
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, 128, 128);

            if (loai === 'hoa') {
                const hue = Math.random() * 360; ctx.fillStyle = `hsl(${hue}, 80%, 50%)`;
                for(let i = 0; i < 5; i++) {
                    const angle = (i * Math.PI * 2) / 5;
                    ctx.beginPath(); ctx.arc(64 + Math.cos(angle) * 22, 64 + Math.sin(angle) * 22, 20, 0, Math.PI * 2); ctx.fill();
                }
                ctx.fillStyle = '#ffd700'; ctx.beginPath(); ctx.arc(64, 64, 10, 0, Math.PI * 2); ctx.fill();
            } else if (loai === 'buom') {
                ctx.fillStyle = '#e040fb';
                ctx.beginPath(); ctx.ellipse(44, 48, 24, 16, Math.PI/6, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.ellipse(84, 48, 24, 16, -Math.PI/6, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.ellipse(50, 80, 16, 12, -Math.PI/6, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.ellipse(78, 80, 16, 12, Math.PI/6, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = '#333'; ctx.beginPath(); ctx.ellipse(64, 64, 6, 28, 0, 0, Math.PI*2); ctx.fill();
            } else if (loai === 'no') {
                ctx.fillStyle = '#ff4081';
                ctx.beginPath(); ctx.moveTo(64, 64); ctx.lineTo(24, 34); ctx.lineTo(24, 94); ctx.closePath(); ctx.fill();
                ctx.beginPath(); ctx.moveTo(64, 64); ctx.lineTo(104, 34); ctx.lineTo(104, 94); ctx.closePath(); ctx.fill();
                ctx.fillStyle = '#ff80ab'; ctx.beginPath(); ctx.arc(64, 64, 14, 0, Math.PI*2); ctx.fill();
                ctx.strokeStyle = '#ff4081'; ctx.lineWidth = 8;
                ctx.beginPath(); ctx.moveTo(54, 74); ctx.lineTo(34, 114); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(74, 74); ctx.lineTo(94, 114); ctx.stroke();
            }
            return new THREE.CanvasTexture(canvas);
        }

        function hienThiTrangTriTuong(loai, x, y, z, scale, rotY=0) {
            const mat = new THREE.MeshStandardMaterial({ map: taoTextureTrangTri(loai), transparent: true, side: THREE.DoubleSide, roughness: 0.5 });
            const mesh = new THREE.Mesh(new THREE.PlaneGeometry(0.5 * scale, 0.5 * scale), mat);
            mesh.position.set(x, y, z); mesh.rotation.y = rotY; roomGroup.add(mesh);
        }

        const cacLoaiDecor = ['hoa', 'buom', 'no'];
        for (let i = 0; i < 35; i++) { 
            let loaiRandom = cacLoaiDecor[Math.floor(Math.random() * cacLoaiDecor.length)];
            let viTriNgauNhien = (Math.random() - 0.5) * 11.2, chieuCaoNgauNhien = 0.5 + Math.random() * 4.0;
            let tyLeKichThuoc = 0.8 + Math.random() * 1.0, chonTuong = Math.floor(Math.random() * 4);
            if (chonTuong === 0) hienThiTrangTriTuong(loaiRandom, -5.93, chieuCaoNgauNhien, viTriNgauNhien, tyLeKichThuoc, Math.PI / 2);
            else if (chonTuong === 1) hienThiTrangTriTuong(loaiRandom, 5.93, chieuCaoNgauNhien, viTriNgauNhien, tyLeKichThuoc, -Math.PI / 2);
            else if (chonTuong === 2 && (Math.abs(viTriNgauNhien) > 3.6 || chieuCaoNgauNhien < 1.2 || chieuCaoNgauNhien > 3.8)) hienThiTrangTriTuong(loaiRandom, viTriNgauNhien, chieuCaoNgauNhien, 5.93, tyLeKichThuoc, Math.PI);
            else if (chonTuong === 3 && Math.abs(viTriNgauNhien) > 1.7) hienThiTrangTriTuong(loaiRandom, viTriNgauNhien, chieuCaoNgauNhien, -5.93, tyLeKichThuoc, 0);
        }

        // --- CHỮ THÔNG ĐIỆP BỔ SUNG ---
        const messages = [ "", "", "", "" ];
        const textPlanes = [];

        function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
            const words = text.split(' ');
            let line = '';
            let lines = [];
            for (let n = 0; n < words.length; n++) {
                let testLine = line + words[n] + ' ';
                let metrics = ctx.measureText(testLine);
                if (metrics.width > maxWidth && n > 0) {
                    lines.push(line);
                    line = words[n] + ' ';
                } else { line = testLine; }
            }
            lines.push(line);
            let currentY = y - ((lines.length - 1) * lineHeight) / 2;
            for (let i = 0; i < lines.length; i++) {
                ctx.fillText(lines[i].trim(), x, currentY);
                currentY += lineHeight;
            }
            return currentY; 
        }

        function createSignText(text, index, posX, posZ, rotY) {
            const canvas = document.createElement('canvas');
            canvas.width = 2048; canvas.height = 1024; 
            const ctx = canvas.getContext('2d');
            const tex = new THREE.CanvasTexture(canvas);

            document.fonts.load('10pt "Dancing Script"').then(() => {
                ctx.font = 'bold 95px "Dancing Script", cursive'; 
                ctx.fillStyle = '#ffccd5'; 
                ctx.textAlign = 'center';
                ctx.shadowColor = '#ff6b8b'; 
                ctx.shadowBlur = 40;
                let nextY = wrapText(ctx, text, 1024, 400, 1700, 120); 
                ctx.font = '100px Arial'; 
                ctx.fillStyle = '#ff6b8b'; 
                ctx.fillText('', 1024, Math.max(nextY + 40, 620));
                tex.needsUpdate = true;
            });

            const plane = new THREE.Mesh(new THREE.PlaneGeometry(24, 10.5), new THREE.MeshBasicMaterial({ map: tex, transparent: true, side: THREE.DoubleSide }));
            plane.position.set(posX, 5.8, posZ); plane.rotation.y = rotY;
            scene.add(plane);
            textPlanes.push(plane);
        }
        createSignText(messages[0], 0, 0, -25, 0);           
        createSignText(messages[1], 1, 25, 0, -Math.PI/2);   
        createSignText(messages[2], 2, 0, 25, Math.PI);      
        createSignText(messages[3], 3, -25, 0, Math.PI/2);   

        // --- HỆ THỐNG MÂY KHỐI ---
        const cloudsGroup = new THREE.Group();
        scene.add(cloudsGroup);
        const cloudMat = new THREE.MeshLambertMaterial({ color: 0xffffff, transparent: true, opacity: 0.85, side: THREE.DoubleSide });

        function createMinecraftCloud(startX, startY, startZ) {
            const cluster = new THREE.Group();
            const blocksCount = 3 + Math.floor(Math.random() * 5); 
            for(let i=0; i<blocksCount; i++) {
                const w = 15 + Math.floor(Math.random() * 20); const h = 4 + Math.floor(Math.random() * 4); const d = 15 + Math.floor(Math.random() * 20);
                const cloudBlock = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), cloudMat);
                cloudBlock.position.set((i * 12) - (blocksCount * 4), (Math.random() - 0.5) * 2, (Math.random() - 0.5) * 10);
                cluster.add(cloudBlock);
            }
            cluster.position.set(startX, startY, startZ); cloudsGroup.add(cluster);
        }
        for(let i=0; i<18; i++) {
            createMinecraftCloud((Math.random() - 0.5) * 500, 80 + Math.random() * 40, (Math.random() - 0.5) * 500);
        }

        const moonGroup = new THREE.Group();
        moonGroup.add(new THREE.Mesh(new THREE.CircleGeometry(32, 48), new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xffffff, emissiveIntensity: 4.8, side: THREE.DoubleSide, roughness: 1.0 })));
        const moonFlare = new THREE.Mesh(new THREE.CircleGeometry(38, 48), new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.32, side: THREE.DoubleSide }));
        moonFlare.position.z = -0.1; moonGroup.add(moonFlare);
        moonGroup.position.set(-80.38, 100, 300); moonGroup.lookAt(0, 0, 0); scene.add(moonGroup);

        // --- XÂY DỰNG CHUỒNG HÀNG RÀO GỖ ---
        const fenceGroup = new THREE.Group();
        fenceGroup.position.set(0, 0, -18); 
        scene.add(fenceGroup);

        const woodMat = new THREE.MeshStandardMaterial({ color: 0x8b5a2b, roughness: 0.9 });
        function buildFenceBar(w, h, d, x, y, z, rotY = 0) {
            const bar = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), woodMat);
            bar.position.set(x, y, z); bar.rotation.y = rotY; bar.castShadow = true; fenceGroup.add(bar);
        }
        for(let i = -6; i <= 6; i += 3) {
            if(i !== 0) buildFenceBar(0.3, 1.8, 0.3, -6, 0.9, i);
            buildFenceBar(0.3, 1.8, 0.3, 6, 0.9, i); buildFenceBar(0.3, 1.8, 0.3, i, 0.9, -6);
            if(Math.abs(i) > 2) buildFenceBar(0.3, 1.8, 0.3, i, 0.9, 6); 
        }
        buildFenceBar(0.15, 0.2, 12, -6, 1.3, 0); buildFenceBar(0.15, 0.2, 12, -6, 0.5, 0);
        buildFenceBar(0.15, 0.2, 12, 6, 1.3, 0);  buildFenceBar(0.15, 0.2, 12, 6, 0.5, 0);
        buildFenceBar(12, 0.2, 0.15, 0, 1.3, -6); buildFenceBar(12, 0.2, 0.15, 0, 0.5, -6);
        buildFenceBar(3.5, 0.2, 0.15, -4.25, 1.3, 6); buildFenceBar(3.5, 0.2, 0.15, -4.25, 0.5, 6);
        buildFenceBar(3.5, 0.2, 0.15, 4.25, 1.3, 6);  buildFenceBar(3.5, 0.2, 0.15, 4.25, 0.5, 6);

        // --- ĐỐNG CỎ/RƠM Ở GÓC CHUỒNG ---
        const strawGroup = new THREE.Group();
        strawGroup.position.set(4.5, 0, -4.5); fenceGroup.add(strawGroup);
        const strawMat = new THREE.MeshStandardMaterial({ color: 0xd2b48c, roughness: 1.0 });
        for(let i=0; i<5; i++) {
            const sGeo = new THREE.BoxGeometry(1.8 - i*0.3, 0.3, 1.8 - i*0.3);
            const sMesh = new THREE.Mesh(sGeo, strawMat); sMesh.position.y = 0.15 + i*0.3; sMesh.castShadow = true; strawGroup.add(sMesh);
        }

        // --- MÔ HÌNH BÒ 3D (ĐÃ THÊM MŨI & MIỆNG NÂU NHẠT) ---
        const cowGroup = new THREE.Group();
        cowGroup.position.set(0, 0.1, 0); fenceGroup.add(cowGroup);

        const cowWhiteMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.8 });
        const cowBlackMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.8 });
        const cowPinkMat = new THREE.MeshStandardMaterial({ color: 0xffb6c1, roughness: 0.8 });
        const cowTanMat = new THREE.MeshStandardMaterial({ color: 0xd2b48c, roughness: 0.8 }); 

        const cowBody = new THREE.Mesh(new THREE.BoxGeometry(1.6, 1.2, 2.2), cowWhiteMat); cowBody.position.y = 1.0; cowBody.castShadow = true; cowGroup.add(cowBody);
        const spot1 = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.5, 0.6), cowBlackMat); spot1.position.set(0.56, 1.2, 0.4); cowGroup.add(spot1);
        const spot2 = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.7, 0.5), cowBlackMat); spot2.position.set(-0.56, 0.9, -0.4); cowGroup.add(spot2);

        const cowHead = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.9, 0.9), cowWhiteMat); cowHead.position.set(0, 1.6, 1.2); cowHead.castShadow = true; cowGroup.add(cowHead);
        const cowSnout = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.4, 0.3), cowPinkMat); cowSnout.position.set(0, 1.4, 1.7); cowGroup.add(cowSnout);

        // Đốm lỗ mũi nâu nhạt dán lên bề mặt hồng
        const nostrilGeo = new THREE.BoxGeometry(0.1, 0.12, 0.01);
        const nostrilL = new THREE.Mesh(nostrilGeo, cowTanMat); nostrilL.position.set(0.18, 1.45, 1.851); cowGroup.add(nostrilL);
        const nostrilR = new THREE.Mesh(nostrilGeo, cowTanMat); nostrilR.position.set(-0.18, 1.45, 1.851); cowGroup.add(nostrilR);

        // Miệng bò dẹt dán bên dưới đầu bò
        const mouthLine = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.06, 0.01), cowTanMat); mouthLine.position.set(0, 1.18, 1.651); cowGroup.add(mouthLine);

        const eyeL = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.15, 0.1), cowBlackMat); eyeL.position.set(0.46, 1.7, 1.6); cowGroup.add(eyeL);
        const eyeR = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.15, 0.1), cowBlackMat); eyeR.position.set(-0.46, 1.7, 1.6); cowGroup.add(eyeR);

        function createLeg(x, z) {
            const leg = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.6, 0.35), cowWhiteMat); leg.position.set(x, 0.3, z); leg.castShadow = true; cowGroup.add(leg);
            const hoof = new THREE.Mesh(new THREE.BoxGeometry(0.37, 0.15, 0.37), cowBlackMat); hoof.position.set(x, 0.05, z); cowGroup.add(hoof);
        }
        createLeg(0.5, 0.7); createLeg(-0.5, 0.7); createLeg(0.5, -0.7); createLeg(-0.5, -0.7);

        let currentCowScale = 0.25; cowGroup.scale.set(currentCowScale, currentCowScale, currentCowScale);

        // --- ĐIỀU KHIỂN & CẤU TRÚC ĐỐI THOẠI KHẢO SÁT ---
        let moveF = false, moveB = false, moveL = false, moveR = false;
        let isDoorOpen = false, doorRot = 0, isCurtainOpen = false, curtainTargetProg = 0, curtainProg = 0;
        let yaw = 0, pitch = 0; const moveSpeed = 0.08;

        let feedCount = 0, hasStraw = false, isTalking = false;

        const heThongCauHoi = {
            cauHoiGoc: {
                title: "Đoạn này tôi sẽ chèn câu hỏi vào sau", 
                options: [
                    { text: "Lựa chọn gốc 1", next: "nhanh1" }, 
                    { text: "Lựa chọn gốc 2", next: "nhanh2" }, 
                    { text: "Lựa chọn gốc 3", next: "nhanh3" }  
                ]
            },
            nhanh1: {
                title: "Câu hỏi nhánh 1", 
                options: [
                    { text: "Phương án 1.1", textEnd: "Câu trả lời cuối cùng số 1" }, 
                    { text: "Phương án 1.2", textEnd: "Câu trả lời cuối cùng số 2" },
                    { text: "Phương án 1.3", textEnd: "Câu trả lời cuối cùng số 3" }
                ]
            },
            nhanh2: {
                title: "Câu hỏi nhánh 2", 
                options: [
                    { text: "Phương án 2.1", textEnd: "Câu trả lời cuối cùng số 4" }, 
                    { text: "Phương án 2.2", textEnd: "Câu trả lời cuối cùng số 5" },
                    { text: "Phương án 2.3", textEnd: "Câu trả lời cuối cùng số 6" }
                ]
            },
            nhanh3: {
                title: "Câu hỏi nhánh 3", 
                options: [
                    { text: "Phương án 3.1", textEnd: "Câu trả lời cuối cùng số 7" }, 
                    { text: "Phương án 3.2", textEnd: "Câu trả lời cuối cùng số 8" },
                    { text: "Phương án 3.3", textEnd: "Câu trả lời cuối cùng số 9" }
                ]
            }
        };

        // --- XỬ LÝ SỰ KIỆN GIAO DIỆN & HOÀN THIỆN MOBILE TRUNCATION ---
        if ('ontouchstart' in window) document.getElementById('joystick-zone').style.display = 'block';

        window.addEventListener('keydown', (e) => {
            if (isTalking) return;
            switch (e.code) { case 'ArrowUp': case 'KeyW': moveF = true; break; case 'ArrowLeft': case 'KeyA': moveL = true; break; case 'ArrowDown': case 'KeyS': moveB = true; break; case 'ArrowRight': case 'KeyD': moveR = true; break; }
        });
        window.addEventListener('keyup', (e) => {
            switch (e.code) { case 'ArrowUp': case 'KeyW': moveF = false; break; case 'ArrowLeft': case 'KeyA': moveL = false; break; case 'ArrowDown': case 'KeyS': moveB = false; break; case 'ArrowRight': case 'KeyD': moveR = false; break; }
        });

        let isMouseDown = false, prevMousePos = { x: 0, y: 0 };
        window.addEventListener('mousedown', (e) => { if (['door-prompt', 'curtain-btn', 'action-prompt'].includes(e.target.id) || isTalking) return; isMouseDown = true; prevMousePos = { x: e.clientX, y: e.clientY }; });
        window.addEventListener('mousemove', (e) => { if (!isMouseDown || isTalking) return; yaw -= (e.clientX - prevMousePos.x) * 0.003; pitch = Math.max(-Math.PI/3, Math.min(Math.PI/3, pitch - (e.clientY - prevMousePos.y) * 0.003)); prevMousePos = { x: e.clientX, y: e.clientY }; });
        window.addEventListener('mouseup', () => { isMouseDown = false; }); window.addEventListener('mouseleave', () => { isMouseDown = false; });

        let joyId = null, lookId = null, touchStart = { x: 0, y: 0 }, joyStart = { x: 0, y: 0 }, vMove = { x: 0, y: 0 };
        window.addEventListener('touchstart', (e) => {
            if (['curtain-btn', 'door-prompt', 'action-prompt'].includes(e.target.id) || isTalking) return;
            for (let i = 0; i < e.changedTouches.length; i++) {
                const t = e.changedTouches[i];
                if (t.clientX < window.innerWidth / 2 && joyId === null) {
                    joyId = t.identifier; joyStart = { x: t.clientX, y: t.clientY };
                    document.getElementById('joystick-zone').style.left = (t.clientX - 60) + 'px'; document.getElementById('joystick-zone').style.bottom = (window.innerHeight - t.clientY - 60) + 'px';
                } else if (t.clientX >= window.innerWidth / 2 && lookId === null) {
                    lookId = t.identifier; touchStart = { x: t.clientX, y: t.clientY };
                }
            }
        });
        window.addEventListener('touchmove', (e) => {
            if (isTalking) return;
            for (let i = 0; i < e.changedTouches.length; i++) {
                const t = e.changedTouches[i];
                if (t.identifier === joyId) {
                    let dx = t.clientX - joyStart.x, dy = t.clientY - joyStart.y, d = Math.sqrt(dx*dx + dy*dy);
                    if(d > 40) { dx = (dx/d)*40; dy = (dy/d)*40; }
                    document.getElementById('joystick-knob').style.transform = `translate(${dx}px, ${dy}px)`;
                    vMove.x = dx / 40; vMove.y = -dy / 40;
                }
                if (t.identifier === lookId) {
                    yaw -= (t.clientX - touchStart.x) * 0.005; pitch = Math.max(-Math.PI/3, Math.min(Math.PI/3, pitch - (t.clientY - touchStart.y) * 0.005)); touchStart = { x: t.clientX, y: t.clientY };
                }
            }
        });
        const endTouch = (e) => {
            for (let i = 0; i < e.changedTouches.length; i++) {
                const t = e.changedTouches[i];
                if (t.identifier === joyId) { joyId = null; vMove = { x: 0, y: 0 }; document.getElementById('joystick-knob').style.transform = 'translate(0px, 0px)'; document.getElementById('joystick-zone').style.left = '40px'; document.getElementById('joystick-zone').style.bottom = '40px'; }
                if (t.identifier === lookId) lookId = null;
            }
        };
        window.addEventListener('touchend', endTouch); window.addEventListener('touchcancel', endTouch);

        const promptBtn = document.getElementById('door-prompt');
        function openDoor() { isDoorOpen = true; promptBtn.style.display = 'none'; roomLight.intensity = 0.5; }
        promptBtn.addEventListener('click', openDoor); promptBtn.addEventListener('touchstart', openDoor);

        const curtainBtn = document.getElementById('curtain-btn');
        function toggleCurtain() { isCurtainOpen = !isCurtainOpen; }
        curtainBtn.addEventListener('click', toggleCurtain); curtainBtn.addEventListener('touchstart', (e) => { e.preventDefault(); toggleCurtain(); });

        // --- QUẢN LÝ THOẠI & KÍCH HOẠT HỆ THỐNG ĐỒNG BỘ DỮ LIỆU GOOGLE SHEET ---
        const actionPrompt = document.getElementById('action-prompt');
        const dialogueBox = document.getElementById('dialogue-box');
        const dialogueText = document.getElementById('dialogue-text');
        const optionsContainer = document.getElementById('options-container');

        function hienThiHộpThoai(noiDung, cacPhuongAn = []) {
            isTalking = true;
            dialogueText.innerText = noiDung;
            optionsContainer.innerHTML = '';
            
            if (cacPhuongAn.length === 0) {
                const btn = document.createElement('div'); btn.className = 'option-btn'; btn.innerText = 'Đóng';
                btn.onclick = () => {
                    // Đồng bộ nút Đóng câu trả lời cuối
                    sendTrackingData(currentCowScale.toString(), noiDung, "Bấm kết thúc (Đóng)");
                    dongHộpThoai();
                };
                optionsContainer.appendChild(btn);
            } else {
                cacPhuongAn.forEach(pa => {
                    const btn = document.createElement('div'); btn.className = 'option-btn'; btn.innerText = pa.text;
                    btn.onclick = () => {
                        // Tự động đẩy sự lựa chọn nhánh của người chơi lên dữ liệu đám mây
                        sendTrackingData(currentCowScale.toString(), noiDung, pa.text);

                        if (pa.next) {
                            const nodeNhanh = heThongCauHoi[pa.next];
                            hienThiHộpThoai(nodeNhanh.title, nodeNhanh.options);
                        } else if (pa.textEnd) {
                            hienThiHộpThoai(pa.textEnd, []);
                        } else if (pa.action === 'reset_loop') {
                            hienThiHộpThoai(heThongCauHoi.cauHoiGoc.title, heThongCauHoi.cauHoiGoc.options);
                        } else if (pa.action === 'close_happy') {
                            hienThiHộpThoai('À, vậy chúc bạn 1 ngày vui vẻ.', []);
                        }
                    };
                    optionsContainer.appendChild(btn);
                });
            }
            dialogueBox.style.display = 'flex'; actionPrompt.style.display = 'none';
        }

        function dongHộpThoai() { dialogueBox.style.display = 'none'; isTalking = false; moveF = moveB = moveL = moveR = false; }

        actionPrompt.addEventListener('click', () => {
            const pPos = playerGroup.position;
            const distToCow = pPos.distanceTo(new THREE.Vector3(0, 1.8, -18));
            const distToStraw = pPos.distanceTo(new THREE.Vector3(4.5, 1.8, -22.5));

            if (distToStraw < 2.5 && !hasStraw && feedCount < 3) {
                hasStraw = true;
                sendTrackingData(currentCowScale.toString(), "Tương tác môi trường", "Nhặt rơm tươi từ đống cỏ");
                alert("Bạn đã nhặt một ít cỏ rơm tươi ngon! Hãy mang lại cho bò ăn.");
                return;
            }

            if (distToCow < 3.5) {
                if (feedCount < 3) {
                    if (hasStraw) {
                        feedCount++; hasStraw = false;
                        if (feedCount === 1) currentCowScale = 0.45;
                        else if (feedCount === 2) currentCowScale = 0.7;
                        else if (feedCount === 3) currentCowScale = 1.0;
                        cowGroup.scale.set(currentCowScale, currentCowScale, currentCowScale);

                        if (feedCount === 1) {
                            sendTrackingData(currentCowScale.toString(), "Cho ăn lần 1", "Yêu cầu: xin thêm cỏ rơm");
                            hienThiHộpThoai("Mình thấy vẫn còn đói, bạn cho mình thêm ít cỏ nữa được không ?");
                        } else if (feedCount === 2) {
                            sendTrackingData(currentCowScale.toString(), "Cho ăn lần 2", "Yêu cầu: vẫn hơi đói chút xíu");
                            hienThiHộpThoai("Cảm ơn nha, ngon lắm! Nhưng bụng mình vẫn còn hơi đói chút xíu...");
                        } else if (feedCount === 3) {
                            sendTrackingData(currentCowScale.toString(), "Cho ăn lần 3 (Kích hoạt khảo sát)", "Hệ thống hiển thị câu hỏi gốc");
                            hienThiHộpThoai(heThongCauHoi.cauHoiGoc.title, heThongCauHoi.cauHoiGoc.options);
                        }
                    } else {
                        sendTrackingData(currentCowScale.toString(), "Nói chuyện khi bò đói", "Bò đòi ăn cỏ rơm");
                        hienThiHộpThoai("Mình đói quá, mình muốn ăn cỏ");
                    }
                } else {
                    sendTrackingData(currentCowScale.toString(), "Yêu cầu khảo sát lại", "Hộp thoại reset vòng lặp khảo sát");
                    hienThiHộpThoai("Bạn muốn trả lời lại à, vậy mình sẽ hỏi lại", [
                        { text: "Đúng rồi", action: "reset_loop" },
                        { text: "Không, mình bấm nhầm", action: "close_happy" }
                    ]);
                }
            }
        });

        // --- VÒNG LẶP TIẾN TRÌNH ANIMATION CHÍNH ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate); const elapsedTime = clock.getElapsedTime(); 
            playerGroup.rotation.y = yaw; camera.rotation.x = pitch;

            if (!isTalking) {
                const cx = (moveL ? -1 : 0) + (moveR ? 1 : 0) + vMove.x, cz = (moveF ? -1 : 0) + (moveB ? 1 : 0) - vMove.y;
                let nextX = playerGroup.position.x, nextZ = playerGroup.position.z;
                if (cx !== 0 || cz !== 0) {
                    const dir = new THREE.Vector3(cx, 0, cz).normalize(); dir.applyQuaternion(playerGroup.quaternion);
                    nextX += dir.x * moveSpeed; nextZ += dir.z * moveSpeed;
                }

                const worldBound = 495;
                if (nextX < -worldBound) nextX = -worldBound; if (nextX > worldBound) nextX = worldBound;
                if (nextZ < -worldBound) nextZ = -worldBound; if (nextZ > worldBound) nextZ = worldBound;

                const wallThick = 0.6, rMinX = -6, rMaxX = 6, rMinZ = -6, rMaxZ = 6, doorGap = 1.35;
                if (playerGroup.position.z < rMaxZ && playerGroup.position.z > rMinZ) {
                    if (nextX < rMinX + wallThick && nextX > rMinX - wallThick) nextX = playerGroup.position.x;
                    if (nextX < rMaxX + wallThick && nextX > rMaxX - wallThick) nextX = playerGroup.position.x;
                }
                if (playerGroup.position.x < rMaxX && playerGroup.position.x > rMinX) {
                    if (nextZ < rMaxZ + wallThick && nextZ > rMaxZ - wallThick) nextZ = playerGroup.position.z;
                    if (nextZ < rMinZ + wallThick && nextZ > rMinZ - wallThick) { if (Math.abs(playerGroup.position.x) > doorGap || !isDoorOpen) nextZ = playerGroup.position.z; }
                }
                if (nextZ < -11.5 && nextZ > -24.5) { if (nextX < -5.6 || nextX > 5.6) nextX = playerGroup.position.x; }
                if (nextX < 5.6 && nextX > -5.6) { if (nextZ < -23.6) nextZ = playerGroup.position.z; if (nextZ > -12.4 && (Math.abs(playerGroup.position.x) > 1.5)) nextZ = playerGroup.position.z; }
                playerGroup.position.x = nextX; playerGroup.position.z = nextZ;
            }

            cloudsGroup.children.forEach(cloudCluster => { cloudCluster.position.x += 0.03; if (cloudCluster.position.x > 350) cloudCluster.position.x = -350; });

            const pPos = playerGroup.position; const distToCow = pPos.distanceTo(new THREE.Vector3(0, 1.8, -18)); const distToStraw = pPos.distanceTo(new THREE.Vector3(4.5, 1.8, -22.5));

            if (!isDoorOpen && pPos.z <= -4.2 && pPos.z >= -6.0 && Math.abs(pPos.x) < 1.4) { promptBtn.style.display = 'block'; } else { promptBtn.style.display = 'none'; }

            if (!isTalking) {
                if (distToCow < 3.5) { actionPrompt.style.display = 'block'; actionPrompt.innerText = (hasStraw && feedCount < 3) ? "Cho bò ăn cỏ rơm 🌾" : "Nói chuyện với bò 🐮"; }
                else if (distToStraw < 2.5 && !hasStraw && feedCount < 3) { actionPrompt.style.display = 'block'; actionPrompt.innerText = "Lấy cỏ rơm ôm tay 🌾"; }
                else { actionPrompt.style.display = 'none'; }
            }

            curtainTargetProg = isCurtainOpen ? 1 : 0; curtainProg = THREE.MathUtils.lerp(curtainProg, curtainTargetProg, 0.08);
            curtainLeft.scale.x = 1 - 0.7 * curtainProg; curtainLeft.position.x = -1.75 - 1.25 * curtainProg;
            curtainRight.scale.x = 1 - 0.7 * curtainProg; curtainRight.position.x = 1.75 + 1.25 * curtainProg;

            if (isDoorOpen) { doorRot = THREE.MathUtils.lerp(doorRot, -Math.PI / 1.7, 0.04); doorPivot.rotation.y = doorRot; }
            textPlanes.forEach((plane, index) => { plane.position.y = 5.5 + Math.sin(elapsedTime * 1.2 + index) * 0.15; });

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); });
        animate();
    </script>
