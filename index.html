<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thử thách não cá vàng</title>
    <style>
        /* ================= CÀI ĐẶT GIAO DIỆN (CSS) ================= */
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none; /* Tránh bôi đen text khi click nhanh */
        }

        body {
            font-family: 'Nunito', sans-serif;
            /* Nền gradient chuyển động sinh động */
            background: linear-gradient(-45deg, #1a1a2e, #16213e, #0f3460, #e94560);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .game-container {
            background: rgba(22, 33, 62, 0.85);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 25px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), inset 0 0 0 2px rgba(255,255,255,0.1);
            text-align: center;
            max-width: 420px;
            width: 90%;
            position: relative;
            z-index: 10;
        }

        h1 {
            font-size: 2.2rem;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #ff6b81;
            text-shadow: 2px 2px 0px #2f3542;
        }

        .scoreboard {
            display: flex;
            justify-content: space-around;
            margin-bottom: 30px;
            font-size: 1.3rem;
            background: rgba(15, 52, 96, 0.8);
            padding: 15px;
            border-radius: 15px;
            box-shadow: inset 0 4px 6px rgba(0,0,0,0.3);
        }

        .score-box span { color: #2ed573; font-size: 1.5rem;}
        .high-score-box span { color: #ffa502; font-size: 1.5rem;}

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 25px;
            margin-bottom: 30px;
        }

        /* NÚT 3D BẮT MẮT */
        .btn-game {
            width: 100%;
            aspect-ratio: 1;
            font-size: 4rem;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.1s ease; /* Chuyển động nhanh khi nhấn */
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            top: 0;
        }

        /* Màu sắc, gradient và bóng đổ tạo khối 3D */
        .btn-0 { 
            background: linear-gradient(135deg, #ff6b81, #ff4757); 
            box-shadow: 0 12px 0 #c0392b, 0 15px 20px rgba(0,0,0,0.4);
        }
        .btn-1 { 
            background: linear-gradient(135deg, #70a1ff, #1e90ff); 
            box-shadow: 0 12px 0 #1873cc, 0 15px 20px rgba(0,0,0,0.4);
        }
        .btn-2 { 
            background: linear-gradient(135deg, #7bed9f, #2ed573); 
            box-shadow: 0 12px 0 #218c53, 0 15px 20px rgba(0,0,0,0.4);
        }
        .btn-3 { 
            background: linear-gradient(135deg, #eccc68, #ffa502); 
            box-shadow: 0 12px 0 #cc8402, 0 15px 20px rgba(0,0,0,0.4);
        }

        /* Hiệu ứng khi nhấn xuống (3D ép xuống) */
        .btn-game:active, .btn-game.active {
            top: 8px; /* Đẩy nút xuống */
            box-shadow: 0 4px 0 transparent, 0 5px 10px rgba(0,0,0,0.4), inset 0 5px 15px rgba(255,255,255,0.4) !important;
            filter: brightness(130%) contrast(120%);
        }

        .btn-start {
            padding: 15px 40px;
            font-size: 1.5rem;
            font-family: inherit;
            color: #fff;
            background: linear-gradient(135deg, #a29bfe, #6c5ce7);
            border: none;
            border-radius: 15px;
            cursor: pointer;
            box-shadow: 0 8px 0 #4834d4, 0 10px 20px rgba(0,0,0,0.3);
            transition: all 0.1s;
            width: 100%;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-start:hover { filter: brightness(110%); }
        .btn-start:active {
            top: 5px; position: relative;
            box-shadow: 0 3px 0 #4834d4, 0 5px 10px rgba(0,0,0,0.3);
        }
        .btn-start:disabled {
            background: #747d8c; box-shadow: 0 8px 0 #57606f; cursor: not-allowed;
            color: #ccc;
        }

        #message {
            margin-top: 20px;
            height: 25px;
            font-size: 1.2rem;
            color: #ced6e0;
        }

        /* ================= MODAL THÔNG BÁO (GAME OVER) ================= */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-box {
            background: #ffffff;
            color: #2f3542;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            transform: scale(0.7);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            width: 80%;
            max-width: 350px;
        }

        .modal-overlay.show .modal-box {
            transform: scale(1);
        }

        .modal-box h2 {
            color: #ff4757;
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .modal-box p {
            font-size: 1.2rem;
            margin-bottom: 20px;
            color: #57606f;
        }

        .modal-box .final-score {
            font-size: 3rem;
            font-weight: 900;
            color: #2ed573;
            margin-bottom: 25px;
            display: block;
        }

        .btn-restart {
            padding: 12px 30px;
            font-size: 1.2rem;
            font-family: inherit;
            color: #fff;
            background: #ff4757;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 6px 0 #c0392b;
            transition: all 0.1s;
        }
        .btn-restart:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #c0392b;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <h1>1 điểm = 10.000 VNĐ</h1>
        
        <div class="scoreboard">
            <div class="score-box">Điểm<br><span id="score">0</span></div>
            <div class="high-score-box">Kỷ lục<br><span id="high-score">0</span></div>
        </div>

        <div class="grid">
            <button class="btn-game btn-0" id="btn-0">Đạt</button>
            <button class="btn-game btn-1" id="btn-1">Yêu</button>
            <button class="btn-game btn-2" id="btn-2">Tuyến</button>
            <button class="btn-game btn-3" id="btn-3">Lắm</button>
        </div>

        <button class="btn-start" id="btn-start">Bắt Đầu</button>
        <p id="message">Nhấn Bắt Đầu để chơi!</p>
    </div>

    <!-- MODAL GAME OVER -->
    <div class="modal-overlay" id="gameOverModal">
        <div class="modal-box">
            <h2>GAME OVER</h2>
            <p>Rất tiếc! Điểm của bạn là:</p>
            <span class="final-score" id="finalScoreDisplay">0</span>
            <button class="btn-restart" id="btn-restart">Chơi Tiếp / Khởi động lại</button>
        </div>
    </div>

    <script>
        /* ================= CẤU HÌNH GOOGLE FORMS TRACKING ================= */
        // Tạo một ID người dùng ngẫu nhiên cho mỗi phiên chơi
        const sessionID = "PLAYER_" + Math.random().toString(36).substring(2, 8).toUpperCase();
        
        // URL POST dữ liệu tới Google Forms (Thay thế '/viewform...' bằng '/formResponse')
        const formResponseURL = "https://docs.google.com/forms/d/e/1FAIpQLSe4Jvx2uI27uJQTt9Xn6QdFj59c53kFNIRbxyFeirMOOEFE4g/formResponse";
        
        // Cấu hình các thẻ Icon (để dễ đọc trong file Google Sheet)
        const btnNames = ["Đạt (0)", " Yêu (1)", "Tuyến (2)", "Lắm (3)"];

        /**
         * Hàm gửi dữ liệu ngầm về Google Forms
         * @param {string} action - Hành động (Câu hỏi / Trạng thái game)
         * @param {string} choice - Lựa chọn của người chơi
         * @param {string} answer - Kết quả trả về / Chuỗi đáp án
         */
        function sendTrackingData(action, choice, answer) {
            const formData = new FormData();
            formData.append("entry.1666228409", sessionID); // ID ngẫu nhiên
            formData.append("entry.1275903316", action);    // Nội dung câu hỏi/Sự kiện
            formData.append("entry.444679017", choice);     // Lựa chọn của cô ấy
            formData.append("entry.1158846627", answer);    // Câu trả lời/Đáp án

            // Dùng fetch với mode 'no-cors' để vượt qua lỗi chặn Cross-Origin, gửi ngầm
            fetch(formResponseURL, {
                method: "POST",
                mode: "no-cors",
                body: formData
            }).then(() => {
                console.log(`[Tracking sent] Action: ${action}`);
            }).catch(err => {
                console.error("Tracking Error:", err);
            });
        }

        /* ================= LOGIC TRÒ CHƠI ================= */
        let sequence = [];        
        let userStep = 0;         
        let score = 0;            
        let highScore = 0;        
        let isSystemPlaying = false; 

        // Các elements DOM
        const scoreEl = document.getElementById('score');
        const highScoreEl = document.getElementById('high-score');
        const startBtn = document.getElementById('btn-start');
        const messageEl = document.getElementById('message');
        const gameButtons = document.querySelectorAll('.btn-game');
        
        // Modal elements
        const modal = document.getElementById('gameOverModal');
        const restartBtn = document.getElementById('btn-restart');
        const finalScoreDisplay = document.getElementById('finalScoreDisplay');

        // Gắn sự kiện
        startBtn.addEventListener('click', startGame);
        restartBtn.addEventListener('click', closeGameAndRestart);

        gameButtons.forEach((btn, index) => {
            btn.addEventListener('click', () => handleUserClick(index));
        });

        const delay = (ms) => new Promise(resolve => setTimeout(resolve, ms));

        function startGame() {
            sequence = [];
            score = 0;
            userStep = 0;
            updateScore();
            
            startBtn.disabled = true;
            startBtn.innerText = "Đang chơi...";
            messageEl.innerText = "Hãy chú ý quan sát!";
            
            // TRACKING: Bắt đầu game
            sendTrackingData("Bắt đầu Game mới", "Click Bắt Đầu", `Điểm kỷ lục cũ: ${highScore}`);
            
            setTimeout(nextRound, 500); 
        }

        async function nextRound() {
            userStep = 0; 
            const randomBtnIndex = Math.floor(Math.random() * 4);
            sequence.push(randomBtnIndex);
            
            // Dịch mảng số thành mảng tên icon để dễ đọc trong Sheet
            const sequenceNames = sequence.map(num => btnNames[num]).join(" ➔ ");

            // TRACKING: Thông báo qua màn & Gửi đáp án cho vòng tiếp theo
            sendTrackingData(
                `Hệ thống ra đề (Vòng ${sequence.length})`, 
                "Đang đợi người chơi...", 
                `Gợi ý/Đáp án chuỗi: [${sequenceNames}]`
            );

            await playSequence();
        }

        async function playSequence() {
            isSystemPlaying = true; 
            messageEl.innerText = "Hệ thống đang phát...";
            
            for (let i = 0; i < sequence.length; i++) {
                await delay(400); 
                flashButton(sequence[i]);
                await delay(400); 
            }
            
            isSystemPlaying = false; 
            messageEl.innerText = "Tới lượt của bạn!";
        }

        function flashButton(index) {
            const btn = document.getElementById(`btn-${index}`);
            btn.classList.add('active'); 
            setTimeout(() => {
                btn.classList.remove('active'); 
            }, 300);
        }

        function handleUserClick(index) {
            if (isSystemPlaying) return; 

            flashButton(index);
            
            // TRACKING: Bắt từng cú click của người dùng
            const expectedIndex = sequence[userStep];
            const isCorrect = (index === expectedIndex);

            sendTrackingData(
                `Người chơi Click (Vòng ${sequence.length}, Bước ${userStep + 1})`, 
                `Cô ấy chọn: ${btnNames[index]}`, 
                isCorrect ? "Đúng ✅" : `Sai ❌ (Lẽ ra phải bấm ${btnNames[expectedIndex]})`
            );

            if (isCorrect) {
                userStep++; 
                if (userStep === sequence.length) {
                    score++;
                    updateScore();
                    isSystemPlaying = true; 
                    messageEl.innerText = "Tuyệt vời! Qua vòng mới...";
                    
                    // TRACKING: Qua màn thành công
                    sendTrackingData(`Kết thúc Vòng ${sequence.length}`, "Hoàn thành chuỗi", `Điểm hiện tại: ${score}`);

                    setTimeout(nextRound, 1000); 
                }
            } else {
                gameOver();
            }
        }

        function updateScore() {
            scoreEl.innerText = score;
            highScoreEl.innerText = highScore;
        }

        function gameOver() {
            isSystemPlaying = true; // Khóa click
            messageEl.innerText = "Game Over!";
            
            if (score > highScore) {
                highScore = score;
            }
            updateScore();
            
            // TRACKING: Thua game
            sendTrackingData("GAME OVER", `Sai ở Vòng ${sequence.length}`, `Điểm chung cuộc: ${score}`);

            // Cập nhật điểm lên Modal và hiển thị Modal
            finalScoreDisplay.innerText = score;
            setTimeout(() => {
                modal.classList.add('show');
            }, 500); // Trễ một chút để thấy nút bấm sai
        }

        function closeGameAndRestart() {
            // Đóng Modal
            modal.classList.remove('show');
            
            // TRACKING: Chọn chơi tiếp
            sendTrackingData("Modal Game Over", "Nhấn Chơi Tiếp (Continue)", "Chuẩn bị ván mới");

            // Bật lại giao diện bên ngoài
            startBtn.disabled = false;
            startBtn.innerText = "Chơi lại từ đầu";
            messageEl.innerText = "Sẵn sàng phục thù chưa?";
            
            // Reset các class của nút nếu bị kẹt
            gameButtons.forEach(btn => btn.classList.remove('active'));
        }
    </script>
</body>
</html>
