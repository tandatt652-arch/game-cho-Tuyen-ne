<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đếm cù 🐑</title>
    <style>
        /* =========================================
           CSS BIẾN & CÀI ĐẶT CƠ BẢN
        ========================================= */
        :root {
            --sky-top: #0a1428;
            --sky-bottom: #1e3a5f;
            --moon-color: #fffac2;
            --moon-glow: rgba(255, 250, 194, 0.4);
            --grass-top: #24573b;
            --grass-bottom: #163624;
            --text-light: #f4f6f8;
            --accent-color: #ffd166;
            --wood-dark: #3e2723;
            --wood-light: #5d4037;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Quicksand', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--sky-top);
            color: var(--text-light);
        }

        /* =========================================
           SCENE BỐ CỤC CHÍNH
        ========================================= */
        #scene {
            position: relative;
            width: 100%;
            height: 100%;
            transition: filter 2s ease-in-out;
        }

        /* Bầu trời */
        .sky {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 65%;
            background: linear-gradient(to bottom, var(--sky-top), var(--sky-bottom));
            z-index: 1;
        }

        /* Mặt trăng */
        .moon {
            position: absolute;
            top: 15%;
            right: 15%;
            width: 100px;
            height: 100px;
            background: var(--moon-color);
            border-radius: 50%;
            box-shadow: 0 0 50px 15px var(--moon-glow);
            z-index: 2;
            transition: box-shadow 3s ease, background 3s ease;
        }

        .moon.glow {
            box-shadow: 0 0 100px 30px rgba(255, 255, 255, 0.8);
            background: #ffffff;
        }

        /* Ngôi sao */
        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            z-index: 1;
            animation: twinkle alternate infinite;
        }

        .star.bright {
            animation: twinkle-bright alternate infinite;
            box-shadow: 0 0 8px 2px rgba(255, 255, 255, 0.6);
        }

        /* Mây */
        .cloud {
            position: absolute;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50px;
            z-index: 1;
            animation: drift linear infinite;
        }
        .cloud::before, .cloud::after {
            content: '';
            position: absolute;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
        }

        /* Đồi núi xa xa */
        .hills {
            position: absolute;
            bottom: 35%;
            width: 100%;
            height: 15%;
            z-index: 2;
        }
        .hill {
            position: absolute;
            bottom: -20px;
            border-radius: 50%;
        }
        
        /* Chiều sâu đồi núi */
        .hill:nth-child(1) { background: #122a1d; z-index: 1; }
        .hill:nth-child(2) { background: #1c4530; z-index: 2; }
        .hill:nth-child(3) { background: #173624; z-index: 1; }

        /* =========================================
           CÁC LỚP CẢNH VẬT
        ========================================= */
        .meadow-bg {
            position: absolute;
            bottom: 12%; 
            left: 0;
            width: 100%;
            height: 25%;
            background: linear-gradient(to bottom, #1a3d2a, var(--grass-top));
            z-index: 3;
            overflow: visible;
        }

        .fence-iso-back {
            position: absolute;
            bottom: 12%; 
            left: 50%;
            width: 0; 
            height: 0;
            z-index: 3;
            overflow: visible;
        }

        #sheep-layer {
            position: absolute;
            bottom: 12%; 
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 4;
            pointer-events: none;
        }

        .fence-iso-front {
            position: absolute;
            bottom: 12%; 
            left: 50%;
            width: 0; 
            height: 0;
            z-index: 5;
            overflow: visible;
        }

        .meadow-fg {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 12%;
            background: linear-gradient(to bottom, var(--grass-top), var(--grass-bottom));
            z-index: 6;
            border-top: 2px solid #24573b; 
        }

        .firefly {
            position: absolute;
            width: 4px;
            height: 4px;
            background: #cdffa6;
            border-radius: 50%;
            box-shadow: 0 0 10px 2px #a3ff52;
            animation: float 4s ease-in-out infinite alternate;
        }

        /* =========================================
           THIẾT KẾ HÀNG RÀO ISOMETRIC
        ========================================= */
        .iso-post {
            position: absolute;
            background: var(--wood-dark);
            border-right: 3px solid var(--wood-light);
            border-radius: 4px 4px 0 0;
            box-shadow: -2px 0 5px rgba(0,0,0,0.3);
        }
        
        .p1 { left: -10px; bottom: -20px; width: 22px; height: 130px; }
        .p2 { left: 25px; bottom: 15px; width: 16px; height: 90px; }
        .p3 { left: 55px; bottom: 45px; width: 12px; height: 60px; border-right: 2px solid var(--wood-light); }
        .p4 { left: 80px; bottom: 70px; width: 9px;  height: 40px; border-right: 2px solid var(--wood-light); }

        .iso-rail {
            position: absolute;
            background: var(--wood-dark);
            border-top: 2px solid var(--wood-light);
            border-bottom: 3px solid #2a1a17;
            transform-origin: left bottom;
            box-shadow: 0 5px 5px rgba(0,0,0,0.2);
        }
        
        .r-top-front { left: -5px; bottom: 50px; width: 36px; height: 10px; transform: rotate(-25deg); }
        .r-bottom-front { left: -5px; bottom: -5px; width: 46px; height: 12px; transform: rotate(-45deg); }

        .r-top-back { left: 25px; bottom: 64px; width: 75px; height: 10px; transform: rotate(-25deg); }
        .r-bottom-back { left: 25px; bottom: 25px; width: 85px; height: 12px; transform: rotate(-45deg); }


        /* =========================================
           CỪU & CHUYỂN ĐỘNG
        ========================================= */
        .sheep-wrapper {
            position: absolute;
            bottom: 0px; 
            left: -150px;
            width: 120px;
            height: 120px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
        }

        .sheep-inner {
            position: relative;
            width: 100%;
            text-align: center;
            transform-origin: center bottom;
            margin-bottom: 5px; 
            z-index: 2; 
        }

        .sheep-shadow {
            position: absolute;
            bottom: 0; 
            width: 60px;
            height: 10px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 50%;
        }

        .default-sheep svg {
            width: 90px;
            height: 90px;
            filter: drop-shadow(0 5px 5px rgba(0,0,0,0.2));
            animation: walk-bounce 0.4s infinite alternate;
        }

        .custom-sheep-img {
            width: 80px;
            height: 80px;
            object-fit: contain;
            filter: drop-shadow(0 5px 5px rgba(0,0,0,0.3));
            animation: walk-bounce 0.4s infinite alternate;
        }

        .sheep-sleeping svg, .sheep-sleeping img {
            animation: none;
            transform: translateY(20px) rotate(-10deg);
            opacity: 0;
            transition: opacity 2s ease;
        }

        /* =========================================
           GIAO DIỆN NGƯỜI DÙNG (UI)
        ========================================= */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 20;
            pointer-events: none;
        }

        /* Menu Start Nằm Giữa Màn Hình */
        .controls {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            background: rgba(0, 0, 0, 0.6);
            padding: 40px 50px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            pointer-events: auto;
            z-index: 50;
            box-shadow: 0 15px 40px rgba(0,0,0,0.5);
            text-align: center;
        }

        .btn {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #fff;
            padding: 12px 25px;
            border-radius: 30px;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.3s;
            text-shadow: 0 1px 2px rgba(0,0,0,0.3);
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            font-weight: 600;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 15px rgba(0,0,0,0.3);
        }

        #file-input { display: none; }

        .counter-board {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.3);
            padding: 15px 25px;
            border-radius: 15px;
            backdrop-filter: blur(5px);
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .counter-title {
            font-size: 14px;
            color: #b0c4de;
            margin-bottom: 5px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .counter-number {
            font-size: 32px;
            font-weight: bold;
            color: var(--accent-color);
            text-shadow: 0 0 10px rgba(255, 209, 102, 0.5);
        }

        .counter-emojis {
            font-size: 20px;
            margin-top: 5px;
            min-height: 30px;
        }

        #message-box {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            background: #fff;
            color: #333;
            width: 90%;
            max-width: 400px;
            padding: 40px 30px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 100;
            pointer-events: auto;
            opacity: 0;
        }

        #message-box.show {
            transform: translate(-50%, -50%) scale(1);
            opacity: 1;
        }

        .message-text {
            font-size: 20px;
            line-height: 1.6;
            margin-bottom: 30px;
            font-weight: 500;
            color: #2c3e50;
        }

        .message-text span {
            display: block;
            margin-bottom: 10px;
        }

        .heart {
            color: #e74c3c;
            animation: heartbeat 1.5s infinite;
            display: inline-block;
        }

        #good-night-text {
            position: absolute;
            top: 30%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 60px;
            font-family: 'Georgia', serif;
            font-style: italic;
            color: #e0f7fa;
            text-shadow: 0 0 20px rgba(224, 247, 250, 0.8), 0 0 40px rgba(129, 212, 250, 0.5);
            opacity: 0;
            z-index: 90;
            transition: opacity 3s ease;
            pointer-events: none;
            white-space: nowrap;
        }

        #good-night-text.show { opacity: 1; }

        /* =========================================
           ANIMATIONS
        ========================================= */
        @keyframes twinkle { 0% { opacity: 0.2; } 100% { opacity: 0.8; } }
        @keyframes twinkle-bright { 0% { opacity: 0.5; transform: scale(0.8); } 100% { opacity: 1; transform: scale(1.3); } }
        @keyframes drift { from { transform: translateX(-150px); } to { transform: translateX(100vw); } }
        @keyframes float { 0% { transform: translateY(0) translateX(0); opacity: 0.5; } 50% { opacity: 1; } 100% { transform: translateY(-20px) translateX(20px); opacity: 0.5; } }
        @keyframes walk-bounce { from { transform: translateY(0); } to { transform: translateY(-5px); } }
        @keyframes heartbeat { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.2); } }
        .scene-blur { filter: blur(4px) brightness(0.8); }

    </style>
</head>
<body>

    <!-- CẢNH VẬT NỀN -->
    <div id="scene">
        <!-- Bầu trời -->
        <div class="sky" id="sky">
            <div class="moon" id="moon"></div>
        </div>

        <!-- Cảnh đồi núi -->
        <div class="hills" id="hills"></div>

        <!-- LỚP 1: Cánh đồng HẬU CẢNH -->
        <div class="meadow-bg" id="meadow-bg"></div>

        <!-- LỚP 2: HÀNG RÀO ISOMETRIC (Nửa xa - Nằm sau cừu) -->
        <div class="fence-iso-back">
            <div class="iso-post p2"></div>
            <div class="iso-post p3"></div>
            <div class="iso-post p4"></div>
            <div class="iso-rail r-top-back"></div>
            <div class="iso-rail r-bottom-back"></div>
        </div>

        <!-- LỚP 3: LAYER CHỨA CỪU -->
        <div id="sheep-layer"></div>

        <!-- LỚP 4: HÀNG RÀO ISOMETRIC (Nửa gần - Nằm trước che cừu) -->
        <div class="fence-iso-front">
            <div class="iso-post p1"></div>
            <div class="iso-rail r-top-front"></div>
            <div class="iso-rail r-bottom-front"></div>
        </div>

        <!-- LỚP 5: Cánh đồng TIỀN CẢNH -->
        <div class="meadow-fg" id="meadow-fg"></div>
    </div>

    <!-- GIAO DIỆN NGƯỜI DÙNG -->
    <div id="ui-layer">
        <!-- Bảng đếm -->
        <div class="counter-board">
            <div class="counter-title">Đếm cừu</div>
            <div class="counter-number" id="counter-num">0</div>
            <div class="counter-emojis" id="counter-emojis"></div>
        </div>

        <!-- Màn hình chờ bắt đầu (Start Menu) -->
        <div class="controls" id="controls">
            <div style="font-size: 24px; font-weight: bold; margin-bottom: 25px; text-shadow: 0 2px 5px rgba(0,0,0,0.5);">Bé muốn dùng cừu nào? 🌙</div>
            <div style="display: flex; gap: 15px; flex-wrap: wrap; justify-content: center;">
                <label for="file-input" class="btn" style="background: #e74c3c; border-color: #c0392b;">Chọn ảnh của em ❤️</label>
                <input type="file" id="file-input" accept="image/*">
                <button class="btn" id="default-btn" style="background: #3498db; border-color: #2980b9;">Dùng cừu bình thường🐑</button>
            </div>
        </div>

        <!-- Lời nhắn kết thúc -->
        <div id="message-box">
            <div class="message-text">
                <span>Đếm tới đây là ngủ được rồi. 🌙</span>
                <span>Không được lén coi tiktok nữa 😼</span>
                <span>Khuye rồi ngủ sớm đi nhaa <span class="heart">❤️</span></span>
            </div>
            <button class="btn" id="replay-btn" style="background: #3498db; color: #fff; border: none; padding: 12px 25px; font-size: 16px;">
                Đếm lại, chưa buồn ngủ!
            </button>
        </div>

        <!-- Text Good Night -->
        <div id="good-night-text">Good Night 💙</div>
    </div>

    <script>
        /* =========================================
           CẤU HÌNH & TRẠNG THÁI (STATE)
        ========================================= */
        const TARGET_COUNT = 5000;
        const SPAWN_INTERVAL_MS = 1400; // 1.4 giây sinh 1 con
        const RUN_DURATION_MS = 6000;   // 6 giây để cừu chạy qua màn hình
        const JUMP_DURATION_MS = 900;   // 0.9 giây nhảy

        let currentCount = 0;       // Số cừu đã nhảy qua (hiển thị lên màn hình)
        let spawnedCount = 0;       // Số cừu đã được sinh ra
        let isCounting = false;
        let spawnTimer = null;
        let customSheepSrc = null;

        /* =========================================
           QUẢN LÝ DOM ELEMENTS
        ========================================= */
        const sheepLayer = document.getElementById('sheep-layer');
        const countNumEl = document.getElementById('counter-num');
        const countEmojiEl = document.getElementById('counter-emojis');
        const fileInput = document.getElementById('file-input');
        const defaultBtn = document.getElementById('default-btn');
        const messageBox = document.getElementById('message-box');
        const replayBtn = document.getElementById('replay-btn');
        const scene = document.getElementById('scene');
        const moon = document.getElementById('moon');
        const goodNightText = document.getElementById('good-night-text');
        const controls = document.getElementById('controls');

        /* =========================================
           TẠO CẢNH VẬT (Bầu trời, Sao, Đom đóm)
        ========================================= */
        function initEnvironment() {
            const sky = document.getElementById('sky');
            const meadowBg = document.getElementById('meadow-bg');
            const meadowFg = document.getElementById('meadow-fg');
            const hills = document.getElementById('hills');

            for (let i = 0; i < 80; i++) {
                let star = document.createElement('div');
                star.className = Math.random() > 0.8 ? 'star bright' : 'star';
                star.style.width = Math.random() * 3 + 'px';
                star.style.height = star.style.width;
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.animationDuration = (Math.random() * 3 + 2) + 's';
                star.style.animationDelay = (Math.random() * 2) + 's';
                sky.appendChild(star);
            }

            for(let i = 0; i < 4; i++) {
                let cloud = document.createElement('div');
                cloud.className = 'cloud';
                cloud.style.width = (Math.random() * 100 + 100) + 'px';
                cloud.style.height = '40px';
                cloud.style.top = (Math.random() * 30 + 5) + '%';
                cloud.style.left = '-' + (Math.random() * 200 + 150) + 'px';
                cloud.style.animationDuration = (Math.random() * 30 + 40) + 's';
                cloud.style.animationDelay = (Math.random() * -40) + 's';
                sky.appendChild(cloud);
            }

            for(let i=0; i<3; i++) {
                let hill = document.createElement('div');
                hill.className = 'hill';
                hill.style.width = (Math.random() * 300 + 400) + 'px';
                hill.style.height = '150px';
                hill.style.left = (i * 35 - 10) + '%';
                hills.appendChild(hill);
            }

            for (let i = 0; i < 15; i++) {
                let firefly = document.createElement('div');
                firefly.className = 'firefly';
                firefly.style.left = Math.random() * 100 + '%';
                firefly.style.bottom = Math.random() * 80 + '%';
                firefly.style.animationDuration = (Math.random() * 3 + 3) + 's';
                firefly.style.animationDelay = (Math.random() * 2) + 's';
                if (Math.random() > 0.5) meadowBg.appendChild(firefly);
                else meadowFg.appendChild(firefly);
            }
        }

        /* =========================================
           HÌNH ẢNH CỪU (Mặc định bằng SVG)
        ========================================= */
        const DEFAULT_SHEEP_SVG = `
            <svg viewBox="0 0 120 100" xmlns="http://www.w3.org/2000/svg">
                <rect x="35" y="70" width="8" height="20" rx="4" fill="#333" />
                <rect x="55" y="75" width="8" height="15" rx="4" fill="#333" />
                <rect x="75" y="70" width="8" height="20" rx="4" fill="#333" />
                <path d="M 25 55 C 25 35, 45 25, 60 25 C 80 25, 95 35, 95 55 C 105 55, 110 70, 100 80 C 95 85, 30 85, 20 80 C 10 70, 15 55, 25 55 Z" fill="#ffffff" />
                <circle cx="45" cy="35" r="15" fill="#ffffff" />
                <circle cx="70" cy="35" r="18" fill="#ffffff" />
                <circle cx="85" cy="45" r="15" fill="#ffffff" />
                <circle cx="35" cy="45" r="15" fill="#ffffff" />
                <ellipse cx="95" cy="50" rx="15" ry="12" fill="#333" transform="rotate(-15 95 50)" />
                <ellipse cx="102" cy="45" rx="8" ry="15" fill="#333" transform="rotate(30 102 45)" /> 
                <path d="M 98 48 Q 102 52 106 48" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/>
            </svg>
        `;

        /* =========================================
           LOGIC ĐẾM & HOẠT ẢNH CỪU
        ========================================= */
        function startCounting() {
            if (isCounting) return;
            isCounting = true;
            
            currentCount = 0;
            spawnedCount = 0;
            updateCounterUI();
            
            sheepLayer.innerHTML = '';
            scene.classList.remove('scene-blur');
            moon.classList.remove('glow');
            goodNightText.classList.remove('show');
            messageBox.classList.remove('show');
            controls.style.display = 'none'; // Ẩn menu đi khi bắt đầu chạy

            spawnTimer = setInterval(() => {
                if (spawnedCount < TARGET_COUNT) {
                    spawnedCount++;
                    spawnSheep(spawnedCount);
                } else {
                    clearInterval(spawnTimer);
                }
            }, SPAWN_INTERVAL_MS);
        }

        function spawnSheep(number) {
            const wrapper = document.createElement('div');
            wrapper.className = 'sheep-wrapper';

            const inner = document.createElement('div');
            inner.className = 'sheep-inner';

            if (customSheepSrc) {
                const img = document.createElement('img');
                img.src = customSheepSrc;
                img.className = 'custom-sheep-img';
                inner.appendChild(img);
            } else {
                const def = document.createElement('div');
                def.className = 'default-sheep';
                def.innerHTML = DEFAULT_SHEEP_SVG;
                inner.appendChild(def);
            }

            const shadow = document.createElement('div');
            shadow.className = 'sheep-shadow';

            wrapper.appendChild(inner);
            wrapper.appendChild(shadow);
            sheepLayer.appendChild(wrapper);
            
            const screenWidth = window.innerWidth;
            const distance = screenWidth + 300; 
            
            const runAnim = wrapper.animate([
                { transform: `translateX(0px)` },
                { transform: `translateX(${distance}px)` }
            ], {
                duration: RUN_DURATION_MS,
                easing: 'linear',
                fill: 'forwards'
            });

            const speed = distance / RUN_DURATION_MS;
            const timeToCenter = (150 + screenWidth / 2) / speed;
            const jumpStartTime = timeToCenter - (JUMP_DURATION_MS / 2);

            setTimeout(() => {
                inner.animate([
                    { transform: 'translateY(0) rotate(0deg)', easing: 'ease-out' },
                    { transform: 'translateY(-160px) rotate(-15deg)', offset: 0.5, easing: 'ease-in' },
                    { transform: 'translateY(0) rotate(5deg)', offset: 0.95 },
                    { transform: 'translateY(0) rotate(0deg)' }
                ], {
                    duration: JUMP_DURATION_MS,
                    fill: 'forwards'
                });

                shadow.animate([
                    { transform: 'scale(1)', opacity: 0.5, easing: 'ease-out' },
                    { transform: 'scale(0.3)', opacity: 0.1, offset: 0.5, easing: 'ease-in' },
                    { transform: 'scale(1)', opacity: 0.6, offset: 0.95 },
                    { transform: 'scale(1)', opacity: 0.4 }
                ], {
                    duration: JUMP_DURATION_MS,
                    fill: 'forwards'
                });
            }, jumpStartTime);

            setTimeout(() => {
                currentCount++;
                updateCounterUI();
            }, timeToCenter);

            runAnim.onfinish = () => {
                if (number !== TARGET_COUNT) {
                    wrapper.remove();
                } else {
                    wrapper.style.transform = `translateX(${150 + screenWidth/2 + 100}px)`; 
                    inner.classList.add('sheep-sleeping');
                    shadow.style.opacity = 0;
                    
                    isCounting = false;
                    setTimeout(showEndingScreen, 500);
                }
            };
        }

        function updateCounterUI() {
            countNumEl.innerText = currentCount;
            let emojis = '🐑'.repeat(Math.min(currentCount, 5));
            if (currentCount > 5) emojis += ' +';
            countEmojiEl.innerText = emojis;
        }

        function showEndingScreen() {
            scene.classList.add('scene-blur');
            moon.classList.add('glow');
            messageBox.classList.add('show');
            goodNightText.classList.add('show');
            
            const lastSheepInner = document.querySelector('.sheep-sleeping svg, .sheep-sleeping img');
            if(lastSheepInner) lastSheepInner.style.opacity = 1;
        }

        /* =========================================
           XỬ LÝ SỰ KIỆN GIAO DIỆN TỪ NGƯỜI DÙNG
        ========================================= */

        // 1. Khi người dùng bấm nút Dùng cừu mặc định
        defaultBtn.addEventListener('click', () => {
            customSheepSrc = null;
            startCounting();
        });

        // 2. Khi người dùng chọn ảnh của riêng mình
        fileInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(evt) {
                    customSheepSrc = evt.target.result;
                    startCounting();
                }
                reader.readAsDataURL(file);
            }
        });

        // 3. Khi bấm nút Replay ở màn hình kết thúc (sẽ quay lại Start Menu)
        replayBtn.addEventListener('click', () => {
            // Dọn dẹp cảnh cũ
            messageBox.classList.remove('show');
            scene.classList.remove('scene-blur');
            moon.classList.remove('glow');
            goodNightText.classList.remove('show');
            
            currentCount = 0;
            spawnedCount = 0;
            updateCounterUI();
            sheepLayer.innerHTML = '';
            
            // Xóa file đã chọn trước đó để bắt sự kiện change nếu chọn lại đúng file đó
            fileInput.value = ""; 
            
            // Hiện lại menu chọn cừu
            controls.style.display = 'flex'; 
        });

        /* =========================================
           KHỞI CHẠY LẦN ĐẦU
        ========================================= */
        window.onload = () => {
            initEnvironment();
            // Trang web sẽ nằm yên chờ cho đến khi bấm nút chọn ảnh hoặc chọn mặc định
        };

    </script>
</body>
</html>
