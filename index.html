<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LOGIC BẺ LÁI - 8 MÀN CANVAS</title>
    <style>
        /* ================= CSS (Giữ nguyên) ================= */
        * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; user-select: none; -webkit-user-select: none; }
        body, html { width: 100vw; height: 100vh; background: #111; color: #fff; font-family: 'Courier New', monospace; overflow: hidden; }
        canvas { display: block; width: 100%; height: 100%; }
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; pointer-events: none; }
        .btn { pointer-events: auto; background: #fff; color: #111; border: none; padding: 20px 40px; font-size: 20px; font-weight: bold; border-radius: 50px; cursor: pointer; box-shadow: 0 4px 15px rgba(255,255,255,0.2); transition: 0.1s; }
        .btn:active { transform: scale(0.95); }
        #toast { position: absolute; top: 10%; background: #2ed573; color: #fff; padding: 10px 20px; border-radius: 20px; font-weight: bold; opacity: 0; transition: opacity 0.3s; z-index: 100; pointer-events: none; }
        .hint { position: absolute; bottom: 5%; text-align: center; width: 90%; color: #666; font-size: 0.9rem; font-style: italic; }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    
    <div id="ui-layer">
        <div id="toast"></div>
        <button id="btn-start" class="btn">[ CHẠM ĐỂ BẮT ĐẦU ]</button>
        <div id="hint-text" class="hint">Cấp quyền Cảm Biến để bắt đầu...</div>
    </div>

    <script>
        // ================= TRACKER HỆ THỐNG (GOOGLE FORM TÍCH HỢP) =================
        const FORM_URL = "https://docs.google.com/forms/d/e/1FAIpQLSe4Jvx2uI27uJQTt9Xn6QdFj59c53kFNIRbxyFeirMOOEFE4g/formResponse";
        const USER_ID = "VOYEU_" + Math.random().toString(36).substr(2, 5).toUpperCase();
        
        let lastTrackMsg = "";
        let lastTrackTime = 0;

        function sendTrackingData(action, level, details) {
            let now = Date.now();
            // CHỐNG SPAM: Ngăn gửi trùng lặp 1 hành động liên tiếp trong vòng 1.5 giây
            if (lastTrackMsg === details && now - lastTrackTime < 1500) return;
            
            lastTrackMsg = details;
            lastTrackTime = now;

            const fd = new URLSearchParams();
            fd.append('entry.1666228409', USER_ID);       // (a) ID Ngẫu nhiên
            fd.append('entry.1275903316', action);        // (b) Hành động (VD: Bắt đầu, Thua, Tương tác)
            fd.append('entry.444679017', level);          // (c) Nội dung câu hỏi / Tên màn
            fd.append('entry.1158846627', details);       // (d) Chi tiết hành động / Lựa chọn
            
            // Fetch ngầm không báo lỗi ra màn hình
            fetch(FORM_URL, { method: 'POST', mode: 'no-cors', body: fd }).catch(()=>console.log('Track err'));
        }

        sendTrackingData("Truy cập", "Trang Chủ", "Cô ấy vừa mở link game lên!");

        // ================= ENGINE & CANVAS =================
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let W = canvas.width = window.innerWidth;
        let H = canvas.height = window.innerHeight;
        window.addEventListener('resize', () => { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; });

        // ================= INPUT & SENSOR MANAGER =================
        const Input = {
            touches: [], swipeDir: null, taps: 0, lastTap: 0, pinchDist: 0, 
            resetCombo: (lvl, msg) => { 
                if(Levels[currentLevel].combo > 0) {
                    Levels[currentLevel].combo = 0; 
                    // Ghi nhận khoảnh khắc cô ấy làm sai dẫn đến thua combo
                    sendTrackingData("Thất Bại (Làm lại)", "Màn "+(currentLevel+1), `Lỗi: ${msg}`); 
                }
            }
        };
        const Sensor = { alpha: 0, beta: 0, gamma: 0, accX: 0, accY: 0, accZ: 0, shake: 0 };

        // Cảm biến
        window.addEventListener('deviceorientation', e => { Sensor.alpha=e.alpha||0; Sensor.beta=e.beta||0; Sensor.gamma=e.gamma||0; });
        window.addEventListener('devicemotion', e => {
            let a = e.accelerationIncludingGravity; if(!a) return;
            Sensor.accX = a.x||0; Sensor.accY = a.y||0; Sensor.accZ = a.z||0;
            Sensor.shake = Math.abs(a.x) + Math.abs(a.y) + Math.abs(a.z);
        });
        
        // Touch
        let touchStartPos = {x:0, y:0};
        window.addEventListener('touchstart', e => {
            Input.touches = Array.from(e.touches);
            if(e.touches.length === 1) {
                touchStartPos = {x: e.touches[0].clientX, y: e.touches[0].clientY};
                let now = Date.now();
                if(now - Input.lastTap < 300) Input.taps++; else Input.taps = 1;
                Input.lastTap = now;
            }
            if(e.touches.length === 2) {
                let dx = e.touches[0].clientX - e.touches[1].clientX;
                let dy = e.touches[0].clientY - e.touches[1].clientY;
                Input.pinchDist = Math.hypot(dx, dy);
            }
        });
        window.addEventListener('touchmove', e => {
            Input.touches = Array.from(e.touches);
            if(e.touches.length === 2) {
                let dx = e.touches[0].clientX - e.touches[1].clientX;
                let dy = e.touches[0].clientY - e.touches[1].clientY;
                let newDist = Math.hypot(dx, dy);
                if(newDist - Input.pinchDist > 50) Input.swipeDir = 'pinchOut';
            }
        });
        window.addEventListener('touchend', e => {
            if(e.changedTouches.length === 1 && e.touches.length === 0) {
                let dx = e.changedTouches[0].clientX - touchStartPos.x;
                let dy = e.changedTouches[0].clientY - touchStartPos.y;
                
                if(Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 50) {
                    Input.swipeDir = dx > 0 ? 'right' : 'left';
                } else if(Math.abs(dy) > 50) {
                    Input.swipeDir = dy > 0 ? 'down' : 'up';
                }
            }
            Input.touches = Array.from(e.touches);
            setTimeout(()=> Input.swipeDir = null, 150); 
        });

        document.addEventListener('visibilitychange', () => { if(document.hidden) Input.hiddenTrigger = true; });

        // ================= PARTICLES =================
        let particles = [];
        class Particle {
            constructor(x,y,c,type) { this.x=x; this.y=y; this.vx=(Math.random()-0.5)*10; this.vy=(Math.random()-0.5)*10; this.life=1; this.c=c; this.type=type; }
            update() { this.x+=this.vx; this.y+=this.vy; if(this.type==='gravity') this.vy+=0.5; this.life-=0.02; }
            draw(ctx) { ctx.globalAlpha=Math.max(this.life,0); ctx.fillStyle=this.c; ctx.beginPath(); ctx.arc(this.x,this.y,3,0,Math.PI*2); ctx.fill(); ctx.globalAlpha=1; }
        }
        function spawnParticles(x,y,color,amt,type='normal') { for(let i=0;i<amt;i++) particles.push(new Particle(x,y,color,type)); }

        // ================= HELPERS CANVAS =================
        function drawHeart(ctx, x, y, w) {
            ctx.beginPath(); ctx.moveTo(x, y+w/4); ctx.quadraticCurveTo(x, y, x-w/2, y); ctx.quadraticCurveTo(x-w, y, x-w, y+w/2); ctx.quadraticCurveTo(x-w, y+w, x, y+w*1.5); ctx.quadraticCurveTo(x+w, y+w, x+w, y+w/2); ctx.quadraticCurveTo(x+w, y, x+w/2, y); ctx.quadraticCurveTo(x, y, x, y+w/4); ctx.fill();
        }

        // ================= LEVELS STATE MACHINE =================
        let currentLevel = 0;
        let t = 0;
        const Levels = [
            { // MÀN 1: LY TRÀ
                combo: 0, waterAng: 0,
                hints: ["Vuốt lên để mở nắp, xoay nghiêng rót nước, rồi lắc đều.", "Hoàn hảo!"],
                update: function() {
                    if(this.combo===0 && Input.swipeDir === 'up') { this.combo=1; spawnParticles(W/2, H/2-100, '#fff', 20); sendTrackingData("Tương Tác", "Màn 1", "Đã vuốt lên mở nắp ly trà"); }
                    if(this.combo===1 && Math.abs(Sensor.gamma) > 60) { this.combo=2; sendTrackingData("Tương Tác", "Màn 1", "Đã xoay nghiêng máy rót nước"); }
                    if(this.combo===2 && Sensor.shake > 20) { this.combo=3; spawnParticles(W/2, H/2, '#0984e3', 30); nextLevel(); }
                },
                draw: function() {
                    ctx.strokeStyle = '#fff'; ctx.lineWidth = 5; ctx.beginPath();
                    ctx.moveTo(W/2-50, H/2-100); ctx.lineTo(W/2-40, H/2+100); ctx.lineTo(W/2+40, H/2+100); ctx.lineTo(W/2+50, H/2-100);
                    if(this.combo===0) ctx.lineTo(W/2-50, H/2-100); 
                    ctx.stroke();
                    ctx.fillStyle = '#666'; ctx.font = "30px Courier"; ctx.fillText(this.combo===3 ? "2" : "1+1=?", W/2-45, H/2+80);
                    if(this.combo>0 && this.combo<3) {
                        ctx.save(); ctx.beginPath(); ctx.moveTo(W/2-45, H/2); ctx.lineTo(W/2-40, H/2+100); ctx.lineTo(W/2+40, H/2+100); ctx.lineTo(W/2+45, H/2); ctx.clip();
                        ctx.fillStyle = 'rgba(9, 132, 227, 0.5)';
                        this.waterAng = -Sensor.gamma * Math.PI/180;
                        ctx.translate(W/2, H/2+50); ctx.rotate(this.waterAng); ctx.fillRect(-100, 0, 200, 200);
                        ctx.restore();
                    }
                }
            },
            { // MÀN 2: DỖ DÀNH
                combo: 0, timer: 0,
                hints: ["Úp máy xuống bàn, im lặng 5 giây, lật lên vuốt ve (trái/phải x3).", "Tâm trạng đã ổn!"],
                update: function(dt) {
                    let isFlipped = (Math.abs(Sensor.beta) > 150 || Math.abs(Sensor.beta) < 30) && Math.abs(Sensor.gamma) < 30 && Sensor.accZ < -8; 
                    if(this.combo===0 && isFlipped) { this.combo=1; sendTrackingData("Tương Tác", "Màn 2", "Đã úp điện thoại xuống (Đang chờ 5 giây...)"); }
                    if(this.combo===1) {
                        if(!isFlipped) Input.resetCombo(1, "Lật máy lên quá sớm!"); 
                        else { 
                            this.timer+=dt; 
                            if(this.timer>3000) { this.combo=2; sendTrackingData("Tiến Độ", "Màn 2", "Đã chờ đủ thời gian, đang chuẩn bị lật máy"); } 
                        }
                    }
                    if(this.combo===2 && !isFlipped) { this.combo = 3; sendTrackingData("Tương Tác", "Màn 2", "Đã lật điện thoại lên, bắt đầu vuốt ve"); }
                    if(this.combo>=3 && this.combo<6) {
                        if(Input.swipeDir==='left'||Input.swipeDir==='right') { 
                            this.combo++; Input.swipeDir=null; 
                            sendTrackingData("Tương Tác", "Màn 2", `Đã vuốt lần thứ ${this.combo - 3}`);
                        }
                    }
                    if(this.combo===6) { this.combo=7; spawnParticles(W/2,H/2,'#ff4757',30); nextLevel(); }
                },
                draw: function() {
                    if(this.combo<6) {
                        ctx.fillStyle = (Math.sin(t/100)>0 && this.combo<3) ? '#ff4757' : '#fff';
                        ctx.font = "50px Courier"; ctx.fillText(this.combo>=3 ? "VUỐT VE..." : "ERROR", W/2-70, H/2);
                    } else { ctx.fillStyle='#ff4757'; drawHeart(ctx, W/2, H/2-20, 50 + Math.sin(t/150)*10); }
                }
            },
            { // MÀN 3: PHÁ BĂNG
                combo: 0,
                hints: ["Giữ 2 mép, lắc mạnh, rồi vuốt xuống để dọn dẹp.", "Băng đã tan!"],
                update: function() {
                    if(Input.touches.length === 2) {
                        if(this.combo===0) { this.combo=1; sendTrackingData("Tương Tác", "Màn 3", "Đã dùng 2 ngón tay giữ mép (Băng bắt đầu nứt)"); }
                        if(this.combo===1 && Sensor.shake > 25) { this.combo=2; sendTrackingData("Tương Tác", "Màn 3", "Đã lắc mạnh điện thoại (Băng nứt to)"); }
                    } else if (Input.touches.length === 0 && this.combo===1) Input.resetCombo(2, "Thả tay quá sớm khi chưa lắc!");
                    
                    if(this.combo===2 && Input.touches.length===0 && Input.swipeDir==='down') {
                        this.combo=3; spawnParticles(W/2,H/2,'#dfe6e9',50,'gravity'); nextLevel();
                    }
                },
                draw: function() {
                    ctx.fillStyle = '#fff'; ctx.font = "40px Courier"; ctx.fillText(this.combo===3?"0":"1000km", W/2-60, H/2);
                    if(this.combo<3) {
                        ctx.fillStyle = 'rgba(255,255,255,0.7)';
                        ctx.beginPath(); ctx.moveTo(W/2-100,H/2-100); ctx.lineTo(W/2+80,H/2-120); ctx.lineTo(W/2+100,H/2+100); ctx.lineTo(W/2-120,H/2+80); ctx.fill();
                        
                        if(this.combo>=1) { 
                            ctx.strokeStyle='#000'; ctx.lineWidth=2; 
                            ctx.beginPath(); ctx.moveTo(W/2-50,H/2-100); ctx.lineTo(W/2+50,H/2+100); ctx.stroke(); 
                        }
                        if(this.combo>=2) {
                            ctx.lineWidth=4; ctx.beginPath();
                            ctx.moveTo(W/2, H/2); ctx.lineTo(W/2-80, H/2+50);
                            ctx.moveTo(W/2+20, H/2-20); ctx.lineTo(W/2+100, H/2-50);
                            ctx.stroke();
                        }
                    }
                }
            },
            { // MÀN 4: TRỌNG LỰC ĐẢO NGƯỢC
                combo: 0, numY: 150, boxY: 0, vy: 0,
                hints: ["Lộn ngược máy, bắt lấy số 6 khi nó rơi ngược lên hộp, lật lại.", "Hoàn hảo!"],
                update: function() {
                    this.boxY = H - 150; 
                    let upsideDown = Sensor.beta < -40;

                    if (this.combo === 0) {
                        this.numY = 150; 
                        this.vy = 0;
                        if(upsideDown) {
                            this.combo = 1;
                            this.numY = H - 150; 
                            sendTrackingData("Tương Tác", "Màn 4", "Đã chổng ngược điện thoại (Số 6 bắt đầu rơi)");
                        }
                    }
                    
                    if(this.combo===1) {
                        this.boxY = 150; 
                        this.vy -= 0.5; 
                        this.numY += this.vy; 
                        
                        let isTouched = Input.touches.some(t => Math.hypot(t.clientX-W/2, t.clientY-this.numY) < 80);
                        
                        if(isTouched && this.numY < this.boxY + 50) {
                            this.combo=2;
                            sendTrackingData("Tương Tác", "Màn 4", "Đã dùng ngón tay chụp trúng số 6");
                        }
                        
                        if(this.numY < -50) Input.resetCombo(4, "Không chụp kịp, số 6 bay mất rồi!");
                    }
                    
                    if(this.combo===2) {
                        this.boxY = 150;
                        if(Input.touches.length === 0) {
                            Input.resetCombo(4, "Đã bắt được nhưng lại trượt tay thả ra!");
                        } else if(!upsideDown) { 
                            this.combo=3; 
                            sendTrackingData("Tương Tác", "Màn 4", "Đã lật điện thoại thẳng lại");
                            nextLevel(); 
                        }
                    }
                },
                draw: function() {
                    ctx.strokeStyle = '#2ed573'; ctx.lineWidth = 5; 
                    ctx.strokeRect(W/2-40, this.boxY-40, 80, 80); 
                    
                    if(this.combo<3) {
                        ctx.save(); ctx.translate(W/2, this.numY); 
                        if(this.combo>0) ctx.rotate(Math.PI); 
                        ctx.fillStyle = '#fff'; ctx.font = "80px Courier"; 
                        ctx.fillText("9", -25, 25);
                        ctx.restore();
                    } else { 
                        ctx.fillStyle = '#2ed573'; ctx.font = "80px Courier"; 
                        ctx.fillText("6", W/2-25, this.boxY+25); 
                    }
                }
            },
            { // MÀN 5: ỒN ÀO
                combo: 0, timer: 0,
                hints: ["Ẩn trình duyệt (ra Home) 3 giây để tìm khoảng lặng.", "Bình yên!"],
                update: function(dt) {
                    if(this.combo===0 && Input.hiddenTrigger) { 
                        this.combo=1; Input.hiddenTrigger=false; 
                        sendTrackingData("Tương Tác", "Màn 5", "Cô ấy vừa thoát ẩn trình duyệt (Ra màn hình chính)");
                    }
                    if(this.combo===1) {
                        this.timer+=dt; 
                        if(!document.hidden && this.timer < 3000) Input.resetCombo(4, "Chưa đủ 3 giây tĩnh lặng đã mở lên lại!");
                        if(!document.hidden && this.timer >= 3000) { 
                            this.combo=2; 
                            sendTrackingData("Tương Tác", "Màn 5", "Cô ấy quay lại trình duyệt sau hơn 3 giây");
                            nextLevel(); 
                        }
                    }
                },
                draw: function() {
                    if(this.combo<2) {
                        for(let i=0; i<100; i++) { ctx.fillStyle = Math.random()>0.5?'#fff':'#333'; ctx.fillRect(Math.random()*W, Math.random()*H, 10, 10); }
                        ctx.fillStyle = '#ff4757'; ctx.font = "60px Courier"; ctx.fillText("ỒN ÀO", W/2-90, H/2);
                    } else { ctx.fillStyle = '#fff'; ctx.font = "100px Courier"; ctx.fillText("∞", W/2-30, H/2+30); }
                }
            },
            { // MÀN 6: LA BÀN
                combo: 0,
                hints: ["Xoay người hướng Bắc (Alpha 0), đặt máy phẳng, Double Tap.", "Khóa mục tiêu!"],
                update: function() {
                    let isNorth = Sensor.alpha < 15 || Sensor.alpha > 345;
                    let isFlat = Math.abs(Sensor.beta) < 10 && Math.abs(Sensor.gamma) < 10;
                    if(this.combo===0 && isNorth) { this.combo=1; sendTrackingData("Tương Tác", "Màn 6", "Đã quay người hướng về phương Bắc"); }
                    if(this.combo===1 && isFlat) { this.combo=2; sendTrackingData("Tương Tác", "Màn 6", "Đã đặt điện thoại nằm phẳng tuyệt đối"); }
                    if(this.combo===2 && Input.taps >= 2) { this.combo=3; nextLevel(); }
                },
                draw: function() {
                    ctx.save(); ctx.translate(W/2, H/2);
                    if(this.combo<3) {
                        ctx.beginPath(); ctx.arc(0,0,100,0,Math.PI*2); ctx.strokeStyle='#fff'; ctx.lineWidth=3; ctx.stroke();
                        ctx.rotate(-Sensor.alpha * Math.PI/180);
                        ctx.fillStyle = this.combo>0 ? '#2ed573' : '#ff4757';
                        ctx.beginPath(); ctx.moveTo(0,-80); ctx.lineTo(10,0); ctx.lineTo(-10,0); ctx.fill();
                    } else { ctx.beginPath(); ctx.arc(0,0,50,0,Math.PI*2); ctx.strokeStyle='#f1c40f'; ctx.lineWidth=15; ctx.stroke(); }
                    ctx.restore();
                }
            },
            { // MÀN 7: DỌN DẸP
                combo: 0, gap: 0,
                hints: ["Tap 5 lần để tách, Pinch kéo giãn, hất thẳng đằng trước.", "Đã dọn sạch!"],
                update: function() {
                    if(this.combo===0 && Input.taps >= 5) { this.combo=1; sendTrackingData("Tương Tác", "Màn 7", "Đã gõ nhanh 5 lần tách chữ Xích Mích"); }
                    if(this.combo===1 && Input.swipeDir==='pinchOut') { this.combo=2; sendTrackingData("Tương Tác", "Màn 7", "Đã dùng 2 ngón tay vuốt giãn chữ (Pinch Out)"); }
                    
                    if(this.combo===2) { 
                        this.gap = Math.min(this.gap+5, 150); 
                        if(Math.abs(Sensor.accZ) > 15 && Math.abs(Sensor.accX) < 10 && Math.abs(Sensor.accY) < 10) { 
                            this.combo=3; sendTrackingData("Tương Tác", "Màn 7", "Đã hất mạnh điện thoại về phía trước (Z-Axis)"); nextLevel(); 
                        } 
                    }
                },
                draw: function() {
                    if(this.combo<3) {
                        let scale = 1 + (this.combo===0 ? Math.sin(t/100)*0.2 : 0);
                        ctx.save(); ctx.translate(W/2, H/2); ctx.scale(scale, scale);
                        ctx.fillStyle = '#ff4757'; ctx.font = "40px Courier";
                        if(this.combo===0) ctx.fillText("XÍCH MÍCH", -100, 15);
                        else { ctx.fillText("XÍCH", -100 - this.gap, 15); ctx.fillText("MÍCH", 20 + this.gap, 15); }
                        ctx.restore();
                    }
                }
            },
            { // MÀN 8: BOSS KÝ TÊN
                combo: 0, line: [],
                hints: ["Để phẳng máy, ký tên (1 nét liền), thả tay rồi Tap để đóng dấu.", "Ký Tên Đóng Dấu!"],
                update: function() {
                    let isFlat = Math.abs(Sensor.beta) < 10 && Math.abs(Sensor.gamma) < 10;
                    if(this.combo===0 && isFlat) { this.combo=1; sendTrackingData("Tương Tác", "Màn 8 (Boss)", "Đã đặt phẳng máy, chuẩn bị ký tên"); }
                    
                    if(!isFlat && this.combo>0 && this.combo<3) { 
                        Input.resetCombo(8, "Máy bị nghiêng! Ký hỏng."); 
                        this.line=[]; 
                    }
                    
                    if(this.combo===1) {
                        if(Input.touches.length === 1) {
                            this.line.push({x:Input.touches[0].clientX, y:Input.touches[0].clientY});
                        } else if (Input.touches.length === 0 && this.line.length > 20) {
                            this.combo=2;
                            sendTrackingData("Tương Tác", "Màn 8 (Boss)", "Đã ký tên xong, đang chờ đóng mộc đỏ");
                        } else if (Input.touches.length === 0 && this.line.length > 0 && this.line.length <= 20) {
                            Input.resetCombo(8, "Ký nét quá ngắn, hãy ký dài và rõ ràng hơn.");
                            this.line = []; 
                        }
                    }
                    
                    if(this.combo===2 && Input.touches.length > 0) { 
                        this.combo=3; 
                        for(let i=0;i<100;i++) spawnParticles(W/2,H/2, `hsl(${Math.random()*360},100%,50%)`, 1, 'gravity');
                        
                        // Gửi sự kiện vinh quang cuối cùng về Google Form
                        sendTrackingData("🎉 PHÁ ĐẢO TOÀN BỘ", "Màn 8 (Boss)", "Vợ yêu đã xuất sắc hoàn thành toàn bộ thử thách!");
                        document.getElementById('hint-text').innerText = "BẠN ĐÃ PHÁ ĐẢO TOÀN BỘ GAME!";
                    }
                },
                draw: function() {
                    ctx.fillStyle = '#ecf0f1'; ctx.fillRect(W/2-150, H/2-200, 300, 400);
                    
                    ctx.strokeStyle = '#2c3e50'; ctx.lineWidth = 4;
                    ctx.beginPath();
                    this.line.forEach((p,i)=> i===0 ? ctx.moveTo(p.x,p.y) : ctx.lineTo(p.x,p.y));
                    ctx.stroke();
                    
                    if(this.combo===3) {
                        ctx.strokeStyle='#c0392b'; ctx.lineWidth=10; ctx.beginPath(); ctx.arc(W/2,H/2,80,0,Math.PI*2); ctx.stroke();
                        ctx.fillStyle='#c0392b'; ctx.font="30px Arial"; ctx.save(); ctx.translate(W/2,H/2); ctx.rotate(-0.5); ctx.fillText("ĐÃ DUYỆT", -70, 10); ctx.restore();
                    }
                }
            }
        ];

        // ================= GAME LOOP =================
        let lastTime = 0;
        let isTransitioning = false; 

        function loop(timestamp) {
            let dt = timestamp - lastTime; lastTime = timestamp; t += dt;
            ctx.clearRect(0,0,W,H);
            
            if(currentLevel < Levels.length) {
                Levels[currentLevel].update(dt);
                Levels[currentLevel].draw(ctx);
            }
            
            particles.forEach((p,i) => { p.update(); p.draw(ctx); if(p.life<=0) particles.splice(i,1); });
            requestAnimationFrame(loop);
        }

        function nextLevel() {
            if(isTransitioning) return; 
            isTransitioning = true; 
            
            let ui = document.getElementById('toast');
            ui.innerText = Levels[currentLevel].hints[1]; 
            ui.style.opacity = 1;
            
            // Gửi dữ liệu qua màn
            sendTrackingData("Qua Màn", `Màn ${currentLevel+1}`, "Hoàn thành toàn bộ combo");
            
            setTimeout(() => { 
                ui.style.opacity = 0; 
                currentLevel++; 
                isTransitioning = false;
                
                if(currentLevel < Levels.length) {
                    document.getElementById('hint-text').innerText = `Màn ${currentLevel+1}/8: ` + Levels[currentLevel].hints[0];
                    sendTrackingData("Bắt đầu Màn", `Màn ${currentLevel+1}`, "Đã load xong giao diện");
                }
            }, 2000);
        }

        // ================= KHỞI ĐỘNG =================
        document.getElementById('btn-start').addEventListener('click', async (e) => {
            sendTrackingData("Tương Tác", "Nút Start", "Cô ấy vừa bấm nút [CHẠM ĐỂ BẮT ĐẦU]");
            if(typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
                let perm = await DeviceMotionEvent.requestPermission();
                if(perm !== 'granted') {
                    sendTrackingData("Từ chối quyền", "Init", "Không cấp quyền Cảm biến (Game sẽ không chơi được)");
                    return alert('Bắt buộc cấp quyền Cảm biến!');
                }
            }
            sendTrackingData("Bắt đầu Màn", "Màn 1", "Đã cấp quyền, chính thức vào game!");
            e.target.style.display = 'none';
            document.getElementById('hint-text').innerText = "Màn 1/8: " + Levels[0].hints[0];
            requestAnimationFrame(loop);
        });
    </script>
</body>
</html>
