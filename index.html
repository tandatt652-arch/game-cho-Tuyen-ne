<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LOGIC BẺ LÁI</title>
    <style>
        /* ================= CSS ================= */
        :root {
            --bg-color: #121212;
            --text-color: #e0e0e0;
            --accent-color: #ff4757;
            --success-color: #2ed573;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none; /* Tránh bôi đen text khi chạm giữ */
        }

        body, html {
            width: 100vw;
            height: 100vh;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden; /* Cấm cuộn */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .screen {
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
            padding: 20px;
            text-align: center;
            position: relative;
            animation: fadeIn 0.5s ease-in-out;
        }

        .screen.active {
            display: flex;
        }

        /* Nút Bắt Đầu */
        #btn-start {
            background-color: var(--text-color);
            color: var(--bg-color);
            border: none;
            padding: 20px 40px;
            font-size: 24px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 255, 255, 0.2);
            transition: transform 0.1s;
        }
        #btn-start:active {
            transform: scale(0.95);
        }

        /* Elements hiển thị toán học */
        .equation {
            font-size: 4rem;
            font-weight: bold;
            margin-bottom: 20px;
            transition: all 0.5s ease;
        }

        .hint {
            font-size: 1rem;
            color: #888;
            font-style: italic;
            max-width: 80%;
            margin-top: 30px;
        }

        /* Màn 1: Shake Animation */
        @keyframes shakeAnim {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(3px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(1px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }
        .shake-active {
            animation: shakeAnim 0.5s infinite;
            color: var(--accent-color);
        }

        /* Màn 2: Đảo ngược */
        #number-9 {
            display: inline-block;
            transition: transform 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }
        .flipped {
            transform: rotate(180deg);
            color: var(--success-color);
        }

        /* Màn 4: Multi-touch */
        .fingerprint {
            position: absolute;
            width: 60px;
            height: 60px;
            border: 2px dashed #555;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0.5;
            transition: all 0.3s ease;
        }
        .fp-top-left { top: 10%; left: 10%; }
        .fp-bottom-right { bottom: 10%; right: 10%; }
        .fingerprint.active {
            border-color: var(--accent-color);
            background-color: rgba(255, 71, 87, 0.2);
            opacity: 1;
        }
        .heart {
            color: var(--accent-color);
            font-size: 5rem;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* Thông báo nhỏ */
        #toast {
            position: absolute;
            top: 20%;
            background: var(--success-color);
            color: #fff;
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: bold;
            opacity: 0;
            transition: opacity 0.5s;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <audio id="silent-audio" loop playsinline>
        <source src="data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA" type="audio/wav">
    </audio>

    <div id="toast"></div>

    <div id="screen-0" class="screen active">
        <button id="btn-start">[ CHẠM ĐỂ BẮT ĐẦU ]</button>
        <div class="hint" style="margin-top: 20px;">Vui lòng cấp quyền cảm biến nếu thiết bị yêu cầu để chơi game.</div>
    </div>

    <div id="screen-1" class="screen">
        <div id="eq-1" class="equation">5 + 5 = ?</div>
        <div class="hint"></div>
    </div>

    <div id="screen-2" class="screen">
        <div id="eq-2" class="equation"><span id="number-9">9</span> - 3 = ?</div>
        <div class="hint"></div>
    </div>

    <div id="screen-3" class="screen">
        <div id="eq-3" class="equation">100 - <span id="var-x">X</span> = 0</div>
        <div class="hint"></div>
    </div>

    <div id="screen-4" class="screen">
        <div class="fingerprint fp-top-left" id="fp-1">👆</div>
        <div id="eq-4" class="equation">1 + 1 = ?</div>
        <div class="fingerprint fp-bottom-right" id="fp-2">👆</div>
        <div class="hint"></div>
    </div>

    <div id="screen-5" class="screen">
        <div class="heart">❤️</div>
        <div class="equation" style="font-size: 2rem; margin-top: 20px;">1 + 1 = CHÚNG TA</div>
        <div class="hint" style="color: var(--success-color);">Đồng vợ đồng chồng, tát biển Đông cũng cạn! Bạn đã phá đảo!</div>
    </div>

    <script>
        let currentLevel = 0;
        const audio = document.getElementById('silent-audio');
        const toast = document.getElementById('toast');

        // Hàm chuyển màn
        function showScreen(level) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(`screen-${level}`).classList.add('active');
            currentLevel = level;
        }

        // Hàm hiển thị thông báo popup
        function showToast(msg, callback) {
            toast.innerText = msg;
            toast.style.opacity = 1;
            setTimeout(() => {
                toast.style.opacity = 0;
                if(callback) callback();
            }, 1500);
        }

        // ================= XỬ LÝ QUYỀN (MÀN 0) =================
        document.getElementById('btn-start').addEventListener('click', async () => {
            // 1. Xin quyền Sensor cho iOS 13+
            if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
                try {
                    const permissionState = await DeviceMotionEvent.requestPermission();
                    if (permissionState !== 'granted') {
                        alert('Cần cấp quyền cảm biến để chơi game!');
                        return;
                    }
                } catch (console) {
                    alert('Lỗi xin quyền cảm biến.');
                }
            }

            // 2. Kích hoạt Audio (Bắt buộc phải qua user gesture)
            try {
                audio.play();
            } catch (e) {
                console.log("Audio autoplay bị chặn, không sao.");
            }

            // Vào màn 1
            showScreen(1);
        });

        // ================= MÀN 1: LẮC =================
        /* Cách test trên PC: Mở Chrome DevTools (F12) -> Nhấn Ctrl+Shift+P -> gõ "Sensors".
           Ở mục Orientation/Device-based, thay đổi các giá trị để giả lập gia tốc.
        */
        let shakeCount = 0;
        let lastUpdate = 0;
        window.addEventListener('devicemotion', (e) => {
            if (currentLevel !== 1) return;
            
            const acc = e.accelerationIncludingGravity;
            if (!acc) return;

            // Tính tổng lực gia tốc
            const force = Math.abs(acc.x) + Math.abs(acc.y) + Math.abs(acc.z);
            
            // Gia tốc trọng trường bình thường là ~9.8. Lắc mạnh sẽ vượt qua 20.
            if (force > 25) {
                const now = Date.now();
                if (now - lastUpdate > 100) { // debounce
                    shakeCount++;
                    lastUpdate = now;
                    document.getElementById('eq-1').classList.add('shake-active');
                    
                    if (shakeCount >= 10) {
                        document.getElementById('eq-1').innerText = "10";
                        document.getElementById('eq-1').classList.remove('shake-active');
                        document.getElementById('eq-1').style.color = "var(--success-color)";
                        setTimeout(() => showToast("Đã trộn đều!", () => showScreen(2)), 1000);
                        shakeCount = 0; // reset
                    }
                }
            } else {
                document.getElementById('eq-1').classList.remove('shake-active');
            }
        });

        // ================= MÀN 2: LỘN NGƯỢC =================
        /* Cách test trên PC: Dùng tab Sensors của DevTools, chỉnh Beta thành 180 hoặc -180
        */
        window.addEventListener('deviceorientation', (e) => {
            if (currentLevel !== 2) return;
            
            const beta = e.beta; // Góc gập (trước/sau): -180 đến 180
            
            // Lộn ngược điện thoại (Portrait) thì beta sẽ vượt quá 140 hoặc dưới -140 tùy dòng máy
            if (beta > 150 || beta < -150) {
                const num9 = document.getElementById('number-9');
                num9.classList.add('flipped');
                document.getElementById('eq-2').innerHTML = `<span class="flipped">9</span> - 3 = 3`;
                
                setTimeout(() => showToast("Hợp lý!", () => showScreen(3)), 1500);
            }
        });

        // ================= MÀN 3: ÂM LƯỢNG =================
        /* Lưu ý về Web API: Bắt phím cứng volume trên Mobile browser rất khó khăn vì OS thường chặn.
           Cách hoạt động tốt nhất là dựa vào event 'volumechange' của thẻ <audio> đang play.
           Cách test trên PC: Mở console gõ `document.getElementById('silent-audio').volume = 0;`
        */
        audio.addEventListener('volumechange', () => {
            if (currentLevel !== 3) return;
            
            if (audio.volume === 0 || audio.muted) {
                document.getElementById('var-x').innerText = "100";
                document.getElementById('var-x').style.color = "var(--success-color)";
                document.getElementById('eq-3').innerText = "100 - 100 = 0";
                setTimeout(() => showToast("Tuyệt vời sự tĩnh lặng!", () => showScreen(4)), 1500);
            }
        });

        // Hỗ trợ Fallback (Dành cho iOS Safari chặn volumechange qua phím cứng quá gắt):
        // Cho phép user tap 3 lần vào phương trình để qua màn nếu không thể dùng phím cứng.
        let fallbackClicks = 0;
        document.getElementById('eq-3').addEventListener('click', () => {
            if(currentLevel !== 3) return;
            fallbackClicks++;
            if(fallbackClicks >= 3) {
                audio.volume = 0; // Trigger logic
            }
        });

        // ================= MÀN 4: MULTI-TOUCH =================
        /* Cách test trên điện thoại: Dùng 2 ngón tay chạm cùng lúc lên màn hình.
           Cách test trên PC (Chrome DevTools): F12 -> Bật Device Toolbar (Ctrl+Shift+M) -> Giữ phím Shift và kéo chuột để giả lập Multi-touch.
        */
        window.addEventListener('touchstart', (e) => {
            if (currentLevel !== 4) return;
            
            if (e.touches.length >= 2) {
                // Đổi màu 2 dấu vân tay
                document.getElementById('fp-1').classList.add('active');
                document.getElementById('fp-2').classList.add('active');
                
                // Đổi phương trình
                document.getElementById('eq-4').innerHTML = `<div class="heart">❤️</div>`;
                
                setTimeout(() => {
                    showScreen(5);
                }, 1500);
            }
        });
        
        // Bỏ active nếu buông tay trước khi chuyển màn (Polish nhẹ)
        window.addEventListener('touchend', (e) => {
            if (currentLevel !== 4) return;
            if (e.touches.length < 2) {
                document.getElementById('fp-1').classList.remove('active');
                document.getElementById('fp-2').classList.remove('active');
            }
        });

    </script>
</body>
</html>
