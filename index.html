<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Gửi Bé Ngày 20/10 ❤️</title>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Great+Vibes&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    body {
      background: radial-gradient(circle at 50% 35%, #fffbfb 0%, #ffe5ec 52%, #ffc2d1 100%);
      color: #4a3540;
      font-family: 'Quicksand', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      touch-action: manipulation;
    }

    /* Canvas nền: Cánh hoa hồng rơi & Đom đóm lấp lánh */
    #bgCanvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 2;
    }

    /* Thanh công cụ nhỏ gọn phía trên */
    #top-bar {
      position: fixed;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 25;
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(12px);
      border: 2px solid #ffb3c6;
      border-radius: 30px;
      padding: 6px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 8px 24px rgba(201, 24, 74, 0.12);
    }
    .replay-btn {
      background: linear-gradient(135deg, #ff4d6d 0%, #ff758f 100%);
      color: #fff;
      border: none;
      padding: 5px 12px;
      border-radius: 20px;
      font-family: inherit;
      font-weight: 700;
      font-size: 12.5px;
      cursor: pointer;
      box-shadow: 0 3px 10px rgba(255, 77, 109, 0.3);
      transition: transform 0.15s;
      white-space: nowrap;
    }
    .replay-btn:hover { transform: scale(1.04); }
    .replay-btn:active { transform: scale(0.96); }

    .music-ctrl {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #fff0f5;
      border: 1.5px solid #ffc2d1;
      padding: 3px 10px;
      border-radius: 20px;
    }
    .music-btn {
      background: none;
      border: none;
      font-size: 15px;
      cursor: pointer;
      line-height: 1;
    }
    #bgm-volume {
      width: 66px;
      accent-color: #ff4d6d;
      cursor: pointer;
      height: 5px;
    }

    /* =========================================================================
       KHU VỰC SÂN KHẤU BÓ HOA HỒNG NẢY NỞ
       ========================================================================= */
    #bouquet-stage {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-top: 24px;
    }

    .bouquet-aura {
      position: absolute;
      width: 420px;
      height: 420px;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.95) 0%, rgba(255, 183, 197, 0.5) 48%, rgba(255, 183, 197, 0) 72%);
      border-radius: 50%;
      z-index: -1;
      animation: auraPulse 4s ease-in-out infinite;
    }
    @keyframes auraPulse {
      0%, 100% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.08); opacity: 1; }
    }

    .bouquet-wrapper {
      width: min(95vw, 480px);
      height: min(76vh, 540px);
      display: flex;
      align-items: center;
      justify-content: center;
      animation: bouquetFloat 5s ease-in-out infinite;
      filter: drop-shadow(0 20px 32px rgba(140, 20, 60, 0.22));
    }
    @keyframes bouquetFloat {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-8px) rotate(0.6deg); }
    }

    /* Hiệu ứng kết cấu từng phần của bó hoa khi nảy nở */
    .bloom-wrap-back {
      transform-box: fill-box;
      transform-origin: bottom center;
      opacity: 0;
      transform: scale(0.7) translateY(30px);
      transition: opacity 0.7s ease, transform 0.8s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .bloom-wrap-back.show {
      opacity: 1;
      transform: scale(1) translateY(0);
    }

    .bloom-foliage {
      transform-box: fill-box;
      transform-origin: bottom center;
      opacity: 0;
      transform: scale(0.2) translateY(40px);
      transition: opacity 0.6s ease, transform 0.75s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .bloom-foliage.show {
      opacity: 1;
      transform: scale(1) translateY(0);
    }

    .bloom-wrap-front {
      transform-box: fill-box;
      transform-origin: bottom center;
      opacity: 0;
      transform: scaleY(0.6) translateY(35px);
      transition: opacity 0.7s ease, transform 0.8s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .bloom-wrap-front.show {
      opacity: 1;
      transform: scaleY(1) translateY(0);
    }

    /* Hiệu ứng từng đóa hoa hồng bung nở từ nụ thành bông */
    .rose-item {
      transform-box: fill-box;
      transform-origin: center;
      opacity: 0;
      transform: scale(0) rotate(-35deg);
      transition: opacity 0.45s ease, transform 0.7s cubic-bezier(0.34, 1.56, 0.64, 1);
      cursor: pointer;
    }
    .rose-item.bloomed {
      opacity: 1;
      transform: scale(1) rotate(0deg);
    }
    .rose-item.bloomed:hover {
      transform: scale(1.13) rotate(4deg);
      filter: brightness(1.06) drop-shadow(0 0 12px rgba(255, 77, 109, 0.55));
    }
    .rose-item.bloomed:active {
      transform: scale(0.95);
    }

    /* Hoa Baby trắng lấp lánh */
    .baby-cluster {
      transform-box: fill-box;
      transform-origin: center;
      opacity: 0;
      transform: scale(0);
      transition: opacity 0.5s ease, transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .baby-cluster.bloomed {
      opacity: 1;
      transform: scale(1);
    }
    .baby-cluster circle {
      animation: twinkleStar 2.4s ease-in-out infinite alternate;
    }
    @keyframes twinkleStar {
      0% { opacity: 0.65; }
      100% { opacity: 1; filter: drop-shadow(0 0 4px #fff); }
    }

    /* =========================================================================
       BỨC THƯ ĐƯỢC KẸP VÀO THÂN BÓ HOA
       ========================================================================= */
    #tucked-letter-group {
      transform-box: fill-box;
      transform-origin: center;
      opacity: 0;
      transform: translateY(-25px) scale(0.4) rotate(-15deg);
      transition: opacity 0.6s ease, transform 0.75s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.3s;
      cursor: pointer;
    }
    #tucked-letter-group.show {
      opacity: 1;
      transform: translateY(0) scale(1) rotate(0deg);
      animation: tuckedLetterPulse 2.4s ease-in-out infinite;
    }
    #tucked-letter-group.show:hover {
      filter: brightness(1.06) drop-shadow(0 0 18px rgba(255, 77, 109, 0.85));
    }
    @keyframes tuckedLetterPulse {
      0%, 100% { transform: translateY(0) scale(1) rotate(0deg); filter: drop-shadow(0 4px 10px rgba(201, 24, 74, 0.35)); }
      50% { transform: translateY(-4px) scale(1.05) rotate(-2deg); filter: drop-shadow(0 0 18px rgba(255, 77, 109, 0.8)); }
    }

    .guide-banner {
      margin-top: 2px;
      background: rgba(255, 255, 255, 0.85);
      border: 1.5px solid #ffb3c6;
      color: #c9184a;
      padding: 7px 18px;
      border-radius: 25px;
      font-weight: 700;
      font-size: 13.5px;
      box-shadow: 0 6px 18px rgba(255, 77, 109, 0.15);
      transition: all 0.3s;
      cursor: pointer;
    }
    .guide-banner:hover {
      background: #fff;
      transform: translateY(-2px);
    }

    /* =========================================================================
       HIỆU ỨNG 3D LẬT MỞ LÁ THƯ (3D BOOK / PAPER FLIP UNFOLD)
       ========================================================================= */
    #letter-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(45, 12, 26, 0.62);
      backdrop-filter: blur(7px);
      z-index: 40;
      align-items: center;
      justify-content: center;
      padding: 16px;
      perspective: 1600px;
    }

    /* Sân khấu 3D chứa phong bì & trang thư lật mở */
    .flip-scene {
      position: relative;
      width: 100%;
      max-width: 550px;
      transform-style: preserve-3d;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Tờ thư chính với hiệu ứng lật mở 3D từ gập đôi sang phẳng */
    .letter-book {
      position: relative;
      width: 100%;
      background: linear-gradient(180deg, #fffdf9 0%, #fff5f8 100%);
      border: 3px solid #ff8fa3;
      border-radius: 22px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.38), inset 0 0 0 6px rgba(255, 194, 209, 0.35);
      padding: 26px 26px 22px;
      transform-origin: top center;
      transform: rotateX(-88deg) scale(0.75);
      opacity: 0;
      transition: transform 0.85s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.45s ease;
      max-height: 86vh;
      display: flex;
      flex-direction: column;
    }

    /* Nắp giấy lật phía trên tạo cảm giác lật mở trang thư thật */
    .letter-flap-cover {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 50%;
      background: linear-gradient(135deg, #ffe5ec 0%, #ffc2d1 100%);
      border-radius: 20px 20px 0 0;
      border-bottom: 2px dashed #ff8fa3;
      transform-origin: top center;
      transform: rotateX(0deg);
      transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.6s ease 0.3s;
      z-index: 10;
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
      backface-visibility: hidden;
    }
    .wax-seal-big {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #ff4d6d, #a4133c 70%, #590d22);
      border: 3px solid #ffb3c6;
      box-shadow: 0 6px 15px rgba(164, 19, 60, 0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      color: #fff;
    }

    /* Khi kích hoạt class .open -> Lật nắp thư 180 độ và trải phẳng trang giấy */
    #letter-overlay.open .letter-book {
      transform: rotateX(0deg) scale(1);
      opacity: 1;
    }
    #letter-overlay.open .letter-flap-cover {
      transform: rotateX(180deg);
      opacity: 0;
    }

    .letter-header {
      font-family: 'Great Vibes', cursive;
      font-size: clamp(32px, 6vw, 42px);
      color: #c9184a;
      text-align: center;
      margin-bottom: 10px;
      line-height: 1.15;
      flex-shrink: 0;
    }

    /* Nội dung bức thư có thanh cuộn mượt và nền kẻ dòng nhật ký */
    .letter-scroll-area {
      overflow-y: auto;
      padding: 14px 16px;
      background:
        linear-gradient(transparent, transparent 31px, rgba(255, 179, 198, 0.38) 32px);
      background-size: 100% 32px;
      border-radius: 14px;
      border: 1.5px solid #ffd6e0;
      background-color: rgba(255, 255, 255, 0.78);
      line-height: 32px;
      font-size: 16.5px;
      font-weight: 600;
      color: #3d2630;
      text-align: left;
      max-height: 58vh;
      box-shadow: inset 0 2px 10px rgba(255, 143, 163, 0.1);
    }
    .letter-scroll-area::-webkit-scrollbar {
      width: 6px;
    }
    .letter-scroll-area::-webkit-scrollbar-thumb {
      background: #ff8fa3;
      border-radius: 10px;
    }

    .letter-paragraph {
      margin-bottom: 14px;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 0.6s ease, transform 0.6s ease;
    }
    .letter-paragraph.visible {
      opacity: 1;
      transform: translateY(0);
    }
    .letter-paragraph:last-child {
      margin-bottom: 0;
      color: #c9184a;
      font-weight: 700;
      font-size: 17.5px;
    }

    .letter-footer {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 14px;
      flex-shrink: 0;
    }
    .close-letter-btn {
      background: linear-gradient(135deg, #ff4d6d 0%, #ff758f 100%);
      color: #fff;
      border: none;
      padding: 9px 24px;
      border-radius: 25px;
      font-family: inherit;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(255, 77, 109, 0.35);
      transition: transform 0.15s;
    }
    .close-letter-btn:hover { transform: translateY(-2px); }
  </style>
</head>
<body>

  <!-- Canvas nền hiệu ứng cánh hoa rơi & đom đóm -->
  <canvas id="bgCanvas"></canvas>

  <!-- Thanh điều khiển trên cùng -->
  <div id="top-bar">
    <button id="btn-replay-bloom" class="replay-btn">🌸 Ngắm hoa nở lại</button>
    <div class="music-ctrl" title="Chỉnh âm lượng nhạc">
      <button id="btn-bgm-toggle" class="music-btn">🎵</button>
      <input type="range" id="bgm-volume" min="0" max="100" value="50" />
    </div>
  </div>

  <!-- =========================================================================
       SÂN KHẤU BÓ HOA HỒNG CHỦ ĐẠO KÈM BỨC THƯ KẸP Ở THÂN HOA
       ========================================================================= -->
  <div id="bouquet-stage">
    <div class="bouquet-aura"></div>

    <div class="bouquet-wrapper">
      <svg id="bouquet-svg" viewBox="0 0 540 600" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <filter id="drop-sh" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#590d22" flood-opacity="0.22"/>
          </filter>
          <filter id="letter-sh" x="-30%" y="-30%" width="160%" height="160%">
            <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#800f2f" flood-opacity="0.35"/>
          </filter>

          <!-- Gradient Giấy gói lụa Hàn Quốc nhiều lớp -->
          <linearGradient id="paper-back" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#fff0f3"/>
            <stop offset="100%" stop-color="#ffccd5"/>
          </linearGradient>
          <linearGradient id="paper-left" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#ffccd5"/>
            <stop offset="55%" stop-color="#ffb3c6"/>
            <stop offset="100%" stop-color="#ff8fa3"/>
          </linearGradient>
          <linearGradient id="paper-right" x1="1" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#ffe5ec"/>
            <stop offset="55%" stop-color="#ffb3c6"/>
            <stop offset="100%" stop-color="#fb6f92"/>
          </linearGradient>
          <linearGradient id="paper-inner" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#ffffff"/>
            <stop offset="100%" stop-color="#fff0f3"/>
          </linearGradient>
          <linearGradient id="ribbon-silk" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#ff4d6d"/>
            <stop offset="50%" stop-color="#c9184a"/>
            <stop offset="100%" stop-color="#800f2f"/>
          </linearGradient>

          <!-- 5 Sắc độ Hoa Hồng Chủ Đạo (Đỏ Nhung, Đỏ Ruby, Hồng Đào, Hồng Phấn, Hồng Kem) -->
          <radialGradient id="rose-velvet" cx="50%" cy="42%" r="55%">
            <stop offset="0%" stop-color="#590d22"/>
            <stop offset="38%" stop-color="#a4133c"/>
            <stop offset="76%" stop-color="#df2957"/>
            <stop offset="100%" stop-color="#ff758f"/>
          </radialGradient>
          <radialGradient id="rose-ruby" cx="50%" cy="42%" r="55%">
            <stop offset="0%" stop-color="#800f2f"/>
            <stop offset="40%" stop-color="#c9184a"/>
            <stop offset="78%" stop-color="#ff4d6d"/>
            <stop offset="100%" stop-color="#ffb3c6"/>
          </radialGradient>
          <radialGradient id="rose-peach" cx="50%" cy="42%" r="55%">
            <stop offset="0%" stop-color="#c9184a"/>
            <stop offset="42%" stop-color="#ff4d6d"/>
            <stop offset="78%" stop-color="#ff8fa3"/>
            <stop offset="100%" stop-color="#ffe5ec"/>
          </radialGradient>
          <radialGradient id="rose-blush" cx="50%" cy="42%" r="55%">
            <stop offset="0%" stop-color="#ff4d6d"/>
            <stop offset="45%" stop-color="#ff8fa3"/>
            <stop offset="82%" stop-color="#ffc2d1"/>
            <stop offset="100%" stop-color="#fff0f3"/>
          </radialGradient>
          <radialGradient id="rose-cream" cx="50%" cy="42%" r="55%">
            <stop offset="0%" stop-color="#ff8fa3"/>
            <stop offset="38%" stop-color="#ffcad4"/>
            <stop offset="75%" stop-color="#fff0f3"/>
            <stop offset="100%" stop-color="#ffffff"/>
          </radialGradient>

          <linearGradient id="leaf-dark" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#52b788"/>
            <stop offset="100%" stop-color="#1b4332"/>
          </linearGradient>
          <linearGradient id="leaf-light" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#95d5b2"/>
            <stop offset="100%" stop-color="#2d6a4f"/>
          </linearGradient>

          <!-- MẪU HOA HỒNG NỞ RỘ CHI TIẾT 6 LỚP CÁNH CHÂN THỰC -->
          <g id="detailed-rose">
            <!-- Lớp cánh ngoài thứ 1 (5 cánh lớn uốn lượn) -->
            <path d="M0,-48 C24,-52 45,-34 46,-10 C47,16 32,38 10,46 C-12,52 -36,40 -45,18 C-52,-4 -40,-34 -18,-45 C-8,-50 -3,-47 0,-48 Z" opacity="0.96"/>
            <path d="M0,-48 C24,-52 45,-34 46,-10 C47,16 32,38 10,46 C-12,52 -36,40 -45,18 C-52,-4 -40,-34 -18,-45 Z" transform="rotate(38)" opacity="0.93"/>
            <path d="M0,-46 C22,-48 42,-30 43,-8 C44,15 30,36 8,43 C-12,48 -34,38 -42,16 C-48,-4 -38,-32 -16,-42 Z" transform="rotate(76)" opacity="0.9"/>

            <!-- Viền sáng mềm trên cánh ngoài -->
            <path d="M-28,-36 Q0,-50 28,-36 Q48,-10 32,24 Q0,46 -32,24 Q-48,-10 -28,-36 Z" fill="rgba(255,255,255,0.16)" transform="rotate(18)"/>

            <!-- Lớp cánh giữa xếp chồng tạo độ phồng 3D -->
            <path d="M-24,-24 C-6,-40 22,-36 32,-16 C42,4 32,28 10,34 C-12,40 -32,26 -35,4 C-38,-12 -30,-19 -24,-24 Z" fill="rgba(0,0,0,0.09)"/>
            <path d="M0,-35 C19,-37 34,-22 34,-3 C34,16 20,31 2,34 C-16,36 -32,24 -34,5 C-36,-14 -19,-33 0,-35 Z"/>
            <path d="M0,-32 C17,-34 30,-20 31,-3 C32,14 18,28 2,30 C-14,32 -29,20 -30,3 C-31,-14 -16,-30 0,-32 Z" transform="rotate(48)" fill="rgba(255,255,255,0.18)"/>

            <!-- Lớp cánh cuộn gần tâm -->
            <path d="M-16,-15 C-4,-26 14,-24 21,-10 C28,3 20,20 5,23 C-10,26 -22,16 -23,1 C-24,-8 -20,-12 -16,-15 Z" fill="rgba(0,0,0,0.12)"/>
            <path d="M0,-22 C13,-23 22,-13 22,0 C22,12 12,22 0,22 C-12,22 -22,12 -22,0 C-22,-12 -12,-21 0,-22 Z"/>

            <!-- Tâm xoáy cuộn tròn đặc trưng của hoa hồng thật -->
            <path d="M-12,-4 C-6,-14 8,-14 13,-4 C17,6 8,15 -2,14 C-11,13 -15,3 -9,-5 C-4,-10 5,-9 8,-3 C10,2 5,8 -1,7 C-5,6 -6,1 -3,-2"
                  fill="none" stroke="rgba(255,255,255,0.72)" stroke-width="2.4" stroke-linecap="round"/>
          </g>

          <!-- MẪU NỤ HOA HỒNG CHÚM CHÍM DƯỚI ĐÀI LÁ -->
          <g id="rose-bud">
            <path d="M0,18 L0,36" stroke="#2d6a4f" stroke-width="3.5" stroke-linecap="round"/>
            <path d="M0,20 C-14,16 -18,-6 -8,-22 C-2,-14 2,-14 8,-22 C18,-6 14,16 0,20 Z"/>
            <path d="M0,18 C-9,14 -10,-6 0,-25 C10,-6 9,14 0,18 Z" fill="rgba(255,255,255,0.28)"/>
            <!-- Đài hoa xanh ôm lấy nụ -->
            <path d="M0,21 C-12,18 -16,8 -13,-2 C-9,8 -4,15 0,18 C4,15 9,8 13,-2 C16,8 12,18 0,21 Z" fill="#2d6a4f"/>
          </g>
        </defs>

        <!-- 1. LỚP GIẤY GÓI LỤA PHÍA SAU -->
        <g id="wrap-back-layer" class="bloom-wrap-back" filter="url(#drop-sh)">
          <path d="M90,190 Q270,55 450,190 L365,465 L175,465 Z" fill="url(#paper-back)"/>
          <path d="M45,235 Q140,120 270,155 L220,460 L125,425 Z" fill="url(#paper-left)"/>
          <path d="M495,235 Q400,120 270,155 L320,460 L415,425 Z" fill="url(#paper-right)"/>
          <path d="M120,165 Q270,85 420,165 L350,445 L190,445 Z" fill="url(#paper-inner)" opacity="0.88"/>
        </g>

        <!-- 2. CÀNH LÁ HỒNG & LÁ KHUYNH DIỆP XÒE RỘNG -->

  <script>
    // =========================================================================
    // 1. NỘI DUNG BỨC THƯ NGUYÊN VĂN CỦA BẠN
    // =========================================================================
    const LETTER_PARAGRAPHS = [
      "Vậy là hành trình nhỏ của chúng mình đến đây là hết rồi nè bé ❤️",
      "Anh hong biết ngoài kia có bao nhiêu lời chúc dành cho bé hôm nay, nhưng anh vẫn muốn tự mình nói với bé một vài điều.",
      "Chúc bé 20/10 thật vui vẻ nhaaa. Anh mong bé sẽ luôn có thật nhiều điều khiến bé mỉm cười, có đủ dũng khí để làm những điều bé muốn, và có thể yêu thương bản thân mình nhiều hơn một chút mỗi ngày.",
      "Anh mong những ngày bé vui, anh có thể vui cùng bé. Những ngày bé mệt, bé có thể kể anh nghe hoặc cứ ở cạnh anh một chút cũng được. Bé hong cần lúc nào cũng phải vui vẻ, hong cần lúc nào cũng phải giỏi giang hay trở thành một người thật hoàn hảo đâu. Bé cứ là bé thoiii.",
      "Anh biết đôi khi hai đứa mình vẫn còn vụng về, vẫn có những lúc chưa hiểu được nhau. Nhưng anh mong tụi mình sẽ ngày càng hiểu nhau hơn, biết cách thương nhau tốt hơn, và cùng nhau trải qua thật nhiều ngày bình thường nữa.",
      "Cảm ơn bé vì đã xuất hiện trong cuộc sống của anh, vì đã cho anh được thương bé, được lắng nghe những câu chuyện của bé và được trở thành một phần trong thế giới của bé.",
      "Mong rằng khi nhìn lại hôm nay, bé sẽ nhớ rằng đã có một người rất vui vì được gặp bé, rất trân trọng bé, và thật lòng mong bé hạnh phúc.",
      "Chúc bé 20/10 vui vẻ nhaaa, cô gái của anh.",
      "Anh thương bé nhiều lắmmm. ❤️"
    ];

    // =========================================================================
    // 2. HỆ THỐNG ÂM THANH & NHẠC HỘP (MUSIC BOX) DỊU DÀNG
    // =========================================================================
    let audioCtx = null;
    let bgmMasterGain = null;
    let bgmPlaying = false;
    let bgmMuted = false;
    let bgmVolume = 0.5;
    let bgmStep = 0;

    const CHIME_NOTES = [523.25, 587.33, 659.25, 783.99, 880.00, 1046.50];

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        bgmMasterGain = audioCtx.createGain();
        bgmMasterGain.gain.setValueAtTime(bgmMuted ? 0 : bgmVolume * 0.24, audioCtx.currentTime);
        bgmMasterGain.connect(audioCtx.destination);
      }
      if (audioCtx.state === "suspended") audioCtx.resume();
      if (!bgmPlaying) startMusicBoxLoop();
    }

    const N = {
      _: 0,
      C3: 130.81, F3: 174.61, G3: 196.00, A3: 220.00,
      C4: 261.63, D4: 293.66, E4: 329.63, F4: 349.23, G4: 392.00, A4: 440.00, B4: 493.88,
      C5: 523.25, D5: 587.33, E5: 659.25, F5: 698.46, G5: 783.99, A5: 880.00, B5: 987.77, C6: 1046.50
    };

    const LEAD_MELODY = [
      N.E5, N._,  N.G5, N.E5, N.C5, N.D5, N.E5, N._,  N.G5, N.A5, N.G5, N.E5, N.D5, N._,  N.C5, N._,
      N.C5, N.E5, N.A5, N._,  N.G5, N.E5, N.C5, N.D5, N.E5, N._,  N.D5, N._,  N.C5, N._,  N._,  N._,
      N.F5, N._,  N.A5, N.F5, N.C5, N.F5, N.A5, N._,  N.G5, N.A5, N.B5, N.G5, N.E5, N._,  N.D5, N._,
      N.E5, N.G5, N.C6, N.B5, N.A5, N.G5, N.E5, N.C5, N.D5, N.E5, N.C5, N._,  N._,  N._,  N._,  N._
    ];

    const ARP_NOTES = [
      N.C4, N.E4, N.G4, N.B4, N.C4, N.E4, N.G4, N.B4, N.C4, N.E4, N.G4, N.B4, N.C4, N.E4, N.G4, N.B4,
      N.A3, N.C4, N.E4, N.G4, N.A3, N.C4, N.E4, N.G4, N.A3, N.C4, N.E4, N.G4, N.A3, N.C4, N.E4, N.G4,
      N.F3, N.A3, N.C4, N.E4, N.F3, N.A3, N.C4, N.E4, N.G3, N.B4, N.D4, N.F4, N.G3, N.B4, N.D4, N.F4,
      N.C4, N.E4, N.G4, N.C5, N.F3, N.A3, N.C4, N.D4, N.G3, N.B4, N.D4, N.G4, N.C4, N.G3, N.E4, N.C4
    ];

    function playBoxNote(freq, dur, waveType, gainVal) {
      if (!audioCtx || !bgmMasterGain || freq <= 0) return;
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = waveType;
      osc.frequency.setValueAtTime(freq, now);

      gain.gain.setValueAtTime(0.001, now);
      gain.gain.linearRampToValueAtTime(gainVal, now + 0.015);
      gain.gain.exponentialRampToValueAtTime(0.001, now + dur);

      osc.connect(gain);
      gain.connect(bgmMasterGain);
      osc.start(now);
      osc.stop(now + dur + 0.02);
    }

    function startMusicBoxLoop() {
      if (bgmPlaying) return;
      bgmPlaying = true;
      setInterval(() => {
        if (!audioCtx || bgmMuted || bgmVolume <= 0.01 || audioCtx.state !== "running") return;
        const lead = LEAD_MELODY[bgmStep];
        const arp = ARP_NOTES[bgmStep];
        if (lead > 0) playBoxNote(lead, 0.34, "sine", 0.25);
        if (arp > 0) playBoxNote(arp, 0.2, "triangle", 0.14);
        bgmStep = (bgmStep + 1) % LEAD_MELODY.length;
      }, 155);
    }

    function updateBgmGain() {
      if (!audioCtx || !bgmMasterGain) return;
      const target = bgmMuted ? 0 : bgmVolume * 0.24;
      bgmMasterGain.gain.setTargetAtTime(target, audioCtx.currentTime, 0.03);
    }

    document.getElementById("bgm-volume").addEventListener("input", (e) => {
      initAudio();
      bgmVolume = parseInt(e.target.value, 10) / 100;
      if (bgmVolume > 0 && bgmMuted) bgmMuted = false;
      document.getElementById("btn-bgm-toggle").innerText = (bgmMuted || bgmVolume === 0) ? "🔇" : "🎵";
      updateBgmGain();
    });

    document.getElementById("btn-bgm-toggle").addEventListener("click", () => {
      initAudio();
      bgmMuted = !bgmMuted;
      document.getElementById("btn-bgm-toggle").innerText = (bgmMuted || bgmVolume === 0) ? "🔇" : "🎵";
      updateBgmGain();
    });

    function playChime(freq, duration = 0.3, vol = 0.16) {
      try {
        initAudio();
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(freq, now);
        gain.gain.setValueAtTime(0.001, now);
        gain.gain.linearRampToValueAtTime(vol, now + 0.015);
        gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + duration);
      } catch (e) {}
    }

    window.addEventListener("pointerdown", () => initAudio(), { once: true });

    // =========================================================================
    // 3. HIỆU ỨNG HOA HỒNG NẢY NỞ KẾT THÀNH BÓ HOA & KẸP BỨC THƯ
    // =========================================================================
    let bloomTimeouts = [];

    function runBouquetBloomSequence() {
      bloomTimeouts.forEach(t => clearTimeout(t));
      bloomTimeouts = [];

      const wrapBack = document.getElementById("wrap-back-layer");
      const foliage = document.getElementById("foliage-layer");
      const wrapFront1 = document.getElementById("wrap-front-layer");
      const wrapFront2 = document.getElementById("wrap-front-layer-2");
      const roses = Array.from(document.querySelectorAll(".rose-item"));
      const babies = document.querySelector(".baby-cluster");
      const tuckedLetter = document.getElementById("tucked-letter-group");

      // Reset trạng thái ban đầu
      wrapBack.classList.remove("show");
      foliage.classList.remove("show");
      wrapFront1.classList.remove("show");
      wrapFront2.classList.remove("show");
      babies.classList.remove("bloomed");
      tuckedLetter.classList.remove("show");
      roses.forEach(r => r.classList.remove("bloomed"));

      // Bước 1: Mở lớp giấy lụa phía sau
      bloomTimeouts.push(setTimeout(() => {
        wrapBack.classList.add("show");
      }, 150));

      // Bước 2: Cành lá vươn lên
      bloomTimeouts.push(setTimeout(() => {
        foliage.classList.add("show");
      }, 500));

      // Bước 3: Lớp giấy gói phía trước ôm lấy bó hoa
      bloomTimeouts.push(setTimeout(() => {
        wrapFront1.classList.add("show");
        wrapFront2.classList.add("show");
      }, 850));

      // Bước 4: 26 Đóa Hoa Hồng & Nụ Hồng lần lượt nảy nở kết thành bó hoa lớn
      const sortedRoses = roses.sort((a, b) => {
        return parseInt(a.getAttribute("data-order") || "0", 10) - parseInt(b.getAttribute("data-order") || "0", 10);
      });

      sortedRoses.forEach((rose, idx) => {
        bloomTimeouts.push(setTimeout(() => {
          rose.classList.add("bloomed");
          if (audioCtx && audioCtx.state === "running" && idx % 2 === 0) {
            playChime(CHIME_NOTES[idx % CHIME_NOTES.length], 0.22, 0.08);
          }
        }, 1050 + idx * 95));
      });

      const totalRoseTime = 1050 + sortedRoses.length * 95;

      // Bước 5: Hoa Baby trắng bung nở điểm xuyết
      bloomTimeouts.push(setTimeout(() => {
        babies.classList.add("bloomed");
      }, totalRoseTime));

      // Bước 6: Bức thư tình cài nhẹ vào giữa thân bó hoa
      bloomTimeouts.push(setTimeout(() => {
        tuckedLetter.classList.add("show");
        if (audioCtx && audioCtx.state === "running") {
          playChime(880, 0.35, 0.14);
        }
      }, totalRoseTime + 350));
    }

    document.getElementById("btn-replay-bloom").addEventListener("click", () => {
      initAudio();
      runBouquetBloomSequence();
    });

    // Chạy hiệu ứng hoa nở ngay khi mở trang
    window.addEventListener("DOMContentLoaded", () => {
      runBouquetBloomSequence();
    });

    // =========================================================================
    // 4. HIỆU ỨNG LẬT MỞ LÁ THƯ 3D & CHỮ HIỆN TỪNG ĐOẠN
    // =========================================================================
    const letterOverlay = document.getElementById("letter-overlay");
    const letterContentBox = document.getElementById("letter-content-box");
    let paragraphTimers = [];

    function openAndFlipLetter(e) {
      if (e && e.clientX) {
        spawnHeartBurst(e.clientX, e.clientY, 16);
      }
      playChime(783.99, 0.4, 0.18);

      // Tạo sẵn các đoạn văn trong thư
      letterContentBox.innerHTML = LETTER_PARAGRAPHS.map((text, i) =>
        `<p id="lp-${i}" class="letter-paragraph">${text}</p>`
      ).join("");

      letterOverlay.style.display = "flex";

      // Kích hoạt animation lật nắp phong bì & trải phẳng tờ thư 3D
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          letterOverlay.classList.add("open");
        });
      });

      // Hiện lần lượt từng đoạn tâm sự sau khi lá thư lật mở ra
      paragraphTimers.forEach(t => clearTimeout(t));
      paragraphTimers = [];

      LETTER_PARAGRAPHS.forEach((_, i) => {
        paragraphTimers.push(setTimeout(() => {
          const pEl = document.getElementById(`lp-${i}`);
          if (pEl) {
            pEl.classList.add("visible");
            // Tự động cuộn nhẹ theo dòng chữ mới xuất hiện
            letterContentBox.scrollTo({
              top: letterContentBox.scrollHeight,
              behavior: "smooth"
            });
          }
        }, 650 + i * 650));
      });
    }

    function closeLetterModal() {
      paragraphTimers.forEach(t => clearTimeout(t));
      paragraphTimers = [];
      letterOverlay.classList.remove("open");
      setTimeout(() => {
        letterOverlay.style.display = "none";
      }, 450);
    }

    document.getElementById("tucked-letter-group").addEventListener("click", openAndFlipLetter);
    document.getElementById("prompt-open-letter").addEventListener("click", openAndFlipLetter);
    document.getElementById("btn-close-letter").addEventListener("click", closeLetterModal);

    // Chạm vào từng đóa hoa hồng để bung tim & chuông gió
    document.querySelectorAll(".rose-item").forEach((rose, idx) => {
      rose.addEventListener("pointerdown", (e) => {
        e.stopPropagation();
        playChime(CHIME_NOTES[idx % CHIME_NOTES.length], 0.35, 0.18);
        spawnHeartBurst(e.clientX, e.clientY, 10);
      });
    });

    // =========================================================================
    // 5. HIỆU ỨNG CÁNH HOA HỒNG BAY & ĐOM ĐÓM TRÊN NỀN
    // =========================================================================
    const bgCanvas = document.getElementById("bgCanvas");
    const bgCtx = bgCanvas.getContext("2d");

    function resizeBg() {
      bgCanvas.width = window.innerWidth;
      bgCanvas.height = window.innerHeight;
    }
    resizeBg();
    window.addEventListener("resize", resizeBg);

    const petals = Array.from({ length: 30 }, () => ({
      x: Math.random() * window.innerWidth,
      y: Math.random() * window.innerHeight,
      vx: -0.35 + Math.random() * 1.0,
      vy: 0.65 + Math.random() * 1.0,
      size: 6 + Math.random() * 6,
      rot: Math.random() * Math.PI * 2,
      vRot: (Math.random() - 0.5) * 0.025,
      color: ["#ff4d6d", "#ff758f", "#ffb3c6", "#ffcad4"][Math.floor(Math.random() * 4)]
    }));

    const fireflies = Array.from({ length: 22 }, () => ({
      x: Math.random() * window.innerWidth,
      y: Math.random() * window.innerHeight,
      vx: (Math.random() - 0.5) * 0.45,
      vy: (Math.random() - 0.5) * 0.45,
      r: 2 + Math.random() * 2.5,
      phase: Math.random() * Math.PI * 2
    }));

    const burstHearts = [];

    function spawnHeartBurst(x, y, count = 12) {
      const icons = ["❤️", "💖", "🌹", "✨", "💗"];
      for (let i = 0; i < count; i++) {
        const ang = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.4;
        const spd = 1.4 + Math.random() * 3.2;
        burstHearts.push({
          x, y,
          vx: Math.cos(ang) * spd,
          vy: Math.sin(ang) * spd - 1.2,
          alpha: 1,
          size: 14 + Math.random() * 9,
          sym: icons[Math.floor(Math.random() * icons.length)]
        });
      }
    }

    function animateBg(timestamp) {
      bgCtx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);

      // Đom đóm lấp lánh
      fireflies.forEach(f => {
        f.x += f.vx;
        f.y += f.vy;
        if (f.x < 0) f.x = bgCanvas.width;
        if (f.x > bgCanvas.width) f.x = 0;
        if (f.y < 0) f.y = bgCanvas.height;
        if (f.y > bgCanvas.height) f.y = 0;

        const alpha = 0.3 + Math.abs(Math.sin(timestamp * 0.002 + f.phase)) * 0.65;
        bgCtx.save();
        bgCtx.globalAlpha = alpha;
        bgCtx.fillStyle = "#ffe066";
        bgCtx.shadowColor = "#ffd166";
        bgCtx.shadowBlur = 10;
        bgCtx.beginPath();
        bgCtx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
        bgCtx.fill();
        bgCtx.restore();
      });

      // Cánh hoa hồng rơi
      petals.forEach(p => {
        p.x += p.vx + Math.sin(timestamp * 0.0015 + p.rot) * 0.35;
        p.y += p.vy;
        p.rot += p.vRot;

        if (p.y > bgCanvas.height + 20) {
          p.y = -15;
          p.x = Math.random() * bgCanvas.width;
        }
        if (p.x > bgCanvas.width + 20) p.x = -15;
        if (p.x < -20) p.x = bgCanvas.width + 15;

        bgCtx.save();
        bgCtx.translate(p.x, p.y);
        bgCtx.rotate(p.rot);
        bgCtx.fillStyle = p.color;
        bgCtx.beginPath();
        bgCtx.moveTo(0, -p.size);
        bgCtx.bezierCurveTo(p.size, -p.size, p.size, p.size, 0, p.size);
        bgCtx.bezierCurveTo(-p.size, p.size, -p.size, -p.size, 0, -p.size);
        bgCtx.fill();
        bgCtx.restore();
      });

      // Hạt tim & hoa khi chạm
      for (let i = burstHearts.length - 1; i >= 0; i--) {
        const bh = burstHearts[i];
        bh.x += bh.vx;
        bh.y += bh.vy;
        bh.vy += 0.05;
        bh.alpha -= 0.018;
        if (bh.alpha <= 0) {
          burstHearts.splice(i, 1);
          continue;
        }
        bgCtx.save();
        bgCtx.globalAlpha = bh.alpha;
        bgCtx.font = `${bh.size}px sans-serif`;
        bgCtx.textAlign = "center";
        bgCtx.fillText(bh.sym, bh.x, bh.y);
        bgCtx.restore();
      }

      requestAnimationFrame(animateBg);
    }

    requestAnimationFrame(animateBg);
  </script>
</body>
</html>
