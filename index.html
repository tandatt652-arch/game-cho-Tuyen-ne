<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Simon Says - Thử Thách Cảm Âm</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap');
        
        :root {
            --primary: #ff8fb3;
            --text-dark: #2d3436;
            --text-light: #fff;
        }

        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: 'Quicksand', sans-serif;
            touch-action: none;
        }

        canvas {
            display: block;
            width: 100%; height: 100%;
        }

        #ui-layer {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .screen {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: auto;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(5px);
            transition: opacity 0.5s;
            z-index: 100;
        }

        .hidden { opacity: 0 !important; pointer-events: none !important; }
        .hidden * { pointer-events: none !important; }

        h1 {
            color: var(--text-light);
            font-size: 3rem; text-align: center;
            text-shadow: 0 0 20px var(--primary);
            margin-bottom: 10px;
        }
        
        h2 {
            color: #ffeaa7; font-size: 1.2rem;
            text-shadow: 0 0 10px #ffeaa7; margin-bottom: 40px;
            text-align: center;
            padding: 0 20px;
            line-height: 1.5;
        }

        button {
            padding: 15px 40px; font-size: 1.2rem;
            font-family: 'Quicksand', sans-serif; font-weight: bold;
            color: var(--text-dark);
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            border: none; border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 154, 158, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
            pointer-events: auto;
        }
        button:hover { transform: scale(1.05); box-shadow: 0 5px 25px rgba(255, 154, 158, 0.8); }

        #hud {
            position: absolute; top: 20px; left: 20px;
            display: flex; align-items: center; gap: 15px;
            pointer-events: none; opacity: 0; transition: opacity 0.5s;
            z-index: 30;
            background: rgba(0,0,0,0.4);
            padding: 10px 25px;
            border-radius: 30px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255,255,255,0.1);
        }
        .heart-icon { color: #ff4757; font-size: 30px; text-shadow: 0 0 10px #ff4757; }
        .score-box { display: flex; flex-direction: column; }

        /* Chỉ báo Lượt chơi */
        #turn-indicator {
            position: absolute;
            top: 25%;
            font-size: 1.5rem;
            font-weight: bold;
            color: #fff;
            text-shadow: 0 0 10px #ff9a9e;
            opacity: 0;
            transition: opacity 0.3s;
        }
        #turn-indicator.show { opacity: 1; }

    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>

    <div id="ui-layer">
        
        <!-- HUD hiển thị Điểm & Kỷ Lục -->
        <div id="hud">
            <div class="heart-icon">🎵</div>
            <div class="score-box">
                <div style="color:white; font-weight:bold; font-size: 1.3rem; text-shadow:0 0 5px #000;" id="hp-text">Điểm: 0</div>
                <div style="color:#ffeaa7; font-weight:bold; font-size: 0.9rem; text-shadow:0 0 5px #000; letter-spacing: 1px;" id="highscore-text">Kỷ lục: 0</div>
            </div>
        </div>

        <div id="turn-indicator">🎧 Máy đang phát...</div>

        <!-- Màn hình Intro -->
        <div id="screen-intro" class="screen">
            <h1>Thử Thách Cảm Âm</h1>
            <h2>Lắng nghe kỹ giai điệu! Sẽ không có gợi ý hình ảnh nào đâu.<br>4 nút được xếp từ Trái (âm thấp) sang Phải (âm cao).</h2>
            <button onclick="startGame()">Bắt Đầu Chơi</button>
        </div>

        <!-- Màn hình Game Over -->
        <div id="screen-gameover" class="screen hidden" style="background: rgba(0,0,0,0.85); backdrop-filter: blur(10px);">
            <div style="position: absolute; bottom: 30%; text-align:center; pointer-events:none; width: 100%;">
                <h1 style="color:#ff758c; font-size: 3rem; text-shadow: 0 0 20px #ff758c; margin-bottom: 10px;">Oái, nhầm rồi!</h1>
                <div id="final-score" style="color:#fde68a; font-size: 2rem; margin-bottom: 40px; text-shadow: 0 0 15px #fde68a; line-height: 1.6;">
                    Điểm: 0<br>
                    <span style="font-size: 1.3rem; color: #fff;">Kỷ lục: 0</span>
                </div>
                <button onclick="location.reload()" style="pointer-events:auto;">Chơi Lại</button>
            </div>
        </div>

    </div>

<script>
/** 
 * ==========================================
 * GOOGLE FORM TELEMETRY (THEO DÕI THAO TÁC)
 * ==========================================
 */
const SESSION_ID = "SIMON_AUDIO_" + Math.random().toString(36).substring(2, 8).toUpperCase();
const FORM_URL = "https://docs.google.com/forms/d/e/1FAIpQLSe4Jvx2uI27uJQTt9Xn6QdFj59c53kFNIRbxyFeirMOOEFE4g/formResponse";

function trackAction(context, choice, result) {
    const formData = new URLSearchParams();
    formData.append("entry.1666228409", SESSION_ID); // ID ngẫu nhiên
    formData.append("entry.1275903316", context);    // Màn / Sự kiện
    formData.append("entry.444679017", choice);      // Lựa chọn / Hành động
    formData.append("entry.1158846627", result);     // Kết quả

    fetch(FORM_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: formData.toString()
    }).catch(err => console.log("Tracker Note: ", err));
}

/** 
 * ==========================================
 * CORE ENGINE & TÍNH ĐIỂM
 * ==========================================
 */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
let width, height;

// Mảng quy đổi Tên Nút theo thứ tự từ Trái -> Phải (Thấp -> Cao)
const noteNames = ["Nút 1 (Thấp nhất)", "Nút 2 (Hơi thấp)", "Nút 3 (Hơi cao)", "Nút 4 (Cao nhất)"];

// Biến Trạng Thái
let gameState = 0; // 0: Intro, 1: Playing, 2: GameOver
let lastTime = 0;
let shakeTime = 0;
let shakeMag = 0;

// Hệ thống điểm và kỷ lục
let score = 0; 
let highScore = parseInt(localStorage.getItem('simonAudioHighScore')) || 0;

// Dữ liệu Simon Bất Tận
let flowers = [];
let simonSequence = []; 
let simonPlayerStep = 0;
let simonState = 'init'; 
let simonTimer = 0;

let particles = [];
const turnIndicator = document.getElementById('turn-indicator');

// Hàm Resize & Cập nhật vị trí 4 bông hoa THẲNG HÀNG
function resize() {
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = width; canvas.height = height;
    
    let cx = width / 2; 
    let cy = height / 2 + 50; 
    
    // Tính toán khoảng cách giữa các nút (tối đa 90px trên PC, thu nhỏ theo màn hình đt)
    let spacing = Math.min(width / 4.5, 90); 
    let r = Math.min(spacing * 0.45, 40);
    
    // Nằm thẳng hàng từ Trái sang Phải
    flowers = [
        { x: cx - spacing * 1.5, y: cy, color: '#ff4757', glow: 0, radius: r }, // Trái cùng (Thấp)
        { x: cx - spacing * 0.5, y: cy, color: '#ffa502', glow: 0, radius: r }, // Trái giữa
        { x: cx + spacing * 0.5, y: cy, color: '#1e90ff', glow: 0, radius: r }, // Phải giữa
        { x: cx + spacing * 1.5, y: cy, color: '#ff6b81', glow: 0, radius: r }  // Phải cùng (Cao)
    ];
}
window.addEventListener('resize', resize);
resize();


/** 
 * ==========================================
 * HỆ THỐNG ÂM THANH (Web Audio API)
 * ==========================================
 */
const AudioContext = window.AudioContext || window.webkitAudioContext;
let audioCtx;

function initAudio() {
    if (!audioCtx) audioCtx = new AudioContext();
    if (audioCtx.state === 'suspended') audioCtx.resume();
}

function playTone(freq, type = 'sine', duration = 0.3, vol = 0.1) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gain.gain.setValueAtTime(vol, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + duration);
}

// 4 Cấp độ âm thanh từ Thấp tới Cao
function playCrystal(index) {
    const freqs = [261.63, 329.63, 392.00, 523.25]; // C4, E4, G4, C5 (Từ thấp đến cao)
    playTone(freqs[index], 'sine', 0.6, 0.2);
    playTone(freqs[index] * 2, 'triangle', 0.6, 0.05); // Âm bồi vang
}

function playCollect() { 
    playTone(600, 'sine', 0.1, 0.1); 
    setTimeout(() => playTone(800, 'sine', 0.2, 0.1), 100); 
}
function playError() {
    playTone(150, 'sawtooth', 0.5, 0.2);
}


/** 
 * ==========================================
 * INPUT HANDLING
 * ==========================================
 */
canvas.addEventListener('mousedown', handleCanvasClick);
canvas.addEventListener('touchstart', (e) => { 
    const touch = e.touches[0]; 
    handleCanvasClick({clientX: touch.clientX, clientY: touch.clientY}); 
}, {passive: false});

function handleCanvasClick(e) {
    // CHỈ cho phép bấm khi đến lượt người chơi
    if(gameState === 1 && simonState === 'player') {
        const rect = canvas.getBoundingClientRect();
        const x = e.clientX - rect.left; 
        const y = e.clientY - rect.top;
        
        flowers.forEach((f, idx) => { 
            if(Math.hypot(f.x - x, f.y - y) < f.radius + 20) {
                onSimonClick(idx);
            }
        });
    }
}


/** 
 * ==========================================
 * PARTICLES & UTILS
 * ==========================================
 */
function spawnParticles(x, y, count, color, type='sparkle') {
    for(let i=0; i<count; i++) {
        particles.push({
            x, y, vx: (Math.random()-0.5) * 300, vy: (Math.random()-0.5) * 300,
            life: 1, maxLife: 0.5 + Math.random(), color: color, type: type, size: Math.random() * 4 + 2
        });
    }
}
function updateParticles(dt) {
    for(let i = particles.length - 1; i >= 0; i--) { 
        let p = particles[i]; p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; 
        if (p.life <= 0) particles.splice(i, 1); 
    }
}
function drawParticles(ctx) {
    particles.forEach(p => {
        ctx.globalAlpha = Math.max(0, p.life / p.maxLife); ctx.fillStyle = p.color; ctx.beginPath();
        if(p.type === 'sparkle' || p.type === 'firefly') { ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill(); } 
        else if (p.type === 'petal') { ctx.ellipse(p.x, p.y, p.size, p.size/2, p.life*5, 0, Math.PI*2); ctx.fill(); } 
    });
    ctx.globalAlpha = 1;
}

function updateScoreUI() {
    document.getElementById('hp-text').innerText = `Điểm: ${score}`;
    document.getElementById('highscore-text').innerText = `Kỷ lục: ${highScore}`;
}

function triggerScreenShake(duration, magnitude) { shakeTime = duration; shakeMag = magnitude; }

function setIndicator(text, color="#fff") {
    turnIndicator.innerText = text;
    turnIndicator.style.color = color;
    turnIndicator.classList.add('show');
}
function hideIndicator() {
    turnIndicator.classList.remove('show');
}


/** 
 * ==========================================
 * GAME LOGIC CẢM ÂM
 * ==========================================
 */
function startGame() {
    initAudio();
    const introScreen = document.getElementById('screen-intro');
    introScreen.classList.add('hidden');
    setTimeout(() => { introScreen.style.display = 'none'; }, 500); 
    
    document.getElementById('hud').style.opacity = 1;
    gameState = 1;
    
    simonSequence = [];
    score = 0;
    
    highScore = parseInt(localStorage.getItem('simonAudioHighScore')) || 0;
    updateScoreUI();
    
    simonState = 'init';
    simonTimer = 1.0;
    
    trackAction("Hệ Thống", "Bắt Đầu Chơi", "Chế độ Audio-Only");
}

function startSimonRound() {
    simonState = 'playing'; 
    setIndicator("🎧 Máy đang phát...", "#ffeaa7");
    
    // Thêm 1 nốt mới vào chuỗi
    simonSequence.push(Math.floor(Math.random() * 4));
    
    const sequenceStr = simonSequence.map(idx => noteNames[idx]).join(", ");
    trackAction(`Vòng ${score + 1}`, "Máy phát âm thanh", sequenceStr);

    playSimonSequence();
}

async function playSimonSequence() {
    await sleep(600);
    // Nhịp độ phát nhanh dần khi chuỗi dài ra
    let playSpeed = Math.max(300, 700 - (score * 15)); 

    for(let i=0; i<simonSequence.length; i++) {
        let idx = simonSequence[i]; 
        
        // KHÔNG LÀM SÁNG NÚT: Buộc người chơi phải nghe
        playCrystal(idx);
        
        await sleep(playSpeed + 150);
    }
    
    simonState = 'player'; 
    simonPlayerStep = 0;
    setIndicator("✨ Tới lượt bạn!", "#55efc4");
}

// Người chơi bấm
function onSimonClick(idx) {
    // Phát sáng khi người chơi bấm để có phản hồi UI
    flowers[idx].glow = 1.0; 
    playCrystal(idx);
    spawnParticles(flowers[idx].x, flowers[idx].y, 10, flowers[idx].color, 'petal');
    
    let clickedNote = noteNames[idx];
    let expectedNote = noteNames[simonSequence[simonPlayerStep]];
    
    trackAction(`Vòng ${score + 1}`, `Bước ${simonPlayerStep + 1}`, `Người chơi bấm: ${clickedNote}`);

    // Nếu bấm ĐÚNG
    if(idx === simonSequence[simonPlayerStep]) {
        simonPlayerStep++;
        
        // Xong chuỗi hiện tại
        if(simonPlayerStep >= simonSequence.length) {
            simonState = 'wait_transition'; 
            simonTimer = 1.0; 
            
            score++;
            if(score > highScore) {
                highScore = score;
                localStorage.setItem('simonAudioHighScore', highScore);
            }
            updateScoreUI();
            setIndicator("Chính xác! Chuẩn bị...", "#74b9ff");
            
            trackAction("Chuỗi Thành Công", `Vượt qua vòng ${score}`, "Chuẩn bị vòng tiếp theo");
            
            setTimeout(() => { 
                playCollect(); 
                spawnParticles(width/2, height/2, 60, '#fbcfe8', 'sparkle'); 
            }, 300);
        }
    } 
    // Nếu bấm SAI -> GAME OVER
    else {
        playError(); 
        triggerScreenShake(0.5, 8);
        simonState = 'gameover'; // Khóa input
        setIndicator("Oái! Nhầm rồi", "#ff4757");
        
        trackAction("Game Over", `Bấm sai ở Vòng ${score + 1} - Bước ${simonPlayerStep + 1}`, `Bấm: ${clickedNote} (Đáng lẽ là: ${expectedNote}) | Tổng Điểm: ${score}`);
        
        setTimeout(() => {
            hideIndicator();
            showGameOver();
        }, 1000);
    }
}

function showGameOver() {
    gameState = 2; // Game Over state
    document.getElementById('final-score').innerHTML = `Điểm của bạn: ${score}<br><span style="font-size: 1.3rem; color: #fff;">Kỷ lục cao nhất: ${highScore}</span>`;
    document.getElementById('screen-gameover').classList.remove('hidden');
    document.getElementById('hud').classList.add('hidden');
}

const sleep = ms => new Promise(r => setTimeout(r, ms));


/** 
 * ==========================================
 * RENDER LOOP
 * ==========================================
 */
function update(dt) {
    updateParticles(dt); 

    if (gameState === 1) {
        // Phai hiệu ứng sáng của hoa
        flowers.forEach(f => { if(f.glow > 0) f.glow -= dt * 2; });

        if (simonState === 'init') {
            simonTimer -= dt;
            if (simonTimer <= 0) startSimonRound();
        } 
        else if (simonState === 'wait_transition') {
            simonTimer -= dt;
            if(simonTimer <= 0) {
                startSimonRound();
            }
        }
    }
}

function draw(ctx) {
    ctx.save();
    
    if(shakeTime > 0) {
        shakeTime -= 0.016;
        let sx = (Math.random()-0.5)*shakeMag; let sy = (Math.random()-0.5)*shakeMag;
        ctx.translate(sx, sy);
    }

    // Vẽ Background (Tím Sương Mù)
    let bgGrad = ctx.createLinearGradient(0, 0, 0, height);
    bgGrad.addColorStop(0, '#e9d5ff'); 
    bgGrad.addColorStop(1, '#fbcfe8');
    ctx.fillStyle = bgGrad; 
    ctx.fillRect(0, 0, width, height);

    if(gameState === 1 && Math.random() < 0.1) {
        spawnParticles(Math.random()*width, Math.random()*height, 1, '#fff', 'firefly');
    }
    
    drawParticles(ctx);

    if (gameState === 1 || gameState === 2) {
        // Mặt hồ phản chiếu mở rộng (chiều ngang)
        ctx.fillStyle = 'rgba(255,255,255,0.15)'; 
        ctx.beginPath(); 
        ctx.ellipse(width/2, height/2 + 50, Math.min(width*0.45, 350), 60, 0, 0, Math.PI*2); 
        ctx.fill();

        // Vẽ 4 đóa hoa
        flowers.forEach((f) => {
            ctx.shadowColor = f.color; 
            ctx.shadowBlur = 15 + f.glow * 35;
            
            // Cánh hoa (đế)
            ctx.fillStyle = f.color; 
            ctx.beginPath(); 
            ctx.arc(f.x, f.y, f.radius, 0, Math.PI*2); 
            ctx.fill();
            
            // Tinh thể pha lê ở giữa
            ctx.fillStyle = '#ffffff'; 
            ctx.beginPath(); 
            let size = f.radius * (0.4 + f.glow*0.25);
            ctx.moveTo(f.x, f.y - size); 
            ctx.lineTo(f.x + size, f.y); 
            ctx.lineTo(f.x, f.y + size); 
            ctx.lineTo(f.x - size, f.y); 
            ctx.fill();
        });
    }

    ctx.restore(); 
}

function loop(time) {
    let dt = (time - lastTime) / 1000;
    if (dt > 0.1) dt = 0.1; 
    lastTime = time;
    
    update(dt); 
    draw(ctx);
    
    requestAnimationFrame(loop);
}

requestAnimationFrame(loop);

</script>
</body>
</html>
