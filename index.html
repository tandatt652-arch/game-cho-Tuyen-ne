    <style>
        body, html {

            touch-action: none;
        }
        
        #ui-overlay {
            position: absolute; top: 0; left: 0; width: 100%; pointer-events: none; z-index: 10;

        }
        .panel {
            background: rgba(236, 240, 241, 0.95); padding: 15px; border-radius: 10px;
            width: 90%; max-width: 650px; pointer-events: auto;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4); border: 2px solid #bdc3c7;
        }
        .header-info {
            display: flex; justify-content: space-between; align-items: center;
            font-weight: bold; color: #e74c3c; font-size: 15px; margin-bottom: 8px; gap: 5px;
        }
        .level-controls { display: flex; align-items: center; gap: 5px; color: #2c3e50; }
        #level-input { width: 40px; text-align: center; border: 1px solid #95a5a6; border-radius: 5px; padding: 3px; font-weight: bold;}
        #btn-jump-level { background: #27ae60; color: white; border: none; border-radius: 5px; cursor: pointer; padding: 4px 10px; font-weight: bold; }
        #health-display { background: #ff7675; color: white; padding: 4px 10px; border-radius: 15px; }

        #instruction { font-style: italic; font-size: 13px; color: #2980b9; margin-bottom: 6px; font-weight: bold;}
        #context { 
            background: #fff; padding: 10px; border: 1px solid #ccc; border-radius: 5px; 
            font-size: 14px; max-height: 100px; overflow-y: auto; margin-bottom: 8px; 
            display: none; white-space: pre-wrap; line-height: 1.4; color: #34495e;
        }
        #question { font-weight: bold; font-size: 15px; color: #2c3e50; margin-bottom: 10px; }
        #options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; font-size: 14px; }
        .opt-box {
            background: #ffffff; border: 1px solid #bdc3c7; padding: 8px 10px; 
            border-radius: 6px; color: #2c3e50; word-break: break-word; font-weight: bold;
        }

        #btn-help {
            position: absolute; top: 10px; right: 10px; background: #f39c12; color: white;
            border: none; padding: 10px 15px; border-radius: 8px; font-weight: bold;
            pointer-events: auto; cursor: pointer; box-shadow: 0 4px #e67e22; z-index: 20;
        }
        #btn-help:active { transform: translateY(4px); box-shadow: none; }
        #btn-help:disabled { background: #95a5a6; box-shadow: none; opacity: 0.7; }

        #notification {
            position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.85); padding: 15px 30px; border-radius: 8px;
            font-size: 18px; font-weight: bold; text-align: center; color: white;
            opacity: 0; pointer-events: none; z-index: 100; transition: opacity 0.3s ease;
        }

        #end-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(44, 62, 80, 0.98); z-index: 200; pointer-events: auto;
            display: none; flex-direction: column; align-items: center; justify-content: center;
            text-align: center; padding: 20px; box-sizing: border-box; color: white;
        }
        #end-msg { font-size: 26px; font-weight: bold; margin-bottom: 25px; line-height: 1.5; }
        #btn-restart {
            background: #f1c40f; border: none; padding: 15px 35px; border-radius: 10px; 
            font-size: 18px; font-weight: bold; cursor: pointer; color: #2c3e50;
        }

        /* Control Mobile */
        #joystick-zone {
            position: absolute; bottom: 30px; left: 30px; width: 120px; height: 120px;
            background: rgba(255, 255, 255, 0.15); border-radius: 50%; border: 2px solid rgba(255,255,255,0.4);
            z-index: 20; pointer-events: auto;
        }
        #joystick-knob {
            position: absolute; top: 50%; left: 50%; width: 50px; height: 50px;
            background: rgba(255, 255, 255, 0.7); border-radius: 50%;
            transform: translate(-50%, -50%); pointer-events: none;
        }
        
        /* Nút Nhảy 3D */
        #btn-jump-3d {
            position: absolute; bottom: 40px; right: 40px; width: 70px; height: 70px;
            background: rgba(255, 255, 255, 0.15); border-radius: 50%; border: 2px solid rgba(255,255,255,0.4);
            color: white; font-weight: bold; font-size: 14px;
            display: flex; align-items: center; justify-content: center;
            z-index: 20; pointer-events: auto; cursor: pointer; user-select: none;
        }
        #btn-jump-3d:active { background: rgba(255, 255, 255, 0.5); }

        #crosshair {
            position: absolute; top: 50%; left: 50%; width: 12px; height: 12px;
            border: 2px solid white; border-radius: 50%; transform: translate(-50%, -50%);
            z-index: 5; pointer-events: none; opacity: 0.8;
        }
        #touch-look-zone {
            position: absolute; top: 0; right: 0; width: 60%; height: 100%;
            z-index: 5; pointer-events: auto;
        }
    </style>

        { id: 42, part: "PART 6: READING COMPREHENSION", context: "Sociologists have been carrying out research into the social pressure on teenagers. Many adolescents are unhappy at school because they find it difficult to make friends. They may also worry about their appearance and there is a great deal of pressure on them to dress, talk and behave the same as others. This phenomenon is called peer pressure, and it is very common in today's society.\n\nThere are a number of programs for teenagers on TV. They provide them with practical skills such as reasoning skills, social skills and cognitive skills.", question: "According to the passage, why are many adolescents unhappy at school?", options: { A: "Because they have too much homework.", B: "Because they find it difficult to make friends.", C: "Because they do not like their teachers.", D: "Because they don't have enough money." }, correct_answer: "B" },
        { id: 43, part: "PART 6: READING COMPREHENSION", context: "Sociologists have been carrying out research into the social pressure on teenagers. Many adolescents are unhappy at school because they find it difficult to make friends. They may also worry about their appearance and there is a great deal of pressure on them to dress, talk and behave the same as others. This phenomenon is called peer pressure, and it is very common in today's society.\n\nThere are a number of programs for teenagers on TV. They provide them with practical skills such as reasoning skills, social skills and cognitive skills.", question: "How does the passage describe \"peer pressure\"?", options: { A: "The pressure from parents to get good grades.", B: "The pressure to dress, talk and behave the same as others.", C: "The pressure to watch educational TV programs.", D: "The pressure to work part-time." }, correct_answer: "B" },
        { id: 44, part: "PART 6: READING COMPREHENSION", context: "Sociologists have been carrying out research into the social pressure on teenagers. Many adolescents are unhappy at school because they find it difficult to make friends. They may also worry about their appearance and there is a great deal of pressure on them to dress, talk and behave the same as others. This phenomenon is called peer pressure, and it is very common in today's society.\n\nThere are a number of programs for teenagers on TV. They provide them with practical skills such as reasoning skills, social skills and cognitive skills.", question: "Why do some teenagers do negative things according to paragraph 2?", options: { A: "Because they want to be famous.", B: "Because they lack cognitive skills.", C: "Just to make others accept them.", D: "Because they rebel against their parents." }, correct_answer: "C" },
        { id: 45, part: "PART 6: READING COMPREHENSION", context: "Sociologists have been carrying out research into the social pressure on teenagers. Many adolescents are unhappy at school because they find it difficult to make friends. They may also worry about their appearance and there is a great deal of pressure on them to dress, talk and behave the same as others. This phenomenon is called peer pressure, and it is very common in today's society.\n\nThere are a number of programs for teenagers on TV. They provide them with practical skills such as reasoning skills, social skills and cognitive skills.", question: "What is the author's advice for teenagers when they have a problem?", options: { A: "They should watch more TV programs.", B: "They should change their appearance.", C: "They should drive carefully.", D: "They should find friends to share their emotions and thoughts." }, correct_answer: "D" },
        { id: 46, part: "PART 7: SENTENCE TRANSFORMATION", context: null, question: "The traffic was too chaotic. The traffic police had a hard time controlling the vehicle flow.", options: { A: "It was such chaotic traffic that the traffic police had a hard time controlling the vehicle flow.", B: "The traffic was too chaotic that the traffic police had a hard time controlling the vehicle flow.", C: "It was so chaotic traffic that the traffic police had a hard time controlling the vehicle flow.", D: "Such chaotic was the traffic that the police didn't control the flow." }, correct_answer: "A" },
        { id: 47, part: "PART 7: SENTENCE TRANSFORMATION", context: null, question: "You should wear your coat, or you may catch a cold.", options: { A: "Unless you don't wear your coat, you may catch a cold.", B: "If you don't wear your coat, you may catch a cold.", C: "If you wear your coat, you may catch a cold.", D: "If you didn't wear your coat, you might catch a cold." }, correct_answer: "B" },
        { id: 48, part: "PART 7: SENTENCE TRANSFORMATION", context: null, question: "The buses are so overcrowded during the rush hour.", options: { A: "My mum wishes the buses wouldn't be overcrowded.", B: "My mum wishes the buses aren't so overcrowded during the rush hour.", C: "My mum wishes the buses weren't so overcrowded during the rush hour.", D: "My mum wishes the buses hasn't been so overcrowded during the rush hour." }, correct_answer: "C" },
        { id: 49, part: "PART 7: SENTENCE TRANSFORMATION", context: null, question: "The student completed the quiz the fastest. The teacher praised her.", options: { A: "The student which the teacher praised completed the quiz the fastest.", B: "The student whom the teacher praised completed the quiz the fastest.", C: "The student whose the teacher praised completed the quiz the fastest.", D: "The student, who completed the quiz the fastest, praised the teacher." }, correct_answer: "B" },
        { id: 50, part: "PART 7: SENTENCE TRANSFORMATION", context: null, question: "\"Why don't we visit the Kon Klor suspension bridge?\" said Lan.", options: { A: "Lan advised us to visit the Kon Klor suspension bridge.", B: "Lan suggested to visit the Kon Klor suspension bridge.", C: "Lan asked why didn't we visit the Kon Klor suspension bridge.", D: "Lan suggested visiting the Kon Klor suspension bridge." }, correct_answer: "D" }
    ];

    // ================= KHỞI TẠO 3D ENGINE =================
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87CEEB); 
    scene.fog = new THREE.Fog(0x87CEEB, 25, 120);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
    scene.add(ambientLight);
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(50, 100, 30);
    scene.add(dirLight);

    // Môi trường: Mặt đất
    const floorGeo = new THREE.PlaneGeometry(100, 400);
    const floorMat = new THREE.MeshLambertMaterial({ color: 0x2ecc71 });
    const floor = new THREE.Mesh(floorGeo, floorMat);
    floor.rotation.x = -Math.PI / 2;
    scene.add(floor);

    // Tường hầm
    const wallGeo = new THREE.BoxGeometry(2, 25, 400);
    const wallMat = new THREE.MeshLambertMaterial({ color: 0xa34b1f });
    const leftWall = new THREE.Mesh(wallGeo, wallMat);
    leftWall.position.set(-21, 12.5, 0);
    scene.add(leftWall);
    const rightWall = new THREE.Mesh(wallGeo, wallMat);
    rightWall.position.set(21, 12.5, 0);
    scene.add(rightWall);

    // Tường cuối
    const endWallGeo = new THREE.BoxGeometry(40, 25, 2);
    const endWallMat = new THREE.MeshLambertMaterial({ color: 0xc0392b }); 
    const endWall = new THREE.Mesh(endWallGeo, endWallMat);
    endWall.position.set(0, 12.5, -61); 
    scene.add(endWall);

    // Mây
    const clouds = [];
    const cloudGeo = new THREE.BoxGeometry(12, 5, 12);
    const cloudMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.85 });
    for(let i=0; i<20; i++){
        const cloud = new THREE.Mesh(cloudGeo, cloudMat);
        cloud.position.set((Math.random() - 0.5) * 180, 35 + Math.random() * 10, (Math.random() - 0.5) * 200);
        scene.add(cloud);
        clouds.push(cloud);
    }

    // ================= CỬA NHÀ =================
    const doorGroups = []; 
    const doorIds = ['A', 'B', 'C', 'D'];
    const doorPositions = [-15, -5, 5, 15];

    const frameGeo = new THREE.BoxGeometry(9, 13, 0.5);
    const frameMat = new THREE.MeshLambertMaterial({ color: 0x34495e });
    const doorGeo = new THREE.BoxGeometry(8, 12, 1);
    const knobGeo = new THREE.SphereGeometry(0.4, 16, 16);
    const knobMat = new THREE.MeshStandardMaterial({ color: 0xcd7f32, metalness: 0.9, roughness: 0.1 });

    function createNormalDoorTexture(text, state) {
        const canvas = document.createElement('canvas');
        canvas.width = 256; canvas.height = 256;
        const ctx = canvas.getContext('2d');

        ctx.fillStyle = '#8e44ad';
        ctx.fillRect(0, 0, 256, 256);

        ctx.strokeStyle = 'rgba(0,0,0,0.1)';
        ctx.lineWidth = 2;
        for(let i=0; i<256; i+=10) {
            ctx.beginPath();
            ctx.moveTo(0, i); ctx.lineTo(256, i + (Math.random()-0.5)*20);
            ctx.stroke();
        }

        ctx.strokeStyle = 'rgba(0,0,0,0.4)';
        ctx.lineWidth = 8;
        ctx.strokeRect(20, 20, 216, 100); 
        ctx.strokeRect(20, 136, 216, 100); 

        ctx.fillStyle = 'white';
        ctx.font = 'bold 160px Arial';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.lineWidth = 12; ctx.strokeStyle = 'black';
        
        if (state === 'active') {
            ctx.strokeText(text, 128, 128);
            ctx.fillText(text, 128, 128);
        } else if (state === 'wrong') {
            ctx.fillStyle = 'rgba(231, 76, 60, 0.6)'; 
            ctx.fillRect(0, 0, 256, 256);
            ctx.strokeStyle = 'rgba(255,255,255,0.7)';
            ctx.lineWidth = 20;
            ctx.beginPath(); ctx.moveTo(30, 30); ctx.lineTo(226, 226);
            ctx.moveTo(226, 30); ctx.lineTo(30, 226); ctx.stroke();
            ctx.fillStyle = 'rgba(255,255,255,0.3)';
            ctx.fillText(text, 128, 128);
        }

        const texture = new THREE.CanvasTexture(canvas);
        return new THREE.MeshLambertMaterial({ map: texture });
    }

    for(let i=0; i<4; i++){
        const group = new THREE.Group();
        group.position.set(doorPositions[i], 6, -60);

        const frame = new THREE.Mesh(frameGeo, frameMat);
        frame.position.z = -0.6;
        group.add(frame);

        const doorMat = createNormalDoorTexture(doorIds[i], 'active');
        const doorBody = new THREE.Mesh(doorGeo, doorMat);
        group.add(doorBody);

        const knob = new THREE.Mesh(knobGeo, knobMat);
        knob.position.set(3, -1, 0.6); 
        group.add(knob);

        group.userData = { id: doorIds[i], active: true, doorBody: doorBody, knob: knob };
        scene.add(group);
        doorGroups.push(group);
    }

    // ================= LOGIC GAME & VẬT LÝ =================
    let health = 10;
    let hasCheated = false;
    let mistakesThisLevel = 0;
    let currentLevel = 1;
    const MAX_LEVEL = 50; 
    let currentQData = null;
    let helpUsed = false;

    // Các biến Vật Lý cho tính năng nhảy
    const basePlayerY = 5.5; 
    let moveSpeed = 0.55;
    let velocityY = 0;
    const gravity3D = -0.015;
    const jumpForce = 0.3;
    let isGrounded = true;
    
    const keys = { forward: false, backward: false, left: false, right: false };
    let joyX = 0, joyY = 0; 
    let camYaw = 0, camPitch = 0;
    const PI_2 = Math.PI / 2;

    let notifyTimeout = null;
    function showNotification(msg, type) {
        const noti = document.getElementById('notification');
        noti.innerText = msg;
        noti.style.border = type === 'error' ? "3px solid #e74c3c" : "3px solid #2ecc71";
        noti.style.color = type === 'error' ? "#ff7675" : "#55efc4";
        noti.style.opacity = 1;
        if (notifyTimeout) clearTimeout(notifyTimeout);
        notifyTimeout = setTimeout(() => { noti.style.opacity = 0; }, 2200); 
    }

    function updateHealthUI() {
        document.getElementById('health-display').innerText = `❤️ ${health}`;
    }

    function fullResetGame() {
        health = 10; currentLevel = 1; hasCheated = false;
        updateHealthUI(); loadLevel();
    }

    function loadLevel() {
        mistakesThisLevel = 0; helpUsed = false;
        document.getElementById('btn-help').disabled = false;
        document.getElementById('level-display').innerText = currentLevel;
        updateHealthUI();

        camera.position.set(0, basePlayerY, 35);
        camYaw = 0; camPitch = 0;
        camera.rotation.set(0, 0, 0);

        for(let i=0; i<4; i++){
            const dg = doorGroups[i];
            dg.userData.active = true;
            dg.userData.doorBody.material = createNormalDoorTexture(doorIds[i], 'active');
            dg.userData.knob.visible = true; 
        }

        currentQData = questionBank[currentLevel - 1];
        document.getElementById('instruction').innerText = currentQData.part; 
        document.getElementById('question').innerText = currentQData.question;
        
        const contextDiv = document.getElementById('context');
        if(currentQData.context) {
            contextDiv.style.display = "block";contextDiv.innerText = currentQData.context;contextDiv.scrollTop = 0; 
        } else { contextDiv.style.display = "none"; }

        // Đổ đáp án sạch sẽ
        ['A','B','C','D'].forEach(id => {
            const optDiv = document.getElementById('opt-'+id);
            optDiv.style.textDecoration = "none";
            optDiv.style.color = "#2c3e50";
            optDiv.style.background = "#ffffff";
            optDiv.innerText = `${id}. ${currentQData.options[id]}`;
        });
    }

    function checkDoorCollision() {
        if (camera.position.z < -57.5) {
            for(let i=0; i<4; i++){
                const dg = doorGroups[i];
                if (!dg.userData.active) continue;
                
                if (Math.abs(camera.position.x - doorPositions[i]) < 4.2) {
                    if (dg.userData.id === currentQData.correct_answer) {
                        if (currentLevel === MAX_LEVEL) {
                            endGame();
                        } else {
                            if (mistakesThisLevel > 0) showNotification("Cố gắng làm tốt hơn nha bé oii", "error");
                            else showNotification("Hmmm, bé này cũng dỏi đó chớ, làm câu nữa đi", "success");
                            currentLevel++;
                            loadLevel();
                        }
                    } else {
                        health--; mistakesThisLevel++;
                        updateHealthUI();
                        showNotification("Làm vầy rồi thi tuyển sinh sao đậu trời (Trừ 1 Máu)", "error");
                        
                        dg.userData.active = false;
                        dg.userData.doorBody.material = createNormalDoorTexture(dg.userData.id, 'wrong');
                        dg.userData.knob.visible = false; 

                        // Bôi xám đáp án sai
                        const wrongOpt = document.getElementById('opt-' + dg.userData.id);
                        wrongOpt.style.textDecoration = "line-through";
                        wrongOpt.style.color = "#95a5a6";
                        wrongOpt.style.background = "#ecf0f1";
                        
                        camera.position.z = -45;

                        if (health <= 0) {
                            showNotification("Hết máu! Bắt đầu lại nào...", "error");
                            setTimeout(fullResetGame, 1500);
                        }
                    }
                    return; 
                }
            }
            if(camera.position.z < -59.5) camera.position.z = -59.5;
        }
        
        if(camera.position.z > 50) camera.position.z = 50;
        if(camera.position.x < -18.5) camera.position.x = -18.5;
        if(camera.position.x > 18.5) camera.position.x = 18.5;
    }

    function endGame() {
        const endScreen = document.getElementById('end-screen');
        const endMsg = document.getElementById('end-msg');
        const btnRestart = document.getElementById('btn-restart');
        endScreen.style.display = "flex";
        
        if (hasCheated) { 
            endMsg.innerText = "GIAN LẬN RỒI BÉ NÀY HƯ QUÁ!\nPHẢI DẠY LẠI THÔI."; 
            endMsg.style.color = "#e74c3c";
            btnRestart.innerText = "Làm lại không gian lận";
        } else { 
            endMsg.innerText = "Bé Tuyến giỏi quá nè 🎉"; 
            endMsg.style.color = "#2ecc71"; 
            btnRestart.innerText = "Chơi lại từ đầu";
        }
        btnRestart.onclick = () => { endScreen.style.display = "none"; fullResetGame(); }
    }

    // Tính năng 50/50
    document.getElementById('btn-help').addEventListener('click', () => {
        if (helpUsed) return;
        helpUsed = true;
        document.getElementById('btn-help').disabled = true;

        let wrongDoors = doorGroups.filter(dg => dg.userData.id !== currentQData.correct_answer && dg.userData.active);
        wrongDoors.sort(() => Math.random() - 0.5);
        
        for(let i=0; i<Math.min(2, wrongDoors.length); i++){
            const dg = wrongDoors[i];
            dg.userData.active = false;
            dg.userData.doorBody.material = createNormalDoorTexture(dg.userData.id, 'wrong');
            dg.userData.knob.visible = false; 

            const wrongOpt = document.getElementById('opt-' + dg.userData.id);
            wrongOpt.style.textDecoration = "line-through";
            wrongOpt.style.color = "#95a5a6";
            wrongOpt.style.background = "#ecf0f1";
        }
    });

    document.getElementById('btn-jump-level').addEventListener('click', () => {
        let inputVal = parseInt(document.getElementById('level-input').value);
        if (inputVal >= 1 && inputVal <= MAX_LEVEL) {
            hasCheated = true; currentLevel = inputVal;
            showNotification("Đã dùng tính năng Dịch Chuyển!", "error");
            loadLevel();
        }
    });

    // ================= CONTROLS =================

    // Hàm thực hiện Nhảy
    function triggerJump() {
        if (isGrounded) {
            velocityY = jumpForce;
            isGrounded = false;
        }
    }

    // Sự kiện Nút Nhảy trên Màn hình
    const btnJump3D = document.getElementById('btn-jump-3d');
    btnJump3D.addEventListener('touchstart', (e) => { e.preventDefault(); triggerJump(); }, {passive: false});
    btnJump3D.addEventListener('mousedown', (e) => { e.preventDefault(); triggerJump(); });

    window.addEventListener('keydown', (e) => {
        if (e.key === 'w' || e.key === 'W' || e.key === 'ArrowUp') keys.forward = true;
        if (e.key === 's' || e.key === 'S' || e.key === 'ArrowDown') keys.backward = true;
        if (e.key === 'a' || e.key === 'A' || e.key === 'ArrowLeft') keys.left = true;
        if (e.key === 'd' || e.key === 'D' || e.key === 'ArrowRight') keys.right = true;
        if (e.code === 'Space') triggerJump(); // Gắn phím Spacebar để nhảy
    });
    window.addEventListener('keyup', (e) => {
        if (e.key === 'w' || e.key === 'W' || e.key === 'ArrowUp') keys.forward = false;
        if (e.key === 's' || e.key === 'S' || e.key === 'ArrowDown') keys.backward = false;
        if (e.key === 'a' || e.key === 'A' || e.key === 'ArrowLeft') keys.left = false;
        if (e.key === 'd' || e.key === 'D' || e.key === 'ArrowRight') keys.right = false;
    });

    let isDragging = false;
    const lookZone = document.getElementById('touch-look-zone');
    lookZone.addEventListener('mousedown', () => isDragging = true);
    window.addEventListener('mouseup', () => isDragging = false);
    window.addEventListener('mousemove', (e) => {
        if (isDragging) {
            camYaw -= e.movementX * 0.005; camPitch -= e.movementY * 0.004;
            camPitch = Math.max(-PI_2, Math.min(PI_2, camPitch));
            camera.rotation.set(camPitch, camYaw, 0, 'YXZ');
        }
    });

    const joyZone = document.getElementById('joystick-zone');
    const joyKnob = document.getElementById('joystick-knob');
    let joyActive = false;
    let joyCenter = { x: 0, y: 0 };

    joyZone.addEventListener('touchstart', (e) => {
        e.preventDefault(); joyActive = true;
        let rect = joyZone.getBoundingClientRect();
        joyCenter = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
        updateJoystick(e.touches[0]);
    }, {passive: false});

    joyZone.addEventListener('touchmove', (e) => {
        e.preventDefault(); if (joyActive) updateJoystick(e.touches[0]);
    }, {passive: false});

    const resetJoy = () => { joyActive = false; joyX = 0; joyY = 0; joyKnob.style.transform = `translate(-50%, -50%)`; };
    joyZone.addEventListener('touchend', resetJoy);
    joyZone.addEventListener('touchcancel', resetJoy);

    function updateJoystick(touch) {
        let dx = touch.clientX - joyCenter.x;
        let dy = touch.clientY - joyCenter.y;
        let distance = Math.min(55, Math.sqrt(dx*dx + dy*dy)); 
        let angle = Math.atan2(dy, dx);
        
        let moveX = distance * Math.cos(angle);
        let moveY = distance * Math.sin(angle);
        joyKnob.style.transform = `translate(calc(-50% + ${moveX}px), calc(-50% + ${moveY}px))`;
        
        joyX = moveX / 55; joyY = moveY / 55; 
    }

    let lastTouchX = 0, lastTouchY = 0;
    lookZone.addEventListener('touchstart', (e) => {
        lastTouchX = e.touches[0].clientX; lastTouchY = e.touches[0].clientY;
    });
    lookZone.addEventListener('touchmove', (e) => {
        e.preventDefault();
        let dx = e.touches[0].clientX - lastTouchX;
        let dy = e.touches[0].clientY - lastTouchY;
        lastTouchX = e.touches[0].clientX; lastTouchY = e.touches[0].clientY;
        
        camYaw -= dx * 0.005; camPitch -= dy * 0.004;
        camPitch = Math.max(-PI_2, Math.min(PI_2, camPitch));
        camera.rotation.set(camPitch, camYaw, 0, 'YXZ');
    }, {passive: false});

    function gameLoop() {
        requestAnimationFrame(gameLoop);

        clouds.forEach(cloud => {
            cloud.position.x -= 0.08;
            if(cloud.position.x < -100) cloud.position.x = 100;
        });

        // Xử lý di chuyển
        let moveForward = 0, moveRight = 0;
        if (keys.forward) moveForward = 1;
        if (keys.backward) moveForward = -1;
        if (keys.left) moveRight = -1;
        if (keys.right) moveRight = 1;

        if (joyActive) { moveForward = -joyY; moveRight = joyX; }

        if (moveForward !== 0 || moveRight !== 0) {
            let dir = new THREE.Vector3(moveRight, 0, -moveForward).normalize();
            dir.applyAxisAngle(new THREE.Vector3(0, 1, 0), camYaw);
            camera.position.addScaledVector(dir, moveSpeed);
        }

        // Xử lý Vật lý Trọng lực & Nhảy
        if (!isGrounded) {
            velocityY += gravity3D;
            camera.position.y += velocityY;
            
            if (camera.position.y <= basePlayerY) {
                camera.position.y = basePlayerY;
                velocityY = 0;
                isGrounded = true;
            }
        }

        checkDoorCollision();
        renderer.render(scene, camera);
    }

    loadLevel();
    gameLoop();
</script>
