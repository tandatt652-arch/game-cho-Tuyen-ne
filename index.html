<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LOGIC BẺ LÁI - HARDCORE EDITION</title>
    <style>
        /* ================= CSS ================= */
        :root {
            --bg-color: #121212;
            --text-color: #e0e0e0;
            --accent-color: #ff4757;
            --success-color: #2ed573;
            --warning-color: #ffa502;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        body, html {
            width: 100vw;
            height: 100vh;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .screen {
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
            padding: 20px;
            text-align: center;
            position: relative;
            animation: fadeIn 0.5s ease-in-out;
        }

        .screen.active {
            display: flex;
        }

        #btn-start {
            background-color: var(--text-color);
            color: var(--bg-color);
            border: none;
            padding: 20px 40px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 255, 255, 0.2);
            transition: transform 0.1s;
        }
        #btn-start:active { transform: scale(0.95); }

        .equation {
            font-size: 3.5rem;
            font-weight: bold;
            margin-bottom: 20px;
            transition: all 0.5s ease;
            position: relative;
        }

        .win-msg {
            font-size: 1.2rem;
            color: var(--success-color);
            max-width: 90%;
            margin-top: 30px;
            line-height: 1.5;
        }

        /* Màn 1 & Màn 4 */
        @keyframes shakeAnim {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            25% { transform: translate(-3px, 2px) rotate(-2deg); }
            50% { transform: translate(3px, -2px) rotate(2deg); }
            75% { transform: translate(-3px, -2px) rotate(-1deg); }
        }
        .shake-active { animation: shakeAnim 0.3s infinite; color: var(--accent-color); }
        .shake-light { animation: shakeAnim 2s infinite ease-in-out; }

        /* Màn 2 */
        .error-text { 
            color: var(--accent-color); 
            font-size: 1.2rem; 
            font-weight: bold; 
            margin-bottom: 10px;
            letter-spacing: 1px;
        }
        .progress-container {
            width: 80%;
            height: 12px;
            background: #333;
            border-radius: 10px;
            margin-top: 20px;
            overflow: hidden;
            display: none;
        }
        #progress-bar { width: 0%; height: 100%; background: var(--success-color); }
        
        .infinity { font-size: 5rem; color: var(--success-color); }

        /* Màn 3: Lỗi hệ thống (Glitch) */
        .glitch {
            animation: glitchAnim 0.15s infinite;
            color: var(--warning-color);
            text-shadow: 2px 0 var(--accent-color), -2px 0 cyan;
        }
        @keyframes glitchAnim {
            0% { transform: translate(0) }
            20% { transform: translate(-2px, 2px) }
            40% { transform: translate(-2px, -2px) }
            60% { transform: translate(2px, 2px) }
            80% { transform: translate(2px, -2px) }
            100% { transform: translate(0) }
        }

        /* Màn 4 & 5 */
        .heart {
            color: var(--accent-color);
            font-size: 5rem;
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* Toast thông báo */
        #toast {
            position: absolute;
            top: 15%;
            background: var(--success-color);
            color: #fff;
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: bold;
            opacity: 0;
            transition: opacity 0.5s;
            pointer-events: none;
            z-index: 100;
        }
    </style>
</head>
<body>
    <div id="toast"></div>

    <!-- MÀN 0: XIN QUYỀN -->
    <div id="screen-0" class="screen active">
        <button id="btn-start">[ CHẠM ĐỂ BẮT ĐẦU ]</button>
    </div>

    <!-- MÀN 1: LẮC -->
    <div id="screen-1" class="screen">
        <div id="eq-1" class="equation">5 + 5 = ?</div>
    </div>

    <!-- MÀN 2: CÂN BẰNG -->
    <div id="screen-2" class="screen">
        <div id="m2-error" class="error-text">ERROR: DỮ LIỆU ĐANG BẤT ỔN</div>
        <div id="eq-2" class="equation">8 / 0 = ?</div>
        <div class="progress-container" id="m2-progress-container">
            <div id="progress-bar"></div>
        </div>
    </div>

    <!-- MÀN 3: THOÁT RA VÀO LẠI (VISIBILITY) -->
    <div id="screen-3" class="screen">
        <div id="eq-3" class="equation glitch">1 / 0 = ?</div>
    </div>

    <!-- MÀN 4: MULTI-TOUCH + MOTION -->
    <div id="screen-4" class="screen">
        <div id="eq-4" class="equation shake-light">1 + 1 = ?</div>
    </div>

    <!-- MÀN 5: WIN -->
    <div id="screen-5" class="screen">
        <div class="heart">❤️</div>
        <div class="equation" style="font-size: 2rem; margin-top: 20px;">1 + 1 = CHÚNG TA</div>
        <div class="win-msg">Đồng vợ đồng chồng, tát biển Đông cũng cạn! Bạn đã phá đảo!</div>
    </div>

    <script>
        let currentLevel = 0;
        const toast = document.getElementById('toast');
        let animationFrameId, lastTime = performance.now();

        // Biến Cảm biến
        let currentBeta = 90, currentGamma = 0;
        let balanceTimer = 0;
        let shakeForce = 0, shakeCountM1 = 0, lastShakeTimeM1 = 0;
        let isHolding = false;
        
        let m3LeftPage = false; // Cờ đánh dấu người chơi đã ẩn trình duyệt
        let m3Passed = false, m4Passed = false;

        function showScreen(level) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(`screen-${level}`).classList.add('active');
            currentLevel = level;
        }

        function showToast(msg, callback, delay = 1500) {
            toast.innerText = msg;
            toast.style.opacity = 1;
            setTimeout(() => {
                toast.style.opacity = 0;
                if(callback) setTimeout(callback, 300);
            }, delay);
        }

        // Xin quyền & Start
        document.getElementById('btn-start').addEventListener('click', async () => {
            try {
                if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
                    const permissionState = await DeviceMotionEvent.requestPermission();
                    if (permissionState !== 'granted') return alert('Cần cấp quyền cảm biến!');
                }
                requestAnimationFrame(gameLoop);
                showScreen(1);
            } catch (err) { alert('Lỗi truy cập cảm biến.'); }
        });

        // ================= CẢM BIẾN =================
        window.addEventListener('deviceorientation', (e) => {
            currentBeta = e.beta || 0;
            currentGamma = e.gamma || 0;
        });

        window.addEventListener('devicemotion', (e) => {
            const acc = e.accelerationIncludingGravity;
            if (!acc) return;
            shakeForce = Math.abs(acc.x || 0) + Math.abs(acc.y || 0) + Math.abs(acc.z || 0);

            if (currentLevel === 1 && shakeForce > 25) {
                const now = Date.now();
                if (now - lastShakeTimeM1 > 150) {
                    shakeCountM1++;
                    lastShakeTimeM1 = now;
                    document.getElementById('eq-1').classList.add('shake-active');
                    setTimeout(() => document.getElementById('eq-1').classList.remove('shake-active'), 100);
                    
                    if (shakeCountM1 >= 10) {
                        currentLevel = -1;
                        document.getElementById('eq-1').innerText = "10";
                        document.getElementById('eq-1').style.color = "var(--success-color)";
                        showToast("Đã trộn đều!", () => showScreen(2));
                    }
                }
            }
        });

        // Đa điểm chạm
        function checkTouches(e) { isHolding = (e.touches.length === 2); }
        window.addEventListener('touchstart', checkTouches);
        window.addEventListener('touchend', checkTouches);
        window.addEventListener('touchcancel', checkTouches);

        // ================= LOGIC MÀN 3: VISIBILITY EVENT =================
        document.addEventListener('visibilitychange', () => {
            if (currentLevel === 3 && !m3Passed) {
                if (document.hidden) {
                    // Người chơi đã vuốt về Home hoặc tắt màn hình điện thoại
                    m3LeftPage = true; 
                } else if (m3LeftPage) {
                    // Người chơi vừa mở lại trình duyệt
                    m3Passed = true;
                    currentLevel = -1; // Khóa màn
                    
                    const eq3 = document.getElementById('eq-3');
                    eq3.classList.remove('glitch');
                    eq3.innerHTML = `<span class="infinity">&infin;</span>`;
                    
                    // Lời nhắn vinh danh quy tắc số 1 của IT
                    showToast("Quy tắc vàng IT: Lỗi thì Restart!", () => showScreen(4), 2500);
                }
            }
        });

        // ================= VÒNG LẶP GAME =================
        function gameLoop(time) {
            const dt = time - lastTime;
            lastTime = time;

            // Màn 2: Cân bằng
            if (currentLevel === 2) {
                const isFlat = Math.abs(currentBeta) <= 2 && Math.abs(currentGamma) <= 2;
                const progContainer = document.getElementById('m2-progress-container');
                const progBar = document.getElementById('progress-bar');
                const errText = document.getElementById('m2-error');
                
                if (isFlat) {
                    progContainer.style.display = 'block';
                    errText.innerText = "ĐANG ĐỒNG BỘ DỮ LIỆU...";
                    errText.style.color = "var(--warning-color)";
                    
                    balanceTimer += dt;
                    progBar.style.width = Math.min((balanceTimer / 3000) * 100, 100) + '%';
                    
                    if (balanceTimer >= 3000) {
                        currentLevel = -1;
                        errText.innerText = "ĐÃ BÌNH ỔN";
                        errText.style.color = "var(--success-color)";
                        document.getElementById('eq-2').innerHTML = `<span class="infinity">&infin;</span>`;
                        showToast("Tĩnh lặng tuyệt đối!", () => showScreen(3), 2000);
                    }
                } else {
                    balanceTimer = 0;
                    progBar.style.width = '0%';
                    progContainer.style.display = 'none';
                    errText.innerText = "ERROR: DỮ LIỆU ĐANG BẤT ỔN";
                    errText.style.color = "var(--accent-color)";
                }
            }

            // Màn 4: Multi-touch + Shake
            if (currentLevel === 4 && !m4Passed) {
                if (isHolding && shakeForce > 25) {
                    m4Passed = true;
                    currentLevel = -1;
                    const eq4 = document.getElementById('eq-4');
                    eq4.classList.remove('shake-light');
                    eq4.innerHTML = `<div class="heart">❤️</div>`;
                    showToast("Gắn kết tuyệt đối! Bạn đã phá đảo!", () => showScreen(5), 2000);
                }
            }

            animationFrameId = requestAnimationFrame(gameLoop);
        }
    </script>
</body>
</html>
