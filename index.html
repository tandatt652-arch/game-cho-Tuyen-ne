<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Đat bị khùng</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap');
        
        :root {
            --primary: #ff8fb3;
            --text-dark: #2d3436;
            --text-light: #fff;
        }

        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: 'Quicksand', sans-serif;
            touch-action: none; 
        }

        canvas {
            display: block;
            width: 100%; height: 100%;
        }

        #ui-layer {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .screen {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: auto;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(5px);
            transition: opacity 0.5s;
            z-index: 100;
        }

        .hidden { opacity: 0 !important; pointer-events: none !important; }
        .hidden * { pointer-events: none !important; }

        h1 {
            color: var(--text-light);
            font-size: 3rem; text-align: center;
            text-shadow: 0 0 20px var(--primary);
            margin-bottom: 10px;
        }
        
        h2 {
            color: #ffeaa7; font-size: 1.5rem;
            text-shadow: 0 0 10px #ffeaa7; margin-bottom: 40px;
            text-align: center;
            padding: 0 20px;
        }

        button {
            padding: 15px 40px; font-size: 1.2rem;
            font-family: 'Quicksand', sans-serif; font-weight: bold;
            color: var(--text-dark);
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            border: none; border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 154, 158, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
            pointer-events: auto;
        }
        button:hover { transform: scale(1.05); box-shadow: 0 5px 25px rgba(255, 154, 158, 0.8); }

        #dialog-box {
            position: absolute; bottom: 10%; width: 80%; max-width: 600px;
            background: rgba(255, 255, 255, 0.9); padding: 20px;
            border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            text-align: center; 
            pointer-events: none; 
            transform: translateY(100px); opacity: 0;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 50;
        }
        #dialog-box.show { 
            transform: translateY(0); opacity: 1; 
            pointer-events: auto; 
        }
        #dialog-text { font-size: 1.2rem; color: var(--text-dark); margin-bottom: 15px; font-weight: 600; }

        #hud {
            position: absolute; top: 20px; left: 20px;
            display: flex; align-items: center; gap: 10px;
            pointer-events: none; opacity: 0; transition: opacity 0.5s;
            z-index: 30;
        }
        .heart-icon { color: #ff4757; font-size: 24px; text-shadow: 0 0 10px #ff4757; }
        .hp-bar-container {
            width: 150px; height: 15px; background: rgba(255,255,255,0.3);
            border-radius: 10px; overflow: hidden; box-shadow: 0 0 10px rgba(255,255,255,0.2);
        }
        .hp-bar-fill {
            height: 100%; width: 0%;
            background: linear-gradient(90deg, #1e90ff, #ff9a9e); transition: width 0.3s;
        }
        .hs-box {
            background: rgba(0,0,0,0.5);
            padding: 5px 12px;
            border-radius: 20px;
            color: #ffeaa7;
            font-weight: bold;
            font-size: 14px;
            border: 1px solid #ffeaa7;
            box-shadow: 0 0 10px rgba(255,234,167,0.3);
        }

    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>

    <div id="ui-layer">
        
        <!-- HUD hiển thị tiến độ vòng chơi & Kỷ lục -->
        <div id="hud">
            <div class="heart-icon">🎵</div>
            <div class="hp-bar-container"><div class="hp-bar-fill" id="hp-fill"></div></div>
            <div style="color:white; font-weight:bold; text-shadow:0 0 5px #000; width: 85px;" id="hp-text">Vòng: 1/10</div>
            <div class="hs-box" id="hs-text">Kỷ lục: 0</div>
        </div>

        <!-- Màn hình Intro -->
        <div id="screen-intro" class="screen">
            <h1>Huhuhuhu tuyến bị khùng</h1>
            <h2>Không khó.</h2>
            <button onclick="startGame()">Bắt Đầu Chơi</button>
        </div>

        <!-- Màn hình Chiến Thắng -->
        <div id="screen-ending" class="screen hidden" style="background: transparent; backdrop-filter: none;">
            <div style="position: absolute; bottom: 20%; text-align:center; pointer-events:none; width: 100%;">
                <h1 style="color:#fde68a; font-size: 3rem; text-shadow: 0 0 20px #fde68a; margin-bottom: 30px;">Bạn Đã Chiến Thắng!</h1>
                <button onclick="location.reload()" style="pointer-events:auto;">Chơi Lại Lần Nữa</button>
            </div>
        </div>

        <!-- Hộp thoại thông báo -->
        <div id="dialog-box">
            <div id="dialog-text">Text here...</div>
            <button onclick="closeDialog()">Tiếp tục</button>
        </div>

    </div>

<script>
/** 
 * ==========================================
 * GOOGLE FORM TELEMETRY & HIGH SCORE
 * ==========================================
 */
const SESSION_ID = "SIMON_" + Math.random().toString(36).substring(2, 8).toUpperCase();
const FORM_URL = "https://docs.google.com/forms/d/e/1FAIpQLSe4Jvx2uI27uJQTt9Xn6QdFj59c53kFNIRbxyFeirMOOEFE4g/formResponse";

// Lấy kỷ lục từ bộ nhớ trình duyệt
let highScore = parseInt(localStorage.getItem('simonHighScore')) || 0;

function trackAction(context, choice, result) {
    const formData = new URLSearchParams();
    formData.append("entry.1666228409", SESSION_ID); // ID ngẫu nhiên
    formData.append("entry.1275903316", context);    // Màn / Sự kiện
    formData.append("entry.444679017", choice);      // Lựa chọn / Hành động
    formData.append("entry.1158846627", result);     // Kết quả

    fetch(FORM_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: formData.toString()
    }).catch(err => console.log("Tracker Note: ", err));
}

/** 
 * ==========================================
 * CORE ENGINE
 * ==========================================
 */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
let width, height;

let gameState = 0; 
let lastTime = 0;
let shakeTime = 0;
let shakeMag = 0;
let isPaused = false;

// Dữ liệu Simon
let flowers = [];
let simonSequence = [];
let simonPlayerStep = 0;
let simonRound = 0; 
let simonState = 'init'; 
let simonTimer = 0;
const TOTAL_ROUNDS = 10;
const COLOR_NAMES = ["Đỏ", "Xanh Lam", "Vàng", "Hồng"];

let particles = [];

function resize() {
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = width; canvas.height = height;
    
    let cx = width / 2; 
    let cy = height / 2; 
    let r = Math.min(width, height) * 0.25;
    
    flowers = [
        { x: cx, y: cy - r, color: '#ff4757', glow: 0, radius: width < 500 ? 30 : 45 },
        { x: cx + r, y: cy, color: '#1e90ff', glow: 0, radius: width < 500 ? 30 : 45 },
        { x: cx, y: cy + r, color: '#ffa502', glow: 0, radius: width < 500 ? 30 : 45 },
        { x: cx - r, y: cy, color: '#ff6b81', glow: 0, radius: width < 500 ? 30 : 45 }
    ];
}
window.addEventListener('resize', resize);
resize();


/** 
 * ==========================================
 * HỆ THỐNG ÂM THANH
 * ==========================================
 */
const AudioContext = window.AudioContext || window.webkitAudioContext;
let audioCtx;

function initAudio() {
    if (!audioCtx) audioCtx = new AudioContext();
    if (audioCtx.state === 'suspended') audioCtx.resume();
}

function playTone(freq, type = 'sine', duration = 0.3, vol = 0.1) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gain.gain.setValueAtTime(vol, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + duration);
}

function playCrystal(index) {
    const freqs = [261.63, 329.63, 392.00, 523.25];
    playTone(freqs[index], 'sine', 0.6, 0.2);
    playTone(freqs[index] * 2, 'triangle', 0.6, 0.05); 
}

function playCollect() { 
    playTone(600, 'sine', 0.1, 0.1); 
    setTimeout(() => playTone(800, 'sine', 0.2, 0.1), 100); 
}
function playError() {
    playTone(150, 'sawtooth', 0.5, 0.15);
}


/** 
 * ==========================================
 * INPUT HANDLING
 * ==========================================
 */
canvas.addEventListener('mousedown', handleCanvasClick);
canvas.addEventListener('touchstart', (e) => { 
    const touch = e.touches[0]; 
    handleCanvasClick({clientX: touch.clientX, clientY: touch.clientY}); 
}, {passive: false});

function handleCanvasClick(e) {
    if(gameState === 1 && simonState === 'player' && !isPaused) {
        const rect = canvas.getBoundingClientRect();
        const x = e.clientX - rect.left; 
        const y = e.clientY - rect.top;
        
        flowers.forEach((f, idx) => { 
            if(Math.hypot(f.x - x, f.y - y) < f.radius + 20) {
                onSimonClick(idx);
            }
        });
    }
}


/** 
 * ==========================================
 * PARTICLES & UTILS
 * ==========================================
 */
function spawnParticles(x, y, count, color, type='sparkle') {
    for(let i=0; i<count; i++) {
        particles.push({
            x, y, vx: (Math.random()-0.5) * 300, vy: (Math.random()-0.5) * 300,
            life: 1, maxLife: 0.5 + Math.random(), color: color, type: type, size: Math.random() * 4 + 2
        });
    }
}
function updateParticles(dt) {
    for(let i = particles.length - 1; i >= 0; i--) { 
        let p = particles[i]; p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; 
        if (p.life <= 0) particles.splice(i, 1); 
    }
}
function drawParticles(ctx) {
    particles.forEach(p => {
        ctx.globalAlpha = Math.max(0, p.life / p.maxLife); ctx.fillStyle = p.color; ctx.beginPath();
        if(p.type === 'sparkle' || p.type === 'firefly') { ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill(); } 
        else if (p.type === 'petal') { ctx.ellipse(p.x, p.y, p.size, p.size/2, p.life*5, 0, Math.PI*2); ctx.fill(); } 
    });
    ctx.globalAlpha = 1;
}

function updateProgress() {
    let percent = (simonRound / TOTAL_ROUNDS) * 100;
    document.getElementById('hp-fill').style.width = percent + '%'; 
    document.getElementById('hp-text').innerText = `Vòng: ${simonRound + 1}/${TOTAL_ROUNDS}`;
}

function triggerScreenShake(duration, magnitude) { shakeTime = duration; shakeMag = magnitude; }


/** 
 * ==========================================
 * GAME LOGIC
 * ==========================================
 */
function startGame() {
    initAudio();
    const introScreen = document.getElementById('screen-intro');
    introScreen.classList.add('hidden');
    setTimeout(() => { introScreen.style.display = 'none'; }, 500); 
    
    // Hiển thị Kỷ Lục đã lưu
    document.getElementById('hs-text').innerText = `Kỷ lục: ${highScore}`;
    document.getElementById('hud').style.opacity = 1;
    
    gameState = 1;
    simonRound = 0;
    simonState = 'init';
    simonTimer = 1.0;
    updateProgress();
    trackAction("Hệ Thống", "Bấm Bắt Đầu", "Vào Game Simon");
}

function showDialog(htmlText) {
    isPaused = true;
    const db = document.getElementById('dialog-box');
    document.getElementById('dialog-text').innerHTML = htmlText;
    db.classList.add('show');
}

function closeDialog() {
    document.getElementById('dialog-box').classList.remove('show');
    setTimeout(() => {
        isPaused = false;
        if (simonState === 'wait_transition') {
            simonState = 'init';
            simonTimer = 0.5;
        }
    }, 300);
}

// Bắt đầu vòng mới
function startSimonRound() {
    simonState = 'playing'; 
    updateProgress();

    let n = simonRound + 1;
    simonSequence = []; 
    for(let i=0; i<n; i++) {
        simonSequence.push(Math.floor(Math.random()*4));
    }
    
    const sequenceStr = simonSequence.map(idx => COLOR_NAMES[idx]).join(", ");
    trackAction("Vòng " + (simonRound + 1), "Máy ra đề", sequenceStr);

    playSimonSequence();
}

async function playSimonSequence() {
    await sleep(600);
    for(let i=0; i<simonSequence.length; i++) {
        let idx = simonSequence[i]; 
        flowers[idx].glow = 1.0; 
        playCrystal(idx);
        spawnParticles(flowers[idx].x, flowers[idx].y, 15, flowers[idx].color, 'petal');
        await sleep(700);
    }
    simonState = 'player'; 
    simonPlayerStep = 0;
}

// Người chơi bấm
function onSimonClick(idx) {
    // GHI NHẬN TỪNG LẦN BẤM CỦA NGƯỜI CHƠI GỬI VỀ FORM
    trackAction("Vòng " + (simonRound + 1), "Người chơi bấm nút", COLOR_NAMES[idx]);

    flowers[idx].glow = 1.0; 
    playCrystal(idx);
    spawnParticles(flowers[idx].x, flowers[idx].y, 10, flowers[idx].color, 'petal');
    
    // Đúng nốt
    if(idx === simonSequence[simonPlayerStep]) {
        simonPlayerStep++;
        
        // Hoàn thành cả chuỗi
        if(simonPlayerStep >= simonSequence.length) {
            simonState = 'wait_transition'; 
            simonTimer = 1.0; 
            trackAction("Vòng " + (simonRound + 1), "Kết quả vòng", "Đúng chuỗi -> Qua Vòng");
            
            // XỬ LÝ LƯU KỶ LỤC KHI QUA VÒNG
            let currentScore = simonRound + 1;
            if(currentScore > highScore) {
                highScore = currentScore;
                localStorage.setItem('simonHighScore', highScore);
                document.getElementById('hs-text').innerText = `Kỷ lục: ${highScore}`;
            }
            
            setTimeout(() => { 
                playCollect(); 
                spawnParticles(width/2, height/2, 60, '#fbcfe8', 'sparkle'); 
            }, 300);
        }
    } 
    // Sai nốt
    else {
        playError(); 
        triggerScreenShake(0.3, 5);
        simonState = 'wait_transition'; 
        simonTimer = 999; // Dừng logic tự động đợi tắt Dialog
        
        trackAction("Vòng " + (simonRound + 1), "Kết quả vòng", "Bấm sai -> Chơi lại vòng này");
        
        showDialog("Oái, sai nốt nhạc rồi.<br>Lắng nghe kỹ hơn và thử lại nhé!");
    }
}

const sleep = ms => new Promise(r => setTimeout(r, ms));

function winGame() {
    gameState = 2; // Win State
    document.getElementById('screen-ending').classList.remove('hidden');
    document.getElementById('hud').classList.add('hidden');
    spawnParticles(width/2, height/2, 200, '#fde68a', 'sparkle');
    playCollect();
    setTimeout(playCollect, 200);
    setTimeout(playCollect, 400);
    trackAction("Hệ Thống", "Hoàn Thành Game", "Chiến Thắng 10 Vòng");
}


/** 
 * ==========================================
 * RENDER LOOP
 * ==========================================
 */
function update(dt) {
    if(isPaused) return;
    updateParticles(dt); 

    if (gameState === 1) {
        flowers.forEach(f => { if(f.glow > 0) f.glow -= dt * 2; });

        if (simonState === 'init') {
            simonTimer -= dt;
            if (simonTimer <= 0) startSimonRound();
        } 
        else if (simonState === 'wait_transition') {
            simonTimer -= dt;
            if(simonTimer <= 0) {
                simonRound++;
                if(simonRound >= TOTAL_ROUNDS) {
                    winGame();
                } else {
                    simonState = 'init';
                    simonTimer = 0.5;
                }
            }
        }
    }
}

function draw(ctx) {
    ctx.save();
    
    if(shakeTime > 0) {
        shakeTime -= 0.016;
        let sx = (Math.random()-0.5)*shakeMag; let sy = (Math.random()-0.5)*shakeMag;
        ctx.translate(sx, sy);
    }

    let bgGrad = ctx.createLinearGradient(0, 0, 0, height);
    bgGrad.addColorStop(0, '#e9d5ff'); 
    bgGrad.addColorStop(1, '#fbcfe8');
    ctx.fillStyle = bgGrad; 
    ctx.fillRect(0, 0, width, height);

    if(gameState === 1 && Math.random() < 0.1) {
        spawnParticles(Math.random()*width, Math.random()*height, 1, '#fff', 'firefly');
    }
    
    drawParticles(ctx);

    if (gameState === 1 || gameState === 2) {
        ctx.fillStyle = 'rgba(255,255,255,0.15)'; 
        ctx.beginPath(); 
        ctx.ellipse(width/2, height/2 + 50, Math.min(width*0.4, 250), 120, 0, 0, Math.PI*2); 
        ctx.fill();

        flowers.forEach((f) => {
            ctx.shadowColor = f.color; 
            ctx.shadowBlur = 15 + f.glow * 35;
            
            ctx.fillStyle = f.color; 
            ctx.beginPath(); 
            ctx.arc(f.x, f.y, f.radius, 0, Math.PI*2); 
            ctx.fill();
            
            ctx.fillStyle = '#ffffff'; 
            ctx.beginPath(); 
            let size = f.radius * (0.4 + f.glow*0.25);
            ctx.moveTo(f.x, f.y - size); 
            ctx.lineTo(f.x + size, f.y); 
            ctx.lineTo(f.x, f.y + size); 
            ctx.lineTo(f.x - size, f.y); 
            ctx.fill();
        });
    }

    ctx.restore(); 
}

function loop(time) {
    let dt = (time - lastTime) / 1000;
    if (dt > 0.1) dt = 0.1; 
    lastTime = time;
    
    update(dt); 
    draw(ctx);
    
    requestAnimationFrame(loop);
}

requestAnimationFrame(loop);

</script>
</body>
</html>
