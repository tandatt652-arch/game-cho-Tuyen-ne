<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
    <style>
        /* Cài đặt khung nền vũ trụ */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, #020111 0%, #20124d 100%);
            overflow: hidden; /* Ẩn thanh cuộn */
            font-family: 'Dancing Script', cursive;
            color: white;
        }

        /* Lời chúc */
        .message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: min(8vw, 4.5rem); /* Tự động thu nhỏ trên điện thoại */
            text-align: center;
            text-shadow: 0 0 10px #ffb3c6, 0 0 20px #ffb3c6, 0 0 30px #ff0055;
            z-index: 10;
            width: 100%;
            animation: pulse 2s infinite alternate;
        }

        /* Hiệu ứng nhịp đập nhẹ cho dòng chữ */
        @keyframes pulse {
            0% { transform: translate(-50%, -50%) scale(1); }
            100% { transform: translate(-50%, -50%) scale(1.05); }
        }

        /* Mặt trăng lưỡi liềm */
        .moon {
            position: absolute;
            top: 50px;
            right: 80px;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            /* Dùng bóng đổ để tạo hình lưỡi liềm */
            box-shadow: -15px 15px 0 0 #ffffe0;
            z-index: 5;
            animation: moonGlow 4s infinite alternate;
        }

        /* Hiệu ứng phát sáng cho mặt trăng */
        @keyframes moonGlow {
            0% { filter: drop-shadow(0 0 5px #ffffe0); }
            100% { filter: drop-shadow(0 0 15px #ffffe0); }
        }

        /* Các vì sao */
        .star {
            position: absolute;
            background-color: white;
            border-radius: 50%;
            z-index: 1;
            /* Cài đặt hiệu ứng trôi và lấp lánh */
            animation: floatUp linear infinite;
        }

        @keyframes floatUp {
            0% { transform: translateY(0); opacity: 0; }
            20% { opacity: 1; }
            80% { opacity: 1; }
            100% { transform: translateY(-150px); opacity: 0; }
        }

        /* Reponsive cho mặt trăng trên điện thoại */
        @media (max-width: 600px) {
            .moon {
                top: 30px;
                right: 50px;
                width: 60px;
                height: 60px;
                box-shadow: -10px 10px 0 0 #ffffe0;
            }
        }
    </style>
</head>
<body>

    <div class="moon"></div>

    <div class="message">Ebe Tuyến ngủ ngoan nha ❤️</div>

    <div id="stars-container"></div>

    <script>
        // Lấy thẻ div chứa sao
        const starsContainer = document.getElementById('stars-container');
        const numStars = 150; // Số lượng sao hiển thị

        // Tạo ra các ngôi sao một cách ngẫu nhiên
        for (let i = 0; i < numStars; i++) {
            let star = document.createElement('div');
            star.className = 'star';
            
            // Kích thước sao ngẫu nhiên từ 1px đến 3px
            let size = Math.random() * 2 + 1;
            star.style.width = size + 'px';
            star.style.height = size + 'px';
            
            // Vị trí sao ngẫu nhiên trên toàn màn hình
            star.style.left = Math.random() * 100 + 'vw';
            star.style.top = Math.random() * 100 + 'vh';
            
            // Thời gian bay và độ trễ ngẫu nhiên để các sao không bay cùng lúc
            let duration = Math.random() * 15 + 10; // Bay từ 10s đến 25s
            let delay = Math.random() * 10;
            star.style.animationDuration = duration + 's';
            star.style.animationDelay = delay + 's';
            
            // Thêm sao vào vùng không gian
            starsContainer.appendChild(star);
        }
    </script>

</body>
</html>
