<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Call</title>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>
    :root {
      --ink: #2b2d42;
      --card-bg: rgba(255, 255, 255, 0.88);
      --pink: #ff758c;
      --pink-light: #ffe5ec;
      --blue: #4facfe;
      --blue-light: #e0f4ff;
      --green: #2ed573;
      --yellow: #ffe066;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    body {
      background: linear-gradient(180deg, #bde0fe 0%, #fff0f5 65%, #e2f0cb 100%);
      color: var(--ink);
      font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      height: 100dvh;
      width: 100vw;
      overflow: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 10px;
      transition: background 0.8s ease;
    }

    /* Giao diện nền khi chuyển sang Trời Đêm */
    body.night-mode {
      background: linear-gradient(180deg, #070b19 0%, #16193b 62%, #0f292f 100%);
    }

    /* NỀN TRANG TRÍ ĐỘNG (NGÀY: MÂY, ĐỒI CỎ, HOA ĐÀO | ĐÊM: TRĂNG, SAO, SAO BĂNG, ĐOM ĐÓM) */
    #bg-decor-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    /* HỆ THỐNG TOAST POPUP */
    #toast-container {
      position: fixed;
      top: 64px;
      right: 14px;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-width: 300px;
      width: calc(100% - 28px);
      pointer-events: none;
    }
    .toast-popup {
      background: #fff;
      border: 2.5px solid var(--ink);
      border-left: 6px solid var(--pink);
      color: var(--ink);
      padding: 10px 14px;
      border-radius: 14px;
      box-shadow: 0 6px 0 rgba(43, 45, 66, 0.15);
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 12.5px;
      font-weight: 700;
      pointer-events: auto;
      animation: slideInRight 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }
    .toast-popup.success { border-left-color: var(--green); }
    .toast-popup.warn { border-left-color: #ffa502; }
    .toast-popup.info { border-left-color: var(--blue); }
    @keyframes slideInRight {
      from { transform: translateX(110%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }
    @keyframes fadeOutRight {
      to { transform: translateX(110%); opacity: 0; }
    }

    /* =========================================================================
       BẢNG GHÉP TRẬN TRÊN CÙNG (CÓ NÚT THU GỌN & ĐỔI NGÀY/ĐÊM ĐỒNG BỘ)
       ========================================================================= */
    #top-panel {
      position: relative;
      z-index: 20;
      width: 100%;
      max-width: 840px;
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      border: 2.5px solid var(--ink);
      border-radius: 18px;
      box-shadow: 0 5px 0 rgba(43, 45, 66, 0.12);
      padding: 8px 14px;
      transition: all 0.25s ease;
    }
    .top-header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }
    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12.5px;
      font-weight: 800;
      color: var(--ink);
      background: #fff9db;
      border: 2px solid var(--ink);
      padding: 4px 10px;
      border-radius: 20px;
    }
    #call-timer {
      font-size: 14px;
      font-weight: 900;
      color: #fff;
      background: var(--green);
      border: 2px solid var(--ink);
      padding: 3px 10px;
      border-radius: 20px;
      display: none;
    }
    .collapse-btn {
      background: var(--blue-light);
      color: var(--ink);
      border: 2px solid var(--ink);
      padding: 4px 10px;
      border-radius: 12px;
      font-weight: 800;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .collapse-btn:active { transform: translateY(1px); }

    #matchmaking-body {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1.5px dashed rgba(43, 45, 66, 0.2);
    }
    #top-panel.collapsed #matchmaking-body {
      display: none;
    }
    .conn-group {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .id-chip {
      background: var(--pink-light);
      border: 2px solid var(--ink);
      color: #d90429;
      padding: 4px 9px;
      border-radius: 10px;
      font-weight: 800;
      font-size: 12px;
      user-select: text;
      -webkit-user-select: text;
    }
    input.cute-input {
      background: #fff;
      border: 2px solid var(--ink);
      color: var(--ink);
      padding: 5px 10px;
      border-radius: 10px;
      font-size: 12.5px;
      font-weight: 600;
      outline: none;
      width: 165px;
    }
    input.cute-input:focus { border-color: var(--pink); background: #fff9fb; }
    .btn-cute {
      background: var(--pink);
      color: #fff;
      border: 2px solid var(--ink);
      padding: 5px 12px;
      border-radius: 10px;
      font-weight: 800;
      font-size: 12px;
      cursor: pointer;
      box-shadow: 0 3px 0 var(--ink);
      transition: transform 0.1s;
    }
    .btn-cute:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
    .btn-cute.blue { background: var(--blue); }
    .btn-cute.yellow { background: var(--yellow); color: var(--ink); }

    /* =========================================================================
       KHU VỰC TRUNG TÂM: 2 NHÂN VẬT CHIBI & KHUNG CHAT
       ========================================================================= */
    #main-workspace {
      position: relative;
      z-index: 10;
      flex: 1;
      width: 100%;
      max-width: 840px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin: 8px 0;
      min-height: 0;
    }

    #stage-column {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      height: 100%;
    }
    .avatars-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
      width: 100%;
    }
    .chibi-card {
      background: var(--card-bg);
      backdrop-filter: blur(8px);
      border: 2.5px solid var(--ink);
      border-radius: 22px;
      padding: 14px 16px;
      width: 235px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      box-shadow: 0 6px 0 rgba(43, 45, 66, 0.14);
      position: relative;
    }

    .chibi-stage {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      background: radial-gradient(circle, #ffffff 30%, #ffe5ec 100%);
      border: 2.5px solid var(--ink);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      margin-top: 8px;
      transition: box-shadow 0.08s ease, transform 0.08s ease;
    }
    .chibi-stage.male-stage {
      background: radial-gradient(circle, #ffffff 30%, #d8f3dc 100%);
    }

    /* =========================================================================
       MODEL NHÂN VẬT CHIBI (NỮ & NAM)
       ========================================================================= */
    @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
    @keyframes walkWobble { 0%, 100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-5px) rotate(3deg); } }

    .player {
      position: relative;
      width: 56px;
      height: 66px;
      z-index: 20;
      transform-origin: center bottom;
      background: transparent;
      border: none;
      will-change: transform;
      pointer-events: none;
    }
    .player.female {
      --c-primary: #ff758c;
      --c-secondary: #ffb3c6;
      --c-accent: #ffe066;
    }
    .player.male {
      --c-primary: #4facfe;
      --c-secondary: #70d6ff;
      --c-accent: #ffe066;
    }
    .player-name-tag {
      position: absolute;
      top: -24px;
      left: 50%;
      transform: translateX(-50%);
      white-space: nowrap;
      font-size: 11px;
      font-weight: 800;
      color: var(--ink);
      background: rgba(255, 255, 255, 0.95);
      padding: 1px 7px;
      border-radius: 10px;
      border: 1.5px solid var(--ink);
      z-index: 10;
    }
    .player-shadow {
      position: absolute;
      bottom: -5px;
      left: 10px;
      width: 36px;
      height: 12px;
      background: rgba(0, 0, 0, 0.16);
      border-radius: 50%;
      z-index: 0;
    }

    .chibi { position: relative; width: 100%; height: 100%; animation: bounce 1.5s infinite ease-in-out; }
    .player.moving .chibi { animation: walkWobble 0.35s infinite ease-in-out; }

    .cb-head { position: absolute; width: 46px; height: 46px; border: 4px solid var(--ink); border-radius: 45%; left: 5px; top: 0; z-index: 2; background: #ffe6d5; box-sizing: border-box; }
    .cb-hair { position: absolute; width: 54px; height: 25px; background: var(--ink); border-radius: 25px 25px 0 0; top: -4px; left: -8px; z-index: 3; box-sizing: border-box; }
    .cb-backhair { position: absolute; width: 56px; height: 50px; background: var(--ink); border-radius: 30px; top: 10px; left: 0; z-index: 1; }
    .cb-eye { position: absolute; top: 20px; width: 6px; height: 10px; background: var(--ink); border-radius: 50%; z-index: 3; transition: transform 0.1s; }
    .cb-eye::after { content: ""; position: absolute; top: 2px; left: 1px; width: 2.5px; height: 2.5px; background: #fff; border-radius: 50%; }
    .cb-eye.e1 { left: 8px; } .cb-eye.e2 { right: 8px; }
    .cb-blush { position: absolute; top: 26px; width: 8px; height: 5px; background: #ff7ca8; border-radius: 50%; opacity: 0.6; z-index: 3; }
    .cb-blush.b1 { left: 2px; } .cb-blush.b2 { right: 2px; }
    .cb-mouth { position: absolute; left: 14px; top: 30px; width: 10px; height: 5px; border-radius: 0 0 10px 10px; background: var(--ink); z-index: 3; transition: height 0.08s; }
    .player.moving .cb-mouth { height: 8px; border-radius: 4px 4px 10px 10px; background: #ff4d6d; }
    .cb-body { position: absolute; width: 34px; height: 26px; background: var(--c-primary); border: 4px solid var(--ink); border-radius: 10px; bottom: 0; left: 11px; z-index: 2; box-sizing: border-box; overflow: hidden; }
    .avatar-acc { position: absolute; pointer-events: none; z-index: 6; }

    /* Phụ kiện Nơ của Bạn Gái (P2) */
    .acc-bow { left: 23px; top: -2px; width: 42px; height: 26px; transform: rotate(6deg); }
    .acc-bow::before, .acc-bow::after { content: ""; position: absolute; top: 3px; width: 18px; height: 14px; background: var(--c-secondary); border: 3px solid var(--ink); box-shadow: inset 0 3px #ffffffa0; box-sizing: border-box; }
    .acc-bow::before { left: 1px; border-radius: 80% 25% 65% 30%; transform: rotate(-12deg); }
    .acc-bow::after { right: 1px; border-radius: 25% 80% 30% 65%; transform: rotate(12deg); }
    .acc-bow i { position: absolute; left: 16px; top: 6px; width: 10px; height: 10px; background: var(--c-accent); border: 3px solid var(--ink); border-radius: 5px; z-index: 3; box-sizing: border-box; }
    .acc-bow span, .acc-bow b { position: absolute; display: block; width: 7px; height: 11px; background: var(--c-primary); border: 3px solid var(--ink); border-top: none; border-radius: 0 0 7px 7px; top: 12px; z-index: 2; box-sizing: border-box; }
    .acc-bow span { left: 10px; transform: rotate(10deg); }
    .acc-bow b { right: 10px; transform: rotate(-10deg); }

    /* Thiết kế riêng cho Nhân Vật Nam (P1) */
    .player.male .cb-backhair { width: 50px; height: 22px; top: 8px; left: 3px; border-radius: 12px; }
    .player.male .cb-hair { width: 52px; height: 19px; top: -5px; left: -7px; border-radius: 20px 20px 6px 6px; }
    .player.male .cb-hair::before { content: ""; position: absolute; left: 4px; bottom: -6px; width: 16px; height: 10px; background: var(--ink); border-radius: 0 0 12px 4px; transform: rotate(-8deg); }
    .player.male .cb-hair::after { content: ""; position: absolute; right: 4px; bottom: -5px; width: 18px; height: 9px; background: var(--ink); border-radius: 0 0 4px 12px; transform: rotate(8deg); }
    .cb-ahoge { position: absolute; top: -13px; left: 18px; width: 14px; height: 11px; border-top: 4px solid var(--ink); border-left: 4px solid var(--ink); border-radius: 100% 0 0 0; transform: rotate(15deg); z-index: 4; }
    .cb-collar { position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 16px; height: 8px; background: #fff; border: 2.5px solid var(--ink); border-top: none; border-radius: 0 0 6px 6px; z-index: 3; }
    .cb-tie { position: absolute; top: 6px; left: 50%; transform: translateX(-50%); width: 7px; height: 11px; background: #ff4d6d; border: 2px solid var(--ink); border-radius: 2px 2px 5px 5px; z-index: 4; }
    .acc-cap { left: -4px; top: -8px; width: 38px; height: 20px; transform: rotate(-10deg); }
    .acc-cap::before { content: ""; position: absolute; top: 2px; left: 2px; width: 32px; height: 15px; background: var(--c-secondary); border: 3px solid var(--ink); border-radius: 20px 20px 6px 6px; box-shadow: inset 0 3px #ffffffa0; box-sizing: border-box; }
    .acc-cap::after { content: ""; position: absolute; bottom: 1px; left: -4px; width: 22px; height: 7px; background: var(--c-primary); border: 3px solid var(--ink); border-radius: 8px 0 8px 8px; box-sizing: border-box; }
    .acc-cap i { position: absolute; right: 9px; top: 5px; width: 8px; height: 8px; background: var(--c-accent); border: 2.5px solid var(--ink); border-radius: 50%; z-index: 3; box-sizing: border-box; }

    /* Hộp Khuếch Đại Âm Thanh */
    .mic-badge {
      font-size: 11.5px;
      font-weight: 800;
      color: var(--ink);
      background: #f1f2f6;
      border: 1.5px solid var(--ink);
      padding: 2px 9px;
      border-radius: 10px;
    }
    .boost-box {
      width: 100%;
      background: #f8f9fa;
      border: 2px solid var(--ink);
      border-radius: 12px;
      padding: 7px 9px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .boost-header {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      font-weight: 800;
    }
    .boost-val { color: #009432; }
    .boost-val.high { color: #e67e22; }
    .boost-val.extreme { color: #d90429; }

    input[type="range"].boost-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 6px;
      background: linear-gradient(90deg, #2ed573 0%, #ffa502 50%, #ff4757 100%);
      border-radius: 4px;
      border: 1px solid var(--ink);
      outline: none;
    }
    input[type="range"].boost-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #fff;
      cursor: pointer;
      border: 2.5px solid var(--ink);
    }
    .boost-presets {
      display: flex;
      justify-content: space-between;
      gap: 3px;
    }
    .preset-btn {
      flex: 1;
      background: #fff;
      border: 1.5px solid var(--ink);
      color: var(--ink);
      font-size: 10px;
      padding: 2px 0;
      border-radius: 5px;
      cursor: pointer;
      font-weight: 800;
    }
    .preset-btn:hover { background: var(--yellow); }

    /* =========================================================================
       KHUNG CHAT NHẮN TIN, VOICE NOTE, GỬI ẢNH & BỘ STICKER
       ========================================================================= */
    #chat-drawer {
      width: 340px;
      height: 375px;
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      border: 2.5px solid var(--ink);
      border-radius: 22px;
      box-shadow: 0 6px 0 rgba(43, 45, 66, 0.14);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
      transition: all 0.25s ease;
    }
    #chat-drawer.hidden {
      display: none;
    }
    @media (max-width: 760px) {
      #chat-drawer {
        position: fixed;
        bottom: 74px;
        left: 50%;
        transform: translateX(-50%);
        width: calc(100% - 24px);
        max-width: 410px;
        height: 360px;
        z-index: 50;
      }
    }
    .chat-header {
      background: var(--pink-light);
      border-bottom: 2px solid var(--ink);
      padding: 8px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-weight: 800;
      font-size: 13px;
    }
    .chat-tools {
      display: flex;
      gap: 5px;
      align-items: center;
    }
    .mini-tool-btn {
      background: #fff;
      border: 1.5px solid var(--ink);
      border-radius: 8px;
      padding: 2px 8px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
    }

    #chat-messages {
      flex: 1;
      padding: 10px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: rgba(255, 255, 255, 0.55);
    }
    .msg-row {
      display: flex;
      flex-direction: column;
      max-width: 84%;
    }
    .msg-row.self {
      align-self: flex-end;
      align-items: flex-end;
    }
    .msg-row.peer {
      align-self: flex-start;
      align-items: flex-start;
    }
    .msg-sender {
      font-size: 10px;
      font-weight: 800;
      color: #6c757d;
      margin-bottom: 2px;
      padding: 0 4px;
    }
    .msg-bubble {
      padding: 7px 11px;
      border-radius: 14px;
      border: 2px solid var(--ink);
      font-size: 12.5px;
      font-weight: 600;
      line-height: 1.35;
      word-break: break-word;
      user-select: text;
      -webkit-user-select: text;
      position: relative;
    }
    .msg-row.self .msg-bubble {
      background: var(--blue-light);
      border-bottom-right-radius: 4px;
    }
    .msg-row.peer .msg-bubble {
      background: var(--pink-light);
      border-bottom-left-radius: 4px;
    }

    /* Hiển thị Tin Nhắn Thoại (Voice Note) */
    .msg-voice-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 11px;
      border-radius: 14px;
      border: 2px solid var(--ink);
      background: #fff;
      min-width: 165px;
      box-shadow: 0 3px 0 rgba(43, 45, 66, 0.1);
    }
    .msg-row.self .msg-voice-wrap {
      background: var(--blue-light);
      border-bottom-right-radius: 4px;
    }
    .msg-row.peer .msg-voice-wrap {
      background: var(--pink-light);
      border-bottom-left-radius: 4px;
    }
    .vn-play-btn {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 2px solid var(--ink);
      background: var(--yellow);
      color: var(--ink);
      font-size: 11px;
      font-weight: 900;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 2px 0 var(--ink);
    }
    .vn-play-btn:active { transform: translateY(1px); box-shadow: none; }
    .vn-waves {
      display: flex;
      align-items: center;
      gap: 3px;
      flex: 1;
      height: 18px;
    }
    .vn-bar {
      width: 3.5px;
      background: var(--ink);
      border-radius: 2px;
      opacity: 0.65;
    }
    @keyframes vnPulse {
      0%, 100% { transform: scaleY(0.45); }
      50% { transform: scaleY(1.35); }
    }
    .msg-voice-wrap.playing .vn-bar {
      background: #d90429;
      opacity: 1;
      animation: vnPulse 0.4s infinite ease-in-out alternate;
    }
    .vn-dur {
      font-size: 10.5px;
      font-weight: 800;
      color: var(--ink);
    }

    /* Hiển thị Hình ảnh trong Chat */
    .msg-image-wrap {
      padding: 4px;
      border-radius: 14px;
      border: 2px solid var(--ink);
      background: #fff;
      overflow: hidden;
      cursor: zoom-in;
      box-shadow: 0 3px 0 rgba(43, 45, 66, 0.1);
    }
    .msg-image {
      display: block;
      max-width: 185px;
      max-height: 185px;
      border-radius: 10px;
      object-fit: cover;
    }

    /* Hiển thị Sticker trong Chat */
    @keyframes stickerPop {
      0% { transform: scale(0.5); opacity: 0; }
      80% { transform: scale(1.08); }
      100% { transform: scale(1); opacity: 1; }
    }
    .msg-sticker-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: stickerPop 0.28s ease-out;
    }
    .msg-sticker-img {
      width: 92px;
      height: 92px;
      object-fit: contain;
      filter: drop-shadow(0 4px 0 rgba(43, 45, 66, 0.14));
      transition: transform 0.15s;
    }
    .msg-sticker-img:hover { transform: scale(1.08) rotate(-3deg); }

    .msg-time {
      font-size: 9.5px;
      color: #777;
      margin-top: 2px;
      padding: 0 4px;
      font-weight: 700;
    }

    /* KHAY CHỌN STICKER POPUP */
    #sticker-picker {
      display: none;
      position: absolute;
      bottom: 50px;
      left: 8px;
      right: 8px;
      background: #fff;
      border: 2.5px solid var(--ink);
      border-radius: 16px;
      padding: 10px;
      box-shadow: 0 8px 0 rgba(43, 45, 66, 0.18);
      z-index: 30;
      animation: stickerPop 0.2s ease-out;
    }
    #sticker-picker.open {
      display: block;
    }
    .sticker-picker-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11.5px;
      font-weight: 800;
      margin-bottom: 8px;
      color: var(--ink);
      padding-bottom: 4px;
      border-bottom: 1.5px dashed #ddd;
    }
    .sticker-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      max-height: 170px;
      overflow-y: auto;
    }
    .sticker-item {
      background: #fff9fb;
      border: 2px solid #ffc2d1;
      border-radius: 12px;
      padding: 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      transition: transform 0.12s, border-color 0.12s;
    }
    .sticker-item:hover {
      transform: translateY(-2px) scale(1.04);
      border-color: var(--ink);
      background: var(--yellow);
    }
    .sticker-item img {
      width: 48px;
      height: 48px;
      object-fit: contain;
    }
    .sticker-item span {
      font-size: 9.5px;
      font-weight: 800;
      color: var(--ink);
      margin-top: 2px;
      white-space: nowrap;
    }

    /* THANH NHẬP TIN NHẮN & NÚT GỬI ẢNH / STICKER / VOICE NOTE */
    .chat-input-bar {
      padding: 7px;
      border-top: 2px solid var(--ink);
      background: #fff;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .chat-icon-btn {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      border: 2px solid var(--ink);
      background: #f8f9fa;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 2px 0 var(--ink);
      transition: transform 0.1s, background 0.15s;
    }
    .chat-icon-btn:hover { background: var(--yellow); }
    .chat-icon-btn:active { transform: translateY(2px); box-shadow: none; }
    .chat-icon-btn.active { background: var(--pink-light); }
    @keyframes recBlink {
      0%, 100% { background: #ffe3e3; transform: scale(1); }
      50% { background: #ff758c; transform: scale(1.06); }
    }
    .chat-icon-btn.recording {
      animation: recBlink 0.75s infinite;
    }

    #chat-input {
      flex: 1;
      min-width: 0;
      border: 2px solid var(--ink);
      border-radius: 10px;
      padding: 6px 9px;
      font-size: 12.5px;
      font-weight: 600;
      outline: none;
    }
    #chat-input:focus { border-color: var(--pink); }

    /* =========================================================================
       LIGHTBOX PHÓNG TO ẢNH KHI BẤM VÀO TRONG KHUNG CHAT
       ========================================================================= */
    #image-lightbox {
      position: fixed;
      inset: 0;
      background: rgba(20, 22, 35, 0.85);
      backdrop-filter: blur(8px);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 200;
      padding: 20px;
      cursor: zoom-out;
    }
    #lightbox-img {
      max-width: 92vw;
      max-height: 80vh;
      border-radius: 16px;
      border: 3px solid #fff;
      box-shadow: 0 15px 45px rgba(0,0,0,0.6);
      object-fit: contain;
    }
    .lightbox-actions {
      margin-top: 14px;
      display: flex;
      gap: 12px;
    }

    /* =========================================================================
       THANH ĐIỀU KHIỂN DƯỚI CÙNG (ICON VẼ BẰNG CANVAS)
       ========================================================================= */
    #bottom-controls {
      position: relative;
      z-index: 20;
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 2.5px solid var(--ink);
      padding: 7px 16px;
      border-radius: 40px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 6px 0 rgba(43, 45, 66, 0.15);
    }
    .ctrl-btn {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      border: 2.5px solid var(--ink);
      background: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      box-shadow: 0 3px 0 var(--ink);
      transition: transform 0.1s, background 0.15s;
    }
    .ctrl-btn:hover { background: #fff9db; }
    .ctrl-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
    .ctrl-btn.off { background: #ffe3e3; }
    .ctrl-btn.active-toggle { background: var(--yellow); }
    .ctrl-btn.hangup {
      background: #ff4757;
      display: none;
    }
    .unread-badge {
      position: absolute;
      top: -5px;
      right: -5px;
      background: #ff4757;
      color: #fff;
      border: 2px solid var(--ink);
      border-radius: 50%;
      width: 20px;
      height: 20px;
      font-size: 10px;
      font-weight: 900;
      display: none;
      align-items: center;
      justify-content: center;
    }

    /* HỘP THOẠI ĐỔ CHUÔNG CUỘC GỌI ĐẾN */
    #incoming-modal {
      position: fixed;
      inset: 0;
      background: rgba(43, 45, 66, 0.55);
      backdrop-filter: blur(6px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 20px;
    }
    .modal-card {
      background: #fff;
      border: 3px solid var(--ink);
      border-radius: 24px;
      padding: 24px;
      width: 100%;
      max-width: 340px;
      text-align: center;
      box-shadow: 0 10px 0 rgba(43, 45, 66, 0.25);
    }
    .incoming-actions {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 18px;
    }

    .floating-heart {
      position: fixed;
      bottom: 75px;
      pointer-events: none;
      z-index: 40;
      animation: floatUp 2.3s ease-out forwards;
    }
    @keyframes floatUp {
      0% { transform: translateY(0) scale(0.7); opacity: 1; }
      100% { transform: translateY(-300px) scale(1.35); opacity: 0; }
    }
  </style>
</head>
<body>

  <!-- Canvas Vẽ Bầu Trời Ngày (Mây, Đồi Cỏ, Hoa Đào) & Đêm (Trăng, Sao, Sao Băng, Đom Đóm) -->
  <canvas id="bg-decor-canvas"></canvas>

  <!-- Container chứa Popup Toast -->
  <div id="toast-container"></div>

  <!-- Lightbox phóng to ảnh khi bấm vào -->
  <div id="image-lightbox">
    <img id="lightbox-img" src="" alt="Zoomed" />
    <div class="lightbox-actions">
      <a id="lightbox-download" class="btn-cute blue" download="anh-ky-niem.jpg" style="text-decoration:none;">⬇️ Tải ảnh về máy</a>
      <button class="btn-cute" onclick="document.getElementById('image-lightbox').style.display='none'">✖ Đóng</button>
    </div>
  </div>

  <!-- Luồng âm thanh chạy nền & PiP -->
  <audio id="remote-raw-puller" autoplay playsinline muted></audio>
  <audio id="remote-boosted-player" autoplay playsinline></audio>
  <canvas id="pip-canvas" width="360" height="200" style="display:none;"></canvas>
  <video id="pip-video" autoplay muted playsinline style="position:fixed; width:1px; height:1px; opacity:0; pointer-events:none;"></video>

  <!-- 1. BẢNG GHÉP TRẬN TRÊN CÙNG (CÓ NÚT ĐỔI NGÀY/ĐÊM ĐỒNG BỘ & THU GỌN) -->
  <div id="top-panel">
    <div class="top-header-row">
      <div class="conn-group">
        <span class="status-pill" id="status-text">🌤️ Đang khởi tạo...</span>
        <span id="call-timer">00:00</span>
        <span class="status-pill" id="role-indicator" style="background:#e0f4ff;"></span>
      </div>
      <div class="conn-group">
        <button id="btn-theme-toggle" class="collapse-btn" style="background:#2b2d42; color:#ffe066;">🌙 Trời Đêm</button>
        <button id="btn-vocal-turbo" class="collapse-btn" style="background:#fff3bf;">Tăng âm lượng</button>
        <button id="btn-pip" class="collapse-btn" title="Tách cửa sổ nổi">🪟 Popup Nổi</button>
        <button id="btn-collapse-top" class="collapse-btn">▲ Thu gọn</button>
      </div>
    </div>

    <div id="matchmaking-body">
      <div class="conn-group">
        <span style="font-size: 12px; font-weight: 800;">Mã ID:</span>
        <span id="my-id" class="id-chip">Đang tạo...</span>
        <button id="btn-copy-link" class="btn-cute yellow">🔗 Copy Link Mời</button>
      </div>
      <div class="conn-group" id="dial-box">
        <input type="text" id="remote-id-input" class="cute-input" placeholder="Nhập ID ..." />
        <button id="btn-call" class="btn-cute">📞 Kết Nối &amp; Gọi</button>
      </div>
    </div>
  </div>

  <!-- 2. KHU VỰC TRUNG TÂM: 2 CHIBI & KHUNG CHAT -->
  <div id="main-workspace">
    <!-- Sân khấu 2 nhân vật Chibi -->
    <div id="stage-column">
      <div class="avatars-row">
        <!-- Thẻ của Bạn -->
        <div class="chibi-card">
          <div id="local-stage" class="chibi-stage male-stage">
            <div id="local-chibi-slot"></div>
          </div>
          <div id="local-mic-label" class="mic-badge">🎤 Đang bật Mic</div>

          <div class="boost-box">
            <div class="boost-header">
              <span>🎙️ Mic:</span>
              <span id="mic-boost-label" class="boost-val">100%</span>
            </div>
            <input type="range" id="mic-boost-slider" class="boost-slider" min="0" max="1000" value="100" step="10" />
            <div class="boost-presets">
              <button class="preset-btn" onclick="setMicBoost(100)">100%</button>
              <button class="preset-btn" onclick="setMicBoost(300)">300%</button>
              <button class="preset-btn" onclick="setMicBoost(600)">600%</button>
              <button class="preset-btn" onclick="setMicBoost(1000)">1000%</button>
            </div>
          </div>
        </div>

        <!-- Thẻ của cục dàng -->
        <div class="chibi-card">
          <div id="remote-stage" class="chibi-stage">
            <div id="remote-chibi-slot"></div>
          </div>
          <div id="remote-mic-label" class="mic-badge">⏳ Chưa kết nối</div>

          <div class="boost-box">
            <div class="boost-header">
              <span>🔊 Loa:</span>
              <span id="spk-boost-label" class="boost-val">100%</span>
            </div>
            <input type="range" id="spk-boost-slider" class="boost-slider" min="0" max="1000" value="100" step="10" />
            <div class="boost-presets">
              <button class="preset-btn" onclick="setSpkBoost(100)">100%</button>
              <button class="preset-btn" onclick="setSpkBoost(300)">300%</button>
              <button class="preset-btn" onclick="setSpkBoost(600)">600%</button>
              <button class="preset-btn" onclick="setSpkBoost(1000)">1000%</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Khung Chat Lưu Lịch Sử, Voice Note, Gửi Ảnh & Bộ Sticker -->
    <div id="chat-drawer">
      <div class="chat-header">
        <span>💌 Trò Chuyện</span>
        <div class="chat-tools">
          <button id="btn-clear-chat" class="mini-tool-btn" title="Xóa lịch sử trò chuyện">🗑️ Xóa</button>
        </div>
      </div>

      <div id="chat-messages"></div>

      <!-- Khay chọn Sticker dễ thương -->
      <div id="sticker-picker">
        <div class="sticker-picker-header">
          <span>✨ Chọn Nhãn Dán Chibi</span>
          <span style="cursor:pointer; color:#d90429;" onclick="toggleStickerPicker(false)">✖ Đóng</span>
        </div>
        <div class="sticker-grid" id="sticker-grid"></div>
      </div>

      <!-- Thanh nhập tin nhắn + Nút Chọn Ảnh + Nút Sticker + Nút Voice Note -->
      <div class="chat-input-bar">
        <input type="file" id="image-file-input" accept="image/*" style="display:none;" />
        <button id="btn-pick-image" class="chat-icon-btn" title="Gửi hình ảnh từ máy">
          <canvas id="icon-camera" width="22" height="22"></canvas>
        </button>
        <button id="btn-pick-sticker" class="chat-icon-btn" title="Mở bộ nhãn dán Sticker">
          <canvas id="icon-sticker" width="22" height="22"></canvas>
        </button>
        <button id="btn-voice-note" class="chat-icon-btn" title="Ghi âm tin nhắn thoại (Bấm để thu, bấm lần nữa để gửi)">
          <canvas id="icon-voicenote" width="22" height="22"></canvas>
        </button>
        <input type="text" id="chat-input" placeholder="Nhắn tin, gửi voice..." />
        <button id="btn-send-chat" class="btn-cute">Gửi</button>
      </div>
    </div>
  </div>

  <!-- 3. HỘP THOẠI ĐỔ CHUÔNG CUỘC GỌI ĐẾN -->
  <div id="incoming-modal">
    <div class="modal-card">
      <h3 style="font-size: 19px; margin-bottom: 6px; color: var(--pink);">📲 Cuộc gọi đến...</h3>
      <p id="caller-id-text" style="font-size: 12.5px; color: #555; font-weight: 700;">Từ: ...</p>
      <div class="incoming-actions">
        <button id="btn-accept" class="btn-cute" style="background: var(--green); padding: 9px 20px;">Nghe máy</button>
        <button id="btn-reject" class="btn-cute" style="background: #ff4757; padding: 9px 20px;">Từ chối</button>
      </div>
    </div>
  </div>

  <!-- 4. THANH NÚT ĐIỀU KHIỂN DƯỚI CÙNG (TẤT CẢ ICON VẼ BẰNG CANVAS) -->
  <div id="bottom-controls">
    <button id="btn-mic" class="ctrl-btn" title="Bật / Tắt Micro">
      <canvas id="icon-mic" width="28" height="28"></canvas>
    </button>
    <button id="btn-speaker" class="ctrl-btn" title="Bật / Tắt Loa">
      <canvas id="icon-speaker" width="28" height="28"></canvas>
    </button>
    <button id="btn-heart" class="ctrl-btn" title="Thả tim">
      <canvas id="icon-heart" width="28" height="28"></canvas>
    </button>
    <button id="btn-chat-toggle" class="ctrl-btn active-toggle" title="Ẩn / Hiện Khung Chat">
      <canvas id="icon-chat" width="28" height="28"></canvas>
      <span id="unread-badge" class="unread-badge">0</span>
    </button>
    <button id="btn-hangup" class="ctrl-btn hangup" title="Kết thúc / Thoát cuộc gọi">
      <canvas id="icon-hangup" width="28" height="28"></canvas>
    </button>
  </div>

  <script>
    // =========================================================================
    // 1. BỘ 8 STICKER CHIBI DỄ THƯƠNG (KHÔNG PHÁT GIỌNG NÓI KHI BẤM)
    // =========================================================================
    function createCuteStickerSVG(bgTop, bgBot, mainEmoji, subEmoji, labelText) {
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120">
        <defs>
          <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="${bgTop}"/>
            <stop offset="100%" stop-color="${bgBot}"/>
          </linearGradient>
        </defs>
        <circle cx="60" cy="54" r="46" fill="url(#g)" stroke="#2b2d42" stroke-width="5"/>
        <ellipse cx="42" cy="30" rx="12" ry="6" fill="rgba(255,255,255,0.55)" transform="rotate(-20 42 30)"/>
        <text x="60" y="62" dominant-baseline="middle" text-anchor="middle" font-size="44">${mainEmoji}</text>
        <text x="88" y="30" dominant-baseline="middle" text-anchor="middle" font-size="22">${subEmoji}</text>
        <rect x="10" y="88" width="100" height="26" rx="13" fill="#ffffff" stroke="#2b2d42" stroke-width="4"/>
        <text x="60" y="102" dominant-baseline="middle" text-anchor="middle" font-family="Segoe UI, sans-serif" font-weight="900" font-size="12.5" fill="#2b2d42">${labelText}</text>
      </svg>`;
      return "data:image/svg+xml;utf8," + encodeURIComponent(svg);
    }

    const STICKER_PACK = [
      { id: "love", label: "Yêu thương", src: createCuteStickerSVG("#ff9a9e", "#fecfef", "🥰", "💖", "Yêu thương") },
      { id: "hug", label: "Ôm cái nào", src: createCuteStickerSVG("#a1c4fd", "#c2e9fb", "🤗", "✨", "Ôm cái nào") },
      { id: "miss", label: "Nhớ quá đi", src: createCuteStickerSVG("#fbc2eb", "#a6c1ee", "🥺", "💭", "Nhớ quá đi") },
      { id: "flower", label: "Tặng hoa nè", src: createCuteStickerSVG("#ffecd2", "#fcb69f", "💐", "🌸", "Tặng hoa nè") },
      { id: "kiss", label: "Hôn chụt", src: createCuteStickerSVG("#ff758c", "#ff7eb3", "😘", "💋", "Hôn chụt!") },
      { id: "pout", label: "Dỗi rồi nha", src: createCuteStickerSVG("#fdcbf1", "#e6dee9", "😤", "💢", "Dỗi rồi nha") },
      { id: "party", label: "Quẩy lên!", src: createCuteStickerSVG("#f6d365", "#fda085", "🥳", "🎉", "Quẩy lên!") },
      { id: "sleep", label: "Ngủ ngoan nhé", src: createCuteStickerSVG("#89f7fe", "#66a6ff", "😴", "🌙", "Ngủ ngon nhé") }
    ];

    const stickerGridEl = document.getElementById("sticker-grid");
    STICKER_PACK.forEach(st => {
      const btn = document.createElement("div");
      btn.className = "sticker-item";
      btn.innerHTML = `<img src="${st.src}" alt="${st.label}" /><span>${st.label}</span>`;
      btn.addEventListener("click", () => {
        sendStickerMessage(st.id);
        toggleStickerPicker(false);
      });
      stickerGridEl.appendChild(btn);
    });

    function toggleStickerPicker(forceState) {
      const picker = document.getElementById("sticker-picker");
      const btn = document.getElementById("btn-pick-sticker");
      const isOpen = typeof forceState === "boolean" ? forceState : !picker.classList.contains("open");
      picker.classList.toggle("open", isOpen);
      btn.classList.toggle("active", isOpen);
    }

    document.getElementById("btn-pick-sticker").addEventListener("click", () => toggleStickerPicker());

    // =========================================================================
    // 2. VẼ CÁC ICON BẰNG HTML5 CANVAS (MIC, LOA, TIM, CHAT, MÁY ẢNH, STICKER, VOICE NOTE)
    // =========================================================================
    function drawCanvasIcon(canvasId, type, isOff = false) {
      const c = document.getElementById(canvasId);
      if (!c) return;
      const ctx = c.getContext("2d");
      const w = c.width;
      const h = c.height;
      ctx.clearRect(0, 0, w, h);
      ctx.strokeStyle = "#2b2d42";
      ctx.lineWidth = 2.2;
      ctx.lineCap = "round";
      ctx.lineJoin = "round";

      if (type === "mic") {
        ctx.fillStyle = isOff ? "#ffccd5" : "#4facfe";
        ctx.beginPath();
        ctx.roundRect(10, 4, 8, 12, 4);
        ctx.fill();
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(14, 12, 7, 0, Math.PI, false);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(14, 19); ctx.lineTo(14, 24);
        ctx.moveTo(10, 24); ctx.lineTo(18, 24);
        ctx.stroke();
      } 
      else if (type === "speaker") {
        ctx.fillStyle = isOff ? "#ffccd5" : "#ffe066";
        ctx.beginPath();
        ctx.moveTo(5, 11);
        ctx.lineTo(10, 11);
        ctx.lineTo(16, 6);
        ctx.lineTo(16, 22);
        ctx.lineTo(10, 17);
        ctx.lineTo(5, 17);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        if (!isOff) {
          ctx.beginPath(); ctx.arc(17, 14, 4, -0.7, 0.7); ctx.stroke();
          ctx.beginPath(); ctx.arc(17, 14, 7.5, -0.8, 0.8); ctx.stroke();
        }
      } 
      else if (type === "heart") {
        ctx.fillStyle = "#ff758c";
        ctx.beginPath();
        ctx.moveTo(14, 23);
        ctx.bezierCurveTo(4, 16, 3, 9, 8, 6);
        ctx.bezierCurveTo(11, 4.5, 14, 7, 14, 9.5);
        ctx.bezierCurveTo(14, 7, 17, 4.5, 20, 6);
        ctx.bezierCurveTo(25, 9, 24, 16, 14, 23);
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = "#fff";
        ctx.beginPath(); ctx.arc(8.5, 9.5, 1.5, 0, Math.PI * 2); ctx.fill();
      } 
      else if (type === "chat") {
        ctx.fillStyle = "#70d6ff";
        ctx.beginPath();
        ctx.roundRect(4, 5, 20, 15, 6);
        ctx.fill();
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(9, 20); ctx.lineTo(7, 24); ctx.lineTo(14, 20);
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = "#2b2d42";
        [10, 14, 18].forEach(x => {
          ctx.beginPath(); ctx.arc(x, 12.5, 1.4, 0, Math.PI * 2); ctx.fill();
        });
      } 
      else if (type === "hangup") {
        ctx.strokeStyle = "#ffffff";
        ctx.lineWidth = 2.8;
        ctx.beginPath();
        ctx.arc(14, 15, 7, 0.8 * Math.PI, 0.2 * Math.PI, false);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(14, 5); ctx.lineTo(14, 14);
        ctx.stroke();
      }
      else if (type === "camera") {
        ctx.lineWidth = 1.9;
        ctx.fillStyle = "#70d6ff";
        ctx.beginPath();
        ctx.roundRect(2, 6, 18, 13, 3.5);
        ctx.fill();
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(7, 6); ctx.lineTo(8.5, 3); ctx.lineTo(13.5, 3); ctx.lineTo(15, 6);
        ctx.stroke();
        ctx.fillStyle = "#ffffff";
        ctx.beginPath();
        ctx.arc(11, 12.5, 3.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
      }
      else if (type === "sticker") {
        ctx.lineWidth = 1.9;
        ctx.fillStyle = "#ffe066";
        ctx.beginPath();
        ctx.arc(11, 11, 8.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = "#2b2d42";
        ctx.beginPath(); ctx.arc(8, 9.5, 1.3, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(14, 9.5, 1.3, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath();
        ctx.arc(11, 11.5, 4, 0.15 * Math.PI, 0.85 * Math.PI);
        ctx.stroke();
      }
      else if (type === "voicenote") {
        ctx.lineWidth = 1.9;
        if (isOff) {
          ctx.fillStyle = "#ff4757";
          ctx.beginPath();
          ctx.roundRect(5, 5, 12, 12, 3);
          ctx.fill();
          ctx.stroke();
          return;
        } else {
          ctx.fillStyle = "#ff758c";
          ctx.beginPath();
          ctx.roundRect(8, 3, 6, 10, 3);
          ctx.fill();
          ctx.stroke();
          ctx.beginPath();
          ctx.arc(11, 9.5, 5.5, 0, Math.PI, false);
          ctx.stroke();
          ctx.beginPath();
          ctx.moveTo(11, 15); ctx.lineTo(11, 19);
          ctx.moveTo(8, 19); ctx.lineTo(14, 19);
          ctx.stroke();
        }
      }

      if (isOff && type !== "voicenote") {
        ctx.strokeStyle = "#d90429";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(5, 5);
        ctx.lineTo(23, 23);
        ctx.stroke();
      }
    }

    function renderAllIcons() {
      drawCanvasIcon("icon-mic", "mic", false);
      drawCanvasIcon("icon-speaker", "speaker", false);
      drawCanvasIcon("icon-heart", "heart", false);
      drawCanvasIcon("icon-chat", "chat", false);
      drawCanvasIcon("icon-hangup", "hangup", false);
      drawCanvasIcon("icon-camera", "camera", false);
      drawCanvasIcon("icon-sticker", "sticker", false);
      drawCanvasIcon("icon-voicenote", "voicenote", false);
    }
    renderAllIcons();

    // =========================================================================
    // 3. VẼ NỀN BAN NGÀY & TRỜI ĐÊM (TRĂNG, SAO, SAO BĂNG & ĐOM ĐÓM) + ĐỒNG BỘ P2P
    // =========================================================================
    const bgCanvas = document.getElementById("bg-decor-canvas");
    const bgCtx = bgCanvas.getContext("2d");
    let isNightMode = false;

    const clouds = [
      { x: 100, y: 80, s: 0.9, v: 0.25 },
      { x: 450, y: 130, s: 1.2, v: 0.18 },
      { x: 850, y: 70, s: 0.8, v: 0.3 },
      { x: 1200, y: 110, s: 1.0, v: 0.22 }
    ];

    const petals = Array.from({ length: 18 }, () => ({
      x: Math.random() * window.innerWidth,
      y: Math.random() * window.innerHeight,
      r: 4 + Math.random() * 4,
      vx: 0.4 + Math.random() * 0.5,
      vy: 0.6 + Math.random() * 0.6,
      a: Math.random() * Math.PI * 2
    }));

    // Vì sao lấp lánh trên bầu trời đêm
    const stars = Array.from({ length: 75 }, () => ({
      x: Math.random(),
      y: Math.random() * 0.72,
      r: 0.8 + Math.random() * 1.9,
      phase: Math.random() * Math.PI * 2,
      speed: 0.002 + Math.random() * 0.004,
      sparkle: Math.random() < 0.2
    }));

    // Đàn đom đóm chập chờn bay nhẹ nhàng
    const fireflies = Array.from({ length: 28 }, () => ({
      x: Math.random() * window.innerWidth,
      y: window.innerHeight * 0.3 + Math.random() * (window.innerHeight * 0.7),
      vx: (Math.random() - 0.5) * 0.4,
      vy: -0.12 - Math.random() * 0.32,
      r: 2 + Math.random() * 2,
      phase: Math.random() * Math.PI * 2,
      glowSpeed: 0.002 + Math.random() * 0.003
    }));

    // Mảng quản lý các vệt Sao Băng bay ngang qua bầu trời đêm
    const shootingStars = [];

    function spawnShootingStar() {
      const w = bgCanvas.width;
      const h = bgCanvas.height;
      // Xuất phát từ vùng cao bên phải bay chéo xuống bên trái
      const startX = w * 0.25 + Math.random() * (w * 0.75);
      const startY = Math.random() * (h * 0.32);
      const angle = (Math.PI * 0.76) + (Math.random() - 0.5) * 0.14;
      const speed = 9 + Math.random() * 6;

      shootingStars.push({
        x: startX,
        y: startY,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * (speed * 0.55),
        tailLen: 85 + Math.random() * 65,
        life: 0,
        maxLife: 42 + Math.random() * 26,
        size: 2.2 + Math.random() * 1.2
      });
    }

    function resizeBg() {
      bgCanvas.width = window.innerWidth;
      bgCanvas.height = window.innerHeight;
    }
    window.addEventListener("resize", resizeBg);
    resizeBg();

    // Hàm cập nhật chế độ Ngày / Đêm và đồng bộ P2P sang máy đối phương
    const btnThemeToggle = document.getElementById("btn-theme-toggle");

    function setNightModeState(nightState, broadcastToPeer = false, isFromPeer = false) {
      isNightMode = !!nightState;
      document.body.classList.toggle("night-mode", isNightMode);

      if (isNightMode) {
        btnThemeToggle.innerText = "☀️ Ban Ngày";
        btnThemeToggle.style.background = "#ffe066";
        btnThemeToggle.style.color = "#2b2d42";
        // Gọi ngay 2 ngôi sao băng chào đón khi vừa chuyển sang Trời Đêm
        spawnShootingStar();
        setTimeout(() => { if (isNightMode) spawnShootingStar(); }, 600);
      } else {
        btnThemeToggle.innerText = "🌙 Trời Đêm";
        btnThemeToggle.style.background = "#2b2d42";
        btnThemeToggle.style.color = "#ffe066";
      }

      if (broadcastToPeer && dataConn && dataConn.open) {
        dataConn.send({ type: "THEME_SYNC", isNightMode });
      }

      if (isFromPeer) {
        const peerLabel = myGender === "male" ? "Tuyến 💖" : "Đạt 💙";
        showPopupToast(
          isNightMode ? `${peerLabel} vừa chuyển sang Trời Đêm 🌠` : `${peerLabel} vừa chuyển sang Ban Ngày ☀️`,
          "info",
          isNightMode ? "🌙" : "☀️"
        );
      }
    }

    btnThemeToggle.addEventListener("click", () => {
      setNightModeState(!isNightMode, true, false);
    });

    function drawBackgroundDecor(time) {
      const w = bgCanvas.width;
      const h = bgCanvas.height;
      bgCtx.clearRect(0, 0, w, h);

      if (!isNightMode) {
        // ================= BAN NGÀY =================
        bgCtx.save();
        bgCtx.fillStyle = "#ffe066";
        bgCtx.strokeStyle = "rgba(255, 224, 102, 0.35)";
        bgCtx.lineWidth = 12;
        bgCtx.beginPath();
        bgCtx.arc(65, 65, 32 + Math.sin(time * 0.002) * 3, 0, Math.PI * 2);
        bgCtx.fill();
        bgCtx.stroke();
        bgCtx.restore();

        bgCtx.fillStyle = "rgba(255, 255, 255, 0.78)";
        clouds.forEach(c => {
          c.x += c.v;
          if (c.x - 100 > w) c.x = -120;
          bgCtx.beginPath();
          bgCtx.arc(c.x, c.y, 24 * c.s, 0, Math.PI * 2);
          bgCtx.arc(c.x + 22 * c.s, c.y - 8 * c.s, 28 * c.s, 0, Math.PI * 2);
          bgCtx.arc(c.x + 48 * c.s, c.y, 22 * c.s, 0, Math.PI * 2);
          bgCtx.fill();
        });

        bgCtx.fillStyle = "#c7f9cc";
        bgCtx.beginPath();
        bgCtx.ellipse(w * 0.25, h + 40, w * 0.45, 130, 0, Math.PI, 0);
        bgCtx.fill();

        bgCtx.fillStyle = "#b5e48c";
        bgCtx.beginPath();
        bgCtx.ellipse(w * 0.78, h + 50, w * 0.45, 145, 0, Math.PI, 0);
        bgCtx.fill();

        bgCtx.fillStyle = "#ff8fa3";
        petals.forEach(p => {
          p.x += p.vx;
          p.y += p.vy;
          p.a += 0.02;
          if (p.x > w) p.x = -10;
          if (p.y > h) p.y = -10;
          bgCtx.save();
          bgCtx.translate(p.x, p.y);
          bgCtx.rotate(p.a);
          bgCtx.beginPath();
          bgCtx.ellipse(0, 0, p.r, p.r * 0.6, 0, 0, Math.PI * 2);
          bgCtx.fill();
          bgCtx.restore();
        });
      } else {
        // ================= TRỜI ĐÊM (TRĂNG, SAO, SAO BĂNG & ĐOM ĐÓM) =================
        // 1. Vì sao lấp lánh
        stars.forEach(st => {
          const sx = st.x * w;
          const sy = st.y * h;
          const alpha = 0.2 + 0.8 * Math.pow(Math.sin(time * st.speed + st.phase), 2);
          bgCtx.save();
          bgCtx.fillStyle = `rgba(255, 252, 225, ${alpha})`;
          bgCtx.beginPath();
          bgCtx.arc(sx, sy, st.r, 0, Math.PI * 2);
          bgCtx.fill();

          if (st.sparkle && alpha > 0.65) {
            bgCtx.strokeStyle = `rgba(255, 252, 225, ${alpha * 0.85})`;
            bgCtx.lineWidth = 1.1;
            const len = st.r * 3.4;
            bgCtx.beginPath();
            bgCtx.moveTo(sx - len, sy); bgCtx.lineTo(sx + len, sy);
            bgCtx.moveTo(sx, sy - len); bgCtx.lineTo(sx, sy + len);
            bgCtx.stroke();
          }
          bgCtx.restore();
        });

        // 2. Hiệu ứng Sao Băng bay ngang qua bầu trời đêm
        if (Math.random() < 0.014 && shootingStars.length < 3) {
          spawnShootingStar();
        }

        for (let i = shootingStars.length - 1; i >= 0; i--) {
          const ss = shootingStars[i];
          ss.x += ss.vx;
          ss.y += ss.vy;
          ss.life++;

          const progress = ss.life / ss.maxLife;
          const alpha = progress < 0.2 ? progress / 0.2 : Math.max(0, 1 - (progress - 0.2) / 0.8);

          const speedMag = Math.hypot(ss.vx, ss.vy) || 1;
          const tailX = ss.x - (ss.vx / speedMag) * ss.tailLen;
          const tailY = ss.y - (ss.vy / speedMag) * ss.tailLen;

          bgCtx.save();
          // Vệt đuôi sao băng chuyển màu phát sáng
          const tailGrad = bgCtx.createLinearGradient(ss.x, ss.y, tailX, tailY);
          tailGrad.addColorStop(0, `rgba(255, 255, 240, ${alpha})`);
          tailGrad.addColorStop(0.35, `rgba(140, 225, 255, ${alpha * 0.65})`);
          tailGrad.addColorStop(1, "rgba(140, 225, 255, 0)");

          bgCtx.strokeStyle = tailGrad;
          bgCtx.lineWidth = ss.size;
          bgCtx.lineCap = "round";
          bgCtx.beginPath();
          bgCtx.moveTo(ss.x, ss.y);
          bgCtx.lineTo(tailX, tailY);
          bgCtx.stroke();

          // Đầu ngôi sao băng lóe sáng chữ thập
          bgCtx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
          bgCtx.beginPath();
          bgCtx.arc(ss.x, ss.y, ss.size * 1.15, 0, Math.PI * 2);
          bgCtx.fill();

          bgCtx.strokeStyle = `rgba(255, 245, 190, ${alpha * 0.9})`;
          bgCtx.lineWidth = 1.2;
          const flare = ss.size * 3.5;
          bgCtx.beginPath();
          bgCtx.moveTo(ss.x - flare, ss.y); bgCtx.lineTo(ss.x + flare, ss.y);
          bgCtx.moveTo(ss.x, ss.y - flare); bgCtx.lineTo(ss.x, ss.y + flare);
          bgCtx.stroke();
          bgCtx.restore();

          if (ss.life >= ss.maxLife || ss.x < -150 || ss.y > h) {
            shootingStars.splice(i, 1);
          }
        }

        // 3. Mặt trăng khuyết & Hào quang
        bgCtx.save();
        const mx = 75, my = 72;
        const halo = bgCtx.createRadialGradient(mx, my, 14, mx, my, 82);
        halo.addColorStop(0, "rgba(255, 243, 176, 0.4)");
        halo.addColorStop(0.5, "rgba(255, 243, 176, 0.14)");
        halo.addColorStop(1, "rgba(255, 243, 176, 0)");
        bgCtx.fillStyle = halo;
        bgCtx.beginPath();
        bgCtx.arc(mx, my, 82, 0, Math.PI * 2);
        bgCtx.fill();

        bgCtx.fillStyle = "#fff3b0";
        bgCtx.beginPath();
        bgCtx.arc(mx, my, 30, 0.2 * Math.PI, 1.35 * Math.PI, false);
        bgCtx.quadraticCurveTo(mx - 4, my + 4, mx + 17, my + 24);
        bgCtx.closePath();
        bgCtx.fill();
        bgCtx.restore();

        // 4. Mây đêm mờ nhẹ
        bgCtx.fillStyle = "rgba(65, 80, 135, 0.22)";
        clouds.forEach(c => {
          c.x += c.v * 0.55;
          if (c.x - 100 > w) c.x = -120;
          bgCtx.beginPath();
          bgCtx.arc(c.x, c.y, 24 * c.s, 0, Math.PI * 2);
          bgCtx.arc(c.x + 22 * c.s, c.y - 8 * c.s, 28 * c.s, 0, Math.PI * 2);
          bgCtx.arc(c.x + 48 * c.s, c.y, 22 * c.s, 0, Math.PI * 2);
          bgCtx.fill();
        });

        // 5. Đồi cỏ đêm yên bình
        bgCtx.fillStyle = "#14283d";
        bgCtx.beginPath();
        bgCtx.ellipse(w * 0.25, h + 40, w * 0.45, 130, 0, Math.PI, 0);
        bgCtx.fill();

        bgCtx.fillStyle = "#0d1d2e";
        bgCtx.beginPath();
        bgCtx.ellipse(w * 0.78, h + 50, w * 0.45, 145, 0, Math.PI, 0);
        bgCtx.fill();

        // 6. Đom đóm chập chờn nhẹ nhàng
        fireflies.forEach(f => {
          f.x += f.vx + Math.sin(time * 0.0016 + f.phase) * 0.35;
          f.y += f.vy + Math.cos(time * 0.0013 + f.phase) * 0.25;

          if (f.x < -20) f.x = w + 20;
          if (f.x > w + 20) f.x = -20;
          if (f.y < h * 0.22) f.y = h + 10;

          const glow = 0.12 + 0.88 * Math.pow(Math.sin(time * f.glowSpeed + f.phase), 2);
          const rad = f.r * 5.8;

          bgCtx.save();
          const fGrad = bgCtx.createRadialGradient(f.x, f.y, 0.5, f.x, f.y, rad);
          fGrad.addColorStop(0, `rgba(235, 255, 130, ${glow})`);
          fGrad.addColorStop(0.45, `rgba(170, 245, 75, ${glow * 0.45})`);
          fGrad.addColorStop(1, "rgba(170, 245, 75, 0)");
          bgCtx.fillStyle = fGrad;
          bgCtx.beginPath();
          bgCtx.arc(f.x, f.y, rad, 0, Math.PI * 2);
          bgCtx.fill();

          bgCtx.fillStyle = `rgba(255, 255, 215, ${glow})`;
          bgCtx.beginPath();
          bgCtx.arc(f.x, f.y, f.r * 0.85, 0, Math.PI * 2);
          bgCtx.fill();
          bgCtx.restore();
        });
      }

      requestAnimationFrame(drawBackgroundDecor);
    }
    requestAnimationFrame(drawBackgroundDecor);

    // =========================================================================
    // 4. QUY TẮC NHÂN VẬT CHIBI: NGƯỜI TRƯỚC = NAM, NGƯỜI SAU = NỮ
    // =========================================================================
    const urlParams = new URLSearchParams(window.location.search);
    let myGender = urlParams.get("id") ? "female" : "male";

    function buildChibiModelHTML(gender, customId, tagLabel) {
      if (gender === "male") {

    function applyGenderRoles(localRoleGender) {
      myGender = localRoleGender;
      const peerGender = myGender === "male" ? "female" : "male";

      const localTag = myGender === "male" ? "Đạt 💙 (Bạn)" : "Tuyến 💖 (Bạn)";
      const peerTag = peerGender === "male" ? "Đạt 💙" : "Tuyến 💖";

      document.getElementById("local-chibi-slot").innerHTML = buildChibiModelHTML(myGender, "local-chibi-model", localTag);
      document.getElementById("remote-chibi-slot").innerHTML = buildChibiModelHTML(peerGender, "remote-chibi-model", peerTag);

        roleInd.style.display = "inline-flex";
        roleInd.style.background = "#ffe5ec";
      }
    }

    applyGenderRoles(myGender);

    const topPanel = document.getElementById("top-panel");
    const btnCollapseTop = document.getElementById("btn-collapse-top");
    btnCollapseTop.addEventListener("click", () => {
      const isCollapsed = topPanel.classList.toggle("collapsed");
      btnCollapseTop.innerText = isCollapsed ? "▼ Mở bảng" : "▲ Thu gọn";
    });

    // =========================================================================
    // 5. HỆ THỐNG CHAT ĐA PHƯƠNG TIỆN (TEXT + VOICE NOTE + ẢNH NÉN + STICKER)
    // =========================================================================
    const CHAT_STORAGE_KEY = "chibi_p2p_chat_history_v2";
    let chatHistory = [];
    let unreadCount = 0;
    let activeVoiceAudio = null;

    const chatDrawer = document.getElementById("chat-drawer");
    const chatMessagesEl = document.getElementById("chat-messages");
    const chatInput = document.getElementById("chat-input");
    const unreadBadge = document.getElementById("unread-badge");

    function loadSavedChat() {
      try {
        const raw = localStorage.getItem(CHAT_STORAGE_KEY);
        if (raw) chatHistory = JSON.parse(raw);
      } catch (e) { chatHistory = []; }
      renderChatMessages();
    }

    function saveChatToStorage() {
      while (chatHistory.length > 50) chatHistory.shift();
      while (chatHistory.length > 0) {
        try {
          localStorage.setItem(CHAT_STORAGE_KEY, JSON.stringify(chatHistory));
          break;
        } catch (quotaErr) {
          chatHistory.shift();
        }
      }
    }

    window.openImageLightbox = function(imgSrc) {
      const lb = document.getElementById("image-lightbox");
      document.getElementById("lightbox-img").src = imgSrc;
      document.getElementById("lightbox-download").href = imgSrc;
      lb.style.display = "flex";
    };

    document.getElementById("image-lightbox").addEventListener("click", (e) => {
      if (e.target.id === "image-lightbox") e.currentTarget.style.display = "none";
    });

    window.playVoiceNote = function(index, btnEl) {
      const item = chatHistory[index];
      if (!item || !item.content) return;
      const wrapEl = btnEl.closest(".msg-voice-wrap");

      if (activeVoiceAudio && !activeVoiceAudio.paused) {
        activeVoiceAudio.pause();
        document.querySelectorAll(".msg-voice-wrap").forEach(el => el.classList.remove("playing"));
        document.querySelectorAll(".vn-play-btn").forEach(b => (b.innerText = "▶"));
        if (activeVoiceAudio._idx === index) {
          activeVoiceAudio = null;
          return;
        }
      }

      const audio = new Audio(item.content);
      audio._idx = index;
      activeVoiceAudio = audio;
      wrapEl.classList.add("playing");
      btnEl.innerText = "⏸";

      audio.play().catch(() => {});
      audio.onended = () => {
        wrapEl.classList.remove("playing");
        btnEl.innerText = "▶";
        activeVoiceAudio = null;
      };
    };

    function renderChatMessages() {
      chatMessagesEl.innerHTML = "";
      if (chatHistory.length === 0) {
        chatMessagesEl.innerHTML = `<div style="text-align:center; color:#777; font-size:12px; margin-top:45px; line-height:1.5;">Chưa có tin nhắn nào.<br/></div>`;
        return;
      }

      chatHistory.forEach((item, idx) => {
        const row = document.createElement("div");
        const isSelf = item.senderGender === myGender;
        row.className = `msg-row ${isSelf ? "self" : "peer"}`;
        const senderName = item.senderGender === "male" ? "Đạt 💙" : "Tuyến 💖";

        const kind = item.kind || "text";
        let bodyHTML = "";

        if (kind === "image") {
          bodyHTML = `
            <div class="msg-image-wrap" onclick="openImageLightbox('${item.content}')" title="Bấm để phóng to ảnh">
              <img class="msg-image" src="${item.content}" alt="Photo" />
            </div>
          `;
        } else if (kind === "sticker") {
          const stObj = STICKER_PACK.find(s => s.id === item.content) || STICKER_PACK[0];
          bodyHTML = `
            <div class="msg-sticker-wrap">
              <img class="msg-sticker-img" src="${stObj.src}" alt="${stObj.label}" />
            </div>
          `;
        } else if (kind === "voice") {
          const durText = item.duration ? `${item.duration}s` : "Voice";
          const heights = [8, 14, 10, 16, 11, 18, 9, 15, 11, 16, 8];
          const barsHTML = heights.map((h, i) => `<div class="vn-bar" style="height:${h}px; animation-delay:${i * 0.05}s"></div>`).join("");
          bodyHTML = `
            <div class="msg-voice-wrap">
              <button class="vn-play-btn" onclick="playVoiceNote(${idx}, this)">▶</button>
              <div class="vn-waves">${barsHTML}</div>
              <span class="vn-dur">${durText}</span>
            </div>

    async function initLocalAudioWithBooster() {
      try {
        const rawStream = await navigator.mediaDevices.getUserMedia({
          audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
          video: false
        });
        rawMicStream = rawStream;

        const ctx = ensureAudioContext();
        const source = ctx.createMediaStreamSource(rawStream);

        highPass.type = "highpass";
        highPass.frequency.setValueAtTime(85, ctx.currentTime);

        micVocalFilter = ctx.createBiquadFilter();
        micVocalFilter.type = "peaking";
        micVocalFilter.frequency.setValueAtTime(2500, ctx.currentTime);
        micVocalFilter.Q.setValueAtTime(1.0, ctx.currentTime);
        micVocalFilter.gain.setValueAtTime(isVocalTurbo ? 8 : 0, ctx.currentTime);

        micGainNode = ctx.createGain();
        micGainNode.gain.value = currentMicBoost;

        const compressor = ctx.createDynamicsCompressor();
        compressor.threshold.setValueAtTime(-16, ctx.currentTime);
        compressor.knee.setValueAtTime(12, ctx.currentTime);
        compressor.ratio.setValueAtTime(18, ctx.currentTime);

        const destination = ctx.createMediaStreamDestination();

        source.connect(highPass);
        highPass.connect(micVocalFilter);
        micVocalFilter.connect(micGainNode);
        micGainNode.connect(compressor);
        compressor.connect(destination);

        processedMicStream = destination.stream;
        statusText.innerText = "🟢 Sẵn sàng kết nối";

        activateBackgroundPersistence();
        setupVoiceVisualizer(processedMicStream, localStage, "local-chibi-model", true);
        return processedMicStream;
      } catch (err) {
        statusText.innerText = "⚠️ Chưa cấp quyền Micro";
        return null;
      }
    }

      const source = ctx.createMediaStreamSource(remoteStream);

      remoteGainNode = ctx.createGain();

      const limiter = ctx.createDynamicsCompressor();
      limiter.threshold.setValueAtTime(-10, ctx.currentTime);
      limiter.knee.setValueAtTime(10, ctx.currentTime);
      limiter.ratio.setValueAtTime(20, ctx.currentTime);

      const boostedDestination = ctx.createMediaStreamDestination();

      source.connect(highPass);
      highPass.connect(remoteVocalFilter);
      remoteVocalFilter.connect(remoteGainNode);
      remoteGainNode.connect(limiter);
      limiter.connect(boostedDestination);

      remoteBoostedPlayer.srcObject = boostedDestination.stream;
      remoteBoostedPlayer.muted = false;
      remoteBoostedPlayer.play().catch(() => {
        limiter.connect(ctx.destination);
      });

      setupVoiceVisualizer(boostedDestination.stream, remoteStage, "remote-chibi-model", false);

    function setupVoiceVisualizer(stream, stageEl, chibiId, isLocal) {
      try {
        const ctx = ensureAudioContext();
        const source = ctx.createMediaStreamSource(stream);
        const analyser = ctx.createAnalyser();
        analyser.fftSize = 256;
        source.connect(analyser);
        const dataArray = new Uint8Array(analyser.frequencyBinCount);

        function updateMeter() {
          if (!stream.active) return;
          analyser.getByteFrequencyData(dataArray);
          let sum = 0;
          for (let i = 0; i < dataArray.length; i++) sum += dataArray[i];
          const avg = sum / dataArray.length;

          if (isLocal) localVolumeLevel = avg;
          else remoteVolumeLevel = avg;

          if (document.visibilityState === "visible") {
            const chibiEl = document.getElementById(chibiId);
            if (avg > 9) {
              const radius = Math.min(32, avg * 0.5);
              stageEl.style.boxShadow = `0 0 0 ${radius * 0.35}px rgba(255, 117, 140, 0.35)`;
              if (chibiEl) chibiEl.classList.add("moving");
            } else {
              stageEl.style.boxShadow = "none";
              if (chibiEl) chibiEl.classList.remove("moving");
            }
          }
          requestAnimationFrame(updateMeter);
        }
        updateMeter();
      } catch (e) {}
    }

        document.getElementById("btn-hangup").style.display = "flex";

        topPanel.classList.add("collapsed");
        btnCollapseTop.innerText = "▼ Mở bảng";

        startCallTimer();
        startHeartbeat();
        showPopupToast("Đã ghép đôi trò chuyện thành công!", "success", "💖");
      });

      call.on("close", () => endCallCleanup("Đã kết thúc cuộc gọi"));
      call.on("error", () => endCallCleanup("Mất kết nối"));
    }

    function setupDataChannel() {
      if (!dataConn) return;
      dataConn.on("open", () => {
        dataConn.send({ type: "MIC_STATE", isMicOn });
        // Chủ phòng (Nam) tự động đồng bộ trạng thái Ngày/Đêm hiện tại sang máy Nữ khi vừa kết nối
        if (myGender === "male") {
          dataConn.send({ type: "THEME_SYNC", isNightMode });
        }
      });
      dataConn.on("data", data => {
        if (data.type === "HEART") {
          spawnFloatingHeart();
          showPopupToast("cục dàng vừa thả tim!", "info", "💗");
        }
        else if (data.type === "THEME_SYNC") {
          setNightModeState(data.isNightMode, false, true);
        }
        else if (data.type === "CHAT_MSG") {
          appendNewChatItem(data.kind || "text", data.content || data.text, data.senderGender, true, data.duration || null);
        }
        else if (data.type === "HANGUP") {
          showPopupToast("cục dàng đã rời cuộc gọi", "warn", "📴");
          endCallCleanup("Đã ngắt kết nối");
        }
        else if (data.type === "REJECTED") {
          showPopupToast("Đối phương bận hoặc từ chối", "warn", "✖");
          endCallCleanup("Từ chối cuộc gọi");
        }
        else if (data.type === "MIC_STATE") {
          document.getElementById("remote-mic-label").innerText = data.isMicOn ? "🎤 Đang bật Mic" : "🔇 Đã tắt Mic";
        }
        else if (data.type === "PING") {
          if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
        }
      });
    }

    function startHeartbeat() {
      stopHeartbeat();
      heartbeatInterval = setInterval(() => {
        if (dataConn && dataConn.open) dataConn.send({ type: "PING" });
        if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
      }, 4000);
    }
    function stopHeartbeat() {
      if (heartbeatInterval) { clearInterval(heartbeatInterval); heartbeatInterval = null; }
    }

    window.addEventListener("pagehide", () => {
      if (dataConn && dataConn.open) dataConn.send({ type: "HANGUP" });
      if (currentCall) currentCall.close();
      peer.destroy();
    });

    function endCallCleanup(reasonText) {
      stopRingtone();
      stopHeartbeat();
      if (currentCall) { currentCall.close(); currentCall = null; }
      remoteRawPuller.srcObject = null;
      remoteBoostedPlayer.srcObject = null;
      document.getElementById("remote-mic-label").innerText = "⏳ Chưa kết nối";
      statusText.innerText = reasonText || "🟢 Sẵn sàng";
      document.getElementById("btn-hangup").style.display = "none";
      stopCallTimer();
    }

    // =========================================================================
    // 8. SỰ KIỆN CÁC NÚT ĐIỀU KHIỂN CANVAS & POPUP NỔI (PIP)
    // =========================================================================
    document.getElementById("btn-mic").addEventListener("click", e => {
      ensureAudioContext();
      isMicOn = !isMicOn;
      if (rawMicStream) rawMicStream.getAudioTracks().forEach(t => (t.enabled = isMicOn));
      if (micGainNode) micGainNode.gain.setTargetAtTime(isMicOn ? currentMicBoost : 0, audioCtx.currentTime, 0.02);

      e.currentTarget.classList.toggle("off", !isMicOn);
      drawCanvasIcon("icon-mic", "mic", !isMicOn);
      document.getElementById("local-mic-label").innerText = isMicOn ? "🎤 Đang bật Mic" : "🔇 Đã tắt Mic";
      if (dataConn && dataConn.open) dataConn.send({ type: "MIC_STATE", isMicOn });
    });

    document.getElementById("btn-speaker").addEventListener("click", e => {
      ensureAudioContext();
      isSpeakerOn = !isSpeakerOn;
      if (remoteGainNode) remoteGainNode.gain.setTargetAtTime(isSpeakerOn ? currentSpkBoost : 0, audioCtx.currentTime, 0.02);
      remoteBoostedPlayer.muted = !isSpeakerOn;

      e.currentTarget.classList.toggle("off", !isSpeakerOn);
      drawCanvasIcon("icon-speaker", "speaker", !isSpeakerOn);
    });

    function spawnFloatingHeart() {
      const heartCanvas = document.createElement("canvas");
      heartCanvas.width = 32;
      heartCanvas.height = 32;
      heartCanvas.className = "floating-heart";
      heartCanvas.style.left = (25 + Math.random() * 50) + "%";
      document.body.appendChild(heartCanvas);

      const hCtx = heartCanvas.getContext("2d");
      hCtx.fillStyle = ["#ff758c", "#ff4d6d", "#ff8fa3"][Math.floor(Math.random() * 3)];
      hCtx.strokeStyle = "#2b2d42";
      hCtx.lineWidth = 2;
      hCtx.beginPath();
      hCtx.moveTo(16, 26);
      hCtx.bezierCurveTo(4, 18, 3, 10, 9, 6);
      hCtx.bezierCurveTo(12.5, 4, 16, 7, 16, 10);
      hCtx.bezierCurveTo(16, 7, 19.5, 4, 23, 6);
      hCtx.bezierCurveTo(29, 10, 28, 18, 16, 26);
      hCtx.fill();
      hCtx.stroke();

      setTimeout(() => heartCanvas.remove(), 2300);
    }

    document.getElementById("btn-heart").addEventListener("click", () => {
      spawnFloatingHeart();
      if (dataConn && dataConn.open) dataConn.send({ type: "HEART" });
    });

    document.getElementById("btn-hangup").addEventListener("click", () => {
      if (dataConn && dataConn.open) dataConn.send({ type: "HANGUP" });
      endCallCleanup("Đã kết thúc cuộc gọi");
    });

    document.getElementById("btn-copy-link").addEventListener("click", () => {
      if (!peer.id) return;
      const inviteUrl = `${window.location.origin}${window.location.pathname}?id=${peer.id}`;
      navigator.clipboard.writeText(inviteUrl);
      showPopupToast("Đã chép Link mời! Gửi cho bạn nữ nhé.", "success", "🔗");
    });

    // Cửa sổ Popup Nổi (PiP)
    const pipCanvas = document.getElementById("pip-canvas");
    const pipCtx = pipCanvas.getContext("2d");
    const pipVideo = document.getElementById("pip-video");

    function renderPipCanvas() {
      pipCtx.fillStyle = isNightMode ? "#121629" : "#fff0f5";
      pipCtx.fillRect(0, 0, 360, 200);
      pipCtx.strokeStyle = "#2b2d42";
      pipCtx.lineWidth = 4;
      pipCtx.strokeRect(2, 2, 356, 196);

      pipCtx.fillStyle = isNightMode ? "#ffe066" : "#2b2d42";
      pipCtx.font = "bold 14px sans-serif";
      pipCtx.textAlign = "center";
      const tStr = document.getElementById("call-timer").innerText || "00:00";
      pipCtx.fillText(currentCall ? `🟢 Đang gọi: ${tStr}` : "🌤️ Chibi Voice Call", 180, 28);

      pipCtx.fillStyle = "#4facfe";
      pipCtx.beginPath(); pipCtx.arc(105, 105, 28 + Math.min(14, localVolumeLevel * 0.25), 0, Math.PI * 2); pipCtx.fill();
      pipCtx.stroke();
      pipCtx.fillStyle = "#fff"; pipCtx.font = "bold 12px sans-serif";
      pipCtx.fillText("Bạn", 105, 110);

      pipCtx.fillStyle = "#ff758c";
      pipCtx.beginPath(); pipCtx.arc(255, 105, 28 + Math.min(14, remoteVolumeLevel * 0.25), 0, Math.PI * 2); pipCtx.fill();
      pipCtx.stroke();
      pipCtx.fillStyle = "#fff";
      pipCtx.fillText("cục dàng", 255, 110);

      requestAnimationFrame(renderPipCanvas);
    }
    renderPipCanvas();

    document.getElementById("btn-pip").addEventListener("click", async () => {
      try {
        if (document.pictureInPictureElement) {
          await document.exitPictureInPicture();
          return;
        }
        if (!pipVideo.srcObject) pipVideo.srcObject = pipCanvas.captureStream(15);
        await pipVideo.play();
        await pipVideo.requestPictureInPicture();
      } catch (e) {
        showPopupToast("Trình duyệt không hỗ trợ tách cửa sổ PiP", "warn", "⚠️");
      }
    });

    function startCallTimer() {
      stopCallTimer();
      callSeconds = 0;
      const timerEl = document.getElementById("call-timer");
      timerEl.style.display = "inline-block";
      callTimerInterval = setInterval(() => {
        callSeconds++;
        const mins = String(Math.floor(callSeconds / 60)).padStart(2, "0");
        const secs = String(callSeconds % 60).padStart(2, "0");
        timerEl.innerText = `${mins}:${secs}`;
      }, 1000);
    }

    function stopCallTimer() {
      if (callTimerInterval) clearInterval(callTimerInterval);
      document.getElementById("call-timer").style.display = "none";
    }
  </script>
</body>
</html>
