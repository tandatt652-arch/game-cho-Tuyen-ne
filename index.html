<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vũ Trụ Bí Mật Của Ebe Tuyến ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght=700&display=swap" rel="stylesheet">
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; user-select: none; -webkit-user-select: none;
            background-color: #7ec0ee; font-family: Arial, sans-serif;
        }
        #canvas-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }
        
        #instruction {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.9); z-index: 10; text-align: center; pointer-events: none;
            font-size: 14px; background: rgba(30, 40, 60, 0.6); padding: 10px 20px; border-radius: 20px;
            box-shadow: 0 0 10px rgba(135, 206, 235, 0.5);
            width: 85%; max-width: 600px;
        }

        /* JOYSTICK */
        #joystick-zone {
            position: absolute; bottom: 40px; left: 40px; width: 120px; height: 120px;
            background: rgba(255, 255, 255, 0.2); border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 50%; z-index: 10; display: none; touch-action: none;
        }
        #joystick-knob {
            position: absolute; top: 35px; left: 35px; width: 50px; height: 50px;
            background: rgba(255, 255, 255, 0.9); box-shadow: 0 0 15px rgba(0,0,0,0.2); border-radius: 50%;
        }

        /* Nút mở cửa */
        #door-prompt {
            position: absolute; bottom: 25%; left: 50%; transform: translateX(-50%);
            color: #fff; background: linear-gradient(45deg, #4caf50, #2196f3);
            padding: 14px 28px; border-radius: 30px; font-size: 18px; font-weight: bold;
            display: none; cursor: pointer; z-index: 10;
            box-shadow: 0 0 20px rgba(33, 150, 243, 0.6);
            animation: pulse 1.5s infinite alternate;
        }
        @keyframes pulse {
            0% { transform: translateX(-50%) scale(1); }
            100% { transform: translateX(-50%) scale(1.08); }
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="instruction">PC: Giữ Chuột để xoay góc nhìn, W-A-S-D để đi | Điện thoại: Vuốt màn hình & Dùng con lăn trái</div>
    <div id="door-prompt">Mở cửa ra đi nèe🚪</div>
    
    <div id="joystick-zone"><div id="joystick-knob"></div></div>
    <div id="canvas-container"></div>

    <script>
        // --- KHỞI TẠO HỆ THỐNG MÔI TRƯỜNG ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x7ec0ee);
        scene.fog = new THREE.FogExp2(0x7ec0ee, 0.005);

        const playerGroup = new THREE.Group();
        playerGroup.position.set(-3, 1.8, 3); 
        scene.add(playerGroup);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 2000);
        playerGroup.add(camera);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xfffaed, 0.9);
        sunLight.position.set(120, 150, 100);
        scene.add(sunLight);

        const roomLight = new THREE.PointLight(0xffeedd, 1.0, 15);
        roomLight.position.set(0, 3.2, 1);
        scene.add(roomLight);

        function createMat(color, roughness = 0.7) {
            return new THREE.MeshStandardMaterial({ color: color, roughness: roughness, side: THREE.FrontSide });
        }

// --- 1. XÂY DỰNG SÀN THẾ GIỚI CỰC LỚN & CĂN PHÒNG ---
        const roomGroup = new THREE.Group();
        scene.add(roomGroup);

        const wallMat = new THREE.MeshStandardMaterial({ color: 0x3a4f6e, roughness: 0.7, side: THREE.DoubleSide }); 
        
        // 1. VẬT LIỆU CHO SÀN TRONG SUỐT (Bên ngoài)
        const invisibleFloorMat = new THREE.MeshStandardMaterial({ 
            transparent: true, 
            opacity: 0.0, 
            depthWrite: false // Giúp tránh lỗi hiển thị khi xếp chồng vật liệu trong suốt
        }); 

        // 2. VẬT LIỆU CHO SÀN GỖ (Trong phòng)
        const roomFloorMat = createMat(0x422d1b, 0.5); 

        // SÀN THẾ GIỚI: Nâng cấp lên 1000x1000 nhưng LÀM TRONG SUỐT
        const floor = new THREE.Mesh(new THREE.PlaneGeometry(1000, 1000), invisibleFloorMat);
        floor.rotation.x = -Math.PI / 2; 
        // Bỏ nhận bóng (receiveShadow) ở sàn ngoài để tối ưu hiệu suất vì nó đã vô hình
        scene.add(floor); 

        // SÀN CĂN PHÒNG: Kích thước 12x12 vừa khít bên trong
        const roomFloor = new THREE.Mesh(new THREE.PlaneGeometry(12, 12), roomFloorMat);
        roomFloor.rotation.x = -Math.PI / 2; 
        roomFloor.receiveShadow = true; // Chỉ để sàn trong nhà nhận bóng
        roomGroup.add(roomFloor);

        // ... (Phần trần nhà - ceiling và các bức tường giữ nguyên như cũ) ...

        const ceiling = new THREE.Mesh(new THREE.PlaneGeometry(12, 12), wallMat);
        ceiling.rotation.x = Math.PI / 2; ceiling.position.y = 5;
        roomGroup.add(ceiling);

        const leftWall = new THREE.Mesh(new THREE.PlaneGeometry(12, 5), wallMat);
        leftWall.position.set(-6, 2.5, 0); leftWall.rotation.y = Math.PI / 2;
        roomGroup.add(leftWall);

        const rightWall = new THREE.Mesh(new THREE.PlaneGeometry(12, 5), wallMat);
        rightWall.position.set(6, 2.5, 0); rightWall.rotation.y = -Math.PI / 2;
        roomGroup.add(rightWall);

        const frontWallLeft = new THREE.Mesh(new THREE.PlaneGeometry(4.5, 5), wallMat);
        frontWallLeft.position.set(-3.75, 2.5, -6);
        roomGroup.add(frontWallLeft);

        const frontWallRight = new THREE.Mesh(new THREE.PlaneGeometry(4.5, 5), wallMat);
        frontWallRight.position.set(3.75, 2.5, -6);
        roomGroup.add(frontWallRight);

        const frontWallTop = new THREE.Mesh(new THREE.PlaneGeometry(3, 1.4), wallMat);
        frontWallTop.position.set(0, 4.3, -6);
        roomGroup.add(frontWallTop);

        const backWallBottom = new THREE.Mesh(new THREE.PlaneGeometry(12, 1.2), wallMat);
        backWallBottom.position.set(0, 0.6, 6); backWallBottom.rotation.y = Math.PI;
        roomGroup.add(backWallBottom);

        const backWallTop = new THREE.Mesh(new THREE.PlaneGeometry(12, 1.3), wallMat);
        backWallTop.position.set(0, 4.35, 6); backWallTop.rotation.y = Math.PI;
        roomGroup.add(backWallTop);

        const backWallLeft = new THREE.Mesh(new THREE.PlaneGeometry(2.5, 2.5), wallMat);
        backWallLeft.position.set(-4.75, 2.45, 6); backWallLeft.rotation.y = Math.PI;
        roomGroup.add(backWallLeft);

        const backWallRight = new THREE.Mesh(new THREE.PlaneGeometry(2.5, 2.5), wallMat);
        backWallRight.position.set(4.75, 2.45, 6); backWallRight.rotation.y = Math.PI;
        roomGroup.add(backWallRight);

        const windowFrameMat = new THREE.MeshStandardMaterial({ 
            color: 0x5c3a21, 
            roughness: 0.4,
            transparent: true,  
            opacity: 0.0  
        });
        const windowFrame = new THREE.Mesh(new THREE.BoxGeometry(7.2, 2.6, 0.15), windowFrameMat);
        windowFrame.position.set(0, 2.45, 5.95);
        roomGroup.add(windowFrame);

        const glassMat = new THREE.MeshStandardMaterial({ 
            color: 0xe0f7fa, 
            transparent: true, 
            opacity: 0.2, 
            roughness: 0.1, 
            metalness: 0.1,
            depthWrite: false 
        });
        const windowGlass = new THREE.Mesh(new THREE.PlaneGeometry(7.0, 2.4), glassMat);
        windowGlass.position.set(0, 2.45, 5.92); 
        windowGlass.rotation.y = Math.PI;
        roomGroup.add(windowGlass);


        // --- 2. CÁNH CỬA PHÒNG ---
        const doorWidth = 3.0, doorHeight = 3.6;
        const doorCanvas = document.createElement('canvas');
        doorCanvas.width = 256; doorCanvas.height = 512;
        const dCtx = doorCanvas.getContext('2d');
        dCtx.fillStyle = '#5c3a21'; dCtx.fillRect(0,0,256,512);
        dCtx.strokeStyle = '#3e251c'; dCtx.lineWidth = 14;
        dCtx.strokeRect(20, 20, 216, 472);
        dCtx.strokeRect(20, 20, 216, 220);
        dCtx.fillStyle = '#ffcc00'; dCtx.beginPath(); dCtx.arc(40, 256, 12, 0, Math.PI*2); dCtx.fill();

        const doorTex = new THREE.CanvasTexture(doorCanvas);
        const doorMesh = new THREE.Mesh(new THREE.BoxGeometry(doorWidth, doorHeight, 0.15), new THREE.MeshStandardMaterial({ map: doorTex }));
        doorMesh.position.set(doorWidth/2, doorHeight/2, 0);

        const doorPivot = new THREE.Group();
        doorPivot.position.set(-doorWidth/2, 0, -6);
        doorPivot.add(doorMesh);
        scene.add(doorPivot);


        // --- 3. TRANG TRÍ TRONG PHÒNG (GIƯỜNG & HOA) ---
        const bedGroup = new THREE.Group();
        bedGroup.position.set(-4.2, 0, 3.0);
        const bedBase = new THREE.Mesh(new THREE.BoxGeometry(2.8, 0.5, 4), createMat(0x6e4726));
        
        const bedMattress = new THREE.Mesh(new THREE.BoxGeometry(2.6, 0.4, 3.8), createMat(0xff69b4, 0.8));
        bedMattress.position.y = 0.4;
        
        const pillow = new THREE.Mesh(new THREE.BoxGeometry(2.0, 0.2, 0.8), createMat(0xe91e63));
        pillow.position.set(0, 0.65, 1.3);
        
        const blanket = new THREE.Mesh(new THREE.BoxGeometry(2.62, 0.42, 2.5), createMat(0xff1493, 0.7));
        blanket.position.set(0, 0.42, -0.6);
        bedGroup.add(bedBase, bedMattress, pillow, blanket);
        roomGroup.add(bedGroup);

        function hienThiHoaDocDien(x, y, z, scale, rotY=0) {
            const hoaCanvas = document.createElement('canvas');
            hoaCanvas.width = 128; hoaCanvas.height = 128;
            const hCtx = hoaCanvas.getContext('2d');
            hCtx.clearRect(0, 0, 128, 128);
            
            const hue = Math.random() * 360; 
            hCtx.fillStyle = `hsl(${hue}, 95%, 70%)`;
            
            for(let i = 0; i < 5; i++) {
                const angle = (i * Math.PI * 2) / 5;
                const cx = 64 + Math.cos(angle) * 22;
                const cy = 64 + Math.sin(angle) * 22;
                hCtx.beginPath(); hCtx.arc(cx, cy, 20, 0, Math.PI * 2); hCtx.fill();
            }
            hCtx.fillStyle = '#ffd700';
            hCtx.beginPath(); hCtx.arc(64, 64, 10, 0, Math.PI * 2); hCtx.fill();

            const hoaTex = new THREE.CanvasTexture(hoaCanvas);
            const hoaMat = new THREE.MeshStandardMaterial({ map: hoaTex, transparent: true, side: THREE.DoubleSide, roughness: 0.5 });
            const hoaMesh = new THREE.Mesh(new THREE.PlaneGeometry(0.5 * scale, 0.5 * scale), hoaMat);
            
            hoaMesh.position.set(x, y, z);
            hoaMesh.rotation.y = rotY;
            roomGroup.add(hoaMesh);
        }
        
        for (let i = 0; i < 100; i++) {
            let vịTríNgẫuNhiên = (Math.random() - 0.5) * 11.2;
            let chiềuCaoNgẫuNhiên = 0.5 + Math.random() * 4.0;
            let tỷLệKíchThước = 0.8 + Math.random() * 1.0;
            let chọnTường = Math.floor(Math.random() * 4);

            if (chọnTường === 0) {
                hienThiHoaDocDien(-5.93, chiềuCaoNgẫuNhiên, vịTríNgẫuNhiên, tỷLệKíchThước, Math.PI / 2);
            } else if (chọnTường === 1) { 
                hienThiHoaDocDien(5.93, chiềuCaoNgẫuNhiên, vịTríNgẫuNhiên, tỷLệKíchThước, -Math.PI / 2);
            } else if (chọnTường === 2) { 
                if (Math.abs(vịTríNgẫuNhiên) > 3.6 || chiềuCaoNgẫuNhiên < 1.2 || chiềuCaoNgẫuNhiên > 3.8) {
                    hienThiHoaDocDien(vịTríNgẫuNhiên, chiềuCaoNgẫuNhiên, 5.93, tỷLệKíchThước, Math.PI);
                }
            } else if (chọnTường === 3) {
                if (Math.abs(vịTríNgẫuNhiên) > 1.7) {
                    hienThiHoaDocDien(vịTríNgẫuNhiên, chiềuCaoNgẫuNhiên, -5.93, tỷLệKíchThước, 0);
                }
            }
        }


        // --- 4. HỆ THỐNG MÂY KHỐI & MẶT TRỜI VUÔNG RÕ NÉT ---
        const cloudsGroup = new THREE.Group();
        scene.add(cloudsGroup);

        const cloudMat = new THREE.MeshLambertMaterial({
            color: 0xffffff,
            transparent: true,
            opacity: 0.85,
            side: THREE.DoubleSide
        });

        function createMinecraftCloud(startX, startY, startZ) {
            const cluster = new THREE.Group();
            const blocksCount = 3 + Math.floor(Math.random() * 5); 
            
            for(let i=0; i<blocksCount; i++) {
                const w = 15 + Math.floor(Math.random() * 20);
                const h = 4 + Math.floor(Math.random() * 4);
                const d = 15 + Math.floor(Math.random() * 20);
                
                const cloudBlock = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), cloudMat);
                cloudBlock.position.set(
                    (i * 12) - (blocksCount * 4),
                    (Math.random() - 0.5) * 2,
                    (Math.random() - 0.5) * 10
                );
                cluster.add(cloudBlock);
            }
            cluster.position.set(startX, startY, startZ);
            cloudsGroup.add(cluster);
        }

        for(let i=0; i<18; i++) {
            let cx = (Math.random() - 0.5) * 500;
            let cy = 80 + Math.random() * 40;
            let cz = (Math.random() - 0.5) * 500;
            createMinecraftCloud(cx, cy, cz);
        }

        const sunGroup = new THREE.Group();
        const sunMesh = new THREE.Mesh(
            new THREE.BoxGeometry(18, 18, 18), 
            new THREE.MeshStandardMaterial({ 
                color: 0xfff3cc,
                emissive: 0xffe066, 
                emissiveIntensity: 0.6,
                roughness: 0.2
            })
        );
        sunGroup.add(sunMesh);
        
        const sunGlow = new THREE.Mesh(
            new THREE.BoxGeometry(22, 22, 22), 
            new THREE.MeshBasicMaterial({ color: 0xfff5cc, transparent: true, opacity: 0.25 })
        );
        sunGroup.add(sunGlow);
        sunGroup.position.set(120, 150, 200);
        scene.add(sunGroup);


        // --- 5. CHỮ THÔNG ĐIỆP ---
        const messages = [
            "Cảm ơn em vì đã chịu nói ra nhưng điều em giữ trong lòng như vậy, anh rất là trân trọng luôn á",
            "Thiệt ra điều anh thấy sau đoạn đó hong phải là thất vọng, mà là anh hiểu em hơn rất nhiều.",
            "Anh chúc Bé Tuyến buổi sáng dui dẻ nhaa ❤️",
            "Còn về chuyện có tiếp tục hay không thì anh chưa bao giờ thực sự muốn bỏ cuộc đâu ngốc ạ"
        ];
        const textPlanes = [];

        function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
            const words = text.split(' ');
            let line = '';
            let lines = [];

            for (let n = 0; n < words.length; n++) {
                let testLine = line + words[n] + ' ';
                let metrics = ctx.measureText(testLine);
                let testWidth = metrics.width;
                if (testWidth > maxWidth && n > 0) {
                    lines.push(line);
                    line = words[n] + ' ';
                } else {
                    line = testLine;
                }
            }
            lines.push(line);

            let currentY = y - ((lines.length - 1) * lineHeight) / 2;
            for (let i = 0; i < lines.length; i++) {
                ctx.fillText(lines[i].trim(), x, currentY);
                currentY += lineHeight;
            }
            return currentY; 
        }

        function createSignText(text, index, posX, posZ, rotY) {
            const canvas = document.createElement('canvas');
            canvas.width = 2048; canvas.height = 1024; 
            const ctx = canvas.getContext('2d');
            const tex = new THREE.CanvasTexture(canvas);

            document.fonts.load('10pt "Dancing Script"').then(() => {
                ctx.font = 'bold 95px "Dancing Script", cursive'; 
                ctx.fillStyle = '#0f2b5c'; 
                ctx.textAlign = 'center';
                ctx.shadowColor = '#00ffff'; 
                ctx.shadowBlur = 30;
                
                let nextY = wrapText(ctx, text, 1024, 400, 1700, 120); 
                
                ctx.font = '100px Arial'; 
                ctx.fillStyle = '#00bcd4'; 
                ctx.fillText('➔', 1024, Math.max(nextY + 40, 620));
                tex.needsUpdate = true;
            });

            const plane = new THREE.Mesh(new THREE.PlaneGeometry(24, 10.5), new THREE.MeshBasicMaterial({ map: tex, transparent: true, side: THREE.DoubleSide }));
            plane.position.set(posX, 5.8, posZ); plane.rotation.y = rotY;
            scene.add(plane);
            textPlanes.push(plane);
        }

        createSignText(messages[0], 0, 0, -25, 0);           
        createSignText(messages[1], 1, 25, 0, -Math.PI/2);   
        createSignText(messages[2], 2, 0, 25, Math.PI);      
        createSignText(messages[3], 3, -25, 0, Math.PI/2);   


        // --- 6. ĐIỀU KHIỂN & HỆ THỐNG VA CHẠM THỐNG NHẤT TOÀN CỤC ---
        let moveF = false, moveB = false, moveL = false, moveR = false;
        let isDoorOpen = false, doorRot = 0;
        let yaw = Math.PI, pitch = 0;
        const moveSpeed = 0.08;

        if ('ontouchstart' in window) document.getElementById('joystick-zone').style.display = 'block';

        window.addEventListener('keydown', (e) => {
            switch (e.code) {
                case 'ArrowUp': case 'KeyW': moveF = true; break;
                case 'ArrowLeft': case 'KeyA': moveL = true; break;
                case 'ArrowDown': case 'KeyS': moveB = true; break;
                case 'ArrowRight': case 'KeyD': moveR = true; break;
            }
        });
        window.addEventListener('keyup', (e) => {
            switch (e.code) {
                case 'ArrowUp': case 'KeyW': moveF = false; break;
                case 'ArrowLeft': case 'KeyA': moveL = false; break;
                case 'ArrowDown': case 'KeyS': moveB = false; break;
                case 'ArrowRight': case 'KeyD': moveR = false; break;
            }
        });

        let isMouseDown = false;
        let prevMousePos = { x: 0, y: 0 };

        window.addEventListener('mousedown', (e) => {
            if (e.target.id === 'door-prompt') return;
            isMouseDown = true;
            prevMousePos = { x: e.clientX, y: e.clientY };
        });
        window.addEventListener('mousemove', (e) => {
            if (!isMouseDown) return;
            yaw -= (e.clientX - prevMousePos.x) * 0.003;
            pitch = Math.max(-Math.PI/3, Math.min(Math.PI/3, pitch - (e.clientY - prevMousePos.y) * 0.003));
            prevMousePos = { x: e.clientX, y: e.clientY };
        });
        window.addEventListener('mouseup', () => { isMouseDown = false; });
        window.addEventListener('mouseleave', () => { isMouseDown = false; });

        let joyId = null, lookId = null;
        let touchStart = { x: 0, y: 0 }, joyStart = { x: 0, y: 0 }, vMove = { x: 0, y: 0 };

        window.addEventListener('touchstart', (e) => {
            for (let i = 0; i < e.changedTouches.length; i++) {
                const t = e.changedTouches[i];
                if (t.clientX < window.innerWidth / 2 && joyId === null) {
                    joyId = t.identifier;
                    const zone = document.getElementById('joystick-zone');
                    zone.style.left = (t.clientX - 60) + 'px'; zone.style.bottom = (window.innerHeight - t.clientY - 60) + 'px';
                    joyStart = { x: t.clientX, y: t.clientY };
                } else if (t.clientX >= window.innerWidth / 2 && lookId === null) {
                    lookId = t.identifier;
                    touchStart = { x: t.clientX, y: t.clientY };
                }
            }
        });

        window.addEventListener('touchmove', (e) => {
            for (let i = 0; i < e.changedTouches.length; i++) {
                const t = e.changedTouches[i];
                if (t.identifier === joyId) {
                    let dx = t.clientX - joyStart.x, dy = t.clientY - joyStart.y;
                    let d = Math.sqrt(dx*dx + dy*dy);
                    if(d > 40) { dx = (dx/d)*40; dy = (dy/d)*40; }
                    document.getElementById('joystick-knob').style.transform = `translate(${dx}px, ${dy}px)`;
                    vMove.x = dx / 40; vMove.y = -dy / 40;
                }
                if (t.identifier === lookId) {
                    yaw -= (t.clientX - touchStart.x) * 0.005;
                    pitch = Math.max(-Math.PI/3, Math.min(Math.PI/3, pitch - (t.clientY - touchStart.y) * 0.005));
                    touchStart = { x: t.clientX, y: t.clientY };
                }
            }
        });

        const endTouch = (e) => {
            for (let i = 0; i < e.changedTouches.length; i++) {
                const t = e.changedTouches[i];
                if (t.identifier === joyId) {
                    joyId = null; vMove = { x: 0, y: 0 };
                    document.getElementById('joystick-knob').style.transform = 'translate(0px, 0px)';
                    document.getElementById('joystick-zone').style.left = '40px'; document.getElementById('joystick-zone').style.bottom = '40px';
                }
                if (t.identifier === lookId) lookId = null;
            }
        };
        window.addEventListener('touchend', endTouch); window.addEventListener('touchcancel', endTouch);

        const promptBtn = document.getElementById('door-prompt');
        function openDoor() { isDoorOpen = true; promptBtn.style.display = 'none'; roomLight.intensity = 0.5; }
        promptBtn.addEventListener('click', openDoor); promptBtn.addEventListener('touchstart', openDoor);


        // --- VÒNG LẶP ANIMATE ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            playerGroup.rotation.y = yaw;
            camera.rotation.x = pitch;

            const cx = (moveL ? -1 : 0) + (moveR ? 1 : 0) + vMove.x;
            const cz = (moveF ? -1 : 0) + (moveB ? 1 : 0) - vMove.y;

            let nextX = playerGroup.position.x;
            let nextZ = playerGroup.position.z;

            // Tính toán vị trí dự kiến tiếp theo
            if (cx !== 0 || cz !== 0) {
                const dir = new THREE.Vector3(cx, 0, cz).normalize();
                dir.applyQuaternion(playerGroup.quaternion);
                nextX += dir.x * moveSpeed;
                nextZ += dir.z * moveSpeed;
            }

            // ==========================================
            // THUẬT TOÁN VA CHẠM TOÀN CỤC MỚI (AABB Tối Ưu)
            // ==========================================
            const worldBound = 495; // Rìa bản đồ cực lớn
            
            // 1. Giới hạn sàn thế giới
            if (nextX < -worldBound) nextX = -worldBound;
            if (nextX > worldBound) nextX = worldBound;
            if (nextZ < -worldBound) nextZ = -worldBound;
            if (nextZ > worldBound) nextZ = worldBound;

            // 2. Định nghĩa biên căn phòng (Chướng ngại vật)
            const wallThick = 0.6; // Bán kính va chạm của tường
            const rMinX = -6, rMaxX = 6;
            const rMinZ = -6, rMaxZ = 6;
            const doorGap = 1.35; // Khoảng cách khe cửa an toàn

            // Kiểm tra va chạm trục X (Trượt dọc theo tường trái/phải)
            // Nếu vị trí Z đang nằm trong dải tường, và X dính vào vách tường
            if (playerGroup.position.z < rMaxZ && playerGroup.position.z > rMinZ) {
                if (nextX < rMinX + wallThick && nextX > rMinX - wallThick) nextX = playerGroup.position.x; // Tường trái
                if (nextX < rMaxX + wallThick && nextX > rMaxX - wallThick) nextX = playerGroup.position.x; // Tường phải
            }

            // Kiểm tra va chạm trục Z (Trượt dọc theo tường trước/sau)
            // Nếu vị trí X đang nằm trong dải tường, và Z dính vào vách tường
            if (playerGroup.position.x < rMaxX && playerGroup.position.x > rMinX) {
                // Tường sau
                if (nextZ < rMaxZ + wallThick && nextZ > rMaxZ - wallThick) nextZ = playerGroup.position.z;
                
                // Tường trước (Nơi có cửa)
                if (nextZ < rMinZ + wallThick && nextZ > rMinZ - wallThick) {
                    if (Math.abs(playerGroup.position.x) > doorGap) {
                        nextZ = playerGroup.position.z; // Kẹt vào mảng tường bê tông vách trước
                    } else if (!isDoorOpen) {
                        nextZ = playerGroup.position.z; // Kẹt vào cửa đóng
                    }
                }
            }

            // Gắn tọa độ cuối cùng
            playerGroup.position.x = nextX;
            playerGroup.position.z = nextZ;

            // --- QUẢN LÝ GỢI Ý NÚT BẤM MỞ CỬA ---
            if (!isDoorOpen && playerGroup.position.z <= -4.2 && playerGroup.position.z >= -6.0 && Math.abs(playerGroup.position.x) < 1.4) {
                promptBtn.style.display = 'block';
            } else {
                promptBtn.style.display = 'none';
            }

            if (isDoorOpen) {
                doorRot = THREE.MathUtils.lerp(doorRot, -Math.PI / 1.7, 0.04);
                doorPivot.rotation.y = doorRot;
            }

            // ANIMATION MÂY TRÔI
            const elapsedTime = clock.getElapsedTime();
            cloudsGroup.children.forEach((cloudCluster) => {
                cloudCluster.position.x += 0.03;
                if(cloudCluster.position.x > 300) {
                    cloudCluster.position.x = -300;
                }
            });

            // Hiệu ứng chữ nổi bồng bềnh
            textPlanes.forEach((plane, index) => {
                plane.position.y = 5.5 + Math.sin(elapsedTime * 1.2 + index) * 0.15;
            });

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
