<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">

    <title>Mario English - Tuyển Sinh Lớp 10 (Giao Diện Dọc + Phím)</title>
    <style>
        body {
            margin: 0; padding: 0;
            background-color: #2c3e50;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            height: 100vh; touch-action: none; font-family: Arial, sans-serif;
            overflow: hidden;
        }
        #app-wrapper {
            width: 100%; max-width: 500px; height: 100vh;
            box-shadow: 0 0 15px rgba(0,0,0,0.7);
            background: #2c3e50;
            display: flex; flex-direction: column; position: relative;
        }
        /* Phần giao diện đề bài (Nằm ở trên) */
        #ui-panel {
            background: #ecf0f1; padding: 12px; box-sizing: border-box;
            color: #2c3e50; border-bottom: 4px solid #bdc3c7;
            flex: 0 0 auto; max-height: 45vh; overflow-y: auto;
        }
        .header-info {
            display: flex; justify-content: space-between; align-items: center; font-weight: bold; margin-bottom: 8px;
            color: #e74c3c; font-size: 15px; flex-wrap: wrap; gap: 5px;
        }
        .level-controls { display: flex; align-items: center; gap: 4px; color: #2c3e50; }
        #level-input { width: 35px; text-align: center; border: 1px solid #95a5a6; border-radius: 5px; padding: 2px; font-weight: bold;}
        #btn-jump-level { background: #27ae60; color: white; border: none; border-radius: 5px; cursor: pointer; padding: 3px 8px; font-weight: bold; }
        #btn-jump-level:active { background: #2ecc71; }
        #health-display { background: #ff7675; color: white; padding: 3px 8px; border-radius: 15px; }

        #instruction { font-style: italic; margin-bottom: 5px; font-size: 13px; color: #2980b9; font-weight: bold;}
        #context { 
            background: #fff; padding: 8px; border: 1px solid #ccc; 
            border-radius: 5px; font-size: 13px; max-height: 100px; overflow-y: auto;
            margin-bottom: 8px; display: none; line-height: 1.4; white-space: pre-wrap;
        }
        #question { font-weight: bold; font-size: 15px; margin-bottom: 10px; color: #2c3e50; }
        #options-grid { display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
        
        /* Phần Canvas Game (Nằm ở giữa) */
        #game-container {
            flex: 1; position: relative; background: #87CEEB;
            display: flex; align-items: center; justify-content: center; overflow: hidden;
        }
        canvas { width: 100%; height: 100%; object-fit: fill; display: block; }
        
        /* Thông báo nổi (Toast Notification) */
        #notification {
            position: absolute; top: 10%; left: 50%; transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.85); padding: 8px 16px; border-radius: 8px;
            font-size: 14px; font-weight: bold; text-align: center; color: white;
            opacity: 0; pointer-events: none; z-index: 100; transition: opacity 0.3s ease;
            max-width: 90%; line-height: 1.3;
        }

        /* Màn hình kết thúc (Level 50) */
        #end-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(44, 62, 80, 0.95); z-index: 200;
            display: none; flex-direction: column; align-items: center; justify-content: center;
            text-align: center; padding: 20px; box-sizing: border-box; color: white;
        }
        #end-msg { font-size: 22px; font-weight: bold; margin-bottom: 20px; line-height: 1.5; }
        #btn-restart {
            background: #f1c40f; border: none; border-bottom: 4px solid #f39c12; color: #2c3e50;
            font-size: 18px; padding: 12px 30px; border-radius: 10px; cursor: pointer; font-weight: bold;
        }
        #btn-restart:active { border-bottom: 0; transform: translateY(4px); }

        /* Bàn phím ảo cảm ứng (Nằm ở dưới cùng) */
        #controls {
            height: 75px; background: #34495e; flex: 0 0 auto;
            display: flex; justify-content: space-around; align-items: center; padding: 0 10px; gap: 8px;
        }
        .btn {
            background: #3498db; border: none; border-bottom: 4px solid #2980b9;
            color: white; font-size: 16px; padding: 12px 0; border-radius: 10px;
            user-select: none; cursor: pointer; flex: 1; text-align: center; font-weight: bold;
        }
        .btn:active { border-bottom: 0; transform: translateY(4px); }
        .btn-help { background: #f39c12; border-bottom: 4px solid #e67e22; }
        .btn-help:disabled { background: #95a5a6; border-bottom: 4px solid #7f8c8d; opacity: 0.7; cursor: not-allowed; }
    </style>
</head>

        { id: 46, part: "PART 7: SENTENCE TRANSFORMATION", context: null, question: "The traffic was too chaotic. The traffic police had a hard time controlling the vehicle flow.", options: { A: "It was such chaotic traffic that the traffic police had a hard time controlling the vehicle flow.", B: "The traffic was too chaotic that the traffic police had a hard time controlling the vehicle flow.", C: "It was so chaotic traffic that the traffic police had a hard time controlling the vehicle flow.", D: "Such chaotic was the traffic that the police didn't control the flow." }, correct_answer: "A" },
        { id: 47, part: "PART 7: SENTENCE TRANSFORMATION", context: null, question: "You should wear your coat, or you may catch a cold.", options: { A: "Unless you don't wear your coat, you may catch a cold.", B: "If you don't wear your coat, you may catch a cold.", C: "If you wear your coat, you may catch a cold.", D: "If you didn't wear your coat, you might catch a cold." }, correct_answer: "B" },
        { id: 48, part: "PART 7: SENTENCE TRANSFORMATION", context: null, question: "The buses are so overcrowded during the rush hour.", options: { A: "My mum wishes the buses wouldn't be overcrowded.", B: "My mum wishes the buses aren't so overcrowded during the rush hour.", C: "My mum wishes the buses weren't so overcrowded during the rush hour.", D: "My mum wishes the buses hasn't been so overcrowded during the rush hour." }, correct_answer: "C" },
        { id: 49, part: "PART 7: SENTENCE TRANSFORMATION", context: null, question: "The student completed the quiz the fastest. The teacher praised her.", options: { A: "The student which the teacher praised completed the quiz the fastest.", B: "The student whom the teacher praised completed the quiz the fastest.", C: "The student whose the teacher praised completed the quiz the fastest.", D: "The student, who completed the quiz the fastest, praised the teacher." }, correct_answer: "B" },
        { id: 50, part: "PART 7: SENTENCE TRANSFORMATION", context: null, question: "\"Why don't we visit the Kon Klor suspension bridge?\" said Lan.", options: { A: "Lan advised us to visit the Kon Klor suspension bridge.", B: "Lan suggested to visit the Kon Klor suspension bridge.", C: "Lan asked why didn't we visit the Kon Klor suspension bridge.", D: "Lan suggested visiting the Kon Klor suspension bridge." }, correct_answer: "D" }
    ];

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // BIẾN TRẠNG THÁI GAME
    let health = 10;
    let hasCheated = false;
    let mistakesThisLevel = 0;
    let currentLevel = 1;
    const MAX_LEVEL = 50; 
    let currentQData = null;
    let hasKey = false;
    let helpUsed = false;
    let blocks = [];
    
    // Tọa độ vật lý phù hợp cho Canvas 800x400
    const player = { x: 50, y: 250, width: 40, height: 40, vx: 0, vy: 0, speed: 5, jumpPower: -14, grounded: false };
    const gravity = 0.8;
    const floorY = 350; 
    const door = { x: 720, y: 250, width: 60, height: 100 };
    const keys = { left: false, right: false, jump: false };

    // Ảnh tùy chọn (Nếu chưa load được sẽ vẽ màu gạch cơ bản)
    const playerImg = new Image(); playerImg.src = 'nhanvat.png';
    const doorImg = new Image(); doorImg.src = 'cua.png';
    const blockImg = new Image(); blockImg.src = 'gach.png';

    // Toast Notification mượt mà
    let notifyTimeout = null;
    function showNotification(msg, type) {
        const noti = document.getElementById('notification');
        noti.innerText = msg;
        if (type === 'error') {
            noti.style.border = "3px solid #e74c3c";
            noti.style.color = "#ff7675";
        } else {
            noti.style.border = "3px solid #2ecc71";
            noti.style.color = "#55efc4";
        }
        noti.style.opacity = 1;
        if (notifyTimeout) clearTimeout(notifyTimeout);
        notifyTimeout = setTimeout(() => { noti.style.opacity = 0; }, 2000); 
    }

    function updateHealthUI() {
        document.getElementById('health-display').innerText = `❤️ ${health}`;
    }

    function fullResetGame() {
        health = 10;
        currentLevel = 1;
        hasCheated = false;
        updateHealthUI();
        loadLevel();
    }

    function loadLevel() {
        mistakesThisLevel = 0;
        hasKey = false;
        helpUsed = false;
        
        document.getElementById('btnHelp').disabled = false;
        document.getElementById('level-display').innerText = currentLevel;
        document.getElementById('status-display').innerText = "Tìm chìa khóa! 🔑";
        document.getElementById('status-display').style.color = "#e74c3c";

        player.x = 50; player.y = floorY - player.height;
        player.vx = 0; player.vy = 0;

        currentQData = questionBank[currentLevel - 1];

        // Cập nhật DOM HTML
        document.getElementById('instruction').innerText = currentQData.part; 
        document.getElementById('question').innerText = currentQData.question;
        
        const contextDiv = document.getElementById('context');
        if(currentQData.context) {
            contextDiv.style.display = "block";
            contextDiv.innerText = currentQData.context; 
            contextDiv.scrollTop = 0; 
        } else {
            contextDiv.style.display = "none";
        }

        ['A','B','C','D'].forEach(id => {
            document.getElementById('opt-'+id).style.textDecoration = "none";
            document.getElementById('opt-'+id).style.color = "#2c3e50";
            document.getElementById('opt-'+id).innerText = `${id}. ${currentQData.options[id]}`;
        });

        // Thiết lập 4 khối gạch đáp án
        blocks = [
            { id: 'A', x: 120, y: 150, w: 50, h: 50, active: true },
            { id: 'B', x: 280, y: 150, w: 50, h: 50, active: true },
            { id: 'C', x: 440, y: 150, w: 50, h: 50, active: true },
            { id: 'D', x: 600, y: 150, w: 50, h: 50, active: true }
        ];
    }

    function useHelp5050() {
        if (helpUsed || hasKey) return;
        helpUsed = true;
        document.getElementById('btnHelp').disabled = true;

        let wrongBlocks = blocks.filter(b => b.id !== currentQData.correct_answer && b.active);
        wrongBlocks.sort(() => Math.random() - 0.5);
        if(wrongBlocks.length >= 2) {
            wrongBlocks[0].active = false;
            wrongBlocks[1].active = false;
            document.getElementById('opt-' + wrongBlocks[0].id).style.textDecoration = "line-through";
            document.getElementById('opt-' + wrongBlocks[0].id).style.color = "#bdc3c7";
            document.getElementById('opt-' + wrongBlocks[1].id).style.textDecoration = "line-through";
            document.getElementById('opt-' + wrongBlocks[1].id).style.color = "#bdc3c7";
        }
    }

    function checkHitBlock(block) {
        if (!block.active) return;
        
        if (block.id === currentQData.correct_answer) {
            hasKey = true;
            block.active = false; 
            document.getElementById('status-display').innerText = "Vào Cửa Ngay! 🚪";
            document.getElementById('status-display').style.color = "#2ecc71";
            showNotification("Đúng rồi nè! Có chìa khóa rồi!", "success");
        } else {
            health--;
            mistakesThisLevel++;
            updateHealthUI();
            
            showNotification("Sai ròi nè! -1 hp", "error");
            block.active = false; 
            document.getElementById('opt-' + block.id).style.textDecoration = "line-through";
            document.getElementById('opt-' + block.id).style.color = "#bdc3c7";

            if (health <= 0) {
                showNotification("Rớt tuyển sinh rồi, làm lại thoi!", "error");
                setTimeout(fullResetGame, 1500);
            }
        }
    }

    function update() {
        // Xử lý di chuyển dựa trên mảng keys (Đồng bộ cả nút ảo lẫn bàn phím)
        if (keys.left) player.vx = -player.speed;
        else if (keys.right) player.vx = player.speed;
        else player.vx = 0;

        if (keys.jump && player.grounded) {
            player.vy = player.jumpPower;
            player.grounded = false;
        }

        player.x += player.vx;
        player.y += player.vy;
        player.vy += gravity;

        if (player.x < 0) player.x = 0;
        if (player.x + player.width > canvas.width) player.x = canvas.width - player.width;

        if (player.y + player.height >= floorY) {
            player.y = floorY - player.height;
            player.vy = 0;
            player.grounded = true;
        }

        blocks.forEach(block => {
            if (block.active) {
                // Va chạm đụng đầu từ dưới lên
                if (player.vy < 0 && 
                    player.y <= block.y + block.h && player.y + player.height > block.y + block.h &&
                    player.x + player.width > block.x && player.x < block.x + block.w) {
                    player.y = block.y + block.h; 
                    player.vy = 0; 
                    checkHitBlock(block);
                }
                // Đứng lên trên khối gạch
                if (player.vy > 0 && 
                    player.y + player.height >= block.y && player.y < block.y &&
                    player.x + player.width > block.x && player.x < block.x + block.w) {
                    player.y = block.y - player.height;
                    player.vy = 0;
                    player.grounded = true;
                }
            }
        });

        // Xử lý qua cửa mở màn tiếp theo
        if (hasKey && player.x + player.width > door.x && player.y + player.height > door.y && player.x < door.x + door.width) {
            if (currentLevel === MAX_LEVEL) {
                const endScreen = document.getElementById('end-screen');
                const endMsg = document.getElementById('end-msg');
                const btnRestart = document.getElementById('btn-restart');
                endScreen.style.display = "flex";
                
                if (hasCheated) {
                    endMsg.innerText = "GIAN LẬN RỒI BÉ NÀY HƯ QUÁ!\nPHẢI DẠY LẠI THÔI.";
                    endMsg.style.color = "#e74c3c";
                    btnRestart.innerText = "Làm lại không gian lận";
                } else {
                    endMsg.innerText = "Bé Tuyến giỏi quá nè, mà tối ròi ngủ sớm i hong có thức khuya nữa nhe🎉";
                    endMsg.style.color = "#2ecc71";
                    btnRestart.innerText = "Chưa buồn ngủ, chơi típ";
                }

                btnRestart.onclick = () => {
                    endScreen.style.display = "none";
                    fullResetGame();
                }
            } 
            else {
                if (mistakesThisLevel > 0) {
                    showNotification("coi tu luyện lại đi nhe!", "error");
                } else {
                    showNotification("Dỏi quá à, tiếp tục cố gắng nhe!", "success");
                }
                currentLevel++;
                loadLevel(); 
            }
        }
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        // Vẽ đất nông thôn
        ctx.fillStyle = '#8B4513';
        ctx.fillRect(0, floorY, canvas.width, canvas.height - floorY);
        ctx.fillStyle = '#2ecc71'; 
        ctx.fillRect(0, floorY, canvas.width, 15);

        // Vẽ các khối đáp án
        blocks.forEach(block => {
            if (block.active) {
                if (blockImg.complete && blockImg.naturalHeight !== 0) {
                    ctx.drawImage(blockImg, block.x, block.y, block.w, block.h);
                } else {
                    ctx.fillStyle = '#e67e22'; 
                    ctx.fillRect(block.x, block.y, block.w, block.h);
                    ctx.strokeStyle = '#d35400';
                    ctx.lineWidth = 3;
                    ctx.strokeRect(block.x, block.y, block.w, block.h);
                }
                ctx.fillStyle = 'white';
                ctx.font = 'bold 28px Arial';
                ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.lineWidth = 2; ctx.strokeStyle = 'black';
                ctx.strokeText(block.id, block.x + block.w / 2, block.y + block.h / 2);
                ctx.fillText(block.id, block.x + block.w / 2, block.y + block.h / 2);
            }
        });

        // Vẽ cửa (Door)
        if (doorImg.complete && doorImg.naturalHeight !== 0) {
            ctx.drawImage(doorImg, door.x, door.y, door.width, door.height);
        } else {
            ctx.fillStyle = hasKey ? '#3498db' : '#7f8c8d';
            ctx.fillRect(door.x, door.y, door.width, door.height);
            ctx.fillStyle = '#f1c40f';
            ctx.beginPath();
            ctx.arc(door.x + 10, door.y + door.height / 2, 5, 0, Math.PI * 2);
            ctx.fill();
        }

        // Vẽ Nhân vật khối vuông
        if (playerImg.complete && playerImg.naturalHeight !== 0) {
            ctx.drawImage(playerImg, player.x, player.y, player.width, player.height);
        } else {
            ctx.fillStyle = '#e74c3c';
            ctx.fillRect(player.x, player.y, player.width, player.height);
            ctx.fillStyle = 'white'; ctx.fillRect(player.x + 25, player.y + 10, 8, 8);
            ctx.fillStyle = 'black'; ctx.fillRect(player.x + 28, player.y + 12, 4, 4);
        }

        // BẢNG TÊN BÉ TUYẾN LƠ LỬNG
        ctx.fillStyle = '#ffffff'; 
        ctx.font = 'bold 16px Arial';
        ctx.textAlign = 'center';
        ctx.strokeStyle = '#000000';
        ctx.lineWidth = 3;
        ctx.strokeText("Bé Tuyến", player.x + player.width / 2, player.y - 12);
        ctx.fillText("Bé Tuyến", player.x + player.width / 2, player.y - 12);
    }

    function gameLoop() {
        update();
        draw();
        requestAnimationFrame(gameLoop);
    }

    // DỊCH CHUYỂN LEVEL (Đánh dấu cheat)
    document.getElementById('btn-jump-level').addEventListener('click', () => {
        let inputVal = parseInt(document.getElementById('level-input').value);
        if (inputVal >= 1 && inputVal <= MAX_LEVEL) {
            hasCheated = true; 
            currentLevel = inputVal;
            showNotification("Đã dùng tính năng Dịch Chuyển!", "error");
            loadLevel();
        } else {
            showNotification(`Vui lòng nhập từ 1 đến ${MAX_LEVEL}`, 'error');
        }
    });

    // ================= SỰ KIỆN ĐIỀU KHIỂN CẢM ỨNG (MOBILE) =================
    function bindButton(btnId, keyName) {
        const btn = document.getElementById(btnId);
        btn.addEventListener('touchstart', (e) => { e.preventDefault(); keys[keyName] = true; }, {passive: false});
        btn.addEventListener('touchend', (e) => { e.preventDefault(); keys[keyName] = false; }, {passive: false});
        btn.addEventListener('mousedown', () => keys[keyName] = true);
        btn.addEventListener('mouseup', () => keys[keyName] = false);
        btn.addEventListener('mouseleave', () => keys[keyName] = false);
    }

    bindButton('btnLeft', 'left');
    bindButton('btnRight', 'right');
    bindButton('btnJump', 'jump');
    
    document.getElementById('btnHelp').addEventListener('click', useHelp5050);
    document.getElementById('btnHelp').addEventListener('touchstart', (e) => { e.preventDefault(); useHelp5050(); }, {passive: false});

    // ================= SỰ KIỆN BÀN PHÍM (MÁY TÍNH / KEYBOARD) =================
    window.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = true;
        if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = true;
        if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W' || e.key === ' ') keys.jump = true;
    });

    window.addEventListener('keyup', (e) => {
        if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = false;
        if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = false;
        if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W' || e.key === ' ') keys.jump = false;
    });

    // Khởi chạy game
    loadLevel();
    gameLoop();
</script>
